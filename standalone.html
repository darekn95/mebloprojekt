    <script type="text/plain" id="app-source">import React, { useState, useEffect, useMemo, useCallback, useRef } from "react";

/* ============================================================
   SZAFKI — poziomy, kolumny, przegrody
   ============================================================ */

const INK = "#1c1917";
const LINE = "#57534e";
const DIMC = "#0369a1";
const WARNC = "#b45309";
const ERRC = "#b91c1c";
const ACC = "#0f766e";
const PALETA = [
  // czysta biel wypadala z rysunku, a cene ma ta sama co mat — zostaje mat
  ["Biały mat", "#e8e6e1"],
  ["Szary", "#9c9b97"],
  ["Antracyt", "#4a4d4f"],
  ["Czarny", "#2b2a28"],
  ["Dąb sonoma", "#d8c3a0"],
  ["Dąb wotan", "#b39a76"],
  ["Orzech", "#7a5638"],
  ["Buk", "#d9b98a"],
  ["Brąz", "#5b4433"],
];

/* Nazwa materialu sklada sie sama: typ z pola nazwy, kolor z palety i grubosc
   tylko wtedy, gdy ta sama plyta wystepuje w projekcie w kilku grubosciach. */
const PALETA_BY_HEX = new Map(PALETA.map(([n, h]) => [h.toLowerCase(), n]));
const paletteName = (hex) => PALETA_BY_HEX.get(String(hex || "").toLowerCase()) || null;
// kolor spoza wzornika trzeba nazwac samemu, inaczej do zamowienia poszloby
// bezuzyteczne "kolor wlasny"
const colorLabel = (m) => ((m && m.decor) || "").trim() || paletteName(m && m.color) || "kolor własny";
const COLORED_KEYS = ["board", "front", "shelf"];

/* Nozki: kolor z palety okuc i ksztalt — kwadratowa albo okragla. */
const LEG_COLORS = [
  ["Czarny", "#2b2a28"],
  ["Grafit", "#3f3f46"],
  ["Aluminium", "#a1a1aa"],
  ["Chrom", "#d4d4d8"],
  ["Biały", "#f4f4f5"],
  ["Złoty", "#b08d3f"],
];
const legColorOf = (cab) => (cab.legs && cab.legs.color) || "#3f3f46";
const legRound = (cab) => (cab.legs || {}).shape === "round";
const LEG_W = 40;      // kwadrat nozki na rysunku
const LEG_INSET = 40;  // odsuniecie od krawedzi korpusu
/* Nozki liczy szerokosc: para na kazdy rog, a od 900 mm dochodzi para posrodku —
   dno bez podparcia zaczyna tam pracowac. Wpisana liczba ma pierwszenstwo:
   parzysta rozklada sie po dwoch rzedach w rownych odstepach, nieparzysta znaczy
   jeszcze jedna podpora na samym srodku dna. */
const autoLegs = (W) => 4 + 2 * Math.floor(Math.max(0, W) / 900);
const legPlan = (cab, W) => {
  const wpisane = Number((cab.legs || {}).count);
  const ile = Math.max(2, Math.round(wpisane > 0 ? wpisane : autoLegs(W)));
  const wRzedzie = Math.max(1, Math.floor(ile / 2));
  const srodek = ile % 2 === 1;
  const xs = [];
  const skok = W - 2 * LEG_INSET - LEG_W;
  if (wRzedzie === 1) xs.push(Math.round((W - LEG_W) / 2));
  else for (let i = 0; i < wRzedzie; i++)
    xs.push(Math.round(LEG_INSET + (skok * i) / (wRzedzie - 1)));
  return { ile, xs, srodek, w: LEG_W, ins: LEG_INSET };
};

// zbior nazw, ktore w podanych zestawach materialow maja wiecej niz jedna grubosc
const ambiguousThickness = (mats) => {
  const by = new Map();
  mats.forEach((mm) =>
    Object.values(mm || {}).forEach((m) => {
      if (!m || !m.name) return;
      const k = m.name.trim();
      if (!by.has(k)) by.set(k, new Set());
      by.get(k).add(m.thickness);
    })
  );
  return new Set([...by.entries()].filter(([, set]) => set.size > 1).map(([k]) => k));
};

const matLabelOf = (m, key, ambiguous) => {
  const parts = [((m && m.name) || "").trim() || key];
  if (COLORED_KEYS.includes(key)) parts.push(colorLabel(m));
  if (ambiguous && ambiguous.has(((m && m.name) || "").trim())) parts.push(String(m.thickness));
  return parts.join(" ");
};

/* Zawieszka kuchenna R0 z regulacja, ZK-ZAW-R0-10 (instrukcje/ZK-ZAW-R0-10_zawieszka_karta.pdf):
   57,2 × 37,5 × 17,4 mm, dwa otwory ⌀4,1 w rozstawie 32 mm. W plycie nic sie nie
   wierci — zawieszke przykreca sie wkretami (uzytkownik 2026-09-29). */
const ZAWIESZKA_MODEL = "ZK-ZAW-R0-10, 57,2 × 37,5 × 17,4 mm, przykręcana 2 wkrętami 4 × 30 (otwory ⌀4,1, rozstaw 32 mm)";
// montaz (uzytkownik 2026-09-29): na samej gorze, pod wiencem, 1 cm od plecow; wkrety 4 × 30 jak w reszcie szafki
const ZAWIESZKA_OD_PLECOW = 10;
// od tej szerokosci dodatkowe zawieszki na przegrodach pionowych
const ZAWIESZKA_SZEROKA = 900;
const ZAWIESZKA_WKRETY = 2;
const zawieszkaNote = (odTylu, ile = 1) =>
  `bez wiercenia — przykręcana ${ZAWIESZKA_WKRETY} wkrętami 4 × 30 od wnętrza; wysokość = górna krawędź zawieszki pod wieńcem, `
  + `tylna krawędź ${fmt(odTylu)} mm od tylnej krawędzi płyty (1 cm od pleców)${ile > 1 ? ` — ${ile} szt. na płycie` : ""}; ZK-ZAW-R0-10`;

/* Rozkroj przelicza sie sam tyle po ostatniej zmianie formatek (uzytkownik
   2026-09-29): 1 s do ROZKROJ_DUZY szafek, 5 s powyzej — pomiar: 40 szafek
   niezauwazalne, 100 szafek jedno przytrzymanie ok. 0,3–0,45 s. Gdy program
   przycina albo sie zawiesza po zmianach, to pierwszy podejrzany (BLEDY.md). */
const ROZKROJ_ZWLOKA = 1000;
const ROZKROJ_ZWLOKA_DUZY = 5000;
const ROZKROJ_DUZY = 40;

// zasada liczby zawiasow — podpowiedz przy polu „zawiasy” drzwi (przeniesiona z listy produktow)
const ZAWIASY_ZASADA = "Liczba zawiasów — puste liczy automatycznie: dwa na skrzydło, trzy dopiero przy szerokości powyżej 500 mm i wysokości powyżej 1400 mm, cztery powyżej 2000 mm; wąskie drzwi zawsze dwa.";
// powierzchnia w podsumowaniach: mala (np. wstawka 720 × 60 = 0,04 m²) z dwoma miejscami, zero pomijamy
const m2Fmt = (v) => (v < 1 ? (Math.round(v * 100) / 100).toFixed(2).replace(/0$/, "") : fmt(v));

/* Blat roboczy liczy sie dlugoscia, nie powierzchnia — kupuje sie go w arkuszach
   4100 mm, wiec liczy sie ile metrow (komentarz uzytkownika 2026-09-29). W
   podsumowaniach formatek: plyty w m², blat w mb. Klucz — nazwa materialu. */
const powierzchnieIBlat = (lista, klucz) => {
  const pow = {}, blat = {};
  lista.forEach((p) => {
    const k = klucz(p);
    if (p.matKey === "worktop") blat[k] = (blat[k] || 0) + (p.qty * p.a) / 1000;
    else pow[k] = (pow[k] || 0) + (p.qty * p.a * p.b) / 1e6;
  });
  return { pow, blat };
};

/* Zapas okleiny na kazdy oklejany bok formatki: oklejarka wypuszcza okleine
   z przodu i z tylu, a potem ja odcina — 9 cm na bok (uzytkownik 2026-09-29).
   Doliczany do materialu obrzeza (22 mm i ABS na blat) i do uslugi oklejania. */
const OBRZEZE_ZAPAS = 90;

/* Ceny startowe — WSZYSTKIE BRUTTO, bo tyle sie faktycznie placi.
   Kazda da sie nadpisac w karcie Wyceny; wpisanie 0 zeruje pozycje.
   Oklejanie liczone jest za kazdy rozpoczety metr, stad zaokraglanie w gore. */
const DEFAULT_PRICES = {
  plytaBiala: 223.1, // arkusz 2800 × 2100 × 18, biel
  plytaKolor: 240, // ten sam arkusz w kolorze
  hdf: 70, // arkusz plecow, cena jedna dla wszystkich kolorow
  ciecie: 51.66, // formatowanie jednego arkusza
  obrzeze: 3.38, // obrzeze 22 × 2 mm, za mb
  oklejanie: 8.86, // oklejanie prostoliniowe, za rozpoczety mb
  // blat roboczy (faktura uzytkownika 2026-09-29): ABS 43/2 na konce, usluga PCV > 23 mm
  obrzezeBlat: 6.68, // obrzeze ABS 43 × 2 mm, za mb
  oklejanieBlat: 11.81, // oklejanie prostoliniowe PCV > 23 mm, za rozpoczety mb
};

/* Plyta w kolorze jest drozsza od bialej, a koloru nie ma w nazwie materialu,
   wiec rozpoznajemy go po odcieniu: bardzo jasny = biel. */
const isWhiteBoard = (hex) => {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ""));
  if (!m) return true;
  const v = parseInt(m[1], 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255].every((c) => c >= 0.85 * 255);
};

/* Prowadnice: cena zalezy od wysokosci boku i dlugosci NL. Progi z cennika,
   w kazdym przedziale przyjmujemy srodek podanego widelka. */
const SLIDE_PRICES = {
  80: [{ maxNl: 400, price: 74 }, { maxNl: Infinity, price: 81 }], // brak w cenniku, przyjete jak 95
  95: [{ maxNl: 400, price: 74 }, { maxNl: Infinity, price: 81 }],
  127: [{ maxNl: 400, price: 86 }, { maxNl: Infinity, price: 95 }],
  178: [{ maxNl: 400, price: 91.5 }, { maxNl: Infinity, price: 100 }],
  210: [{ maxNl: Infinity, price: 108.5 }],
  238: [{ maxNl: 450, price: 110 }, { maxNl: Infinity, price: 126 }],
};

/* Okucia dopasowujemy po samej nazwie — specyfikacja bywa zmienna
   (np. zawias nakladany kontra wpuszczany), a cena i tak jest ta sama. */
const DEFAULT_HW_PRICES = {
  Zawias: 3,
  "Nóżka regulowana": 2.3,
  "Zaślepka na konfirmat": 0.7, // blister 25 szt.
  Uchwyt: 10,
  "Konfirmat 7 × 50": 0.1,
  "Kołek podporowy ⌀5": 0.1,
  "Zawieszka meblowa regulowana": 3,
  "Listwa montażowa do zawieszek": 9, // za metr
  "Hak / wkręt z kołkiem do ściany": 1,
  "Trójkąt meblarski": 0.25,
  "Złączka do cokołu": 0.3,
  "Lustro na drzwiach": 200, // za m²
  "Zszywka / gwoździk do pleców": 0.05,
  "Wkręt 3,5 × 30 do pleców": 0.05,
  "Wkręt 4 × 30": 0.08,
  /* Zawiasy szafki naroznej ze skrzydlami lamanymi: pierwsze skrzydlo na
     zawiasie szerokokatnym, drugie na lamanym — jedne i drugie po 15 zl. */
  "Zawias 165°": 15,
  "Zawias łamany 90°": 15,
  // klapy — cena standardowa ustalona z uzytkownikiem (2026-09-28)
  "Podnośnik gazowy do klapy": 10,
  "Amortyzator do klapy opadanej": 10,
};

/* Prowadnica ma rozmiar w nazwie i NL w specyfikacji, wiec nie da sie jej
   zalatwic zwyklym wpisem w tabeli — stad osobne dopasowanie. */
const hwDefaultPrice = (h) => {
  const sl = /^Prowadnica .*?(\d+) mm$/.exec(h.name || "");
  if (sl) {
    const bands = SLIDE_PRICES[Number(sl[1])];
    if (!bands) return 0;
    const nl = Number((/(\d+)/.exec(h.spec || "") || [])[1]) || 0;
    return (bands.find((b) => nl <= b.maxNl) || bands[bands.length - 1]).price;
  }
  // uchwyt moze miec wlasna nazwe, wiec dopasowujemy po stalym kluczu pozycji
  return DEFAULT_HW_PRICES[h.pk || h.name] || 0;
};

/* Ceny netto rozdawane przez wczesniejsza wersje — jesli projekt ma
   dokladnie te wartosci, znaczy ze nikt ich nie ruszal, wiec ustepuja
   nowym cenom brutto zamiast zanizac wycene. */
const LEGACY_NET_PRICES = {
  "plyta:Płyta laminowana 18": 181.38,
  ciecie: 42,
  obrzeze: 2.75,
  oklejanie: 7.2,
};

const MIN_COL = 200; // najwezsza sensowna kolumna
/* Wystawanie uchwytu przed lico frontu. Jedno miejsce dla rysunku 3D i dla
   kontroli otwierania — inaczej model kolizji rozjezdzalby sie z tym, co widac.
   Dotyczy tak samo drzwi jak i szuflad. */
const handleOutOf = (cab) => Math.max(0, Math.round(Number((cab || {}).handleOut ?? 20) || 0));
/* Uchwyt jednego frontu: ile wystaje (wlasne ustawienie skrzydla albo szafki,
   domyslnie 20 mm) i gdzie siedzi. Drzwi maja uchwyt na boku (pionowy, przy
   wolnej krawedzi) albo u gory (poziomy, przy wolnym rogu) — prosba
   uzytkownika 2026-09-28. Szuflada i klapa: poziomy na srodku. Zwraca obrys
   w ukladzie szafki (mm) dla bryly 3D i rzutu z gory. */
const uchwytOut = (d, cab) => {
  const w = num(d.handleOut);
  return w !== null ? Math.max(0, Math.round(w)) : handleOutOf(cab);
};
/* Konfirmaty: co ok. 200 mm styku, minimum 2; skrajne 50 mm od przedniej
   i tylnej krawedzi plyty, reszta rowno pomiedzy (uzytkownik 2026-09-29). Ta
   sama liczba idzie do okuc i do planu wiercen. */
const KONF_OD_KRAWEDZI = 50;
const konfirmatyNaStyk = (len) => Math.max(2, Math.ceil((len || 0) / 200));
const konfirmatyPoz = (len, od = 0) => {
  const n = konfirmatyNaStyk(len);
  const a = KONF_OD_KRAWEDZI, b = Math.max(a, len - KONF_OD_KRAWEDZI);
  return [...Array(n)].map((_, i) => Math.round(od + (n === 1 ? (a + b) / 2 : a + ((b - a) * i) / (n - 1))));
};
// kolki z obu stron przegrody na tej samej wysokosci: o tyle przesuwamy jedna strone do srodka polki
const KOLEK_PRZESUN = 20;
/* Mocowanie polek w kolumnach: kolki podporowe (przestawne), konfirmaty albo
   trojkaty meblowe (uzytkownik 2026-09-29) — po dwa na strone polki, przy jej
   przedniej i tylnej krawedzi, KONF_OD_KRAWEDZI od nich. */
const mocowaniePolek = (cab) => (cab.shelfMount === "confirmat" ? "confirmat"
  : cab.shelfMount === "trojkaty" ? "trojkaty" : "pins");
const UCHWYT_OD_KRAWEDZI = 36;   // os uchwytu pionowego od wolnej krawedzi skrzydla
const uchwytObrys = (d) => {
  if (d.type === "drawer" || d.type === "klapa") {
    const cy = d.type === "klapa" ? klapaUchwytY(d) : d.y + d.h - Math.min(50, d.h / 2);
    return { x0: d.x + d.w / 2 - Math.min(120, d.w * 0.3), x1: d.x + d.w / 2 + Math.min(120, d.w * 0.3), y0: cy - 6, y1: cy + 6 };
  }
  if (d.handlePos === "gora") {
    const len = Math.min(160, d.w * 0.5);
    const cy = d.y + d.h - Math.min(40, d.h / 4);
    return d.hingeSide === "left"
      ? { x0: d.x + d.w - 30 - len, x1: d.x + d.w - 30, y0: cy - 6, y1: cy + 6 }
      : { x0: d.x + 30, x1: d.x + 30 + len, y0: cy - 6, y1: cy + 6 };
  }
  /* 30 mm od wolnej krawedzi do uchwytu z obu stron (os 36 mm). Wczesniej
     przy zawiasie po prawej bylo 20 mm, po lewej 32 — audyt rysunkow 2D. */
  const cx = d.hingeSide === "left" ? d.x + d.w - UCHWYT_OD_KRAWEDZI : d.x + UCHWYT_OD_KRAWEDZI;
  return { x0: cx - 6, x1: cx + 6, y0: d.y + d.h / 2 - Math.min(90, d.h * 0.25), y1: d.y + d.h / 2 + Math.min(90, d.h * 0.25) };
};
// szerokosc pionowego wspornika w wewnetrznym rogu szafki naroznej
/* Ramie katownika w rogu szafki w L. To nie jest liczba z powietrza: 60 mm to
   najmniejsza formatka, jaka da sie uciac i okleic (MIN_PART nizej), a katownika
   z czegos wezszego nikt nie zrobi. */
const CORNER_BRACKET_W = 60;
/* Wymiary startowe szablonu „Narożnik L". Korpus jest szerszy od glebokosci
   drugiego ciagu, bo inaczej nie zostaje nic na front — CORNER_L_W minus
   CORNER_L_D (i minus grubosc frontu ramienia) to swiatlo, ktore zostaje do reki.

   Ramie liczy sie OD konca naroznego kwadratu: przy drugiej scianie narożnik
   zajmuje CORNER_L_D + CORNER_L_ARM, czyli tyle, ile odsuwa sie tamten ciag.
   CORNER_L_TOTAL to ta wlasnie calkowita szerokosc przy drugiej scianie —
   1200 mm, bo krotsze ramie nie daje sie po nie siegnac przez rog. */
const CORNER_L_W = 900;
/* 560 jak szafka stojaca (ustalone z uzytkownikiem 2026-09-28): z HDF za
   korpusem 563 od sciany, blat nad ramieniem 593 — miesci sie w arkuszu 600. */
const CORNER_L_D = 560;
const CORNER_L_TOTAL = 1200;
const CORNER_L_ARM = CORNER_L_TOTAL - CORNER_L_D;
/* Gorna szafka w L (szablon „Górna narożna L”): korpus 650 i ramie 350 przy
   glebokosci 300 — oba fronty ponad 250 mm, przy obu scianach ok. 650. */
const CORNER_LG_W = 650;
const CORNER_LG_ARM = 350;
// ponizej tego boku formatki nie utnie sie na pile formatowej
const MIN_PART = 60;
/* Ponizej tego front robi sie waski — nie blad, bo czasem inaczej sie nie da,
   ale warto rzucic okiem, zanim pojdzie do ciecia. */
const WASKI_FRONT = 250;
/* Skrzydlo szersze niz to ciazy na zawiasach, opada i zabiera duzo miejsca przy
   otwieraniu — w kuchni drzwi robi sie zwykle do ok. 600 mm. */
const SZEROKI_FRONT = 600;
/* Wstawka w rogu: 60 mm to najwezsza formatka, jaka da sie jeszcze okleic —
   tyle ma plaska w glab, a szeroka licem do przodu (ustalone z uzytkownikiem). */
const WSTAWKA_W = 60;
/* Slepy narożnik: zaslonieta czesc frontu szafki w rogu konczy sie nie na
   korpusie sasiada, tylko na jego licu (korpus + front) i jeszcze dalej —
   fix w slepej czesci robi sie szerszy, zeby drzwi nie zahaczaly o uchwyt na
   sasiednich drzwiach. Uzytkownik robi ok. 50 mm, ale 30 mm wystarcza
   (ustalone 2026-09-28). */
const SLEPY_ZAPAS = 30;

/* ---------- klapy ----------
   Front uchylny: klapa do gory (zawiasy na gornej krawedzi) albo opadana w dol
   (zawiasy na dolnej). Zawiasy te same co przy skrzydlach: 2, powyzej 900 mm
   szerokosci 3. Podnosnik (do gory) albo amortyzator (w dol): 1, powyzej
   600 mm szerokosci domyslnie 2 (mozna zmienic).
   Sile bierzemy z tabel producenta (instrukcje od uzytkownika, 2026-09-28):
   - klapa do gory: podnosnik gazowy GTV PD-G00 „standard” — maksymalna waga
     frontu [kg] na jeden podnosnik dla sily 50–150 N, wysokosci frontu
     300–600 mm i kata otwarcia 75/90/100°. W tabeli dla 50 N / 400 mm / 75°
     wydrukowano „12” — to literowka, ma byc 1,2.
   - klapa w dol: amortyzator olejowy GTV PD-ECGDL — 60 / 80 / 150 N, tylko
     kat 90°; liczby takie same jak w PD-G00 dla 90°. Klapa uzytkownika
     560 × 750 pracuje na jednym 80 N, ale otwiera sie tylko na ok. 45°. */
const KLAPA_WYS = [300, 400, 500, 600];
const GTV_PD_G00 = {
  75: { 50: [1.6, 1.2, 1.0, 0.8], 60: [2.0, 1.5, 1.2, 1.0], 80: [2.7, 2.0, 1.6, 1.4],
    100: [3.4, 2.6, 2.0, 1.7], 120: [4.1, 3.1, 2.5, 2.0], 150: [4.7, 3.5, 2.9, 2.4] },
  90: { 50: [1.5, 1.1, 0.9, 0.7], 60: [1.8, 1.3, 1.1, 0.9], 80: [2.4, 1.8, 1.4, 1.2],
    100: [3.0, 2.2, 1.8, 1.5], 120: [3.6, 2.7, 2.1, 1.8], 150: [4.1, 3.2, 2.3, 2.1] },
  100: { 50: [1.1, 1.0, 0.8, 0.7], 60: [1.6, 1.2, 0.9, 0.8], 80: [2.1, 1.6, 1.2, 1.0],
    100: [2.6, 1.9, 1.6, 1.3], 120: [3.1, 2.3, 1.9, 1.6], 150: [3.5, 2.6, 2.2, 1.9] },
};
const GTV_PD_ECGDL = { 60: [1.8, 1.3, 1.1, 0.9], 80: [2.4, 1.8, 1.4, 1.2], 150: [4.1, 3.2, 2.3, 2.1] };
/* Gestosc robocza plyty frontu od uzytkownika: 660–680 kg/m3 — bierzemy
   gorna granice, zeby podnosnik nie wyszedl za slaby (18 mm ≈ 12,2 kg/m2). */
const GESTOSC_FRONTU = 680;
const KLAPA_MIN_KORPUS = 290;   // instrukcja GTV: korpus co najmniej 290 mm
const wagaFrontu = (w, h, grub) => (w / 1000) * (h / 1000) * (grub / 1000) * GESTOSC_FRONTU;
/* Najmniejsza sila z tabeli, ktora przy tej wysokosci frontu utrzyma podana
   wage (na jeden podnosnik). Miedzy wierszami tabeli liczymy proporcjonalnie;
   ponizej 300 mm bierzemy wiersz 300 (bezpiecznie), powyzej 600 — poza tabela.
   Klapa w dol ma tylko tabele PD-ECGDL dla 90°, wiec kat nie gra roli. */
const dobierzPodnosnik = (hFrontu, kgNaJeden, kat, kierunek = "gora") => {
  const tab = kierunek === "dol" ? GTV_PD_ECGDL : (GTV_PD_G00[kat] || GTV_PD_G00[90]);
  const sily = Object.keys(tab).map(Number).sort((a, b) => a - b);
  const h = Math.max(KLAPA_WYS[0], Math.min(KLAPA_WYS[KLAPA_WYS.length - 1], hFrontu));
  let i = 0;
  while (i < KLAPA_WYS.length - 2 && h > KLAPA_WYS[i + 1]) i++;
  const t = (h - KLAPA_WYS[i]) / (KLAPA_WYS[i + 1] - KLAPA_WYS[i]);
  const udzwig = (f) => tab[f][i] + (tab[f][i + 1] - tab[f][i]) * t;
  const sila = sily.find((f) => udzwig(f) >= kgNaJeden);
  const max = sily[sily.length - 1];
  return { sila: sila || null, poza: hFrontu > KLAPA_WYS[KLAPA_WYS.length - 1],
    udzwig: sila ? udzwig(sila) : udzwig(max), max,
    tabela: kierunek === "dol" ? "GTV PD-ECGDL" : "GTV PD-G00" };
};

/* Ile szafka w L zajmuje od rogu wzdluz obu scian i skad sie to bierze. Przy
   zwyklej szafce szerokosc to szerokosc — tu przy scianie ramienia dochodzi
   jeszcze odstep od sciany i glebokosc korpusu, a front korpusu jest wezszy
   od niego o to, co zabiera rog (glebokosc ramienia z frontem). */
const cornerSpan = (n) => {
  const a = n && n.arm;
  if (!a || !n.pair) return null;
  const r = n.pair.rogowa;
  const odScianyA = r ? r.wallGap.bottom : 0;
  const glKorpusu = r ? Math.round(r.geo.carcassDepth - r.offset) : n.pair.glRog;
  const odScianyB = n.pair.odSasiada || 0;
  // miedzy odstepem a korpusem: plecy przybijane i dosuniecie do lica ciagu
  const zaKorpusem = Math.max(0, n.pair.glRog - odScianyA - glKorpusu);
  return {
    odScianyA, glKorpusu, odScianyB, zaKorpusem, plecy: r ? r.geo.plecyZa || 0 : 0,
    // wzdluz sciany korpusu: odstep od sciany ramienia + szerokosc korpusu
    wzdluzKorpusu: odScianyB + a.cab.geo.W,
    // wzdluz sciany ramienia: odstep od sciany korpusu + glebokosc korpusu + ramie
    wzdluzRamienia: n.pair.glRog + a.len,
  };
};
const MIN_LEVEL = 100; // najnizszy sensowny poziom przy auto-dodawaniu

/* Otwory pod prowadnice V-BOX wzdluz boku, od krawedzi korpusu (instrukcja
   Sevroll, str. 6 „Wymagana przestrzen i montaz prowadnic”). */
const prowadnicaOtwory = (nl) => {
  const n = Math.round(Number(nl) || 0);
  if (n >= 600) return [37, 37 + 224, 37 + 224 + 128];
  if (n >= 450) return [37, 37 + 224];
  if (n >= 400) return [37, 37 + 192];
  if (n >= 300) return [37, 37 + 128];
  return [37, 37 + 96];
};
/* Sevroll V-BOX 3D Slim, wymiary elementow dla plyty 18 mm */
const VBOX = {
  heights: [80, 95, 127, 178, 210, 238],
  backH: { 80: 71, 95: 86, 127: 118, 178: 169, 210: 200, 238: 230 },
  // minimalna wysokosc frontu zalezy od tego, czy front idzie na korpus czy w niego
  minFront: {
    overlay: { 80: 95, 95: 110, 127: 142, 178: 192, 210: 223, 238: 253 },
    inset: { 80: 93, 95: 108, 127: 140, 178: 190, 210: 221, 238: 251 },
  },
  nl: [250, 270, 300, 350, 400, 450, 500, 550, 600],
};

/* polska odmiana liczebnikow: 1 blad, 2-4 bledy, 5+ bledow (12-14 tez bledow) */
const plural = (n, one, few, many) => {
  const a = Math.abs(n) % 100;
  const b = a % 10;
  if (a === 1) return one;
  if (b >= 2 && b <= 4 && !(a >= 12 && a <= 14)) return few;
  return many;
};

const fmt = (n) => {
  if (n === null || n === undefined || Number.isNaN(n)) return "—";
  const r = Math.round(n * 10) / 10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
};

/* Okucia sprzedawane w opakowaniach trzymamy w sztukach az do wyswietlenia —
   inaczej suma z kilku szafek zaokraglalaby sie w gore w kazdej z osobna. */
const hwQty = (h) => (h.pack ? Math.ceil(h.qty / h.pack) : h.qty);
const hwUnit = (h) => (h.pack ? "op." : h.unit);
const hwNote = (h) => (h.pack ? ` (${h.qty} szt.)` : "");

/* Zamowienie ma miec JEDEN wiersz na produkt. Rozbite wiersze — ten sam
   trojkat osobno pod cokolem kazdej szafki i osobno pod fixem — zmuszaly do
   przegladania calej tabeli i zgadywania, czy dane zastosowanie w ogole sie
   policzylo. Pozycje z polem `use` (krotki opis, do czego ida) skladamy w
   jeden wiersz i wypisujemy kazde zastosowanie z jego liczba, zeby po sumie
   dalo sie sprawdzic, co sie na nia zlozylo. Pozycje bez `use` — prowadnice,
   lustra — zostaja osobno, bo tam inny opis znaczy inny produkt do kupienia. */
const scalOkucia = (lista) => {
  const map = new Map();
  lista.forEach((h) => {
    const k = `${h.name}|${h.unit}|${h.pack || 0}|${h.use ? "" : h.spec}`;
    const e = map.get(k);
    if (!e) {
      map.set(k, { ...h, uzycia: h.use ? [{ use: h.use, qty: h.qty }] : null });
      return;
    }
    e.qty += h.qty;
    if (!e.uzycia) return;
    const u = e.uzycia.find((x) => x.use === h.use);
    if (u) u.qty += h.qty;
    else e.uzycia.push({ use: h.use, qty: h.qty });
  });
  return [...map.values()].map(({ uzycia, ...h }) => {
    if (!uzycia) return h;
    /* Przy jednym zastosowaniu liczba jest juz w kolumnie „Ilosc", wiec jej
       nie powtarzamy — dopiero kilka zastosowan trzeba rozpisac. */
    const opis = uzycia.length === 1
      ? uzycia[0].use
      : uzycia.map((u) => `${u.use} — ${qtyFmt(u.qty)} ${h.unit}`).join("; ");
    return { ...h, spec: opis };
  });
};

/* Ilosci w wycenie mnozy sie przez cene, wiec nie moga byc zaokraglone
   mocniej niz to, czym liczymy — fmt gubi setne i m2 przestaja sie zgadzac. */
// do 3 miejsc — obrzeze liczy sie do 1 mm (uzytkownik 2026-09-29)
const qtyFmt = (n) => {
  const r = Math.round(n * 1000) / 1000;
  return Number.isInteger(r) ? String(r) : r.toFixed(3).replace(/0+$/, "");
};

// kwoty pokazujemy z groszami — fmt zaokragla do dziesiatych i gubilby je
const zl = (n) => {
  if (n === null || n === undefined || Number.isNaN(n)) return "—";
  return (Math.round(n * 100) / 100).toFixed(2);
};

const num = (v) =>
  v === "" || v === null || v === undefined || Number.isNaN(Number(v))
    ? null
    : Math.round(Number(v));

/* zawiasy: dwa w standardzie, wiecej dopiero przy duzym i szerokim skrzydle */
function autoHinges(h, w) {
  if (w <= 500) return 2;
  if (h > 2000) return 4;
  if (h > 1400) return 3;
  return 2;
}

/* prowadnice szuflad: 21 mm na stronę (razem ze ścianką skrzynki) */
/* Wysoka i waska szafka po przeskalowaniu do stalej wysokosci chowala sie na
   srodku pola, a wymiary robily sie nieczytelne — bierzemy tyle wysokosci
   okna, ile realnie jest. */
/* Rysunek ma sie skalowac do szerokosci pola, a nie miescic w stalej wysokosci
   — inaczej wysoka szafka kurczy sie do paska na srodku. Sufit jest tylko
   zabezpieczeniem przed skrajnie waskim i wysokim rzutem. */
const DRAW_MAX_H = "min(180vh, 2000px)";

const RUNNER_W = 21; // szerokosc prowadnicy przy boku
/* Od spodu prowadnicy do spodu dna skrzynki — wymiar okucia, niezalezny od
   wysokosci boku szuflady. Nad nim lezy jeszcze grubosc samego dna. */
const RAIL_TO_BOTTOM = 26;
/* Luz nad podniesionym tylem szuflady — tyl nie moze siegac dokladnie do frontu
   wyzej ani do wienca, bo bedzie o nie zawadzal przy wysuwaniu. */
const BACK_CLEAR = 20;

/* gabaryty zawiasu widziane od przodu (puszka + ramie na boku) */
const HINGE_H = 55; // wysokosc
const HINGE_W = 20; // szerokosc na boku
const HINGE_D = 80; // glebokosc zabudowy
const HINGE_REF = 100; // referencyjny odstep srodka od krawedzi frontu
const HINGE_CLR = 30; // wymagany luz od polki czy wzmocnienia

/* Srodek skrajnych zawiasow 100 mm od gory i dolu frontu, kolejne rozlozone
   rowno miedzy nimi (trzeci wypada dokladnie w polowie). Gdy zawias koliduje
   z polka albo wzmocnieniem, przesuwamy go najkrocej jak sie da tak, zeby
   zostalo HINGE_CLR luzu — i meldujemy o tym w uwagach. */
function hingePositions(y0, h, n, obstacles) {
  if (n <= 0 || h < HINGE_H) return { pts: [], moved: [] };
  const half = HINGE_H / 2;
  const lo = y0 + half;
  const hi = y0 + h - half;
  let b = y0 + HINGE_REF;
  let t = y0 + h - HINGE_REF;
  if (t <= b) {
    // front za niski na referencyjne 100 mm — rozkladamy na calej wysokosci
    b = lo;
    t = hi;
  }
  const base =
    n === 1 ? [(b + t) / 2] : Array.from({ length: n }, (_, i) => b + ((t - b) * i) / (n - 1));
  const pts = [];
  const moved = [];
  base.forEach((want) => {
    let y = Math.min(hi, Math.max(lo, want));
    for (let pass = 0; pass < 4; pass++) {
      const hit = obstacles.find(
        (o) => y + half + HINGE_CLR > o.y0 && y - half - HINGE_CLR < o.y1
      );
      if (!hit) break;
      const below = hit.y0 - HINGE_CLR - half;
      const above = hit.y1 + HINGE_CLR + half;
      const okB = below >= lo;
      const okA = above <= hi;
      let ny = null;
      if (okB && okA) ny = Math.abs(below - want) <= Math.abs(above - want) ? below : above;
      else if (okB) ny = below;
      else if (okA) ny = above;
      if (ny === null) break; // nie ma gdzie uciec — zostawiamy i tak jest ostrzezenie
      y = ny;
    }
    const yr = Math.round(y);
    if (Math.abs(yr - Math.round(want)) >= 1) moved.push({ from: Math.round(want), to: yr });
    pts.push(yr);
  });
  return { pts, moved };
}

/* rozdziela `total` na pola: podane zostaja, puste dziela reszte po rowno */
function distribute(total, targets) {
  const t = targets.map(num);
  const fixed = t.reduce((s, v) => s + (v === null ? 0 : v), 0);
  const auto = t.map((v, i) => (v === null ? i : -1)).filter((i) => i >= 0);
  const out = t.slice();
  if (auto.length) {
    const rest = total - fixed;
    const base = rest >= 0 ? Math.floor(rest / auto.length) : 0;
    const rem = rest >= 0 ? rest - base * auto.length : 0;
    auto.forEach((idx, k) => (out[idx] = rest >= 0 ? base + (k < rem ? 1 : 0) : 0));
  }
  const sum = out.reduce((s, v) => s + v, 0);
  return { sizes: out, diff: total - sum };
}

/* Rowny podzial pasma wychodzi tylko przy odpowiednim luzie. Szukamy najblizszego
   luzu w gore i w dol, przy ktorym reszta pasma dzieli sie na formatki bez
   resztek — `span` to cale pasmo, `n` liczba frontow, `fixedSum` suma tych o
   zadanym wymiarze, `autoCnt` liczba dzielonych po rowno. */
const evenGapOptions = (span, n, fixedSum, autoCnt, gap, min = 2, max = 12) => {
  const fits = (G) => {
    if (G < min || G > max) return false;
    const rest = Math.round(span - (n - 1) * G - fixedSum);
    return rest >= autoCnt && rest % autoCnt === 0;
  };
  let up = null;
  let down = null;
  for (let d = 1; d <= max && up === null; d++) if (fits(gap + d)) up = gap + d;
  for (let d = 1; d <= max && down === null; d++) if (fits(gap - d)) down = gap - d;
  return { up, down };
};

const defaultMaterials = {

};

// element wzmacniajacy w kolumnie (moze byc wiele)
// orient: "front" = pionowa plyta w licu (trawers), "shelf" = lezacy jak polka,

/* Ile polek wrzucic do swiezej szafki. Zamiast sztywnej trojki bierzemy tyle,
   ile zmiesci sie przy zachowaniu sensownego swiatla — niska szafka dostanie
   jedna polke, slupek kilka. Uzytkownik i tak moze dolozyc albo usunac. */
const MIN_OPENING = 250; // najmniejsze swiatlo miedzy polkami przy auto-doborze

const autoShelves = (innerH, t = 18, minOpen = MIN_OPENING) => {
  let n = 0;
  while (n < 20 && (innerH - (n + 1) * t) / (n + 2) >= minOpen) n++;
  return n;
};

/* Swiatlo w pionie bez wnikania w kolumny — tyle wystarczy do doboru polek. */
const innerHeightOf = (H, { t = 18, plinth = 0, hasBot = true, hasTop = true } = {}) =>
  H - (hasBot ? t : 0) - (hasTop ? t : 0) - plinth;

const newColumn = (doors = 1, shelves = 0) => ({
  w: null,
  kind: "doors",
  doors,
  shelfTargets: Array(shelves + 1).fill(null),
  nl: null,
  drawers: [],
  doorWidths: [],

  handles: [],
  hinges: [],
  rails: [],
  backMode: "inherit",
  fix: { side: "none", w: 60, mode: "overlay", support: false, supportDepth: 100 },
  blendaMode: "overlay",
  drawerMode: "inherit", // front szuflady: dziedziczy z korpusu / na korpusie / wewnatrz
  hinge: "auto",
});

const newDrawer = (h = "auto") => ({ h, front: null, handle: true });

/* Para wzmocnien zamiast wienca: z przodu plyta na plask, do ktorej przykreca
   sie blat, z tylu stojaca, ktora trzyma korpus w kacie prostym. */
/* Tylne wzmocnienie stoi pionowo i konczy sie rowno z bokami — dokladnie tak,
   jak konczy sie tylna krawedz korpusu. Plecy idzie na nie normalnie, tak jak
   przybija sie je do bokow. */
/* W rogu plyta od strony drzwi tez staje pionowo i jest wezsza: dwie stojace
   plyty spotykaja sie tam pod katem prostym i skreca sie je przez lico jednej
   w czolo drugiej. Plaska, na 100 mm, dawala tam tylko styk krawedzi. */
const ROG_WZM_H = 60;
const railPair = (cofniete = 0, odTylu = 0, pionZPrzodu = false) => ([
  pionZPrzodu
    ? { ...newRail(), orient: "front", pos: "top", h: ROG_WZM_H, atDepth: cofniete, fromBack: false }
    : { ...newRail(), orient: "shelf", pos: "top", depth: 100, atDepth: cofniete, fromBack: false },
  { ...newRail(), orient: "front", pos: "top",
    h: pionZPrzodu ? ROG_WZM_H : 100, atDepth: odTylu, fromBack: true },
]);

/* Szafka pod blatem roboczym: wieniec schodzi, a kazda kolumna najwyzszego
   poziomu dostaje te pare. Ta sama zamiana idzie z przycisku w Uwagach, wiec
   liczy sie w jednym miejscu. */
const bezWienca = (cab, tfIn) => {
  /* Grubosc frontu bierzemy z materialu szafki — wpisana na sztywno klamalaby
     przy plycie innej niz 18 mm. Gdy wolajacy jej nie zna, zostaje domyslna. */
  const tf = Math.max(1, Math.round(Number(tfIn) || defaultMaterials.front.thickness));
  const levels = JSON.parse(JSON.stringify(cab.levels || []));
  const last = levels.length - 1;
  /* W szafce naroznej wzmocnienie z przodu cofa sie o grubosc frontu, zeby jego
     czolo wypadlo rowno z wewnetrzna strona maskownicy katownika i bylo do czego
     ja przykrecic. */
  const wRogu = !!(cab.corner || {}).on;
  const cofniete = wRogu ? tf : 0;
  /* W szafce naroznej tylne wzmocnienie cofa sie od plecow o grubosc plyty:
     dolega wtedy do wewnetrznego lica katownika w tylnym narozniku i jest do
     czego je przykrecic. W zwyklej szafce nie ma tam czego szukac, wiec stoi
     rowno z tylna krawedzia, a plecy ida na nie. */
  const odTylu = (cab.corner || {}).on ? Math.round(tf) : 0;
  if (last >= 0)
    levels[last].cols = (levels[last].cols || []).map((c) => ({
      ...c, rails: [...(c.rails || []), ...railPair(cofniete, odTylu, wRogu)],
    }));
  return { joints: { ...(cab.joints || {}), topL: "none", topR: "none" }, levels };
};

const newLevel = (doors = 2, shelves = 3) => ({

  cols: [newColumn(doors, shelves)],
});

const defaultCab = {

  /* Luz miedzy drzwiami musi byc PARZYSTY, jesli luz przy krawedziach tez jest

  gaps: { edge: 2, between: 2, top: 3, bottom: 3, inset: 2, divOverlay: 7,

     plaszczyzna przez wszystkie szafki i nie zjada swiatla wnetrza. */
  plinth: { on: false, height: 100, mode: "under", setback: 0 },
  // wieniec jako blat: wystaje poza boki i poza lico korpusu, a fronty
  // konczą sie pod nim
  top: { mode: "wieniec", widthMode: "outside", overL: 0, overR: 0, overFront: 0, overBack: 0 },
  topFiller: { on: false, height: 100 }, // zaslepka nad szafka (do sufitu / maskownica)
  extraParts: [], // formatki dopisane recznie, poza geometria szafki
  note: "", // notatka montazowa — trafia do zestawienia
  frontSameAsBoard: true,
  shelfSameAsBoard: true,
  openAngle: 90,
  /* Strona zawiasow dla pojedynczych drzwi — jedno ustawienie na cala szafke,
     bo w kuchni wszystkie drzwi otwiera sie zwykle w te sama strone.
     „auto" = jak dotad, czyli od lewej, chyba ze z lewej stoi fix. */
  hinge: "auto",
  /* `count` puste = liczba nozek z szerokosci (autoLegs); wpisana liczba ma
     pierwszenstwo. Nieparzysta znaczy jeszcze jedna podpora na srodku dna. */
  legs: { on: false, height: 100, color: "#3f3f46", shape: "box", count: null },
  /* Szafka narozna w L: do korpusu dochodzi ramie wzdluz drugiej sciany, a oba
     fronty spotykaja sie w rogu pod katem prostym. `arm` to dlugosc ramienia
     mierzona wzdluz tamtej sciany. `doors` mowi, jak zamykaja sie drzwi:
     „wsporniki" = dwa pionowe wsporniki w wewnetrznym rogu (jak w zdjeciach),
     „lamane" = drzwi na podwojnych zawiasach, „skrecone" = dwa fronty skrecone
     na staly kat 90 stopni, na zawiasach z jednej strony, „fix" = ramie zaslepia
     przykrecony na staly fix, a otwieraja sie tylko jedne drzwi w korpusie. */
  corner: { on: false, arm: 600, doors: "wsporniki", bracket: "krotsze",
    /* Od strony ramienia korpus nie ma boku — przechodzi w ramie. Zamiast plyty
       stoi tam katownik: dwie plyty polkowe pod 90 stopni, na cala wysokosc
       wnetrza, w zewnetrznym narozniku. `side` mowi, ktora strona to jest;
       „auto" znaczy prawa, a rozjazd z ukladem zglasza uwaga. */
    /* Plecy ramienia z pelnej plyty zamiast HDF. Plyta trzyma rog sama, wiec
       stojace wzmocnienie przy niej schodzi — to samo po stronie korpusu robi
       zwykle ustawienie pleców na „płyta". */
    /* Wzmocnienia ramienia to osobne plyty — `railW` trzyma ich szerokosc,
       osobno dla czolowej i tylnej. Puste = tak jak w korpusie. */
    /* `bracketW` to szerokosc pionowych wspornikow w rogu przy drzwiach —
       domyslnie CORNER_BRACKET_W, mniej niz MIN_PART sie nie da okleic. */
    post: { on: true, w: 150 }, side: "auto", backBoard: false, bracketW: null,
    railW: { przod: null, tyl: null } },
  // polki w kolumnach: na kolkach podporowych czy skrecane konfirmatami
  shelfMount: "pins",
  // odsuniecie osi otworu pod kolek od przedniej i tylnej krawedzi polki
  shelfPin: { dFront: 37, dBack: 37 },
  // od czego liczymy wysokosc otworu: "panel" = dolna krawedz boku/przegrody
  // (tak sie mierzy plyte na stole), "bottom" = dno szafki
  pinDatum: "panel",
  hangers: "auto", // zawieszki do szafek wiszacych: auto / zawsze / nigdy
  // pojedyncza szafka wisi na haczykach; listwa oplaca sie dopiero, gdy szafek
  // jest kilka w ciagu i trzeba je wyrownac do jednej linii
  hangerMode: "haczyki", // zawieszki mocowane na listwie albo wprost na haczyki
  grainMatters: false,
  texture: false, // rysuj strukture slojow zamiast plaskiego koloru
  textureDir: "v", // kierunek slojow na rysunku: v = pionowo, h = poziomo
  realColors: false,
  // dwa niezaleznie wycinane narozniki TYLNE (lewy = cutout, prawy = cutoutR)
  cutout: { on: false, w: 100, d: 100, fullHeight: true, levelIndex: 0, mask: true, maskType: "auto", maskFront: "over" },
  cutoutR: { on: false, w: 100, d: 100, fullHeight: true, levelIndex: 0, mask: true, maskType: "auto", maskFront: "over" },
  obstacles: [],
  // kazdy element: { on, w, d, h, side, fromSide, fromBack, fromBottom, fullHeight,
  //   mask, maskType, maskFront, maskCorner, maskToShelf, maskH }
  obstacle: { on: false, w: 80, d: 80, h: 0, side: "right", fromSide: 0, fromBack: 0, fromBottom: 0, fullHeight: true, mask: false, maskType: "auto", maskFront: "over" },
  edgeOverrides: {},
};

// scala wczytana szafke z domyslnymi polami + migruje stary model wyciecia
/* `mat` sluzy tylko do tego, zeby prostowanie starych ustawien liczylo sie
   gruboscia plyty z projektu, a nie liczba wpisana na sztywno. */
const migrateCab = (rawCab, mat) => {
  const merged = { ...defaultCab, ...(rawCab || {}), version: defaultCab.version };
  if (!merged.top || typeof merged.top !== "object")
    merged.top = { mode: "wieniec", widthMode: "outside", overL: 0, overR: 0, overFront: 0, overBack: 0 };
  if (!Array.isArray(merged.extraParts)) merged.extraParts = [];
  ["cutout", "cutoutR", "obstacle", "backGroove", "plinth", "topFiller", "legs", "corner", "gaps", "joints", "shelfPin"].forEach((k) => {
    if (defaultCab[k] && typeof defaultCab[k] === "object")
      merged[k] = { ...defaultCab[k], ...((rawCab && rawCab[k]) || {}) };
  });
  /* Stare domyslne frezu (16 od tylu, 4 w plyte) liczyly sie jak rowek
     odsuniety od tylu — zamieniamy na wreg 16 × 3 zlicowany z tylem. Wpisane
     recznie liczby zostaja: pola „Szerokość”/„Głębokość” juz wtedy znaczyly to,
     co teraz. */
  {
    const bg = merged.backGroove;
    if (bg && !(rawCab && rawCab.backGroove && rawCab.backGroove.wreg)) merged.backGroove = (bg.offset === 16 && bg.depth === 4)
      ? { ...bg, offset: 3, depth: 16, wreg: true } : { ...bg, wreg: true };
  }
  /* Tylne wzmocnienie: w zwyklej szafce rowno z tylna krawedzia (plecy ida na
     nie), w naroznej cofniete o grubosc plyty, zeby doleglo do wewnetrznego
     lica katownika w rogu. Po drodze bylo raz tak, raz tak, wiec prostujemy to
     przy wczytaniu — ale tylko dla plyty z tej pary (stojaca, u gory) i tylko
     gdy stoi na jednej z naszych wartosci, zeby nie kasowac recznych ustawien. */
  const wRogu = !!(merged.corner || {}).on;
  const tPlyty = Math.max(1, Math.round(Number(((mat || defaultMaterials).board || {}).thickness) || 18));
  (merged.levels || []).forEach((lv) => (lv.cols || []).forEach((c) => {
    (c.rails || []).forEach((r) => {
      if (r.orient === "front" && r.fromBack && r.pos === "top") {
        const at = Number(r.atDepth) || 0;
        if (at === 0 || at === tPlyty) r.atDepth = wRogu ? tPlyty : 0;
        /* W rogu obie plyty tej pary stoja pionowo i maja 60 mm — dwie stojace
           latwiej skrecic w kacie. Stare 100 mm z domyslnego ukladu zmieniamy,
           recznie ustawionej innej szerokosci nie ruszamy. */
        if (wRogu && Number(r.h) === 100) r.h = ROG_WZM_H;
        return;
      }
      /* Plyta od strony drzwi w rogu stoi teraz pionowo i ma 60 mm. Projekty
         z czasow, gdy lezala na plask na 100 mm, przestawiamy — rozpoznajemy ja
         po tej samej sygnaturze, ktora sama zaklada `railPair`. */
      if (wRogu && r.orient === "shelf" && r.pos === "top" && !r.fromBack
        && Number(r.depth) === 100) {
        r.orient = "front";
        r.h = 60;
        delete r.depth;
      }
    });
  }));
  if (rawCab && rawCab.cutout && rawCab.cutout.corner === "backRight") {
    merged.cutoutR = { ...merged.cutout };
    merged.cutout = { ...defaultCab.cutout };
  }
  if (merged.cutout) delete merged.cutout.corner;
  if (merged.cutoutR) delete merged.cutoutR.corner;
  return merged;
};
// stare nazwy niosly grubosc i rodzaj w jednym; teraz sklada sie ja z pol
const LEGACY_MAT_NAMES = { "Płyta laminowana 18": "Płyta", "HDF 3": "HDF", "Lustro 4": "Lustro" };

const migrateMat = (rawMat) => {
  const mm = { ...defaultMaterials };
  if (rawMat) Object.keys(mm).forEach((k) => { mm[k] = { ...mm[k], ...(rawMat[k] || {}) }; });
  Object.keys(mm).forEach((k) => {
    const n = (mm[k].name || "").trim();
    if (LEGACY_MAT_NAMES[n]) mm[k] = { ...mm[k], name: LEGACY_MAT_NAMES[n] };
  });
  mm.mirror = { ...mm.mirror, color: defaultMaterials.mirror.color }; // kolor lustra staly
  return mm;
};
// buduje stan projektu z wczytanych danych: obsluguje stary {cab,mat} i nowy {items,active}
const DEFAULT_PROJECT_NAME = "Projekt bez nazwy";
/* Dokument we wspolnym magazynie artefaktu na claude.ai, do ktorego przycisk
   „Wyslij do Claude" zapisuje biezacy projekt (pole `json`) — Claude czyta go
   stamtad. Poza artefaktem na claude.ai nieuzywany. */
const PROJEKT_DLA_CLAUDE = "projekt/biezacy";

/* ---------- ciagi meblowe ----------
   Ciag to grupa szafek stojacych obok siebie przy jednej scianie. Sam nie jest
   szafka — trzyma to, co szafki maja wspolne (dlugosc sciany, luz miedzy
   korpusami), a kolejnosc ustawienia bierze z kolejnosci szafek w projekcie,
   zeby nie prowadzic dwoch list naraz i nie musiec ich godzic.
   Szafka bez ciagu jest wolnostojaca i zachowuje sie dokladnie jak dotad. */
const nextRunId = (runs) => {
  // numerujemy po kolei zamiast losowac — zapis projektu ma byc powtarzalny
  let n = 1;
  while (runs.some((r) => r.id === "c" + n)) n++;
  return "c" + n;
};

const makeRun = (runs, roomId = null) => {
  /* Numer sciany liczymy w obrebie pomieszczenia — kazde zaczyna od „Ściana 1”.
     Id ciagu jest wspolne dla calego projektu, wiec liczy sie ze wszystkich. */
  const nums = runs.filter((r) => !roomId || !r.roomId || r.roomId === roomId).map((r) => {
    const m = /^Ściana (\d+)$/.exec((r.name || "").trim());
    return m ? Number(m[1]) : 0;
  });
  /* H, D i cokol zostaja puste — ciag przejmuje je od pierwszej szafki, ktora do
     niego wejdzie. Dzieki temu nigdy nie narzuca wymiarow wzietych znikad. */
  /* Nowy ciag od razu dostaje blat roboczy: w kuchni to regula, a szafki pod
     nim nie maja wienca, tylko pare wzmocnien. Stare projekty zostaja bez
     zmian — tam `worktop` po prostu nie ma i nie wlacza sie samo. */
  return { id: nextRunId(runs), name: `Ściana ${Math.max(0, ...nums) + 1}`, roomId, wallW: null, gap: 0,
    H: null, D: null, plinth: null, plinthCuts: null, topCuts: null, worktop: true,
    hangerMode: "listwa", mountY: 0, corner: null,
    tier: "dolny", wall: null, clearance: 500, ceiling: null,
    offset: 0, offsetFrom: "left", wallGap: { bottom: 0, top: null }, topCut: null };
};

/* Gorny ciag tej samej sciany. Dlugosc sciany i narożnik bierze od dolnego, wiec
   ich tu nie ma. Wisi nad nim, jest plytszy i nie ma cokolu ani blatu. */
const GORNY_D = 300;
const makeUpperRun = (runs, dolny, mountY) => ({
  ...makeRun(runs, dolny.roomId || null), name: dolny.name, tier: "gorny", wall: dolny.id,
  wallW: null, D: GORNY_D, H: null, plinth: null, worktop: false,
  clearance: 500, ceiling: null, mountY, corner: null,
  offset: 0, offsetFrom: "left",
});

/* ---------- kreator rogu ----------
   Drugi ciag pod katem prostym do pierwszego razem z gotowa szafka w rogu —
   bez szukania pol po kartach (prosba uzytkownika 2026-09-28). Te same reguly
   co przycisk „Ustaw szafke w rogu”: slepa szafka dostaje fix na zaslonieta
   czesc (glebokosc sasiada + front + SLEPY_ZAPAS), jedne drzwi z zawiasem od
   zewnatrz (uchwyt przy fixie), a narożnik — wstawke. Szafka w L bierze
   szablon „Narożnik L” z podana szerokoscia i ramieniem.
   o = { of, at, owner, szafka: "slepa" | "L" | "brak", W, arm, wstawka: null |
   "plaska" | "szeroka", top: null | "of" | "self" } */
const KREATOR_DOMYSLNY = { at: "end", owner: "self", szafka: "slepa", W: 1000, arm: CORNER_L_ARM,
  wstawka: "plaska", top: null };
const utworzCiagZRogiem = (p, o) => {
  const runs = p.runs || [];
  const rodzic = runs.find((r) => r.id === o.of);
  if (!rodzic) return p;
  const L = o.szafka === "L";
  const nowy = { ...makeRun(runs, rodzic.roomId || null), corner: migrateCorner({ of: o.of, at: o.at, owner: o.owner, clear: 0,
    top: o.top || null, wstawka: !L && o.wstawka ? { typ: o.wstawka, w: WSTAWKA_W } : null }) };
  let items = [...p.items];
  let active = p.active;
  if (o.szafka !== "brak") {
    const doNowego = o.owner === "self";                 // szafka stoi w ciagu, ktory wjezdza w rog
    const cel = doNowego ? nowy : rodzic;
    const inny = doNowego ? rodzic : nowy;
    // rog na poczatku ciagu docelowego: nowy ciag zaczyna sie w rogu, gdy stoi „za tamtym"
    const rogNaStarcie = doNowego ? o.at === "end" : o.at !== "end";
    const W = Math.max(MIN_COL, Math.round(Number(o.W) || 0));
    let cab;
    if (L) {
      cab = { ...makeFromTemplate("naroznikL"), W };
      cab.corner = { ...cab.corner, arm: Math.max(0, Math.round(Number(o.arm) || CORNER_L_ARM)) };
    } else {
      cab = { ...makeFromTemplate("stojaca"), W };
      const strona = rogNaStarcie ? "left" : "right";
      const glInnego = (inny.D != null ? inny.D : (cel.D != null ? cel.D : CORNER_L_D))
        + wallGapOf(inny, null).bottom;
      const fixW = Math.min(W, glInnego + defaultMaterials.front.thickness + SLEPY_ZAPAS);
      cab.levels = cab.levels.map((lv) => {
        const cols = [...lv.cols];
        const j = strona === "left" ? 0 : cols.length - 1;
        cols[j] = { ...cols[j], kind: "doors", doors: 1, doorWidths: [],
          fix: { ...(cols[j].fix || {}), side: strona, w: fixW, mode: "overlay", support: false },
          hinge: strona === "left" ? "right" : "left" };
        return { ...lv, cols };
      });
    }
    // wymiary i sposob stania ciagu docelowego, jak przy „+ szafka”
    if (cel.H != null) cab.H = cel.H;
    if (cel.D != null && !L) cab.D = cel.D;
    if (cel.plinth) cab.plinth = { ...cel.plinth };
    cab.legs = { ...(cab.legs || { height: 100, color: "#3f3f46", shape: "box" }), on: true };
    cab.hangerMode = cel.hangerMode || "listwa";
    if (cel.worktop) Object.assign(cab, bezWienca(cab, defaultMaterials.front.thickness));
    const nums = items.map((it) => { const m = /^Szafka (\d+)$/.exec((it.cab.name || "").trim()); return m ? Number(m[1]) : 0; });
    cab.name = `Szafka ${Math.max(0, ...nums) + 1}`;
    const nowa = { cab, mat: defaultMaterials, runId: cel.id, roomId: cel.roomId || null, offset: 0 };
    // w ciagu docelowym: pierwsza, gdy rog jest na jego poczatku, inaczej ostatnia
    const wCelu = items.map((it, k) => ((it.runId || null) === cel.id ? k : -1)).filter((k) => k >= 0);
    const at = !wCelu.length ? items.length : rogNaStarcie ? wCelu[0] : wCelu[wCelu.length - 1] + 1;
    items = [...items.slice(0, at), nowa, ...items.slice(at)];
    active = at;
  }
  // szafka w L potrzebuje glebokosci drugiego ciagu od razu (jak szablon)
  const nowyD = L && o.owner !== "self" ? { ...nowy, D: nowy.D || CORNER_L_D } : nowy;
  const wynik = { ...p, runs: [...runs, nowyD], items, active };
  // ciag bez wymiarow przejmuje je od pierwszej szafki (jak withRunDefaults)
  wynik.runs = wynik.runs.map((r) => {
    if (r.H != null) return r;
    const pierwsza = wynik.items.find((it) => it.runId === r.id);
    return pierwsza ? { ...r, H: pierwsza.cab.H, D: pierwsza.cab.D, plinth: pierwsza.cab.plinth ? { ...pierwsza.cab.plinth } : null } : r;
  });
  /* Fix liczymy ostatecznie z ukladu, tak samo jak kontrola slepego rogu
     (`zaslania`): glebokosc sasiedniego ciagu od sciany — razem z plecami
     przybijanymi i odstepem — plus jego front i zapas. Szacunek z ustawien
     ciagu (wyzej) nie zna plecow sasiadow i roznil sie o ich grubosc. */
  if (!L && o.szafka !== "brak") {
    const z = [...projectLayout(wynik).info.values()].map((n) => n.blind)
      .find((b) => b && b.cab.index === active);
    const it = wynik.items[active];
    if (z && it) {
      const lv = it.cab.levels.map((l) => ({ ...l, cols: l.cols.map((c) => (c.fix && c.fix.w > 0
        ? { ...c, fix: { ...c.fix, w: Math.round(z.covered) } } : c)) }));
      /* Nowy obiekt, nie zmiana w miejscu: uklad jest zapamietany przy obiekcie
         projektu (`layoutCache`), wiec po podmianie `items` zostalby stary. */
      return { ...wynik, items: wynik.items.map((x, k) => (k === active ? { ...x, cab: { ...x.cab, levels: lv } } : x)) };
    }
  }
  return wynik;
};

/* Nazwa z pietrem — sama „Ściana 1" przestaje wystarczac, gdy ma dwa ciagi. */
const runLabel = (runs, run) => {
  const dolny = run.tier === "gorny" ? (runs || []).find((r) => r.id === run.wall) : run;
  const nazwa = (dolny && dolny.name) || run.name;
  const maPietra = (runs || []).some((r) => r.tier === "gorny" && r.wall === (dolny || run).id);
  if (!maPietra) return nazwa;
  return `${nazwa} — ciąg ${run.tier === "gorny" ? "górny" : "dolny"}`;
};

/* ---------- narozniki ----------
   Dwa ciagi spotykaja sie pod katem prostym. Ciag „dziecko" dostawia sie do
   konca albo do poczatku ciagu-rodzica i skreca w strone pokoju — tak samo jak
   sciany w prawdziwym pomieszczeniu. Lancuch takich narozy daje L (dwa ciagi),
   U (trzy) i G (cztery-piec), wiec nie ma tu osobnego pola „ksztalt".

   W samym rogu dwa ciagi zawsze na siebie wchodza: jeden z nich musi dojechac
   do naroza, a drugi zaczac sie dopiero za jego glebokoscia. Kto wchodzi w rog,
   mowi `owner`: „of" = rodzic, „self" = ten ciag. */
const migrateCorner = (c) => {
  if (!c || c.of == null) return null;
  return {
    of: String(c.of),
    // "end" = przy koncu rodzica (skret w prawo), "start" = przy jego poczatku
    at: c.at === "start" ? "start" : "end",
    owner: c.owner === "self" ? "self" : "of",
    // dodatkowy luz w rogu, zeby uchwyty i fronty sie nie zaczepialy
    clear: Math.max(0, Math.round(Number(c.clear) || 0)),
    /* Blat w rogu: ktory ciag przechodzi przez naroze i jak sie tnie styk.
       null = blat idzie tak jak korpusy, czyli przechodzi ten, ktory wjezdza
       w rog. „skos" to lyzwa, czyli oba kawalki ciete pod 45 stopni. */
    top: c.top === "self" || c.top === "of" ? c.top : null,
    cut: c.cut === "skos" ? "skos" : "prosty",
    /* Wstawka w rogu (tylko bez szafki w L): listwa z plyty frontowej na boku
       pierwszej szafki ciagu, ktory ustepuje, od strony rogu. „plaska" — grubosc
       plyty w poprzek, `w` (60) w glab, przykrecona wkretami; „szeroka" — `w`
       licem do przodu, na trojkatach. Odsuwa ciag o to, co widac od przodu. */
    wstawka: c.wstawka && (c.wstawka.typ === "plaska" || c.wstawka.typ === "szeroka")
      ? { typ: c.wstawka.typ, w: Math.max(20, Math.round(Number(c.wstawka.w) || WSTAWKA_W)) } : null,
  };
};

// wymiary, ktore w ciagu musza byc wspolne — inaczej fronty i blat sie rozjada
const RUN_SHARED = ["H", "D", "plinth", "hangerMode"];

/* Odsuniecie od sciany. Szafke odsuwa sie, gdy sciana jest krzywa albo cos
   z niej wystaje (rura, listwa) — za plecami zostaje wtedy pusta przestrzen.
   Dwie wartosci, bo krzywa sciana daje inny odstep przy podlodze i inny na
   wysokosci blatu, a blat liczy sie od sciany wlasnie tam. `top: null` = tyle
   samo co na dole. W szafce `null` znaczy „jak caly ciag". */
const migrateWallGap = (g) => {
  if (!g || typeof g !== "object") return null;
  const mm = (v) => Math.max(0, Math.round(Number(v) || 0));
  return { bottom: mm(g.bottom), top: g.top == null || g.top === "" ? null : mm(g.top) };
};
const wallGapOf = (run, it) => {
  const g = migrateWallGap(it && it.wallGap) || migrateWallGap(run && run.wallGap) || { bottom: 0, top: null };
  return { bottom: g.bottom, top: g.top == null ? g.bottom : g.top };
};

const migrateRun = (r) => ({
  id: String(r.id),
  // pomieszczenie; brak (stary projekt) = pierwsze — rozstrzyga loadProject
  roomId: r.roomId != null ? String(r.roomId) : null,
  name: typeof r.name === "string" && r.name.trim() ? r.name : "Ciąg",
  wallW: Number(r.wallW) > 0 ? Math.round(Number(r.wallW)) : null,
  gap: Math.max(0, Math.round(Number(r.gap) || 0)),
  H: Number(r.H) > 0 ? Math.round(Number(r.H)) : null,
  D: Number(r.D) > 0 ? Math.round(Number(r.D)) : null,
  plinth: r.plinth && typeof r.plinth === "object" ? { ...r.plinth } : null,
  // null = podzial dobierany sam; tablica = styki wybrane recznie
  plinthCuts: Array.isArray(r.plinthCuts)
    ? r.plinthCuts.map(Number).filter((n) => n > 0).sort((a, b) => a - b) : null,
  topCuts: Array.isArray(r.topCuts)
    ? r.topCuts.map(Number).filter((n) => n > 0).sort((a, b) => a - b) : null,
  // wlasne ciecia w dowolnym miejscu (mm od lewego konca), poza stykami korpusow
  plinthCutsWlasne: Array.isArray(r.plinthCutsWlasne)
    ? r.plinthCutsWlasne.map((n) => Math.round(Number(n))).filter((n) => n > 0).sort((a, b) => a - b) : [],
  topCutsWlasne: Array.isArray(r.topCutsWlasne)
    ? r.topCutsWlasne.map((n) => Math.round(Number(n))).filter((n) => n > 0).sort((a, b) => a - b) : [],
  // blat roboczy przez caly ciag; w starych projektach pola nie ma, wiec zostaje wylaczony
  worktop: r.worktop === true,
  // ciag wiesza sie na listwie; pojedyncza szafka na haczykach
  hangerMode: r.hangerMode === "haczyki" ? "haczyki" : "listwa",
  // wysokosc spodu korpusu nad podloga: 0 = ciag stoi, wiecej = ciag wisi
  mountY: Number(r.mountY) > 0 ? Math.round(Number(r.mountY)) : 0,
  /* Jedna sciana trzyma dwa pietra: dolne i gorne. Dlugosc sciany i narożnik sa
     wspolne — gorny bierze je od dolnego, na ktory wskazuje `wall`. Wysokosc
     montazu gornego nie jest wpisywana, tylko liczona: lico dolnego plus
     `clearance`. `ceiling` to wysokosc pomieszczenia, gdy chcemy znac luz nad
     szafkami. */
  tier: r.tier === "gorny" ? "gorny" : "dolny",
  wall: r.wall != null ? String(r.wall) : null,
  clearance: Number(r.clearance) > 0 ? Math.round(Number(r.clearance)) : 500,
  ceiling: Number(r.ceiling) > 0 ? Math.round(Number(r.ceiling)) : null,
  /* Odsuniecie ciagu w obrebie sciany: dolne szafki moga zaczynac sie w innym
     miejscu niz gorne. Liczone od tej krawedzi, ktora wskazuje `offsetFrom`. */
  offset: Math.max(0, Math.round(Number(r.offset) || 0)),
  offsetFrom: r.offsetFrom === "right" ? "right" : "left",
  // null = ciag stoi przy wlasnej scianie, bez zwiazku z innymi
  corner: migrateCorner(r.corner),
  wallGap: migrateWallGap(r.wallGap) || { bottom: 0, top: null },
  // blat: true = docięty na wymiar, false = caly arkusz, null = dobiera sam
  topCut: r.topCut === true ? true : r.topCut === false ? false : null,
});

// cokol porownujemy po wszystkich czterech polach — cofniecie tez psuje lico ciagu
const samePlinth = (a, b) => {
  if (!a || !b) return !a === !b;
  if (!a.on || !b.on) return !a.on === !b.on;
  return Math.round(a.height || 0) === Math.round(b.height || 0)
    && (a.mode || "inbody") === (b.mode || "inbody")
    && Math.round(a.setback || 0) === Math.round(b.setback || 0);
};

const plinthText = (p) => {
  if (!p || !p.on) return "bez cokołu";
  const gdzie = (p.mode || "inbody") === "inbody" ? "w bryle" : "pod korpusem";
  return `cokół ${fmt(p.height)} mm ${gdzie}` + (p.setback > 0 ? `, cofnięty ${fmt(p.setback)} mm` : "");
};

/* szafki jednego ciagu w kolejnosci ustawienia przy scianie; id === null daje
   szafki wolnostojace, wiec caly pasek grup idzie jednym mechanizmem */
const runItems = (project, id) =>
  project.items.map((it, i) => ({ it, i })).filter(({ it }) => (it.runId || null) === (id || null));

/* ---------- pomieszczenia ----------
   Projekt → pomieszczenia → ciagi (sciany) → szafki (uzytkownik 2026-09-29).
   Ciag ma `roomId`, szafka w ciagu nalezy do pomieszczenia swojego ciagu,
   a wolnostojaca ma wlasne `roomId`. Rogi, pietra, blaty i kolizje dzialaja
   tylko w obrebie jednego pomieszczenia; formatki, produkty, rozkroj i wycena
   ida domyslnie z calego projektu, bo to jedno zamowienie. Stary projekt bez
   pomieszczen otwiera sie jako „Pomieszczenie 1”. */
const ROOM_FIRST = { id: "p1", name: "Pomieszczenie 1" };
const roomsOf = (project) => (project && Array.isArray(project.rooms) && project.rooms.length
  ? project.rooms : [ROOM_FIRST]);
const roomOfRun = (project, run) => (run && run.roomId) || roomsOf(project)[0].id;
const roomOfItem = (project, it) => {
  if (!it) return roomsOf(project)[0].id;
  const run = it.runId ? (project.runs || []).find((r) => r.id === it.runId) : null;
  return run ? roomOfRun(project, run) : it.roomId || roomsOf(project)[0].id;
};
// pomieszczenie, ktore ogladamy = to, w ktorym stoi aktywna szafka
const activeRoomOf = (project) => roomOfItem(project, project.items[project.active]);
const runsInRoom = (project, roomId) => (project.runs || []).filter((r) => roomOfRun(project, r) === roomId);
const itemsInRoom = (project, roomId) =>
  project.items.map((it, i) => ({ it, i })).filter(({ it }) => roomOfItem(project, it) === roomId);
const roomName = (project, roomId) => {
  const r = roomsOf(project).find((x) => x.id === roomId);
  return r ? r.name : "";
};
const makeRoom = (rooms) => {
  let n = 1;
  while (rooms.some((r) => r.id === "p" + n)) n++;
  const nums = rooms.map((r) => { const m = /^Pomieszczenie (\d+)$/.exec((r.name || "").trim()); return m ? Number(m[1]) : 0; });
  return { id: "p" + n, name: `Pomieszczenie ${Math.max(0, ...nums) + 1}` };
};
/* Ciagi zwiazane ze soba rogiem albo pietrem (gorny nad dolnym) to jedna
   zabudowa — przenosi sie je miedzy pomieszczeniami tylko razem, inaczej rog
   laczylby dwa rozne pokoje. */
const grupaCiagow = (runs, id) => {
  const out = new Set([id]);
  for (let zmiana = true; zmiana;) {
    zmiana = false;
    runs.forEach((r) => {
      const sasiedzi = [r.corner && r.corner.of, r.tier === "gorny" ? r.wall : null].filter(Boolean);
      const w = out.has(r.id);
      sasiedzi.forEach((q) => {
        if (w && !out.has(q) && runs.some((x) => x.id === q)) { out.add(q); zmiana = true; }
        if (!w && out.has(q)) { out.add(r.id); zmiana = true; }
      });
    });
  }
  return out;
};

const loadProject = (d) => {
  if (!d) return null;
  let items;
  if (Array.isArray(d.items) && d.items.length) {
    items = d.items.map((it) => {
      const mat = migrateMat(it.mat);
      return { cab: migrateCab(it.cab, mat), mat,
        runId: it.runId || null, roomId: it.roomId != null ? String(it.roomId) : null,
        offset: Math.round(Number(it.offset) || 0),
        wallGap: migrateWallGap(it.wallGap) };
    });
  } else if (d.cab) {
    items = (() => { const mat = migrateMat(d.mat);
      return [{ cab: migrateCab(d.cab, mat), mat, runId: null, offset: 0 }]; })();
  } else return null;
  const runs = (Array.isArray(d.runs) ? d.runs : []).filter((r) => r && r.id != null).map(migrateRun);
  // ciag mogl wypasc z zapisu — szafka po nim wraca na wolnostojaca, nie zostaje sierota
  items.forEach((it) => { if (!runs.some((r) => r.id === it.runId)) it.runId = null; });
  /* Narożnik wskazujacy na skasowany ciag, na samego siebie albo zapetlony
     rozwiazujemy — inaczej rozmieszczenie ciagow nie mialoby konca. */
  runs.forEach((r) => {
    if (!r.corner) return;
    if (r.corner.of === r.id || !runs.some((q) => q.id === r.corner.of)) { r.corner = null; return; }
    let p = runs.find((q) => q.id === r.corner.of);
    for (let n = 0; p && p.corner && n <= runs.length; n++) {
      if (p.corner.of === r.id) { r.corner = null; break; }
      p = runs.find((q) => q.id === p.corner.of);
    }
  });
  /* Pomieszczenia. Stary projekt ich nie ma — calosc trafia do „Pomieszczenie 1”.
     Ciagi zwiazane rogiem albo pietrem ida do jednego pomieszczenia (tego, co
     ciag, od ktorego sie zaczynaja), a szafka w ciagu — do pomieszczenia ciagu. */
  const rooms = [];
  (Array.isArray(d.rooms) ? d.rooms : []).forEach((r) => {
    if (!r || r.id == null || rooms.some((x) => x.id === String(r.id))) return;
    rooms.push({ id: String(r.id), name: typeof r.name === "string" && r.name.trim() ? r.name : `Pomieszczenie ${rooms.length + 1}` });
  });
  if (!rooms.length) rooms.push({ ...ROOM_FIRST });
  const jest = (id) => rooms.some((r) => r.id === id);
  runs.forEach((r) => { if (!jest(r.roomId)) r.roomId = rooms[0].id; });
  for (let n = 0; n <= runs.length; n++) {
    runs.forEach((r) => {
      const od = r.tier === "gorny" && r.wall ? r.wall : r.corner ? r.corner.of : null;
      const q = od && runs.find((x) => x.id === od);
      if (q && q.roomId !== r.roomId) r.roomId = q.roomId;
    });
  }
  items.forEach((it) => {
    const run = it.runId && runs.find((r) => r.id === it.runId);
    it.roomId = run ? run.roomId : jest(it.roomId) ? it.roomId : rooms[0].id;
  });
  const active = Math.min(Math.max(0, Math.round(d.active || 0)), items.length - 1);
  // trzymamy wylacznie ceny wpisane recznie; domyslne siedza przy pozycjach
  const prices = { ...(d.prices && typeof d.prices === "object" ? d.prices : {}) };
  Object.entries(LEGACY_NET_PRICES).forEach(([k, v]) => {
    if (prices[k] === v) delete prices[k];
  });
  /* Etykieta materialu nosi teraz kolor, wiec recznie wpisana cena zapisana
     pod stara nazwa zostalaby sierota — przenosimy ja na nowy klucz. */
  const ambig = ambiguousThickness(items.map((it) => it.mat));
  items.forEach((it) =>
    Object.entries(it.mat || {}).forEach(([key, m]) => {
      Object.keys(LEGACY_MAT_NAMES).forEach((old) => {
        const from = "plyta:" + old;
        const to = "plyta:" + matLabelOf(m, key, ambig);
        if (prices[from] != null && prices[to] == null && LEGACY_MAT_NAMES[old] === m.name) {
          prices[to] = prices[from];
          delete prices[from];
        }
      });
    })
  );
  const name = typeof d.name === "string" && d.name.trim() ? d.name : DEFAULT_PROJECT_NAME;
  return { name, rooms, items, runs, active, prices };
};

/* ---------- szablony startowe ----------
   Szablon tylko ustawia zestaw pol — nie blokuje niczego i nie rozgalezia
   silnika geometrii. Po dodaniu szafki zmieniasz w niej co chcesz. */
const TEMPLATES = [

       ma zapas na krzywa sciane; lepiej dociac tyl blatu niz zeby zabraklo
       (ustalone z uzytkownikiem 2026-09-28, wczesniej 570). */
    hint: "600 × 720 × 560, cokół, dwoje drzwi",
    make: () => ({
      W: 600, H: 720, D: 560,
      plinth: { on: true, height: 100, mode: "under", setback: 0 },
      // cokol pod korpusem nie zjada swiatla — korpus stoi na nim caly
      levels: [newLevel(2, autoShelves(innerHeightOf(720)))],
    }),
  },
  {
    id: "wiszaca",
    label: "Szafka wisząca",
    hint: "600 × 720 × 300, bez cokołu i nóżek",
    make: () => ({
      W: 600, H: 720, D: 300,
      plinth: { on: false, height: 100, mode: "under", setback: 0 },
      legs: { on: false, height: 100, color: "#3f3f46", shape: "box" },
      levels: [newLevel(2, autoShelves(innerHeightOf(720)))],
    }),
  },
  {
    id: "biurko",
    label: "Biurko",
    hint: "1200 × 750 × 600, blat na bokach, bez dna, pleców i drzwi",
    make: () => {
      const col = newColumn(0, 0);
      col.doors = 0;
      col.shelfTargets = [null];
      return {
        W: 1200, H: 750, D: 600,
        top: { mode: "blat", widthMode: "inside", overL: 50, overR: 50, overFront: 30, overBack: 0 },
        joints: { topL: "over", topR: "over", botL: "none", botR: "none" },
        back: "none",
        plinth: { on: false, height: 100, mode: "under", setback: 0 },
        legs: { on: false, height: 100, color: "#3f3f46", shape: "box" },
        levels: [{ h: null, cols: [col] }],
      };
    },
  },
  {
    id: "slupek",
    label: "Słupek",
    hint: "600 × 2000 × 600, wyższy od ciągu — blat kończy się przy nim",
    make: () => ({
      W: 600, H: 2000, D: 600,
      plinth: { on: true, height: 100, mode: "under", setback: 0 },
      levels: [newLevel(2, autoShelves(innerHeightOf(2000)))],
    }),
  },
  {
    /* Narożnik w L to nie jedna szafka, tylko układ: szafka w rogu przy jednej
       ścianie, drugi ciąg pod kątem prostym i szafka przy nim. Ustawianie tego
       ręcznie to cztery różne pola w trzech miejscach — szablon składa to od
       razu, a `corner: true` mówi karcie, że po dodaniu ma jeszcze założyć
       drugi ciąg i dołożyć do niego szafkę. */
    id: "naroznikL",
    label: "Narożnik L",
    hint: "szafka narożna z ramieniem plus drugi ciąg za rogiem",
    corner: true,
    // glebokosc drugiego ciagu — pusty ciag nie ma jej skad wziac, a to od niej
    // zalezy, ile z szerokosci naroznika zostaje na front
    otherD: CORNER_L_D,
    make: () => {
      /* Front sięga tylko tam, gdzie korpus nie wchodzi w ramię: reszta
         szerokości chowa się za drugim ciągiem, a ostatnie milimetry zabiera
         lico ramienia, które stoi o grubość frontu przed jego korpusem.
         Szerokosci nie wpisujemy: pasmo frontu jest juz przyciete do lica
         naroznika, wiec drzwi dobieraja sie same i jada za kazda zmiana
         glebokosci sasiada. Wpisana na sztywno zostawala stara i robila szpare
         miedzy drzwiami a maskownica katownika. */

      return {
        W: CORNER_L_W, H: 720, D: CORNER_L_D,
        plinth: { on: true, height: 100, mode: "under", setback: 0 },

        levels: [{ h: null, cols: [col] }],
      };
    },
  },
  {
    /* Gorna szafka narozna (uzytkownik 2026-09-28): „wzorowana na dolnej, z tym
       ze ma wieniec”. Te same zasady co w szafce w L: korpus przy jednej scianie,
       ramie przy drugiej, katownik w tylnym narozniku zamiast boku, katownik
       naroznika przy frontach. Wymiary tak, zeby oba fronty mialy ponad 250 mm
       (przy 300 w glab korpus 650 daje 285, ramie 350 — 270); dolozona do
       gornego ciagu staje od razu przy rogu. */
    id: "naroznikLgorny",
    label: "Górna narożna L",
    hint: `${CORNER_LG_W} × 720 × ${GORNY_D}, ramię ${CORNER_LG_ARM}, wieniec, wisząca`,
    gornyRog: true,
    make: () => ({
      W: CORNER_LG_W, H: 720, D: GORNY_D,
      plinth: { on: false, height: 100, mode: "under", setback: 0 },
      legs: { on: false, height: 100, color: "#3f3f46", shape: "box" },
      corner: { on: true, arm: CORNER_LG_ARM, doors: "wsporniki" },

];

const makeFromTemplate = (id) => {
  const tpl = TEMPLATES.find((t) => t.id === id) || TEMPLATES[0];
  return migrateCab({ ...JSON.parse(JSON.stringify(defaultCab)), ...tpl.make() });
};

/* Nowy projekt startuje z szablonu „Szafka stojąca", a nie z golego defaultCab:
   szafka bez cokolu to nie jest nic, co ktos faktycznie stawia, a dopisanie
   cokolu pozniej przesuwa wszystkie wysokosci w gotowym juz projekcie.
   `makeFromTemplate` oddaje swiezy obiekt, wiec kolejne projekty nie dziela
   jednej szafki przez referencje. */
const START_TEMPLATE = "stojaca";
const newProject = () => ({
  name: DEFAULT_PROJECT_NAME,
  prices: {},
  rooms: [{ ...ROOM_FIRST }],
  items: [{ cab: makeFromTemplate(START_TEMPLATE), mat: defaultMaterials, runId: null, roomId: ROOM_FIRST.id }],
  runs: [],
  active: 0,
});

/* Wejscie do pomieszczenia: aktywna staje sie jego pierwsza szafka. Puste
   pomieszczenie (nowe albo po usunieciu ciagu) dostaje szafke startowa, jak
   nowy projekt — aplikacja zawsze ma jakas szafke do pokazania. */
const wejdzDoPokoju = (p, roomId) => {
  const akt = p.items[p.active];
  if (akt && roomOfItem(p, akt) === roomId) return p;
  const tu = itemsInRoom(p, roomId);
  if (tu.length) return { ...p, active: tu[0].i };
  const nums = p.items.map((it) => { const m = /^Szafka (\d+)$/.exec((it.cab.name || "").trim()); return m ? Number(m[1]) : 0; });
  const cab = { ...makeFromTemplate(START_TEMPLATE), name: `Szafka ${Math.max(0, ...nums) + 1}` };
  return { ...p, items: [...p.items, { cab, mat: defaultMaterials, runId: null, roomId }], active: p.items.length };
};

/* Ciagi przeniesione do innego pomieszczenia: zmieniaja `roomId` razem ze
   swoimi szafkami, a „Ściana N”, ktora tam juz jest, dostaje kolejny wolny
   numer (gorny ciag bierze nazwe swojego dolnego). Wlasne nazwy zostaja. */
const przeniesCiagi = (p, ids, roomId) => {
  const runs = p.runs || [];
  const zajete = new Set(runs.filter((r) => !ids.has(r.id) && r.tier !== "gorny"
    && roomOfRun(p, r) === roomId).map((r) => r.name));
  const nowe = new Map();
  let n = 1;
  runs.forEach((r) => {
    if (!ids.has(r.id) || r.tier === "gorny") return;
    if (zajete.has(r.name) && /^Ściana \d+$/.test(r.name)) {
      while (zajete.has(`Ściana ${n}`)) n++;
      nowe.set(r.id, `Ściana ${n}`);
    }
    zajete.add(nowe.get(r.id) || r.name);
  });
  return { ...p,
    runs: runs.map((r) => (!ids.has(r.id) ? r : { ...r, roomId,
      ...(nowe.has(r.id) ? { name: nowe.get(r.id) }
        : r.tier === "gorny" && nowe.has(r.wall) ? { name: nowe.get(r.wall) } : {}) })),
    items: p.items.map((it) => (it.runId && ids.has(it.runId) ? { ...it, roomId } : it)) };
};

/* Szafka (wolnostojaca) albo cala jej zabudowa — ciag razem ze wszystkim, co
   laczy z nim rog albo pietro — idzie do innego pomieszczenia. Widok idzie
   za nia, bo to ona jest aktywna. */
const przeniesDoPokoju = (p, i, cel) => {
  const it = p.items[i];
  if (!it || !roomsOf(p).some((r) => r.id === cel) || roomOfItem(p, it) === cel) return p;
  if (it.runId) return przeniesCiagi(p, grupaCiagow(p.runs || [], it.runId), cel);
  return { ...p, items: p.items.map((x, k) => (k === i ? { ...x, roomId: cel } : x)) };
};

/* Usuniecie pomieszczenia (uzytkownik 2026-09-29: zawsze z pytaniem). `cel`
   = pomieszczenie, do ktorego ida jego ciagi i szafki; brak = znikaja razem
   z nim. Ostatniego pomieszczenia nie usuwamy. */
const usunPokoj = (p, id, cel) => {
  const rooms = roomsOf(p);
  if (rooms.length <= 1 || !rooms.some((r) => r.id === id)) return p;
  const zostaja = rooms.filter((r) => r.id !== id);
  const ids = new Set(runsInRoom(p, id).map((r) => r.id));
  const byl = activeRoomOf(p);
  let q;
  if (cel && zostaja.some((r) => r.id === cel)) {
    q = przeniesCiagi(p, ids, cel);
    q = { ...q, items: q.items.map((it) => (!it.runId && roomOfItem(p, it) === id ? { ...it, roomId: cel } : it)) };
  } else {
    const items = p.items.filter((it) => roomOfItem(p, it) !== id);
    q = { ...p, runs: (p.runs || []).filter((r) => !ids.has(r.id)), items,
      active: Math.max(0, items.indexOf(p.items[p.active])) };
  }
  q = { ...q, rooms: zostaja };
  return wejdzDoPokoju(q, byl === id ? (cel || zostaja[0].id) : byl);
};

/* ---------- geometria ---------- */

/* `ctx` to informacja z rozmieszczenia ciagow, ktorej sama szafka nie ma:
   `armFree` mowi, ile jej lica zostaje przed narozem, a `armSide`, z ktorej
   strony wychodzi ramie. Bez tego wzmocnienia w szafce naroznej biegly przez
   caly korpus, takze przez przelot w ramie. Pole jest opcjonalne — widoki,
   ktore o narozniku nie wiedza, wolaja `computeGeo` jak dotad. */
/* Geometrie tej samej szafki liczy przy jednym przerysowaniu kilkanascie miejsc
   (uklad ciagu, blat, zlacza, uwagi, zestawienie). Szafka i materialy sa
   niezmienne — kazda zmiana tworzy nowy obiekt — wiec wynik zapamietujemy przy
   nich, osobno dla kazdego kontekstu rogu. Wynik jest tylko do odczytu. */
const geoCache = new WeakMap();
function computeGeo(cab, mat, ctx) {
  if (!cab || typeof cab !== "object" || !mat || typeof mat !== "object") return computeGeoLiczy(cab, mat, ctx);
  let poMat = geoCache.get(cab);
  if (!poMat) { poMat = new WeakMap(); geoCache.set(cab, poMat); }
  let poCtx = poMat.get(mat);
  if (!poCtx) { poCtx = new Map(); poMat.set(mat, poCtx); }
  const klucz = ctx ? JSON.stringify(ctx) : "";
  if (!poCtx.has(klucz)) poCtx.set(klucz, computeGeoLiczy(cab, mat, ctx));
  return poCtx.get(klucz);
}
function computeGeoLiczy(cab, mat, ctx) {
  const t = mat.board.thickness;
  const tf = mat.front.thickness;
  // polki w kolumnach (i dno/tyl szuflady) moga byc z innej plyty niz korpus;
  // przegrody i polki przelotowe zostaja konstrukcyjne, czyli z plyty korpusu
  const ts = cab.shelfSameAsBoard !== false ? t : ((mat.shelf && mat.shelf.thickness) || t);
  const backIsBoard = cab.back === "board";
  /* Pelne plecy z plyty w szafce naroznej zastepuja stojace wzmocnienie przy
     tej samej scianie — konstrukcja jest wtedy sztywna bez niego. */
  const plecyUsztywniaja = !!(cab.corner || {}).on && backIsBoard;
  // plyta na plecy ma grubosc korpusu, HDF swoja wlasna
  const tb = backIsBoard ? mat.board.thickness : mat.back.thickness;
  const backPos = cab.backPos === "outside" ? "outside" : "inside";
  const { H, D } = cab;

  // dno i wieniec: kazde zlacze osobno — "between" = plyta miedzy bokami, "over" = plyta na boku
  const J = cab.joints || {};
  const legacy = (m) => (m === "outside" || m === "under" ? "over" : "between");
  const topL = J.topL || legacy(cab.topMode);
  const topR = J.topR || legacy(cab.topMode);
  const botL = J.botL || legacy(cab.bottomMode);
  const botR = J.botR || legacy(cab.bottomMode);
  // "none" = brak panelu (wieniec/dno). Boki i tak stoja na pelnej wysokosci.
  const rawTop = cab.top || {};
  const ov = (v) => Math.max(0, Math.round(num(v) ?? 0));
  const hasTop = topL !== "none" && topR !== "none";
  // blat lezy na bokach jak wieniec "na boku", ale ma wlasny obrys
  const isBlat = hasTop && rawTop.mode === "blat";
  // blat roboczy ma swoja grubosc — wieniec z plyty zostaje przy grubosci plyty
  const isWorktop = isBlat && rawTop.material === "worktop";
  const tTop = isWorktop ? ((mat.worktop && mat.worktop.thickness) || 38) : t;
  const blat = isBlat
    ? { overL: ov(rawTop.overL), overR: ov(rawTop.overR), overFront: ov(rawTop.overFront), overBack: ov(rawTop.overBack) }
    : null;
  const hasBot = botL !== "none" && botR !== "none";

  /* Szerokosc blatu: "outside" (domyslnie) — W to korpus, blat wystaje poza
     niego; "inside" — W to calkowita szerokosc mebla, a boki chowaja sie do
     srodka o wysuniecia. Reszta silnika liczy jak zwykle od szerokosci
     korpusu, wiec wystarczy podmienic ja tutaj. */
  const blatInside = isBlat && rawTop.widthMode === "inside";
  const W = blatInside ? cab.W - blat.overL - blat.overR : cab.W;
  const g = cab.gaps;
  const msgs = [];
  const add = (level, text) => msgs.push({ level, text });

  if (blatInside && W <= 2 * t)
    add("error", `Wysunięcia blatu (${fmt(blat.overL)} + ${fmt(blat.overR)} mm) zjadają całą szerokość ${fmt(cab.W)} mm — na korpus nic nie zostaje.`);

  const gr = cab.backGroove || defaultCab.backGroove;
  const grooved = cab.back === "hdf" && !!gr.on;
  // wreg: grOff — glebokosc w strone drzwi (lico HDF od tylu), grDep — szerokosc w plyte
  const grOff = Math.max(0, Math.round(gr.offset ?? 3));
  const grDep = Math.max(0, Math.round(gr.depth ?? 16));
  const grPlay = Math.max(0, Math.round(gr.play ?? 1));

  // plecy we frezie chowaja sie w korpusie, wiec nie doliczaja sie do glebokosci
  let carcassDepth = D;
  if (!grooved && cab.depthIncludesBack && cab.back !== "none") carcassDepth -= tb;
  // front nakladany wystaje przed korpus; jesli podana glebokosc go zawiera, korpus jest plytszy
  if (cab.depthIncludesFront && cab.frontMode === "overlay") {
    const anyFront = (cab.levels || []).some((lv) =>
      (lv.cols || []).some((c) => (c.kind !== "blenda") && ((c.doors ?? 0) > 0 || (c.drawers || []).length))
    );
    if (anyFront) carcassDepth -= tf;
  }
  const hasBack = cab.back !== "none";
  const rear = !hasBack;
  /* Plecy za korpusem: HDF przybijany i plyta na zewnatrz siedza na tylnych
     krawedziach bokow, wiec szafka stoi o ich grubosc dalej od sciany i tyle
     samo wysuwa sie jej lico (ustalone z uzytkownikiem 2026-09-28). HDF we
     frezie i plyta wewnatrz chowaja sie w glebokosci korpusu. `glebOdSciany`
     to glebokosc od sciany do lica korpusu — tej uzywa uklad ciagu. */
  const plecyZa = grooved ? Math.max(0, tb - grOff)   // wreg plytszy niz HDF: wystaje z tylu
    : hasBack && !(cab.back === "board" && backPos === "inside") ? tb : 0;
  const glebOdSciany = carcassDepth + plecyZa;

  if (grooved) {
    if (grDep >= t)
      add("error", `Frez ${grDep} mm jest szerszy niż płyta ${fmt(t)} mm — z płyty nic nie zostaje.`);
    if (grPlay >= grDep)
      add("error", "Luz we frezie jest większy niż jego szerokość — plecy nie wejdą.");
    if (grOff > carcassDepth)
      add("error", "Frez wypada poza głębokość korpusu.");
    if (grOff < tb)
      add("warn", `Frez ma ${fmt(grOff)} mm głębokości, a HDF ${fmt(tb)} mm — plecy wystają ${fmt(tb - grOff)} mm za tył korpusu.`);
  }

  if (W <= 2 * t) add("error", "Szerokość jest mniejsza niż dwie grubości płyty.");
  if (H <= 2 * t) add("error", "Wysokość jest mniejsza niż dwie grubości płyty.");
  if (carcassDepth <= 0) add("error", "Głębokość korpusu wychodzi zero lub mniej.");

  /* Szafka narozna z ramieniem nie ma boku od tej strony, w ktora ramie wychodzi
     — zamiast niego stoi katownik w zewnetrznym narozniku. */
  const rawCorner = cab.corner || {};
  const postCfg = rawCorner.post || {};
  const postOn = !!(rawCorner.on && postCfg.on !== false);
  /* „auto” bierze strone z ukladu ciagow (w ktora strone wychodzi ramie) —
     wczesniej zawsze „prawa”, wiec szafka w L na poczatku ciagu (ramie w lewo,
     tak ustawia ja kreator rogu) miala pelny bok od strony ramienia, a katownik
     po przeciwnej stronie (audyt 2026-09-28). */
  const postSide = postOn
    ? (rawCorner.side === "left" || rawCorner.side === "right" ? rawCorner.side
      : ctx && (ctx.armSide === "left" || ctx.armSide === "right") ? ctx.armSide : "right")
    : null;
  /* Katownik w tylnym narozniku chowa sie za plecami z obu stron: wzdluz sciany
     korpusu i wzdluz sciany ramienia. Plecy przybija sie na niego od zewnatrz,
     wiec o ich grubosc odsuwa sie od obu plaszczyzn. */
  const postBack = Math.max(0, cab.back !== "none" ? Math.round(tb) : 0);
  const postW = Math.max(MIN_PART, Math.round(Number(postCfg.w) || 150));

  const topOverL = isBlat || topL === "over";
  const topOverR = isBlat || topR === "over";
  const leftLen = H - (topOverL ? t : 0) - (botL === "over" ? t : 0);
  const rightLen = H - (topOverR ? t : 0) - (botR === "over" ? t : 0);
  const leftY0 = botL === "over" ? t : 0;
  const rightY0 = botR === "over" ? t : 0;
  /* Po stronie ramienia nie ma boku, a katownik stoi miedzy dnem a wiencem —
     obie plyty ida wiec do jego zewnetrznego lica (plaszczyzna boku cofnieta
     o plecy) i skreca sie je konfirmatem w czolo plyt katownika (uzytkownik
     2026-09-29). Wczesniej konczyly sie tam, gdzie bylby bok, i nachodzily
     na katownik tylko grubosc plecow. */
  const postX0 = postSide === "left" ? postBack : null;
  const postX1 = postSide === "right" ? W - postBack : null;
  const topX0 = isBlat ? -blat.overL : postX0 ?? (topL === "between" ? t : 0);
  const topX1 = isBlat ? W + blat.overR : postX1 ?? (topR === "between" ? W - t : W);
  const botX0 = postX0 ?? (botL === "between" ? t : 0);
  const botX1 = postX1 ?? (botR === "between" ? W - t : W);

  const pMode = cab.plinth.mode === "between" ? "inbody" : cab.plinth.mode;
  const plinthInBody =
    cab.plinth.on && pMode === "inbody" && botL === "between" && botR === "between";
  const plinthH = cab.plinth.on ? cab.plinth.height : 0;
  const bottomY = plinthInBody ? plinthH : 0;
  /* Nozka podpiera dno. Przy cokole w obrysie dno stoi juz na wysokosci cokolu,
     wiec nozka miesci sie w tej przestrzeni i nie podnosi szafki — podnosi ja
     dopiero o tyle, o ile jest wyzsza od cokolu. */
  const legH = cab.legs && cab.legs.on ? Math.max(0, Math.round(num(cab.legs.height) ?? 100)) : 0;
  const legTop = plinthInBody ? bottomY : 0;
  const legBelow = Math.max(0, legH - legTop);
  // rozstaw i liczba nozek — jedno miejsce dla rysunkow i dla zamowienia
  const legs = legPlan(cab, W);
  /* Recznie wpisana liczba nozek, przy ktorej srodek dna nie ma zadnej podpory.
     Od 900 mm automat stawia pare posrodku; jedna nozka na srodku dna tez
     wystarcza — dlatego podpowiedz odzywa sie dopiero ponizej tego, i od razu
     proponuje obie wersje. To nie blad: pod spodem moze stac cos nosnego. */
  const zalecaneNozki = autoLegs(W);
  if (cab.legs && cab.legs.on && Number(cab.legs.count) > 0
      && zalecaneNozki >= 6 && legs.ile <= zalecaneNozki - 2)
    add("info", `Szafka ${fmt(W)} mm stoi na ${legs.ile} ${plural(legs.ile, "nóżce", "nóżkach", "nóżkach")}`
      + ` — przy tej szerokości środek dna nie ma podpory. Dołóż nóżkę na środku`
      + ` albo parę na środku.|legs:${zalecaneNozki - 1}|legs:${zalecaneNozki}`);

  const interior = { x0: t, x1: W - t, y0: hasBot ? bottomY + t : bottomY, y1: hasTop ? H - t : H };
  const innerW = interior.x1 - interior.x0;
  const innerH = interior.y1 - interior.y0;

  // przy plecach we frezie polka musi zatrzymac sie przed HDF
  /* Polka i przegroda koncza sie przed plecami, ktore siedza w glebokosci
     korpusu: HDF we wregu (jego lico grOff od tylu) albo plyta wewnatrz miedzy
     bokami. Plyty wewnatrz wczesniej nie odejmowalismy — polka wchodzila
