    const oy1 = oFull ? interior.y1 : oy0 + Math.max(0, Math.round(ob.h || 0));

    if (ow <= 0 || od <= 0) add("error", `${obName} ma zerowy wymiar.`);
    // kontrola: czy bryla miesci sie w obrysie szafki
    if (ox0 < 0)
      add("warn", `${obName} wystaje poza lewą krawędź szafki o ${fmt(-ox0)} mm.`);
    if (ox1 > W)
      add("warn", `${obName} wystaje poza prawą krawędź szafki o ${fmt(ox1 - W)} mm.`);
    // bryla siegajaca w plyte boku wymaga jej przyciecia — informujemy
    if (ox0 < interior.x0 && ox0 >= 0)
      add("info", "Element sięga w płytę lewego boku — bok zostanie skrócony jak przy wycięciu narożnika.");
    if (ox1 > interior.x1 && ox1 <= W)
      add("info", "Element sięga w płytę prawego boku — bok zostanie skrócony jak przy wycięciu narożnika.");
    if (oz1 > carcassDepth)
      add("warn", `${obName} wystaje przed lico korpusu o ${fmt(oz1 - carcassDepth)} mm.`);
    if (!oFull && oy1 > interior.y1)
      add("warn", `${obName} wystaje ponad wnętrze szafki.`);

    // najblizsze ograniczenie z lewej i prawej: przegroda albo bok korpusu
    const boundL = dividers
      .filter((dv) => dv.x + t <= ox0 + 1)
      .reduce((a, dv) => Math.max(a, dv.x + t), interior.x0);
    const boundR = dividers
      .filter((dv) => dv.x >= ox1 - 1)
      .reduce((a, dv) => Math.min(a, dv.x), interior.x1);

    const geoOb = { ox0, ox1, oz0, oz1, oy0, oy1, ow, od, oFull, distLeft, distRight,
      touchLeft: ox0 - boundL < 50, touchRight: boundR - ox1 < 50, boundL, boundR,
      touchBack: oz0 <= 1, touchFront: oz1 >= carcassDepth - 1,
      mask: !!ob.mask, maskFront: ob.maskFront, name: obName, maskTop: null, shelfAbove: null };

    // kolizja z polkami i przegrodami
    const hitY = (y0, y1) => Math.min(y1, oy1) - Math.max(y0, oy0) > 0;
    const hitX = (x0, x1) => Math.min(x1, ox1) - Math.max(x0, ox0) > 0;
    levels.forEach((lv) => {
      lv.cols.forEach((c) => {
        if (!hitX(c.x0, c.x1)) return;
        c.shelves.forEach((sh) => {
          // polka koliduje, jesli bryla siega jej glebokosci od tylu
          if (hitY(sh.y, sh.y + ts) && oz0 < shelfBack + shelfDepth)
            add("warn", `Poziom ${lv.i + 1}: półka na ${fmt(sh.y)} mm koliduje z elementem — przytnij ją lub skróć.`);
        });
        // kolizja z szufladami: sprawdz czy bryla wchodzi w strefe prowadnicy
        if (c.drawers && c.drawers.length) {
          c.drawers.forEach((dr) => {
            const drNl = dr.nl || 0;
            if (!hitY(dr.y, dr.y + dr.h)) return;
            const freeDepth = carcassDepth - oz1 - (ob.mask ? t : 0);
            const gap = Math.round(freeDepth - drNl);
            if (gap >= 4) return;
            const maxNlFit = [600, 550, 500, 450, 400, 350, 300, 270, 250]
              .find((v) => v + 4 <= freeDepth);
            const act = maxNlFit ? `|fixnl:${lv.i}:${c.j}:${dr.i}:${maxNlFit}` : "";
            const gdzie = `Poziom ${lv.i + 1}, kolumna ${c.j + 1}, szuflada ${dr.i + 1}`;
            const co = ob.mask ? "zabudowy elementu" : "elementu";
            if (gap < 0) {
              const advice = maxNlFit
                ? `zejdź z prowadnicą do NL ${maxNlFit}`
                : `przed elementem zostaje ${fmt(freeDepth)} mm — najkrótsza szuflada się nie zmieści, przesuń bryłę`;
              add("error", `${gdzie}: NL ${drNl} sięga ${co} — ${advice}.${act}`);
            } else if (gap === 0) {
              add("error", `${gdzie}: szuflada styka się z ${co} — brak luzu, potrzeba minimum 4 mm.${act}`);
            } else {
              add("warn", `${gdzie}: tylko ${fmt(gap)} mm luzu do ${co} — zalecane minimum 4 mm.${act}`);
            }
          });
        }
      });
    });

    // polka nad elementem — zabudowa moze konczyc sie na niej
    let shelfAbove = null;
    levels.forEach((lv) => {
      lv.cols.forEach((c) => {
        if (Math.min(c.x1, ox1) - Math.max(c.x0, ox0) <= 0) return;
        (c.shelves || []).forEach((sh) => {
          if (sh.y >= oy1 - 1 && (shelfAbove === null || sh.y < shelfAbove)) shelfAbove = sh.y;
        });
      });
    });
    if (shelfAbove !== null && ob.mask && !ob.maskToShelf)
      add("info", `${obName}: nad elementem jest półka na ${fmt(shelfAbove)} mm — zabudowa może kończyć się na niej zamiast biec przez całą wysokość.`);
    // wysokosc zabudowy: do polki, wlasna albo do gory elementu
    const maskTop = ob.mask && ob.maskToShelf && shelfAbove !== null
      ? (num(ob.maskH) !== null ? oy0 + Math.round(ob.maskH) : shelfAbove)
      : oy1;

    // zabudowa bryly
    if (ob.mask) {
      const r = buildEnclosure(`Zabudowa: ${obName}`, ox0, ox1, oz0, oz1, oy0, maskTop,
        { maskType: ob.maskType || "auto", maskFront: ob.maskFront, maskCorner: ob.maskCorner,
          boundL, boundR, touchLeft: geoOb.touchLeft, touchRight: geoOb.touchRight,
          farSideThickness: (ox0 <= interior.x0 + 1 || ox1 >= interior.x1 - 1) ? t : 0 });
      geoOb.maskChosen = r.type;
      geoOb.maskVisible = r.visible;
      geoOb.maskTop = maskTop;
    } else if (ow > 0 && od > 0) {
      add("warn", `${obName} nie ma zabudowy — nie jest zakryty ani odgrodzony od wnętrza. Włącz zabudowę, jeśli ma być schowany.`);
    }
    geoOb.shelfAbove = shelfAbove;
    geoObs.push(geoOb);
  });
  const geoOb = geoObs[0] || null;

  /* --- wiercenia: co i na jakiej wysokosci na kazdej plycie ---
     Wszystko mierzone od DOLNEJ KRAWEDZI wierconej plyty, bo tak sie ja
     kladzie na stole. Zawias i prowadnica siedza na tej samej wysokosci po
     obu stronach kolumny, wiec wpisujemy je do obu plyt. */
  const drillMap = new Map();
  const drillKey = (lvI, name) => (levels.length > 1 ? `Poziom ${lvI + 1} — ${name}` : name);
  const drillAdd = (lvI, name, base, kind, y, note) => {
    const key = drillKey(lvI, name);
    if (!drillMap.has(key)) drillMap.set(key, { panel: key, holes: [] });
    drillMap.get(key).holes.push({ kind, y: y == null ? null : Math.round(y - base), note });
  };
  /* Przegroda niesie kolki i zawiasy z obu stron — kazda strona to osobne
     wiercenie, wiec w planie osobny wpis „(od kolumny N)”. Wczesniej te same
     wysokosci z obu stron zlewaly sie w jeden wpis i jednego otworu brakowalo. */
  const panelsOfCol = (lv, c) => {
    const last = lv.cols.length - 1;
    const strona = ` (od kolumny ${c.j + 1})`;
    return {
      left: { name: c.j === 0 ? "Bok lewy" : `Przegroda ${c.j}`, base: c.j === 0 ? leftY0 : lv.y0, strona: c.j === 0 ? "" : strona },
      right: { name: c.j === last ? "Bok prawy" : `Przegroda ${c.j + 1}`, base: c.j === last ? rightY0 : lv.y0, strona: c.j === last ? "" : strona },
    };
  };
  {
    const pin = cab.shelfPin || {};
    const pinF = num(pin.dFront) ?? 37, pinB = num(pin.dBack) ?? 37;
    levels.forEach((lv) =>
      lv.cols.forEach((c) => {
        const p = panelsOfCol(lv, c);
        /* Kolki od przedniej krawedzi boku, nie od przodu polki: polka bywa
           cofnieta (fronty wpuszczane) albo plytsza (wspornik fixu, katowniki
           w L) — wiertacz ma przed soba plyte boku, a nie polke. */
        const przod = frontCut + (c.shFront || 0);
        const gl = c.shD ?? shelfDepth;
        const pinNote = `⌀5, ${fmt(przod + pinF)} i ${fmt(przod + gl - pinB)} mm od przedniej krawędzi płyty; wysokość = spód półki`;
        /* Po drugiej stronie przegrody polka na tej samej wysokosci — otwory
           z obu stron trafilyby w siebie w plycie 18 mm. Kolki od tej kolumny
           idą o KOLEK_PRZESUN blizej srodka polki, polki zostaja na swoich
           wysokosciach (uzytkownik 2026-09-29). */
        const sasiadL = c.j > 0 ? lv.cols[c.j - 1] : null;
        const kolidujeL = (y) => !!sasiadL && (sasiadL.shelves || []).some((q) => Math.abs(q.y - y) < 10);
        const pinNoteL = `⌀5, ${fmt(przod + pinF + KOLEK_PRZESUN)} i ${fmt(przod + gl - pinB - KOLEK_PRZESUN)} mm od przedniej krawędzi płyty; `
          + `wysokość = spód półki; przesunięte o ${KOLEK_PRZESUN} mm do środka — po drugiej stronie półka na tej samej wysokości`;
        /* Szafka w L: po stronie ramienia boku nie ma — polka lezy tam na
           kolkach (albo trojkatach) we wzmocnieniu tylnym, po jednym w kazdej
           jego plycie (uzytkownik 2026-09-29). Liczba kolkow sie nie zmienia. */
        const przyKatL = postSide === "left" && c.j === 0;
        const przyKatP = postSide === "right" && c.j === lv.cols.length - 1;
        const pOdK = Math.max(backIntrusion, postBack);
        const katownikKolki = (y) => {
          const tyl = przod + gl - pinB - (carcassDepth - pOdK - postW);
          drillAdd(lv.i, "Kątownik przy ramieniu — bok", interior.y0, "kołek półki", y,
            `⌀5, ${fmt(Math.max(0, Math.round(tyl)))} mm od przedniej krawędzi płyty; wysokość = spód półki; zamiast boku (albo trójkąt meblowy)`);
          drillAdd(lv.i, "Kątownik przy ramieniu — plecy", interior.y0, "kołek półki", y,
            `⌀5 w licu od wnętrza, ${fmt(pinF)} mm od końca przy płycie bocznej; wysokość = spód półki; zamiast boku (albo trójkąt meblowy)`);
        };
        if (mocowaniePolek(cab) === "pins")
          (c.shelves || []).forEach((s) => {
            if (przyKatL) katownikKolki(s.y);
            else drillAdd(lv.i, p.left.name, p.left.base, "kołek półki", s.y, (kolidujeL(s.y) ? pinNoteL : pinNote) + p.left.strona);
            if (przyKatP) katownikKolki(s.y);
            else drillAdd(lv.i, p.right.name, p.right.base, "kołek półki", s.y, pinNote + p.right.strona);
          });
        /* Polka na trojkatach: dwa pod polka z kazdej strony, przy jej przedniej
           i tylnej krawedzi. Z obu stron przegrody na tej samej wysokosci wkrety
           trafilyby w siebie — jak przy kolkach, ta strona o KOLEK_PRZESUN blizej
           srodka polki. Po stronie ramienia szafki w L — w plytach wzmocnienia. */
        if (mocowaniePolek(cab) === "trojkaty") {
          const trNote = (o) => `2 rzędy — pod półką, przy jej przedniej i tylnej krawędzi: ${fmt(przod + KONF_OD_KRAWEDZI + o)} i ${fmt(przod + gl - KONF_OD_KRAWEDZI - o)} mm od przedniej krawędzi płyty; wysokość = spód półki`
            + (o ? `; przesunięte o ${o} mm do środka — po drugiej stronie półka na tej samej wysokości` : "");
          const katownikTr = (y) => {
            drillAdd(lv.i, "Kątownik przy ramieniu — bok", interior.y0, "trójkąt meblowy", y, "pod półką, zamiast boku; wysokość = spód półki");
            drillAdd(lv.i, "Kątownik przy ramieniu — plecy", interior.y0, "trójkąt meblowy", y, "pod półką, w licu od wnętrza, zamiast boku; wysokość = spód półki");
          };
          (c.shelves || []).forEach((s) => {
            if (przyKatL) katownikTr(s.y);
            else drillAdd(lv.i, p.left.name, p.left.base, "trójkąt meblowy", s.y, trNote(kolidujeL(s.y) ? KOLEK_PRZESUN : 0) + p.left.strona);
            if (przyKatP) katownikTr(s.y);
            else drillAdd(lv.i, p.right.name, p.right.base, "trójkąt meblowy", s.y, trNote(0) + p.right.strona);
          });
        }
        (c.drawers || []).forEach((dr) => {
          if (!dr.rail) return;
          /* Otwory wg instrukcji V-BOX (instrukcje/…V-BOX…pdf, str. 6): 37 mm od
             krawedzi korpusu i dalej wg NL; przy frontach wpuszczanych prowadnica
             cofnieta o grubosc frontu. */
          const sb = dr.rail.setback || 0;
          const otw = prowadnicaOtwory(dr.rail.d).map((x) => fmt(x + sb)).join(", ");
          const note = `dolna krawędź prowadnicy, NL ${fmt(dr.rail.d)}; otwory ${otw} mm od przedniej krawędzi`
            + (sb ? ` (cofnięta o ${fmt(sb)} mm)` : "");
          drillAdd(lv.i, p.left.name, p.left.base, "prowadnica", dr.rail.y0, note + p.left.strona);
          drillAdd(lv.i, p.right.name, p.right.base, "prowadnica", dr.rail.y0, note + p.right.strona);
        });
      })
    );
    doors.forEach((d) => {
      const lv = levels[d.lvl];
      const c = lv && lv.cols[d.colJ];
      if (!c) return;
      if (d.type === "klapa") {
        /* Klapa do gory — zawiasy w wiencu nad nia, w dol — w dnie pod nia;
           polozenie wzdluz szerokosci od wewnetrznej strony lewego boku. */
        const gora = d.klapa === "gora";
        const nazwa = gora ? (lv.i === levels.length - 1 ? "Wieniec" : `Półka przelotowa nad poziomem ${lv.i + 1}`)
          : (lv.i === 0 ? "Dno" : `Półka przelotowa pod poziomem ${lv.i + 1}`);
        (d.klapaZawiasy || []).forEach((hx) => {
          const key = nazwa;
          if (!drillMap.has(key)) drillMap.set(key, { panel: key, holes: [] });
          drillMap.get(key).holes.push({ kind: "zawias klapy", y: Math.round(hx - interior.x0),
            note: "oś zawiasu od wewnętrznej strony lewego boku — puszka ⌀35 w klapie, prowadnik na płycie" });
        });
        return;
      }
      if (d.type !== "door" || !(d.hingePts || []).length) return;
      const p = panelsOfCol(lv, c);
      /* Po stronie fixu zawias niesie wspornik pionowy, a nie bok — tam trzeba
         wiercic (wczesniej plan wysylal te otwory na bok). Wspornik stoi na
         wysokosc poziomu, od jego dolu liczymy. */
      const naWsporniku = c.fix && c.support && c.fix.side === d.hingeSide;
      const side = naWsporniku
        ? { name: lv.cols.length > 1 ? `Wspornik pionowy — kolumna ${c.j + 1}` : "Wspornik pionowy", base: lv.y0 }
        : d.hingeSide === "left" ? p.left : p.right;
      const note = "oś zawiasu — puszka ⌀35 we froncie, prowadnik na płycie" + (side.strona || "");
      d.hingePts.forEach((hy) => drillAdd(lv.i, side.name, side.base, "zawias", hy, note));
    });
  }
  /* Laczenia korpusu w planie wiercen (uzytkownik 2026-09-29): konfirmaty —
     gdzie wiercic i w ktorej plycie, oraz trojkaty meblowe — zeby bylo widac,
     co jest na konfirmaty, a co na trojkaty. Plyta pozioma „miedzy bokami”
     dostaje konfirmat przez bok (otwor w boku na wysokosci osi plyty), plyta
     „na bokach” — przez siebie w czolo boku (otwor w niej, od jej lewego konca). */
  {
    const listaPoz = (xs) => xs.map((v) => fmt(v)).join(", ");
    const doPlyty = (name, kind, v, note) => {
      if (!drillMap.has(name)) drillMap.set(name, { panel: name, holes: [] });
      drillMap.get(name).holes.push({ kind, y: v == null ? null : Math.round(v), note });
    };
    const top = levels.length - 1;
    const przezBok = (lvI, zlacze, yOs, gl, od, co) => {
      const note = `⌀7 w boku, ${listaPoz(konfirmatyPoz(gl, od))} mm od przedniej krawędzi; w czole ${co} ⌀5 × 50`;
      if (postSide !== "left" && zlacze.l) drillAdd(lvI, "Bok lewy", leftY0, `konfirmat — ${zlacze.nazwa}`, yOs, note);
      if (postSide !== "right" && zlacze.r) drillAdd(lvI, "Bok prawy", rightY0, `konfirmat — ${zlacze.nazwa}`, yOs, note);
    };
    const naBokach = (plyta, zlacze, gl, od) => {
      const note = `⌀7 w płycie (od jej lewego końca), ${listaPoz(konfirmatyPoz(gl, od))} mm od przedniej krawędzi; w czole boku ⌀5 × 50`;
      if (postSide !== "left" && zlacze.l) doPlyty(plyta, "konfirmat — bok lewy", t / 2, note);
      if (postSide !== "right" && zlacze.r) doPlyty(plyta, "konfirmat — bok prawy", W - t / 2, note);
    };
    if (hasTop && !isBlat) {
      przezBok(top, { nazwa: "wieniec", l: topL === "between", r: topR === "between" }, H - t / 2, carcassDepth, 0, "wieńca");
      naBokach("Wieniec", { l: topL === "over", r: topR === "over" }, carcassDepth, 0);
    }
    if (hasBot) {
      przezBok(0, { nazwa: "dno", l: botL === "between", r: botR === "between" }, bottomY + t / 2, carcassDepth, 0, "dna");
      naBokach("Dno", { l: botL === "over", r: botR === "over" }, carcassDepth, 0);
    }
    /* Szafka w L: po stronie ramienia wieniec i dno skreca sie konfirmatem
       w czolo obu plyt katownika (uzytkownik 2026-09-29) — po jednym na plyte,
       w jej srodku. Polozenie w plycie od jej lewego konca i od przodu. */
    if (postSide) {
      // w srodku czola kazdej plyty (A i B — polozenie z `postRects`, v od tylu)
      const wKatownik = (plyta, x0) => postRects.forEach((q) => doPlyty(plyta,
        `konfirmat — kątownik przy ramieniu (${q.nazwa})`, (q.x0 + q.x1) / 2 - x0,
        `⌀7 w płycie (od jej lewego końca), ${fmt(Math.round(carcassDepth - (q.v0 + q.v1) / 2))} mm od przedniej krawędzi; w czole kątownika ⌀5 × 50`));
      if (hasTop && !isBlat) wKatownik("Wieniec", topX0);
      if (hasBot) wKatownik("Dno", botX0);
    }
    // polki przelotowe miedzy poziomami — przez boki, w osi polki
    sepShelves.forEach((sh) => przezBok(0, { nazwa: "półka przelotowa", l: true, r: true }, sh.y + t / 2, shelfDepth, frontCut, "półki"));
    /* Przegrody pionowe i wsporniki fixu stoja na plycie pod soba i dochodza do
       plyty nad soba — konfirmat przez te plyty w ich czolo; polozenie wzdluz
       szerokosci od wewnetrznej strony lewego boku. */
    const nad = (lvI) => (lvI === top ? (hasTop && !isBlat ? "Wieniec" : null) : `Półka przelotowa nad poziomem ${lvI + 1}`);
    const pod = (lvI) => (lvI === 0 ? (hasBot ? "Dno" : null) : `Półka przelotowa pod poziomem ${lvI + 1}`);
    dividers.forEach((dv, k) => {
      const x = Math.round(dv.x + t / 2 - interior.x0);
      const note = `⌀7 w płycie, ${listaPoz(konfirmatyPoz(dividerDepth))} mm od przedniej krawędzi; w czole przegrody ⌀5 × 50; położenie od wewnętrznej strony lewego boku`;
      [nad(dv.level), pod(dv.level)].filter(Boolean).forEach((pl) => doPlyty(pl, `konfirmat — przegroda ${k + 1}`, x, note));
    });
    levels.forEach((lv) => lv.cols.forEach((c) => {
      if (!c.support || !c.fix) return;
      const x = Math.round((c.fix.side === "left" ? c.fix.x + c.fix.w - t : c.fix.x) + t / 2 - interior.x0);
      const note = `⌀7 w płycie, ${listaPoz(konfirmatyPoz(carcassDepth))} mm od przedniej krawędzi; w czole wspornika ⌀5 × 50; położenie od wewnętrznej strony lewego boku`;
      [nad(lv.i), pod(lv.i)].filter(Boolean).forEach((pl) => doPlyty(pl, "konfirmat — wspornik pionowy", x, note));
    }));
    // polki na konfirmatach (zamiast kolkow) — przez boki/przegrody w osi polki
    if (cab.shelfMount === "confirmat")
      levels.forEach((lv) => lv.cols.forEach((c) => {
        const p = panelsOfCol(lv, c);
        const gl = c.shD ?? shelfDepth, od = frontCut + (c.shFront || 0);
        const note = `⌀7 w płycie, ${listaPoz(konfirmatyPoz(gl, od))} mm od przedniej krawędzi; w czole półki ⌀5 × 50`;
        (c.shelves || []).forEach((s2) => {
          drillAdd(lv.i, p.left.name, p.left.base, "konfirmat — półka", s2.y + ts / 2, note + p.left.strona);
          drillAdd(lv.i, p.right.name, p.right.base, "konfirmat — półka", s2.y + ts / 2, note + p.right.strona);
        });
      }));
    /* Trojkaty meblowe (na wkrety, bez wiercenia): blat roboczy przykrecany od
       spodu i cokol bez nozek — te same ilosci co w okuciach. */
    const rowno = (len, n) => (n <= 1 ? [Math.round(len / 2)]
      : [...Array(n)].map((_, i) => Math.round(KONF_OD_KRAWEDZI + ((len - 2 * KONF_OD_KRAWEDZI) * i) / (n - 1))));
    if (isBlat) {
      const n = Math.max(2, Math.ceil(W / 400));
      rowno(W, n).forEach((x) => doPlyty("Blat", "trójkąt meblowy",
        x, "od spodu, 2 rzędy — przy przedniej i przy tylnej krawędzi boków; położenie od lewej krawędzi korpusu"));
    }
    /* Frez pod HDF (uzytkownik 2026-09-29): na tylnej krawedzi bokow, wienca
       i dna — to nie wiercenie, ale ta sama kartka idzie na stol. */
    if (grooved) {
      const note = `na tylnej krawędzi, na całej długości: ${fmt(grDep)} mm w grubość płyty × ${fmt(grOff)} mm w stronę drzwi`;
      if (postSide !== "left") drillAdd(0, "Bok lewy", leftY0, "frez pod HDF", null, note);
      if (postSide !== "right") drillAdd(0, "Bok prawy", rightY0, "frez pod HDF", null, note);
      if (hasTop && !isBlat) doPlyty("Wieniec", "frez pod HDF", null, note);
      if (hasBot) doPlyty("Dno", "frez pod HDF", null, note);
    }
    if (cab.plinth && cab.plinth.on && !(cab.legs && cab.legs.on)) {
      const len = Math.round(plinthInBody ? innerW : W);
      rowno(len, Math.max(2, Math.ceil(len / 300))).forEach((x) => doPlyty("Cokół", "trójkąt meblowy",
        x, "wzdłuż cokołu, od jego lewego końca — plus po 1 na każdym krótkim boku"));
    }
  }

  // scalamy powtorki (te same wysokosci z sasiadujacych kolumn) i porzadkujemy
  /* Zawieszki szafki wiszacej (uzytkownik 2026-09-29): w gornym tylnym rogu
     boku, od wnetrza. Szafka w L ma dwie, kazda na plycie prostopadlej do
     swojej sciany: przy wzmocnieniu A — bok korpusu i bok ramienia; przy B —
     obie w czesci ramienia (plyta wzmocnienia rownolegla do plecow i bok
     ramienia) albo obie w czesci szafki (bok korpusu i plyta rownolegla do
     boku). Bok ramienia dopisuje `wierceniaDodatkowe`. */
  const zawieszki = (() => {
    const wisi = cab.hangers === "always"
      || (cab.hangers !== "never" && !((cab.legs && cab.legs.on) || (cab.plinth && cab.plinth.on)));
    /* Szafka od ZAWIESZKA_SZEROKA wzwyz dostaje dodatkowe zawieszki na
       przegrodach pionowych siegajacych wienca — po jednej na przegrode, najwyzej
       dwie; dwie na tej samej przegrodzie nie wejda, bo wkrety z obu stron
       trafialyby w siebie (uzytkownik 2026-09-29). Bez przegrody zostaja dwie
       na bokach — para trzyma 95 kg (karta ZK-ZAW-R0-10). */
    const przegrodyGora = dividers.filter((d) => d.level === levels.length - 1);
    const naPrzegrodach = !wisi || postSide || W < ZAWIESZKA_SZEROKA ? []
      : przegrodyGora.length <= 2 ? przegrodyGora
      : [przegrodyGora[0], przegrodyGora[przegrodyGora.length - 1]];
    const n = !wisi ? 0 : 2 + naPrzegrodach.length;
    const gdzie = !postSide ? null : postTyp === "B" ? (rawCorner.zawieszki === "korpus" ? "korpus" : "ramie") : "A";
    const naKorpusie = !n ? 0 : !postSide ? n : gdzie === "A" ? 1 : gdzie === "korpus" ? 2 : 0;
    return { n, gdzie, naKorpusie, naRamieniu: postSide && n ? n - naKorpusie : 0, naPrzegrodach };
  })();
  /* Zawieszka na samej gorze, pod wiencem, 1 cm od plecow (uzytkownik
     2026-09-29) — wysokosc w planie to jej gorna krawedz. Na boku plecy stoja
     za plyta albo we frezie, wiec od tylnej krawedzi boku 10 mm + wejscie
     plecow; plyty wzmocnienia tylnego dochodza koncem do plecow — 10 mm. */
  if (zawieszki.n) {
    const top = levels.length - 1;
    const zaw = (name, base, odTylu, ile) => drillAdd(top, name, base, "zawieszka", interior.y1,
      zawieszkaNote(odTylu, ile));
    const bokKorpusu = postSide === "right" ? "Bok lewy" : "Bok prawy";
    const baseBoku = postSide === "right" ? leftY0 : rightY0;
    const odTyluBoku = ZAWIESZKA_OD_PLECOW + backIntrusion;
    if (!postSide) {
      zaw("Bok lewy", leftY0, odTyluBoku, 1);
      zaw("Bok prawy", rightY0, odTyluBoku, 1);
      // przegroda konczy sie na plecach (backIntrusion od tylu), wiec 10 mm od jej tylnej krawedzi
      zawieszki.naPrzegrodach.forEach((d) => zaw(`Przegroda ${d.j + 1}`, d.y0, ZAWIESZKA_OD_PLECOW, 1));
    } else if (zawieszki.gdzie === "A") zaw(bokKorpusu, baseBoku, odTyluBoku, 1);
    else if (zawieszki.gdzie === "korpus") {
      zaw(bokKorpusu, baseBoku, odTyluBoku, 1);
      zaw("Kątownik przy ramieniu — bok", interior.y0, ZAWIESZKA_OD_PLECOW, 1);
    } else zaw("Kątownik przy ramieniu — plecy", interior.y0, ZAWIESZKA_OD_PLECOW, 1);
  }
  const drillPlan = [...drillMap.values()].map((p) => {
    const by = new Map();
    p.holes.forEach((h) => {
      const k = `${h.kind}|${h.note}`;
      if (!by.has(k)) by.set(k, { kind: h.kind, note: h.note, ys: [] });
      const g = by.get(k);
      if (h.y != null && !g.ys.includes(h.y)) g.ys.push(h.y);
    });
    return {
      panel: p.panel,
      rows: [...by.values()].map((g) => ({ ...g, ys: g.ys.sort((a, b) => a - b) })),
    };
  });

  /* --- produkty do zamowienia --- */
  const hardware = [];
  slideGroups.forEach((qty, k) => {
    const [h, nl] = k.split("|");
    hardware.push({
      name: `Prowadnica Sevroll V-BOX 3D Slim ${h} mm`,
      spec: `NL ${nl} mm`,
      qty,
      unit: "kpl.",
    });
  });
  const miGroups = new Map();
  mirrorParts.forEach((f) => {
    const k = `${Math.round(f.a)}|${Math.round(f.b)}`;
    miGroups.set(k, (miGroups.get(k) || 0) + 1);
  });
  miGroups.forEach((qty, k) => {
    const [a2, b2] = k.split("|").map(Number);
    hardware.push({
      name: "Lustro na drzwiach",
      // lustro kupuje sie na metry, wiec podajemy powierzchnie, nie sztuki
      spec: `${fmt(b2)} × ${fmt(a2)} mm × ${qty} szt. — luz 0,5 mm na każdą stronę drzwi`,
      qty: Math.round((a2 * b2 * qty) / 1e6 * 100) / 100,
      unit: "m²",
    });
  });

  if (handleCount)
    hardware.push({
      name: cab.handleName || "Uchwyt",
      pk: "Uchwyt",
      use: "fronty z zaznaczonym uchwytem",
      spec: "na fronty z zaznaczonym uchwytem",
      qty: handleCount,
      unit: "szt.",
    });
  /* Szafka narozna ze skrzydlami lamanymi: pierwsze skrzydlo wisi na boku i
     musi otworzyc sie szerzej niz zwykle, zeby drugie zdazylo sie zlozyc —
     stad zawias 165 stopni zamiast zwyklego. Drugie skrzydlo wisi juz na tym
     pierwszym, na zawiasie lamanym, i liczy sie przy ramieniu. */
  const skrzydlaLamane = !!(cab.corner || {}).on && (cab.corner || {}).doors === "lamane";
  if (hingeCount)
    hardware.push({
      name: skrzydlaLamane ? "Zawias 165°" : "Zawias",
      use: skrzydlaLamane
        ? "pierwsze skrzydło szafki narożnej, na boku"
        : "drzwi szafki",
      spec: skrzydlaLamane
        ? "skrzydło przy boku szafki narożnej — otwiera się na tyle, żeby drugie skrzydło się złożyło"
        : (cab.frontMode === "overlay" ? "nakładany" : "wpuszczany") +
          ", 2 szt. na skrzydło poza szerokimi i wysokimi"
          + (klapy.length ? "; klapa: te same zawiasy, 2 szt. na górnej lub dolnej krawędzi, powyżej 900 mm 3" : ""),
      qty: hingeCount,
      unit: "szt.",
    });
  /* Klapy: podnosnik gazowy (do gory, tabela GTV PD-G00) albo amortyzator
     klapy opadanej (w dol, tabela GTV PD-ECGDL). Sila z tabeli albo wpisana
     recznie. Grupujemy po kierunku i sile — jedna pozycja na rodzaj. */
  const klapyGrupy = new Map();
  klapy.forEach((k) => {
    const opis = `${fmt(k.w)} × ${fmt(k.h)} mm, ok. ${k.kg.toFixed(1).replace(".", ",")} kg`;
    const gora = k.klapa === "gora";
    const co = gora ? "podnośnik" : "amortyzator";
    const kg1 = (v) => v.toFixed(1).replace(".", ",");
    if (gora && k.h < KLAPA_MIN_KORPUS)
      add("warn", `${k.where}: klapa do góry ma tylko ${fmt(k.h)} mm wysokości — podnośnik GTV potrzebuje co najmniej ${KLAPA_MIN_KORPUS} mm korpusu na boku.`);
    if (!k.recznie && k.dobor.poza)
      add("warn", `${k.where}: klapa ${fmt(k.h)} mm jest wyższa niż 600 mm — poza tabelą ${k.dobor.tabela}. Siłę ${k.sila ? `${k.sila} N ` : ""}przyjęto jak dla 600 mm; sprawdź u producenta albo wpisz ją ręcznie.`);
    if (!k.recznie && !k.dobor.sila)
      add("warn", `${k.where}: klapa (${opis}) jest za ciężka — nawet ${k.dobor.max} N utrzyma ok. ${kg1(k.dobor.udzwig)} kg na ${co}. `
        + (k.ile < 2 ? `Daj dwa ${gora ? "podnośniki" : "amortyzatory"}, lżejszy front albo wpisz siłę ręcznie.` : "Daj lżejszy front albo wpisz siłę ręcznie.")
        + (gora ? "" : " Tabela jest dla otwarcia 90° — klapa otwierana na mniejszy kąt (np. 45°) zwykle pracuje na słabszym."));
    else if (k.sila)
      add("info", `${k.where}: klapa ${gora ? "do góry" : "w dół"} ${opis} — ${k.ile} × ${co} ${k.sila} N`
        + (k.recznie ? " (siła wpisana ręcznie)." : ` (tabela ${k.dobor.tabela}, kąt ${k.kat}°, udźwig ok. ${kg1(k.dobor.udzwig)} kg na sztukę).`));
    if (k.ile === 1 && k.w > 600)
      add("warn", `${k.where}: klapa ma ${fmt(k.w)} mm szerokości, a jeden ${co} — przy szerokości ponad 600 mm dają się dwa, po jednym na bok.`);
    const key = `${k.klapa}|${k.sila || 0}`;
    const gr = klapyGrupy.get(key) || { klapa: k.klapa, sila: k.sila, qty: 0, opisy: [], kat: k.kat, recznie: k.recznie };
    gr.qty += k.ile;
    gr.opisy.push(opis);
    klapyGrupy.set(key, gr);
  });
  klapyGrupy.forEach((gr) => {
    const gora = gr.klapa === "gora";
    hardware.push({
      pk: gora ? "Podnośnik gazowy do klapy" : "Amortyzator do klapy opadanej",
      name: gora
        ? `Podnośnik gazowy ${gr.sila ? gr.sila + " N" : "— siła do dobrania"}`
        : `Amortyzator do klapy opadanej ${gr.sila ? gr.sila + " N" : "— siła do dobrania"}`,
      use: gora ? "klapa otwierana do góry" : "klapa opadająca w dół",
      spec: `${gr.opisy.join("; ")}`
        + (!gr.recznie && gr.sila ? `; dobór z tabeli ${gora ? "GTV PD-G00" : "GTV PD-ECGDL"}, kąt ${gr.kat}°` : ""),
      qty: gr.qty,
      unit: "szt.",
    });
  });
  if (cab.legs && cab.legs.on)
    hardware.push({
      name: "Nóżka regulowana",
      use: "pod szafką",
      spec: `${(cab.legs || {}).shape === "round" ? "okrągła" : "kwadratowa"}, wysokość ${fmt(cab.legs.height || 100)} mm`
        + (legs.srodek ? ", w tym jedna podpora na środku dna" : ""),
      // tyle, ile ich stoi na rysunku — para na rog plus para na kazde 900 mm
      qty: legs.ile,
      unit: "szt.",
    });

  /* --- zlacza korpusu, kolki, zawieszki, wkrety ---
     Konfirmat co ok. 200 mm dlugosci styku, minimum 2 na styk. */
  const confPer = konfirmatyNaStyk;
  let confQty = 0;
  const jointNotes = [];
  const joint = (n, len, what) => {
    if (n <= 0) return;
    const per = confPer(len);
    confQty += n * per;
    jointNotes.push(`${what} ${n}×${per}`);
  };
  // blat lezy na bokach i jest kryty od gory — mocowany od spodu, nie konfirmatem
  // po stronie ramienia (bez boku) wieniec i dno ida konfirmatem w czolo obu plyt katownika
  if (hasTop && !isBlat) joint(postSide ? 1 : 2, carcassDepth, "wieniec");
  if (hasBot) joint(postSide ? 1 : 2, carcassDepth, "dno");
  if (postSide) {
    const n = (hasTop && !isBlat ? 1 : 0) + (hasBot ? 1 : 0);
    if (n) { confQty += 2 * n; jointNotes.push(`${hasTop && !isBlat && hasBot ? "wieniec i dno" : hasBot ? "dno" : "wieniec"} do kątownika przy ramieniu ${n}×2`); }
  }
  joint(dividers.length * 2, dividerDepth, "przegrody");
  joint(sepShelves.length * 2, shelfDepth, "półki przelotowe");
  joint(supportParts.length * 2, carcassDepth, "wsporniki");

  const shelfPins = mocowaniePolek(cab) === "pins";
  let colShelves = 0;
  levels.forEach((lv) => lv.cols.forEach((c) => { colShelves += (c.shelves || []).length; }));
  if (mocowaniePolek(cab) === "confirmat") joint(colShelves * 2, shelfDepth, "półki");

  if (confQty)
    hardware.push({
      name: "Konfirmat 7 × 50",
      use: "złącza korpusu, co ok. 200 mm styku",
      spec: `złącza korpusu: ${jointNotes.join(", ")} szt.`,
      qty: confQty,
      unit: "szt.",
    });
  // zaslepki chodza w blistrach po 25 — tak sie je kupuje i tak sie je wycenia.
  // qty zostaje w sztukach, przeliczenie na opakowania idzie na sam koniec,
  // zeby suma z kilku szafek nie zaokraglala sie w gore kilka razy
  if (confQty)
    hardware.push({
      name: "Zaślepka na konfirmat",
      use: "po jednej na widoczny łeb konfirmatu",
      spec: "blister 25 szt., po jednej na widoczny łeb",
      qty: confQty,
      unit: "szt.",
      pack: 25,
    });

  if (isBlat) {
    /* Blat lapie sie od spodu na dwoch rzedach — przy przednim i tylnym boku —
       po jednym trojkacie na kazdym koncu i kolejnym co ok. 400 mm szerokosci.
       Wpisane na sztywno cztery starczaly na 600 mm, a na 1200 juz nie. */
    const wRzedzie = Math.max(2, Math.ceil(W / 400));
    hardware.push({
      name: "Trójkąt meblarski",
      use: "blat roboczy przykręcany od spodu, 2 rzędy co ok. 400 mm",
      spec: `blat przykręcany od spodu — konfirmat zepsułby lico: 2 rzędy po ${wRzedzie} na ${fmt(W)} mm`,
      qty: 2 * wRzedzie,
      unit: "szt.",
    });
  }
  if (cab.plinth && cab.plinth.on) {
    if (cab.legs && cab.legs.on) {
      /* Cokol wpina sie w nozki przedniego rzedu, wiec klipsow jest tyle, ile
         tych nozek — przy szerokiej szafce sam poczatek i koniec nie wystarcza.
         Nozka srodkowa (przy nieparzystej liczbie) stoi w glebi, nie pod
         cokolem, wiec do klipsow sie nie liczy. */
      const przod = legs.xs.length;
      hardware.push({
        name: "Złączka do cokołu",
        use: "cokół wpinany w nóżki przedniego rzędu",
        spec: `klips na nóżkę — po jednym na każdą nóżkę przedniego rzędu (${przod})`,
        qty: przod,
        unit: "szt.",
      });
    } else {
      /* Bez nozek cokol jest skrecany do korpusu na plastikowe trojkaty.
         To JEDYNE miejsce, gdzie styk dostaje mniej niz dwa laczniki: cokol
         jest mocowany z trzech stron naraz (oba konce plus dlugi bok), wiec
         pojedynczy trojkat na koncu nie ma sie jak obrocic i calosc zostaje
         sztywna. Wzdluz dlugiego boku co ok. 300 mm, nie mniej niz dwa. */
      const plinthLen = Math.round(plinthInBody ? innerW : W);
      const alongLong = Math.max(2, Math.ceil(plinthLen / 300));
      hardware.push({
        name: "Trójkąt meblarski",
        use: "cokół skręcany do korpusu (bez nóżek), po obwodzie co ok. 300 mm",
        spec: `cokół skręcany bez nóżek: po 1 na każdy krótki bok + ${alongLong} wzdłuż ${fmt(plinthLen)} mm (co ok. 300 mm)`,
        qty: 2 + alongLong,
        unit: "szt.",
      });
    }
  }

  if (shelfPins && colShelves) {
    const pin = cab.shelfPin || {};
    hardware.push({
      name: "Kołek podporowy ⌀5",
      use: "półki szafki, po cztery na półkę",
      spec: `4 szt. na półkę, otwory ⌀5 — ${fmt(num(pin.dFront) ?? 37)} mm od przodu i ${fmt(num(pin.dBack) ?? 37)} mm od tyłu półki, wysokości na widoku otwartym liczone od ${
        cab.pinDatum === "bottom" ? "dna" : "dolnej krawędzi boku"}`,
      qty: colShelves * 4,
      unit: "szt.",
    });
  }
  if (mocowaniePolek(cab) === "trojkaty" && colShelves)
    hardware.push({
      name: "Trójkąt meblarski",
      use: "półki szafki na trójkątach, po cztery na półkę",
      spec: `półki na trójkątach: 4 szt. na półkę (po 2 z każdej strony, ${KONF_OD_KRAWEDZI} mm od przedniej i tylnej krawędzi) × ${colShelves}`,
      qty: colShelves * 4,
      unit: "szt.",
    });

  // szafka wisząca: brak nozek i cokolu = musi byc na czym powiesic
  const floorStanding = (cab.legs && cab.legs.on) || (cab.plinth && cab.plinth.on);
  const wantHangers = cab.hangers === "always" || (cab.hangers !== "never" && !floorStanding);
  if (wantHangers) {
    const nH = zawieszki.n;
    const gdzieL = { A: "jedna na boku korpusu, druga na boku ramienia (każda przy swojej ścianie)",
      ramie: "obie w części ramienia — na płycie wzmocnienia tylnego i na boku ramienia",
      korpus: "obie w części szafki — na boku korpusu i na płycie wzmocnienia tylnego" };
    hardware.push({
      name: "Zawieszka meblowa regulowana",
      use: "szafka wieszana na ścianie",
      spec: `${ZAWIESZKA_MODEL}; szafka bez nóżek i cokołu — wieszana na ścianie`
        + (postSide ? `; szafka w L: ${gdzieL[zawieszki.gdzie]}` : ""),
      qty: nH,
      unit: "szt.",
    });
    /* listwa montazowa jest opcjonalna — zawieszki moga isc wprost na haki.
       W szafce w L listwa pod korpusem tylko wtedy, gdy wisi tam zawieszka;
       odcinek pod ramieniem liczy `cornerArmParts`. */
    if (cab.hangerMode !== "haczyki") {
      if (zawieszki.naKorpusie)
        hardware.push({
          name: "Listwa montażowa do zawieszek",
          use: "pod zawieszki szafek wiszących",
          spec: `odcinek ${fmt(Math.max(0, W - 40))} mm na szafkę`,
          qty: Math.round(Math.max(0, W - 40) / 100) / 10,
          unit: "mb",
        });
    } else
      hardware.push({
        name: "Hak / wkręt z kołkiem do ściany",
        use: "zawieszki wieszane bez listwy",
        spec: "zawieszki wieszane bez listwy — po jednym na zawieszkę",
        qty: nH,
        unit: "szt.",
      });
  }

  /* Wzmocnienia i katownik skreca sie wkretami, nie konfirmatem: tam plyty
     stykaja sie licem do czola i konfirmat nie ma w co wejsc. Dwa wkrety na
     kazdy koniec wzmocnienia, a przy katowniku co ok. 200 mm wysokosci. */
  let wkretyPlyt = 0;
  const wkretyOpis = [];
  let ileWzm = 0;
  levels.forEach((lv) => lv.cols.forEach((c) => { ileWzm += (c.rails || []).length; }));
  if (ileWzm) { wkretyPlyt += ileWzm * 4; wkretyOpis.push(`wzmocnienia ${ileWzm}×4`); }
  if (postSide) {
    const naPlyte = Math.max(2, Math.ceil(innerH / 200));
    wkretyPlyt += 2 * naPlyte;
    wkretyOpis.push(`kątownik w narożniku 2×${naPlyte}`);
  }
  // zawieszki przykreca sie tymi samymi wkretami 4 × 30 (uzytkownik 2026-09-29)
  if (zawieszki.n) { wkretyPlyt += ZAWIESZKA_WKRETY * zawieszki.n; wkretyOpis.push(`zawieszki ${zawieszki.n}×${ZAWIESZKA_WKRETY}`); }
  if (wkretyPlyt)
    hardware.push({
      name: "Wkręt 4 × 30",
      use: "wzmocnienia i kątownik skręcane na licu — 4 na wzmocnienie, kątownik co ok. 200 mm",
      spec: `skręcanie płyt na licu: ${wkretyOpis.join(", ")} szt.`,
      qty: wkretyPlyt,
      unit: "szt.",
    });

  // wkretow do zawiasow i prowadnic nie liczymy — ida w komplecie z okuciem

  // plecy przybijane — we frezie trzymaja sie same
  if (hasBack && !grooved) {
    const per = 2 * (W + H);
    hardware.push({
      name: backIsBoard ? "Wkręt 3,5 × 30 do pleców" : "Zszywka / gwoździk do pleców",
      use: "plecy przybijane po obwodzie, co ok. 100 mm",
      spec: "co ok. 100 mm po obwodzie",
      qty: Math.ceil(per / 100),
      unit: "szt.",
    });
  }

  /* Najmniejszy bok formatki. Ponizej tego piła formatowa nie ma czego trzymac
     — takiego kawalka nikt nie wytnie z plyty na maszynie. */
  const male = panels.filter((q) => Math.min(q.a, q.b) > 0 && Math.min(q.a, q.b) < MIN_PART);
  if (male.length)
    add("warn", `${male.length === 1 ? "Formatka" : "Formatki"} `
      + listPl([...new Set(male.map((q) => `${q.name} ${fmt(q.a)} × ${fmt(q.b)} mm`))])
      + ` ${male.length === 1 ? "ma bok" : "mają bok"} poniżej ${fmt(MIN_PART)} mm — `
      + "na formatówce się tego nie utnie, trzeba dociąć ręcznie z większego kawałka.");

  return {
    hardware,
    t, tf, tb, ts, carcassDepth, plecyZa, glebOdSciany, hasBack, interior, innerW, innerH,
    shelfDepth, shelfBack, dividerDepth, backIntrusion, frontCut, levels, sepShelves, dividers, doors, klapy, panels, msgs, maxNL,
    plinthInBody, plinthH, bottomY, legH, legTop, legBelow, legs, pMode, grooved, grOff, grDep, grPlay, geoCuts, geoOb, geoObs,
    backPos, backIsBoard, cornerCut, builtFront,
    topL, topR, botL, botR, hasTop, hasBot, leftLen, rightLen, leftY0, rightY0,
    postSide, postW, postBack, postTyp, postRects, zawieszki,
    isBlat, isWorktop, tTop, blat, blatDepth, blatInside, W, drillPlan,
    topX0, topX1, botX0, botX1, divOv,
  };
}

/* ---------- rysunki ---------- */

/* ---------- struktura usłojenia na rysunkach ----------
   Zamiast plaskiego koloru plyta dostaje wzor z delikatnymi slojami.
   Kolor zostaje ten sam — wzor tylko go rozrysowuje, wiec nic sie nie
   rozjezdza w zestawieniach, gdzie nadal uzywamy czystego hexa. */
/* Polki i zabudowa ida z "plyty polek", a ta domyslnie jest ta sama co korpus.
   Kolor na rysunku musi isc za tym samym wyborem co lista formatek, inaczej
   biala szafka dostaje bezowa zabudowe. */
const shelfColorOf = (cab, mat) =>
  cab.shelfSameAsBoard !== false ? mat.board.color : ((mat.shelf || mat.board).color);

const TEX_KEYS = ["board", "front", "shelf"];
const grainId = (hex, dir) =>
  "gr" + (dir === "h" ? "h" : "v") + String(hex || "").replace(/[^0-9a-fA-F]/g, "").toLowerCase();

const GrainDefs = ({ mat, on, dir }) => {
  if (!on) return null;
  const cols = [...new Set(TEX_KEYS.map((k) => (mat[k] || {}).color).filter(Boolean))];
  return (
    <defs>
      {cols.map((c) => (
        <pattern key={c} id={grainId(c, dir)} width="160" height="54"
          patternUnits="userSpaceOnUse" patternContentUnits="userSpaceOnUse"
          patternTransform={dir === "h" ? undefined : "rotate(90)"}>
          <rect x="0" y="0" width="160" height="54" fill={c} />
          <g fill="none" stroke="#000" strokeWidth="2.2" strokeOpacity="0.09">
            <path d="M0 8 q40 -6 80 0 t80 0" />
            <path d="M0 20 q30 5 60 0 t60 -3 t40 3" />
            <path d="M0 33 q50 -7 100 0 t60 2" />
            <path d="M0 46 q35 4 70 0 t90 -2" />
          </g>
          <g fill="none" stroke="#fff" strokeWidth="1.6" strokeOpacity="0.18">
            <path d="M0 14 q45 -5 90 0 t70 1" />
            <path d="M0 39 q40 5 80 0 t80 -2" />
          </g>
        </pattern>
      ))}
    </defs>
  );
};

/* Lico szafki naroznej za maskownica katownika jest otwarte — tamtedy siega sie
   w rog. Samo jasne pole czytalo sie jak dziura albo jak brakujaca plyta, wiec
   kreskujemy je na ukos: tak rysuje sie miejsce, w ktorym plyty nie ma. */
const PRZEJSCIE_ID = "mp-przejscie";
const PrzejscieDefs = () => (
  <defs>
    <pattern id={PRZEJSCIE_ID} width="34" height="34" patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="34" stroke={ACC} strokeWidth="3" opacity="0.3" />
    </pattern>
  </defs>
);

/* zwraca kopie materialow, w ktorej kolor plyty wskazuje na wzor slojow */
const texMat = (mat, on, dir) => {
  if (!on) return mat;
  const out = { ...mat };
  TEX_KEYS.forEach((k) => {
    if (out[k] && out[k].color) out[k] = { ...out[k], color: `url(#${grainId(out[k].color, dir)})` };
  });
  return out;
};

const DimH = ({ x1, x2, y, label, c = DIMC, above = true }) => (
  <g>
    <line x1={x1} y1={y} x2={x2} y2={y} stroke={c} strokeWidth="1.5" />
    <line x1={x1} y1={y - 8} x2={x1} y2={y + 8} stroke={c} strokeWidth="1.5" />
    <line x1={x2} y1={y - 8} x2={x2} y2={y + 8} stroke={c} strokeWidth="1.5" />
    <text x={(x1 + x2) / 2} y={above ? y - 8 : y + 22} textAnchor="middle"
      fontSize="22" fill={c} fontFamily="ui-monospace, monospace">{label}</text>
  </g>
);

const DimV = ({ y1, y2, x, label, c = DIMC, left = true, labelY = null }) => (
  <g>
    <line x1={x} y1={y1} x2={x} y2={y2} stroke={c} strokeWidth="1.5" />
    <line x1={x - 8} y1={y1} x2={x + 8} y2={y1} stroke={c} strokeWidth="1.5" />
    <line x1={x - 8} y1={y2} x2={x + 8} y2={y2} stroke={c} strokeWidth="1.5" />
    <text x={left ? x - 8 : x + 8} y={(labelY == null ? (y1 + y2) / 2 : labelY) + 7}
      textAnchor={left ? "end" : "start"} fontSize="22" fill={c}
      fontFamily="ui-monospace, monospace">{label}</text>
  </g>
);

/* Wysokosc lica szafki nad podloga ciagu: po niej poznajemy, ktore szafki laduja
   pod jednym blatem, ktora jest slupkiem, i jak wysoko wisi ciag gorny. */
const cabTopY = (cab, geo) => {
  const plinthH = cab.plinth && cab.plinth.on && !geo.plinthInBody ? geo.plinthH : 0;
  const legH = cab.legs && cab.legs.on ? geo.legBelow : 0;
  return Math.round(Math.max(plinthH, legH) + cab.H);
};

/* Ciag gorny wisi nad dolnym tej samej sciany, wiec jego wysokosci montazu sie nie
   wpisuje — liczy sie ja z lica dolnego plus przeswit. Dopoki dolny jest pusty,
   zostaje to, co zapisane. */
const tierMountY = (project, run) => {
  const wlasny = Math.max(0, Math.round(run.mountY || 0));
  if (run.tier !== "gorny" || !run.wall) return wlasny;
  const dolny = (project.runs || []).find((r) => r.id === run.wall);
  if (!dolny) return wlasny;
  const lista = runItems(project, dolny.id);
  if (!lista.length) return wlasny;
  const lico = Math.max(...lista.map(({ it }) => cabTopY(it.cab, computeGeo(it.cab, it.mat))));
  /* Przeswit mierzy sie od blatu, a nie od lica korpusu — nad szafkami lezy
     jeszcze plyta blatu i to ona wyznacza poziom, od ktorego liczy sie odstep. */
  const blat = dolny.worktop
    ? ((lista[0].it.mat.worktop || {}).thickness || 38)
    : Math.max(0, ...lista.map(({ it }) => {
        const g = computeGeo(it.cab, it.mat);
        return g.isBlat ? g.tTop : 0;
      }));
  return Math.round((dolny.mountY || 0) + lico + blat
    + Math.max(0, Math.round(run.clearance ?? 500)));
};

/* Dlugosc sciany jest wspolna dla obu pieter. */
const runWallW = (project, run) => {
  if (run.tier === "gorny" && run.wall) {
    const dolny = (project.runs || []).find((r) => r.id === run.wall);
    if (dolny && dolny.wallW != null) return dolny.wallW;
  }
  return run.wallW;
};

/* ---------- widoki zabudowy ----------
   Pojedyncza szafka ma swoje widoki od dawna. Ciag i cala zabudowa rysuja sie
   z tych samych czesci: kazda szafka wnosi swoja geometrie, a roznica jest
   tylko w tym, ile ciagow bierzemy i na jakiej wysokosci one wisza. */
/* `ref` to rozmieszczenie calego projektu. Szafka narozna potrzebuje z niego
   szerokosci dostepnego lica — bez tego jej wzmocnienia biegna przez przelot
   w ramie. Pierwsze przejscie (to, ktore buduje rozmieszczenie) `ref` nie ma
   i liczy sie jak dotad; rysunki i zestawienie wolaja juz z nim. */
/* Ile katownik wystaje poza wolne lico korpusu. Liczymy z `bracketPlan`, zeby
   rysunek i geometria nie rozjechaly sie przy zmianie ukladu plyt: bierzemy te
   plyty, ktore stoja w plaszczyznie korpusu (siegaja w glab ramienia). */
const bracketPozaLico = (a) => {
  if (!a.bracket) return 0;
  const tf = a.cab.geo.tf;
  const vF0 = armInset(a) ? a.depth - tf : a.depth;
  const korpusowe = bracketPlan(a, true).filter((r) => r.h === a.bracket.w);
  if (!korpusowe.length) return 0;
  return Math.max(0, Math.round(vF0 + tf - Math.min(...korpusowe.map((r) => r.v))));
};

const armCtxOf = (ref, index) => {
  if (!ref) return undefined;
  let out;
  ref.info.forEach((k) => {
    if (k.arm && k.arm.cab.index === index)
      out = { armFree: k.arm.free, armSide: k.arm.side, armKat: bracketPozaLico(k.arm), armBracket: !!k.arm.bracket,
        // ile lica zostaje na front korpusu: wolne lico bez maskownicy i luzu
        armFront: k.arm.front };
  });
  return out;
};

const assemblyParts = (project, runs, ref) =>
  runs.map((run) => {
    const gap = Math.max(0, Math.round(run.gap || 0));
    const mount = tierMountY(project, run);
    let x = 0;
    const cabs = runItems(project, run.id).map(({ it, i: index }, i, arr) => {
      const geo = computeGeo(it.cab, it.mat, armCtxOf(ref, index));
      const mat = texMat(it.mat, it.cab.texture, it.cab.textureDir);
      /* Cokol pod korpusem podnosi szafke, cokol w obrysie siedzi juz w H.
         Nozki podnosza tak samo, ale schowane w cokole nie dokladaja nic —
         dlatego bierzemy to, co wyzsze, a nie sume. */
      const plinthH = it.cab.plinth && it.cab.plinth.on && !geo.plinthInBody ? geo.plinthH : 0;
      const legBelow = it.cab.legs && it.cab.legs.on ? geo.legBelow : 0;
      const o = {
        // index = pozycja szafki w projekcie; po niej trafiaja w nia poprawki
        cab: it.cab, geo, mat, rawMat: it.mat, x, plinthH, index,
        // odstep od sciany przy podlodze i pod blatem — ciagu albo wlasny szafki
        wallGap: wallGapOf(run, it),
        // wysuniecie (+) albo cofniecie (-) z lica ciagu
        offset: Math.round(Number(it.offset) || 0),
        base: mount + Math.max(plinthH, legBelow),
        name: (it.cab.name || "").trim(),
        frontColor: it.cab.realColors && it.cab.frontSameAsBoard !== false
          ? mat.board.color : mat.front.color,
      };
      x += geo.W;
      if (i < arr.length - 1) x += gap;
      return o;
    });
    return { run, gap, mount, cabs, total: x };
  });

/* Ciag za rogiem bywa pusty — ramie i cokol trzeba narysowac, a koloru plyty
   ani wzoru slojow nie ma z czego wziac. Bierzemy je wtedy z pierwszej szafki,
   jaka w ogole jest na rysunku. */
const wzorcowaSzafka = (groups) => {
  const g = groups.find((x) => x.cabs.length);
  return g ? g.cabs[0] : null;
};
const kolorPlyty = (g, wzor) => {
  const c = g.cabs[0] || wzor;
  return c ? c.mat.board.color : "#d6d3d1";
};

/* Ramie szafki naroznej lezy w pasie sasiedniej sciany. Gdy rysujemy tylko
   jeden ciag, tamtego pasa nie ma — a ramie i tak trzeba pokazac, bo to kawalek
   tej szafki. Dostawiamy je wtedy tuz za koncem ciagu. */
const armsIn = (full, n, rysowane) => {
  const fn = full.info.get(n.id);
  if (!fn) return [];
  /* Ramiona lezace w tym pasie rysujemy zawsze, tez wtedy, gdy ciagu ich szafki
     nie ma na rysunku: to kawalek zabudowy stojacy przy TEJ scianie, wiec przy
     zakresie „ciag" musi byc widoczny — inaczej ciag za rogiem wyglada tak,
     jakby narożnika w ogole nie bylo. */
  const swoje = fn.arms;
  // ramiona szafek tego ciagu, ktorych pas nie jest rysowany — dostawiamy za koniec
  const cudze = [...full.info.values()]
    .filter((k) => k.arm && k.arm.run.id === n.id && !rysowane.has(k.arm.other.id))
    // `u0Pasa` — gdzie ramie stoi naprawde w swoim pasie; blat tamtego pasa liczy sie od niego
    .map((k) => ({ ...k.arm, u0: n.len + WALL_SEP / 2, u0Pasa: k.arm.u0, dostawione: true }));
  return [...swoje, ...cudze];
};

/* Front ramienia trzyma sie tego samego trybu co fronty jego szafki: nakladany
   siedzi przed korpusem ramienia, wpuszczany chowa sie w nim. `a.depth` to lico
   korpusu, wiec to od niego liczymy w obie strony. */
const armInset = (a) => a.cab.cab.frontMode === "inset";
const armFrontV = (a) => a.depth + (armInset(a) ? 0 : a.cab.geo.tf);

/* Katownik w wewnetrznym rogu szafki w L. Cztery pionowe plyty na cala wysokosc:
   dwie w srodku z plyty polkowej i dwie na czole korpusu z plyty frontowej,
   wszystkie skrecone ze soba. Zewnetrzne siedza wprost na korpusie, wiec ich lico
   wypada rowno z zamknietymi drzwiami — razem tworza jedna plaszczyzne.

   Formatka nie schodzi ponizej 60 mm, bo mniejszej nikt nie utnie i nie oklei.
   Dlatego jedna plyta nachodzi na czolo drugiej i od wewnetrznego naroza wychodzi
   60 mm dla nachodzacej, a 60 + grubosc dla doczolowej. Nachodzaca stoi domyslnie
   od strony krotszych drzwi — to one maja mniej do stracenia. */
const cornerBracket = (arm) => {
  const geo = arm.cab.geo;
  const cab = arm.cab.cab;
  /* Luz miedzy katownikiem a frontami to ten sam luz, co miedzy drzwiami —
     domyslna wartosc bierzemy z `defaultCab`, zeby nie rozjechala sie z nia,
     gdy tam sie zmieni. */
  const luz = (cab.gaps || {}).between ?? defaultCab.gaps.between;
  // szerokosc wspornikow w rogu: z ustawienia szafki, domyslnie CORNER_BRACKET_W
  const w = Math.max(MIN_PART, Math.round(Number((cab.corner || {}).bracketW) || CORNER_BRACKET_W));
  const tryb = (cab.corner || {}).bracket === "dluzsze" ? "dluzsze" : "krotsze";
  const korpusKrotszy = arm.free <= arm.len;
  const nachodziKorpus = tryb === "krotsze" ? korpusKrotszy : !korpusKrotszy;
  /* Plyty musza sie stykac: krawedz jednej lezy na licu drugiej, tak jak przy
     zabudowie wycietego naroznika. Nachodzaca wchodzi w kwadrat styku obu lic,
     wiec od wewnetrznego naroza wystaje o grubosc plyty mniej, a doczolowa —
     ktora zaczyna sie dopiero za tym licem — o tyle samo wiecej. */
  return {
    w, luz, nachodziKorpus,
    // ile lica zjada katownik razem z luzem — osobno po stronie korpusu i ramienia
    odKorpusu: (nachodziKorpus ? w - geo.tf : w) + luz,
    odRamienia: (nachodziKorpus ? w + geo.tf : w) + luz,
  };
};

/* Front ramienia w ukladzie „od naroza": `odRogu` mowi, gdzie sie zaczyna, `w`
   jaki jest szeroki. Przy katowniku luz siedzi tylko na wolnym koncu — front
   zachodzi tam na bok ramienia dokladnie tak, jak drzwi szafki zachodza na jej
   bok. Jedno miejsce dla formatki i dla wszystkich rysunkow: rysowany po staremu
   na cala `armFront` konczyl sie rowno z bokiem, zamiast na niego zachodzic. */
const armFrontPlan = (a) => {
  const luz = (a.cab.cab.gaps || {}).edge ?? 2;
  const pelne = a.armFront != null ? a.armFront : a.len;
  const fix = a.doors === "fix";
  const ubytek = fix ? 0 : a.bracket ? luz : 2 * luz;
  return {
    odRogu: (a.len - pelne) + (fix || a.bracket ? 0 : luz),
    w: Math.max(0, Math.round(pelne - ubytek)),
  };
};

/* Nozki ramienia w jego ukladzie: `us` to odleglosci od rogu (wzdluz ramienia),
   `vs` od sciany — dwa rzedy, przy scianie i przy licu. Ramie stoi na nozkach
   tak jak samodzielna szafka tej dlugosci — rozstaw liczy ten sam `legPlan`:
   para przy rogu, para pod wolnym koncem i od 900 mm para posrodku (1200 mm
   to 6 nozek). Przy rogu ramie mogloby sie oprzec na nozkach szafki naroznej,
   ale uzytkownik wybral wlasna pare — ramie nie zalezy wtedy od tego, jak
   stanie szafka obok. Jedno miejsce dla zamowienia, obu elewacji i bryly. */
const armLegPlan = (a) => {
  const len = Math.max(0, Math.round(a.len));
  const us = legPlan({}, len).xs;
  const vs = [LEG_INSET, Math.max(LEG_INSET, Math.round(a.depth) - LEG_INSET - LEG_W)];
  return { us, vs, w: LEG_W, ile: us.length * vs.length };
};

/* Polka w bryle: prostopadloscian, a przy wzmocnieniu tylnym B z wycietym
   tylnym rogiem — dwa (pas od frontu do lica wzmocnienia na cala szerokosc
   i reszta z tylu obok wyciecia). z od frontu, `cd` = glebokosc korpusu. */
const polkaCzesci = (c, z0, z1, cd) => {
  const x0 = c.shX0 ?? c.x0, x1 = c.shX1 ?? c.x1, n = c.shNotch;
  if (!n) return [[x0, z0, x1, z1]];
  const zN = cd - n.v1;
  const [r0, r1] = n.x0 > x0 + 0.5 ? [x0, n.x0] : [n.x1, x1];
  return [[x0, z0, x1, zN], [r0, zN, r1, z1]];
};

/* Cztery plyty katownika w rzucie z gory, w ukladzie ramienia: `u` biegnie wzdluz
   ramienia od strony rogu, `v` w glab od sciany. Zewnetrzne siedza w licach obu
   frontow, wewnetrzne tuz za nimi. Gdy rog wypada na drugim koncu ramienia,
   wszystko odbija sie lustrzanie. */
const bracketPlan = (a, lokalnie) => {
  const kat = a.bracket;
  if (!kat) return [];
  const tf = a.cab.geo.tf;
  const t = a.cab.geo.t;
  const vF0 = armInset(a) ? a.depth - tf : a.depth;   // wewnetrzna krawedz frontu ramienia
  /* Para plyt spina sie w kacie prostym wokol jednego naroza: krawedz jednej
     lezy na licu drugiej. Zewnetrzna para trzyma sie naroza obu lic, wewnetrzna
     tego samego naroza cofnietego o grubosc plyty czolowej — dlatego obie pary
     licza sie tym samym wzorem, tylko z innym punktem i inna gruboscia. */
  const para = (uC, vC, th, front) => (kat.nachodziKorpus
    ? [{ u: uC - th, v: vC - th, w: th, h: kat.w, front },          // korpus: nachodzaca
       { u: uC, v: vC - th, w: kat.w, h: th, front }]               // ramie: doczolowa
    : [{ u: uC - th, v: vC - th, w: kat.w, h: th, front },          // ramie: nachodzaca
       { u: uC - th, v: vC, w: th, h: kat.w, front }]);             // korpus: doczolowa
  const rects = [
    ...para(tf, vF0 + tf, tf, true),   // zewnetrzne — w licu zamknietych drzwi
    ...para(0, vF0, t, false),         // wewnetrzne — tuz za czolem korpusu
  ];
  /* W ukladzie ciagu rog wypada raz na poczatku, raz na koncu ramienia. Rysunek
     samej szafki liczy zawsze od jej lica, wiec tam odbicie jest zbedne. */
  return lokalnie || a.outerAtEnd ? rects : rects.map((r) => ({ ...r, u: a.len - r.u - r.w }));
};

/* Wzmocnienia i plecy ramienia w jego wlasnym ukladzie: `u` biegnie wzdluz
   ramienia od lica korpusu, `v` w glab od sciany. Jedno miejsce dla rysunku
   i dla formatek — inaczej lista mowi swoje, a rysunek swoje.

   Dwie rzeczy nie koncza sie na licu korpusu, tylko wchodza w glab szafki
   naroznej az do katownika w tylnym narozniku: plecy i tylne wzmocnienie.
   Bez tego wisialy w powietrzu nad przejsciem, a wzdluz drugiej sciany
   zostawal goly kawalek. */
const armPlan = (a, lokalnie) => {
  const geo = a.cab.geo;
  const cab = a.cab.cab;
  const t = geo.t;
  const tf = geo.tf;
  /* Plecy ramienia moga byc pelna plyta zamiast HDF — wtedy trzymaja rog same
     i stojace wzmocnienie przy nich jest juz niepotrzebne. */
  const plytaRamienia = !!(cab.corner || {}).on && !!(cab.corner || {}).backBoard;
  const maPlecy = cab.back !== "none" || plytaRamienia;
  const tb = !maPlecy ? 0 : plytaRamienia ? t : geo.tb || t;
  const pOd = Math.max(geo.backIntrusion, cab.back !== "none" ? geo.tb : 0);
  const tyl = geo.postSide
    ? Math.max(0, Math.round(geo.carcassDepth - pOd - geo.postW)) : 0;
  /* Plecy koncza sie na katowniku, ale wzmocnienie idzie dalej: nachodzi na jego
     ramie i tam sie z nim skreca. Wolna czesc tego ramienia to jego dlugosc bez
     dwoch grubosci plyty — drugiego ramienia katownika i wzmocnienia korpusu,
     ktore stoi przy tej samej scianie. */
  const tylWzm = geo.postSide
    ? tyl + Math.max(0, Math.round(geo.postW - 2 * t)) : 0;
  // ramie zamyka bok na wolnym koncu — plyty poziome dochodza do jego lica
  const u1 = Math.max(0, Math.round(a.len - t));
  const surowe = (((cab.levels || []).slice(-1)[0] || {}).cols || [])
    .flatMap((c) => c.rails || []);
  /* Wzmocnienia ramienia to osobne plyty, wiec ich szerokosc moze byc inna niz
     w korpusie — polozenie zostaje wspolne, bo obie plyty musza sie spotkac.
     Puste ustawienie znaczy „tak jak w szafce". */
  const szerRam = (cab.corner || {}).railW || {};
  const nadpis = (r) => {
    const v = Number(szerRam[r.fromBack ? "tyl" : "przod"]);
    return v > 0 ? Math.round(v) : null;
  };
  const rails = geo.hasTop ? [] : surowe
    .filter((r) => !(plytaRamienia && r.orient === "front" && r.fromBack))
    .map((r) => {
    const szer = nadpis(r)
      ?? Math.max(0, Math.round(r.orient === "front" ? Number(r.h) || 0 : Number(r.depth) || 0));
    const gr = Math.max(0, Math.round(r.orient === "front" ? t : szer));
    const at = Math.max(0, Math.round(Number(r.atDepth) || 0));
    /* Przy plecach katownik jest cofniety o ich grubosc, wiec wzmocnienie
       ramienia zaczyna sie dopiero za jego ramieniem. */
    const zaKat = geo.postSide ? geo.postBack + t : 0;
    const v0 = r.fromBack ? Math.max(at, zaKat) : Math.max(0, a.depth - at - gr);
    /* Wzmocnienie czolowe ramienia dobija do tylnej krawedzi tego samego
       wzmocnienia w korpusie — czyli wchodzi w szafke o jego cofniecie plus
       szerokosc. Dopiero wtedy obie plyty stykaja sie cala szerokoscia i da sie
       je skrecic; skrocone do lica mijaly sie o grubosc frontu. */
    return { u0: r.fromBack ? -tylWzm : -(at + gr), u1, v0, v1: v0 + gr, wys: szer,
      // stojace = plyta na sztorc (liczy sie wysokosc), przyTyle = ktora to z pary
      stojace: r.orient === "front", przyTyle: !!r.fromBack, wlasna: nadpis(r) != null };
  });
  /* Plecy ida dalej niz wzmocnienie: nachodza na katownik w narozniku i konczą
     sie dopiero na tylnej plaszczyznie szafki. Przybija sie je do niego tak samo
     jak do bokow, wiec nie ma powodu urywac ich na jego czole. */
  const tylPlecy = geo.postSide ? Math.max(0, Math.round(geo.carcassDepth - pOd)) : tyl;
  const back = maPlecy
    ? { u0: -tylPlecy, u1: a.len, v0: 0, v1: tb, plyta: plytaRamienia } : null;
  /* Tak samo jak katownik: w ukladzie ciagu rog wypada raz na poczatku, raz na
     koncu ramienia, a rysunek samej szafki liczy zawsze od jej lica. */
  const odbij = (r) => (lokalnie || a.outerAtEnd
    ? r : { ...r, u0: a.len - r.u1, u1: a.len - r.u0 });
  return { tyl, u1, tb, rails: rails.map(odbij), back: back && odbij(back) };
};

/* Glebokosc ciagu liczona od sciany do lica — szafki wyrownujemy do lica, wiec
   od sciany odsuwa nas najglebsza z nich, a wysuniete jeszcze bardziej.
   Pusty ciag za rogiem glebokosci jeszcze nie ma z czego wziac, wiec bierze ja
   z wlasnego ustawienia — to od niej zalezy szerokosc frontu szafki naroznej. */
/* Odsuniecie od sciany (przy podlodze) tez tu wchodzi: szafka odsunieta stoi
   dalej od sciany razem z licem, a za plecami zostaje pusta przestrzen. */
const runFrontDepth = (g) =>
  g.cabs.length
    ? Math.max(...g.cabs.map((c) => (c.wallGap ? c.wallGap.bottom : 0) + c.geo.glebOdSciany - c.offset))
    /* Pusty ciag (np. z samym ramieniem szafki w L): glebokosc z ustawienia
       ciagu jak u szafki z domyslnymi plecami HDF przybijanymi — tak samo
       daleko od sciany jak szafki obok. Bez tego ramie w pustym ciagu bylo
       o grubosc plecow plytsze (2026-09-28). */
    : Math.max(0, Math.round(Number(g.run.D) || 0)) + defaultMaterials.back.thickness + wallGapOf(g.run, null).bottom;

/* Ciag bez szafek zwykle nie ma czego pokazac, ale ten za rogiem owszem: w jego
   pasie lezy ramie szafki naroznej, a jego glebokosc wyznacza szerokosc frontu
   w rogu. Dlatego pusty ciag zostaje na rysunku, jesli laczy go z czyms narożnik. */
const runInCorner = (runs, r) =>
  !!(r.corner && r.corner.of) || runs.some((o) => o.corner && o.corner.of === r.id);
/* Pusty gorny ciag nie ma wlasnego narożnika (bierze go od dolnego), ale gdy za
   rogiem wisi gorna szafka w L, lezy na nim jej ramie — bez niego ramienia nie
   byloby gdzie polozyc. */
const gornyPodRamie = (project, runs, r) => {
  if (r.tier !== "gorny" || !r.wall) return false;
  const dol = runs.find((q) => q.id === r.wall);
  if (!dol) return false;
  const sasiedzi = [dol.corner && dol.corner.of,
    ...runs.filter((o) => o.corner && o.corner.of === dol.id).map((o) => o.id)].filter(Boolean);
  return runs.some((g) => g.tier === "gorny" && sasiedzi.includes(g.wall)
    && runItems(project, g.id).some(({ it }) => it.cab.corner && it.cab.corner.on));
};
const drawableRuns = (project, roomId = null) => {
  const runs = project.runs || [];
  return runs.filter((r) => (!roomId || roomOfRun(project, r) === roomId)
    && (runItems(project, r.id).length || runInCorner(runs, r) || gornyPodRamie(project, runs, r)));
};

/* Zasieg sciany w ukladzie ciagu (u wzdluz sciany). W rogu mur idzie o swoja
   grubosc dalej, do narozu, a lico konczy sie na licu drugiej sciany. Na wolnym
   koncu nie wiemy, gdzie sciana sie konczy — rysujemy ja do konca ciagu albo
   na wpisana dlugosc sciany, liczona od rogu albo od krawedzi, od ktorej
   mierzy sie polozenie ciagu. */
const scianaZasieg = (n, dl) => {
  const rogS = (n.corner && n.corner.at === "end") || n.kids.some((k) => k.corner.at === "start");
  const rogE = (n.corner && n.corner.at === "start") || n.kids.some((k) => k.corner.at === "end");
  let u0 = 0, u1 = n.len;
  if (dl != null && dl > n.len) {
    if (rogS || (!rogE && n.run.offsetFrom !== "right")) u1 = dl; else u0 = n.len - dl;
  }
  return { u0, u1, rogS, rogE };
};

// odstep miedzy scianami w rozwinieciu elewacji — tyle, zeby rog byl widoczny
const WALL_SEP = 260;

/* Rozmieszczenie ciagow w rzucie i w rozwinietej elewacji. Ciag bez naroznika
   lezy wzdluz osi X: sciana na y = 0, front w strone +y. Naroznik obraca ciag
   o 90 stopni tak, zeby sciana zostala po tej samej rece — dlatego kolejne
   narozniki skladaja sie same w L, U i G i nie ma tu osobnego pola „ksztalt".

   `lead` to odcinek przed pierwsza szafka, `tail` za ostatnia. W rogu dwa ciagi
   zawsze na siebie wchodza: ten, ktory w rog wjezdza, jedzie do konca, a drugi
   musi sie odsunac o jego glebokosc.

   `ref` to rozmieszczenie calego projektu. Przy zakresie „ciag" drugiego ciagu
   nie ma na rysunku, wiec rog nie ma sie z czego policzyc — a odsuniecie i tak
   obowiazuje, bo w tej luce lezy ramie szafki naroznej. Wtedy bierzemy `lead`
   i `tail` z calosci, zeby ramie wypadlo dokladnie tam, gdzie stoi naprawde. */
const runLayout = (groups, ref = null) => {
  const info = new Map();
  groups.forEach((g) => info.set(g.run.id, {
    g, id: g.run.id, run: g.run, depth: runFrontDepth(g), total: g.total,
    // szafka wysunieta z lica wystaje poza lico ciagu — rysunek musi ja objac
    front: Math.max(0, ...g.cabs.map((c) => c.offset)),
    /* Odsuniecie ciagu w obrebie sciany wchodzi od razu w `lead` albo `tail` —
       dalej liczy sie samo, bo cala geometria pasa idzie od tych dwoch liczb. */
    lead: g.run.offsetFrom === "right" ? 0 : Math.max(0, Math.round(g.run.offset || 0)),
    tail: g.run.offsetFrom === "right" ? Math.max(0, Math.round(g.run.offset || 0)) : 0,
    corner: null, kids: [], zones: [], arms: [], blind: null, arm: null, pair: null, wstawki: [],
  }));
  info.forEach((n) => {
    const c = n.run.corner;
    // narożnik do ciagu, ktorego na rysunku nie ma, po prostu nie dziala
    if (!c || c.of === n.id || !info.has(c.of)) return;
    n.corner = c;
    n.parent = info.get(c.of);
    n.parent.kids.push(n);
  });
  /* Gorna szafka w L (uzytkownik 2026-09-28: „wzorowana na dolnej”). Gorny ciag
     nie ma wlasnego narożnika — bierze go od dolnego i tylko odsuwa sie o gorny
     ciag sciany wjezdzajacej (nizej). Gdy w rogu wisi szafka z ramieniem, para
     gornych ciagow dostaje narożnik jak dolna: ramie, katownik, odsuniecie
     sasiada o glebokosc i ramie. W rog wjezdza ten gorny ciag, w ktorym szafka
     w L stoi przy rogu — niekoniecznie ten sam co na dole. Bez szafki w L nic
     sie nie zmienia (dotychczasowy slepy rog gornych). */
  info.forEach((n) => {
    if (n.corner || n.run.tier !== "gorny" || !n.run.wall || !info.has(n.run.wall)) return;
    const c = info.get(n.run.wall).run.corner;
    if (!c || !info.has(c.of)) return;
    const p = [...info.values()].find((q) => q.run.tier === "gorny" && q.run.wall === c.of);
    if (!p || p === n) return;
    // przy ktorym koncu danego ciagu jest rog — jak `przyStarcie` nizej
    const naRogu = (q) => {
      const s = q === n ? c.at === "end" : c.at !== "end";
      const k = q.g.cabs[s ? 0 : q.g.cabs.length - 1];
      return !!(k && k.cab.corner && k.cab.corner.on);
    };
    const pierwszy = c.owner === "self" ? n : p;
    const owner = naRogu(pierwszy) ? c.owner
      : naRogu(pierwszy === n ? p : n) ? (c.owner === "self" ? "of" : "self") : null;
    if (!owner) return;
    n.corner = { of: p.id, at: c.at, owner, clear: c.clear || 0, gorny: true };
    n.parent = p;
    p.kids.push(n);
  });
  info.forEach((n) => {
    if (!n.corner) return;
    const p = info.get(n.corner.of);
    const wchodzi = n.corner.owner === "self" ? n : p;   // ten jedzie do naroza
    const ustepuje = wchodzi === n ? p : n;              // ten sie odsuwa
    // przy ktorym koncu ciagu wjezdzajacego w rog wypada narożnik
    const przyStarcie = (n.corner.at === "end") === (wchodzi === n);
    const rogowa = wchodzi.g.cabs[przyStarcie ? 0 : wchodzi.g.cabs.length - 1];
    /* Szafka narozna w L wychodzi ramieniem na sasiednia sciane, wiec drugi
       ciag musi sie odsunac nie tylko o glebokosc, ale i o dlugosc ramienia. */
    const kor = rogowa && rogowa.cab.corner;
    const armLen = kor && kor.on ? Math.max(0, Math.round(kor.arm || 0)) : 0;
    /* Rog zjada tyle, ile ma glebokosci szafka, ktora w nim faktycznie stoi —
       nie caly ciag. Plytsza szafka w rogu odsuwa sasiada mniej, glebsza
       wiecej; branie glebokosci ciagu myliloby sie w obie strony. */
    /* Szafka odsunieta od sciany zjada rog razem z tym odstepem — sasiad
       zaczyna sie za jej frontem, a nie za samym korpusem. */
    /* Szafki ciagu stoja wyrownane do lica (`n.depth`), wiec plytsza szafka
       w rogu stoi dalej od sciany, a jej lico jest tam, gdzie lico ciagu —
       plus jej wlasne wysuniecie. Wczesniej liczone od sciany: szafka w L 560
       w ciagu szafek 570 wchodzila ramieniem 10 mm w pierwsza szafke drugiego
       ciagu (audyt 2026-09-28). */
    const glRog = rogowa
      ? Math.round(wchodzi.depth + rogowa.offset)
      : wchodzi.depth; // glebokosc ciagu juz liczy sie od sciany, z odstepem
    n.pair = { wchodzi, ustepuje, przyStarcie, rogowa, armLen, glRog };
    /* Wstawka siedzi na boku tej szafki ciagu ustepujacego, ktora stoi przy
       rogu, i odsuwa caly ciag o to, co z niej widac od przodu: grubosc plyty
       frontowej (plaska) albo swoja szerokosc (szeroka). Przy szafce w L jej
       nie ma — tam rog zamyka ramie. */
    const ustNaStarcie = n.corner.at === "end" ? ustepuje === n : ustepuje === p;
    const ws = !armLen && n.corner.wstawka ? n.corner.wstawka : null;
    const przyRogu = ws && ustepuje.g.cabs.length
      ? ustepuje.g.cabs[ustNaStarcie ? 0 : ustepuje.g.cabs.length - 1] : null;
    const wsU = przyRogu ? (ws.typ === "szeroka" ? ws.w : przyRogu.geo.tf) : 0;
    if (przyRogu) n.pair.wstawka = { ...ws, cab: przyRogu, run: ustepuje, naStarcie: ustNaStarcie,
      u: wsU, gl: ws.typ === "szeroka" ? przyRogu.geo.tf : ws.w };
    /* Slepy rog: drugi ciag staje bokiem przed licem szafki w rogu, czyli
       za jej frontem (fix / drzwi w zaslonietej czesci), a nie za korpusem.
       Bez tego bok sasiada i fix zajmowaly to samo miejsce, a wstawka
       nachodzila na fix (zgloszenie uzytkownika 2026-09-28). Przy szafce
       w L rog domyka ramie — tam front liczy geometria ramienia. */
    const frontRog = rogowa && !armLen && rogowa.cab.frontMode !== "inset" ? rogowa.geo.tf : 0;
    n.pair.frontRog = frontRog;
    const o = glRog + frontRog + armLen + (n.corner.clear || 0) + wsU;
    // odsuwamy z tej strony ciagu, ktora dotyka rogu
    if (n.corner.at === "end") { if (ustepuje === n) n.lead += o; else p.tail += o; }
    else if (ustepuje === n) n.tail += o; else p.lead += o;
    /* Szafka w L stoi tylem ramienia i bokiem korpusu przy scianie sasiada.
       Gdy tamten ciag jest odsuniety od sciany, ramie stoi z tym samym odstepem
       — a razem z nim cala szafka, wiec jej ciag konczy sie o tyle wczesniej. */
    const odSasiada = armLen ? wallGapOf(ustepuje.run, null).bottom : 0;
    n.pair.odSasiada = odSasiada;
    if (odSasiada) {
      if (n.corner.at === "end") { if (wchodzi === p) p.tail += odSasiada; else n.lead += odSasiada; }
      else if (wchodzi === p) p.lead += odSasiada; else n.tail += odSasiada;
    }
  });
  /* Ciag, ktorego partner z rogu nie jest rysowany, nie policzyl sobie wyzej
     odsuniecia — bierze je z calosci, razem z ta sama luka na ramie. */
  if (ref) info.forEach((n) => {
    if (n.pair || n.corner) return;
    const rn = ref.info.get(n.id);
    if (!rn) return;
    n.lead = rn.lead;
    n.tail = rn.tail;
  });
  info.forEach((n) => { n.len = n.lead + n.total + n.tail; });
  /* Gorna szafka w L musi wisiec w samym rogu, inaczej jej ramie (liczone od
     rogu, w ramce sasiada) rozjezdza sie z korpusem. Gorny ciag, ktory konczy
     sie w rogu, jest zwykle krotszy od dolnego — dosuwamy go do rogu, czyli do
     konca dolnego ciagu tej sciany, i mowimy o tym w uwagach. */
  info.forEach((n) => {
    if (!n.pair || !n.corner.gorny || n.pair.przyStarcie) return;
    const w = n.pair.wchodzi;
    const dol = w.run.wall && info.get(w.run.wall);
    const brak = dol ? Math.round(dol.len - w.len) : 0;
    if (brak <= 0) return;
    w.lead += brak;
    w.len += brak;
    n.pair.dosuniety = brak;
  });

  /* Ciag gorny wisi na scianie swojego dolnego: ta sama ramka i ten sam numer
     sciany (ustawiane nizej, przy ramkach). Wczesniej gorny bez wlasnego
     narożnika zawsze trafial na pierwsza sciane — gorny drugiej sciany wisial
     nad pierwsza i nachodzil na tamten.
     W rogu gorne zachowuja sie jak dolne, ale z wlasna glebokoscia: gdy gorny
     ciag sciany wjezdzajacej w rog (ta sama zasada `owner` co na dole) siega
     rogu, gorny drugiej sciany zaczyna sie dopiero za jego glebokoscia i luzem. */
  info.forEach((n) => {
    if (n.run.tier === "gorny" && n.run.wall && info.has(n.run.wall)) n.dolny = info.get(n.run.wall);
  });
  info.forEach((n) => {
    const dol = n.dolny;
    if (n.corner || !dol || !dol.corner || !info.has(dol.corner.of)) return;
    const pDol = info.get(dol.corner.of);
    const p = [...info.values()].find((q) => q.dolny === pDol);
    if (!p || !n.g.cabs.length || !p.g.cabs.length) return;
    const c = dol.corner;
    // gdzie w ramce danego ciagu lezy rog: na poczatku (u = 0) albo na koncu
    const rogU = (q) => (q === n ? (c.at === "end" ? 0 : dol.len) : (c.at === "end" ? pDol.len : 0));
    const odRogu = (q) => (rogU(q) === 0 ? q.lead : rogU(q) - (q.lead + q.total));
    const wchodzi = c.owner === "self" ? n : p;
    const ustepuje = wchodzi === n ? p : n;
    if (odRogu(wchodzi) >= ustepuje.depth) return;       // wchodzacy do rogu nie siega
    // jak w dolnym rogu: za licem szafki wchodzacej, czyli razem z jej frontem
    const pierwsza = wchodzi.g.cabs[rogU(wchodzi) === 0 ? 0 : wchodzi.g.cabs.length - 1];
    const frontW = pierwsza && pierwsza.cab.frontMode !== "inset" ? pierwsza.geo.tf : 0;
    const trzeba = wchodzi.depth + frontW + (c.clear || 0);
    /* Odsuwamy tylko ciag, ktory w rogu sie zaczyna. Ten, ktory w rogu sie
       konczy, stoi od poczatku sciany — jego przesuniecie zmieniloby uklad
       calej sciany; jesli wchodzi w rog, powie o tym kontrola otwierania. */
    if (rogU(ustepuje) === 0 && ustepuje.lead < trzeba) {
      ustepuje.lead = trzeba;
      ustepuje.len = ustepuje.lead + ustepuje.total + ustepuje.tail;
    }
  });

  /* Slepy narożnik. Ciag, ktory wjezdza w rog, konczy sie szafka stojaca za
     plecami drugiego ciagu: tyle jej frontu, ile ma glebokosci ten drugi ciag,
     jest po prostu zaslonione i nie da sie tamtedy siegnac. Dlatego szafki
     narozne robi sie szersze — zostaje wtedy kawalek frontu na drzwi — albo
     dokłada sie ramie i robi z nich jedna szafke w L. */
  info.forEach((n) => {
    if (!n.pair) return;
    const { wchodzi: w, ustepuje: other, przyStarcie, rogowa: c, armLen, glRog } = n.pair;
    if (!c) return;
    const frontSasiada = other.g.cabs.length && other.g.cabs[0].cab.frontMode !== "inset"
      ? other.g.cabs[0].geo.tf : (other.g.cabs.length ? 0 : defaultMaterials.front.thickness);
    const zaslania = other.depth + frontSasiada + SLEPY_ZAPAS;   // ile zabiera sasiad, niezaleznie od szafki
    const covered = Math.min(c.geo.W, zaslania);
    const free = c.geo.W - covered;
    const u0 = przyStarcie ? w.lead : w.lead + w.total - covered;
    const z = { cab: c, covered, zaslania, free, run: w, other, u0, u1: u0 + covered,
      strona: przyStarcie ? "left" : "right",
      freeU0: przyStarcie ? u0 + covered : u0 - free };
    /* Polozenie wstawki liczymy dopiero tu, gdy znane sa juz ostateczne
       odsuniecia ciagow. Lico korpusu to glebokosc ciagu plus wysuniecie szafki;
       wstawka konczy sie w licu drzwi, czyli grubosc frontu przed nim. */
    const wsp = n.pair.wstawka;
    if (wsp) {
      const c0 = wsp.cab;
      const u0 = wsp.naStarcie ? wsp.run.lead + c0.x - wsp.u : wsp.run.lead + c0.x + c0.geo.W;
      const lico = wsp.run.depth + c0.offset + (c0.cab.frontMode === "inset" ? 0 : c0.geo.tf);
      wsp.run.wstawki.push({ ...wsp, u0, u1: u0 + wsp.u, v0: lico - wsp.gl, v1: lico,
        z0: c0.base, z1: c0.base + c0.cab.H, H: c0.cab.H, rogRun: n.run.id });
    }
    if (!armLen) { n.blind = z; w.zones.push(z); return; }
    /* Ramie rysuje sie i mierzy w ukladzie tego ciagu, ktory sie odsunal —
       lezy dokladnie w luce miedzy rogiem a jego pierwsza szafka. */
    const a0 = przyStarcie ? other.len - glRog - armLen : glRog;
    /* Front korpusu i front ramienia spotykaja sie w rogu pod katem prostym.
       Lico ramienia lezy o grubosc frontu przed jego korpusem (przy froncie
       nakladanym), wiec front korpusu ma do dyspozycji o tyle mniej — liczony
       po staremu do samej glebokosci sasiada nachodzil na tamten front. */
    /* Glebokosc sasiada liczy sie od sciany, razem z odstepem od niej — ramie
       ma tyle, ile sam korpus, i stoi z tym samym odstepem co tamte szafki. */
    const glRamienia = Math.max(0, other.depth - (n.pair.odSasiada || 0));
    const licoRamienia = glRamienia
      + (c.cab.frontMode === "inset" ? 0 : c.geo.tf);
    const arm = { cab: c, len: armLen, depth: glRamienia, run: w, other,
      u0: a0, free: Math.max(0, Math.round(c.geo.W - licoRamienia)),
      outerAtEnd: !przyStarcie,
      // z ktorej strony korpusu wychodzi ramie — po tej stronie nie ma juz frontu
      side: przyStarcie ? "left" : "right",
      doors: (c.cab.corner || {}).doors || "wsporniki" };
    /* Katownik zjada kawalek lica po obu stronach rogu: oba skrzydla domykaja
       sie do niego, kazde do swojego ramienia i kazde z luzem. Zostaje z tego
       `front` na drzwi korpusu i `armFront` na front ramienia. */
    arm.bracket = arm.doors === "wsporniki" ? cornerBracket(arm) : null;
    arm.front = Math.max(0, Math.round(arm.free - (arm.bracket ? arm.bracket.odKorpusu : 0)));
    arm.armFront = Math.max(0, Math.round(armLen - (arm.bracket ? arm.bracket.odRamienia : 0)));
    n.arm = arm;
    other.arms.push(n.arm);
  });

  /* Blat w narozniku. Nad rogiem plaszczyzny obu ciagow na siebie wchodza,
     wiec albo jeden blat przechodzi przez rog, a drugi dojezdza do jego boku,
     albo oba tnie sie na 45 stopni (lyzwa) i spotykaja sie po przekatnej.
     `s` i `e` to poczatek i koniec blatu na osi ciagu — moga wyjsc poza szafki
     (blat idzie nad rogiem) albo przed nie (rog zabral go sasiad). */
  info.forEach((n) => {
    n.top = { s: n.lead, e: n.lead + n.total, skosS: false, skosE: false, corS: false, corE: false };
  });
  info.forEach((n) => {
    if (!n.pair) return;
    const p = n.parent;
    const c = n.corner;
    const przez = c.top === "self" ? n : c.top === "of" ? p : n.pair.wchodzi;
    const skos = c.cut === "skos";
    const ust = (r, atStart) => {
      // na lyzwe oba kawalki dochodza do rogu, na styk tylko ten przechodzacy
      const d = skos || r === przez ? 0 : przez.depth;
      /* Dojezdzajacy blat konczy sie na krawedzi przechodzacego, a ten jest
         glebszy od szafek o front, wysieg i docinke arkusza. Te glebokosc zna
         dopiero `runTop`, wiec zostawiamy mu, czyj blat idzie przez rog. */
      const przezId = d ? przez.id : null;
      if (atStart) { r.top.s = d; r.top.skosS = skos; r.top.corS = true; r.top.przezS = przezId; }
      else { r.top.e = r.len - d; r.top.skosE = skos; r.top.corE = true; r.top.przezE = przezId; }
    };
    ust(n, c.at === "end");
    ust(p, c.at !== "end");
  });
  // ten sam odcinek, ale liczony od lewej krawedzi pierwszej szafki ciagu
  info.forEach((n) => {
    n.topSpan = { x0: n.top.s - n.lead, x1: n.top.e - n.lead,
      skos0: n.top.skosS, skos1: n.top.skosE, cor0: n.top.corS, cor1: n.top.corE,
      przez0: n.top.przezS || null, przez1: n.top.przezE || null,
      glPrzez0: n.top.s, glPrzez1: n.len - n.top.e };
  });

  /* Ramka ciagu: punkt (u, v) — u wzdluz sciany od poczatku ciagu, v w glab
     pokoju od sciany — trafia na (ox + ux·u + vx·v, oy + uy·u + vy·v). */
  const at = (f, u, v) => ({ x: f.ox + f.ux * u + f.vx * v, y: f.oy + f.uy * u + f.vy * v });
  const seen = new Set();
  const put = (n, f, wall) => {
    if (seen.has(n.id)) return;
    seen.add(n.id);
    n.f = f;
    n.wall = wall;
    n.at = (u, v) => at(f, u, v);
    n.kids.forEach((k) => {
      if (k.corner.at === "end") {
        // rog na koncu rodzica: dziecko rusza z rogu i skreca w strone pokoju
        const o = at(f, n.len, 0);
        put(k, { ox: o.x, oy: o.y, ux: -f.uy, uy: f.ux, vx: -f.vy, vy: f.vx }, wall + 1);
      } else {
        // rog na poczatku rodzica: dziecko konczy sie w rogu, wiec cofamy o jego dlugosc
        const o = at(f, 0, 0);
        const ux = f.uy, uy = -f.ux;
        put(k, { ox: o.x - ux * k.len, oy: o.y - uy * k.len, ux, uy, vx: f.vy, vy: -f.vx }, wall - 1);
      }
    });
  };
  const base = { ox: 0, oy: 0, ux: 1, uy: 0, vx: 0, vy: 1 };
  [...info.values()].filter((n) => !n.corner && !n.dolny).forEach((n) => put(n, base, 0));
  // gorny ciag dostaje ramke i numer sciany swojego dolnego
  info.forEach((n) => {
    if (!n.dolny || !seen.has(n.dolny.id) || seen.has(n.id)) return;
    seen.add(n.id);
    n.f = n.dolny.f;
    n.wall = n.dolny.wall;
    n.at = (u, v) => at(n.f, u, v);
  });
  // ciag ocalaly z zapetlonego naroznika i tak trzeba gdzies postawic
  info.forEach((n) => put(n, base, 0));

  /* Rozwiniecie elewacji: kazda sciana dostaje swoj pas, ciag gorny i dolny tej
     samej sciany trafiaja na siebie, bo maja ten sam numer sciany. */
  const wallLen = new Map();
  info.forEach((n) => wallLen.set(n.wall, Math.max(wallLen.get(n.wall) || 0, n.len)));
  const keys = [...wallLen.keys()].sort((a, b) => a - b);
  let ex = 0;
  const exOf = new Map();
  keys.forEach((k, i) => {
    exOf.set(k, ex);
    ex += wallLen.get(k) + (i < keys.length - 1 ? WALL_SEP : 0);
  });
  info.forEach((n) => { n.ex = exOf.get(n.wall); });

  /* Rzut rysuje tez sciane na jej wpisana dlugosc — kadr musi ja objac, z ktorej
     strony ciagu by nie wypadla. */
  const pts = [...info.values()].flatMap((n) => {
    const sc = scianaZasieg(n, n.run.wallW);
    return [[0, 0], [n.len, 0], [0, n.depth + n.front], [n.len, n.depth + n.front],
      [sc.u0, 0], [sc.u1, 0]]
      .map(([u, v]) => n.at(u, v));
  });
  return {
    info,
    corners: [...info.values()].some((n) => n.corner),
