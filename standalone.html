                    <MiniBtn onClick={() => removeObstacle(oi)} title="Usuń element">×</MiniBtn>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <Field label="Szerokość">
                      <Num value={ob.w ?? 80} onChange={(v) => setObstacle(oi, { w: v })} />
                    </Field>
                    <Field label="Głębokość">
                      <Num value={ob.d ?? 80} onChange={(v) => setObstacle(oi, { d: v })} />
                    </Field>
                  </div>
                  <Field label="Liczone od boku">
                    <Seg value={ob.side === "left" ? "left" : "right"}
                      onChange={(v) => setObstacle(oi, { side: v })}
                      options={[{ v: "left", l: "Od lewej" }, { v: "right", l: "Od prawej" }]} />
                  </Field>
                  <div className="grid grid-cols-2 gap-3">
                    <Field label={ob.side === "left" ? "Od lewego boku" : "Od prawego boku"}
                      hint="od zewnętrznej krawędzi szafki">
                      <Num value={ob.fromSide ?? 0} onChange={(v) => setObstacle(oi, { fromSide: v })} />
                    </Field>
                    <Field label="Od tyłu" hint="od tylnej płaszczyzny">
                      <Num value={ob.fromBack ?? 0} onChange={(v) => setObstacle(oi, { fromBack: v })} />
                    </Field>
                  </div>
                  {g && (
                    <div className="rounded bg-stone-50 px-3 py-2 font-mono text-xs text-stone-600">
                      od lewej: {fmt(g.distLeft)} mm &nbsp;·&nbsp; od prawej: {fmt(g.distRight)} mm
                    </div>
                  )}
                  <Check checked={ob.fullHeight !== false}
                    onChange={(v) => setObstacle(oi, { fullHeight: v })}
                    label="Na całą wysokość szafki" />
                  {ob.fullHeight === false && (
                    <div className="grid grid-cols-2 gap-3">
                      <Field label="Od dna">
                        <Num value={ob.fromBottom ?? 0} onChange={(v) => setObstacle(oi, { fromBottom: v })} />
                      </Field>
                      <Field label="Wysokość bryły">
                        <Num value={ob.h ?? 0} onChange={(v) => setObstacle(oi, { h: v })} />
                      </Field>
                    </div>
                  )}
                  <Check checked={!!ob.mask} onChange={(v) => setObstacle(oi, { mask: v })}
                    label="Zabuduj element (odgrodź od wnętrza)" />
                  {ob.mask && (
                    <>
                      <Field label="Typ zabudowy" hint={g?.maskChosen
                        ? `Program wybrał: ${g.maskChosen === "U" ? "U (trzy ścianki)" : "L (dwie ścianki)"}`
                        : "Auto dobiera L w narożniku, U przy ścianie lub w środku."}>
                        <Seg value={ob.maskType || "auto"}
                          onChange={(v) => setObstacle(oi, { maskType: v })}
                          options={[{ v: "auto", l: "Auto" }, { v: "L", l: "L" }, { v: "U", l: "U" }]} />
                      </Field>
                      {g?.shelfAbove != null && (
                        <>
                          <Check checked={!!ob.maskToShelf}
                            onChange={(v) => setObstacle(oi, { maskToShelf: v })}

                            options={[{ v: "over", l: "Przed bokami" }, { v: "between", l: "Między bokami" }]} />

                        <Field label="Który bok widoczny" hint="jeden bok musi zachodzić na drugi">
                          <Seg value={ob.maskCorner === "horizontal" ? "horizontal" : "vertical"}
                            onChange={(v) => setObstacle(oi, { maskCorner: v })}
                            options={[{ v: "vertical", l: "Boczna" }, { v: "horizontal", l: "Czołowa" }]} />
                        </Field>
                      )}
                    </>
                  )}
                </div>
              );
            })}
            <p className="text-xs text-stone-500">
              Odległości liczone od zewnętrznych krawędzi szafki, tak samo jak przy wycięciu
              narożnika. Przy 0 i 0 bryła siada w narożniku i skraca bok oraz plecy dokładnie
              tak jak wycięcie.
            </p>
          </Card>

          <Card title="Cokół" collapsible defaultOpen={false}>
            <Check checked={cab.plinth.on} onChange={(v) => set({ plinth: { ...cab.plinth, on: v } })} label="Cokół pod szafką" />
            {cab.plinth.on && (
              <div className="space-y-3">
                <Field label="Montaż" hint={!(geo.botL === "between" && geo.botR === "between")

                </Field>

                  <Field label="Wysokość">
                    <Num value={cab.plinth.height} onChange={(v) => set({ plinth: { ...cab.plinth, height: v } })} />
                  </Field>

                  </Field>
                </div>
              </div>

          </Card>

          <Card title="Nóżki" collapsible defaultOpen={false}>
            <Check checked={!!cab.legs?.on}
              onChange={(v) => set({ legs: { ...(cab.legs || { height: 100 }), on: v } })}
              label="Nóżki pod szafką" />
            {cab.legs?.on && (
              <>
              <Field label="Kształt nóżki">
                <Seg value={legRound(cab) ? "round" : "box"}

                    <button key={hex} title={nazwa}
                      onClick={() => set({ legs: { ...(cab.legs || {}), color: hex } })}
                      className={"h-6 w-6 rounded border transition-transform hover:scale-110 " +
                        (legColorOf(cab).toLowerCase() === hex.toLowerCase()
                          ? "border-teal-700 ring-1 ring-teal-700"
                          : "border-stone-300")}
                      style={{ background: hex }} />

                  <input type="color" value={legColorOf(cab)}
                    onChange={(e) => set({ legs: { ...(cab.legs || {}), color: e.target.value } })}

                </div>

            {cab.legs?.on && (
              <Field label="Wysokość nóżki"
                hint={`Całkowita wysokość z podstawą: ${fmt(cab.H + Math.max(geo.legBelow, cab.plinth.on && !geo.plinthInBody ? geo.plinthH : 0))} mm`
                  + (geo.plinthInBody && geo.legH > 0
                    ? ` — nóżki mieszczą się w świetle cokołu (${fmt(geo.plinthH)} mm)`
                    : "")}>
                <Num value={cab.legs.height ?? 100}
                  onChange={(v) => set({ legs: { ...cab.legs, height: v } })} />
              </Field>
            )}
            {cab.legs?.on && (
              <Field label="Liczba nóżek"
                hint={`Puste = z szerokości: para na róg, a od 900 mm dochodzi para pośrodku `
                  + `(tutaj ${autoLegs(geo.W)} szt.). Parzysta rozkłada się w dwóch rzędach po równo, `

                <AutoNum value={cab.legs.count ?? ""} placeholder={fmt(autoLegs(geo.W))}
                  fixed={Number(cab.legs.count) > 0}
                  onChange={(v) => set({ legs: { ...cab.legs,
                    count: v === "" || v == null ? null : Math.max(2, Math.round(Number(v) || 0)) } })} />
              </Field>

          </Card>

          <Card title="Montaż półek i zawieszenie" collapsible defaultOpen={false}>
            <Field label="Półki w kolumnach"
              hint={mocowaniePolek(cab) === "confirmat"

                      <th className="py-2 pr-3 font-medium">Produkt</th>
                      <th className="py-2 pr-3 font-medium">Specyfikacja</th>
                      <th className="py-2 text-right font-medium">Ilość</th>
                    </tr>
                  </thead>
                  <tbody>
                    {projectHardware.map((h, i) => (
                      <tr key={i} className="border-b border-stone-100">
                        <td className="py-2 pr-3">{h.name}</td>
                        <td className="py-2 pr-3 font-mono text-xs text-stone-500">{h.spec}</td>
                        <td className="py-2 text-right font-mono">{hwQty(h)} {hwUnit(h)}{hwNote(h)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </Card>
          )}

          {/* wycena na koncu, pod produktami calego projektu (uzytkownik 2026-09-29) */}
          <Card title="Wycena" collapsible defaultOpen={false}
            right={
              !cutPlan ? (
                <button onClick={() => makeCutPlan(zCaloscia ? "project" : "cab")}
                  title="Rozkrój liczy się sam po każdej zmianie formatek — tu otwierasz rysunek arkuszy"
                  className="text-xs text-teal-700 hover:underline">
                  Pokaż rozkrój
                </button>
              ) : null
            }>
            {roomsOf(project).length > 1 && (
              <p className="text-xs font-medium text-stone-600">
                {zamTylkoPokoj
                  ? `Zakres: tylko pomieszczenie „${roomName(project, pokoj)}” — przełącznik „Zamówienie” na pasku pomieszczeń.`
                  : `Zakres: cały projekt (${roomsOf(project).length} ${plural(roomsOf(project).length, "pomieszczenie", "pomieszczenia", "pomieszczeń")}) — jedno zamówienie.`}
              </p>
            )}
            <p className="text-xs text-stone-500">
              Wszystkie ceny są <strong>brutto</strong>. Płyta i formatowanie liczone są od
              arkusza — rozkrój przelicza się sam sekundę (przy ponad {ROZKROJ_DUZY} szafkach — 5 sekund) po każdej zmianie formatek albo
              płyty (także jej koloru — to inne arkusze); lustro, uchwyty czy zawiasy go
              nie ruszają. Obrzeże, oklejanie i okucia wyliczają się od razu. Puste pole bierze cenę domyślną (szara podpowiedź w polu);
              wpisz 0, jeśli pozycja ma nie liczyć się do sumy. Ceny zapisują się razem
              z projektem.
            </p>
            <p className="text-xs text-stone-500">
              Obrzeże liczone jest do 1 mm z zapasem 9 cm na każdy oklejany bok (oklejarka
              wypuszcza okleinę z przodu i z tyłu), a usługę oklejania rozkrojownia liczy od
              tej okleiny za każdy <strong>rozpoczęty</strong> metr.
            </p>
            {!planSheets && (
              <p className="rounded border border-stone-200 bg-stone-50 px-2 py-1 text-xs text-stone-500">
                Przeliczam rozkrój — płyta i cięcie pojawią się w wycenie za chwilę.
              </p>
            )}
            <div className="overflow-x-auto">
              <table className="w-full min-w-[520px] text-sm">
                <thead>
                  <tr className="border-b border-stone-200 text-left text-xs uppercase tracking-wider text-stone-500">
                    <th className="py-2 pr-3 font-medium">Pozycja</th>
                    <th className="py-2 pr-3 text-right font-medium">Ilość</th>
                    <th className="py-2 pr-3 text-right font-medium">Cena jedn. brutto</th>
                    <th className="py-2 text-right font-medium">Wartość</th>
                  </tr>
                </thead>
                <tbody>
                  {quote.rows.map((r) => (
                    <tr key={r.key} className="border-b border-stone-100">
                      <td className="py-1.5 pr-3">
                        {r.label}
                        {r.spec && <span className="block font-mono text-[11px] text-stone-400">{r.spec}</span>}
                      </td>
                      <td className="py-1.5 pr-3 text-right font-mono">{qtyFmt(r.qty)} {r.unit}</td>
                      <td className="py-1.5 pr-3 text-right">
                        <input type="number" min={0} step="0.01"
                          value={prices[r.key] ?? ""}
                          placeholder={r.def ? String(r.def) : "0"}
                          title={r.def
                            ? `Cena domyślna: ${zl(r.def)} zł brutto. Wpisz swoją albo 0, żeby wyzerować pozycję.`
                            : "Wpisz cenę jednostkową brutto"}
                          onChange={(e) => setPrice(r.key, e.target.value)}
                          className="w-24 rounded border border-stone-300 bg-white px-1.5 py-1 text-right font-mono text-xs focus:border-teal-600 focus:outline-none" />
                      </td>
                      <td className="py-1.5 text-right font-mono">
                        {r.price ? zl(r.qty * r.price) : "—"}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="flex items-baseline justify-between border-t border-stone-200 pt-3">
              <span className="text-xs uppercase tracking-wider text-stone-500">Razem</span>
              <span className="font-mono text-lg">{zl(quote.sum)} zł brutto</span>
            </div>
          </Card>

        </div>
      </main>

      {printing && <PrintReport project={project} />}

      {confirmNew && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 p-4"
          onClick={() => setConfirmNew(false)}>
          <div className="w-full max-w-sm rounded-lg bg-white p-4 shadow-xl"
            onClick={(e) => e.stopPropagation()}>
            <h3 className="mb-2 text-sm font-semibold text-stone-800">Zacząć nowy projekt?</h3>
            <p className="mb-4 text-xs text-stone-500">
              Bieżący projekt zostanie wyczyszczony. Można go przywrócić przyciskiem Cofnij.
            </p>
            <div className="flex justify-end gap-2">
              <button onClick={() => setConfirmNew(false)}
                className="rounded px-3 py-1.5 text-sm text-stone-600 hover:bg-stone-100">Anuluj</button>
              <button onClick={() => {
                  replaceProject(newProject());
                  setSaved("nowy projekt"); setConfirmNew(false);
                }}
                className="rounded bg-teal-700 px-3 py-1.5 text-sm font-medium text-white hover:bg-teal-800">
                Tak, nowy projekt
              </button>
            </div>
          </div>
        </div>
      )}

      {/* usuwanie pomieszczenia — zawsze z pytaniem (uzytkownik 2026-09-29) */}
      {usuwanyPokoj && (() => {
        const u = usuwanyPokoj;
        const nazwa = roomName(project, u.id) || "Pomieszczenie";
        const szafek = itemsInRoom(project, u.id).length;
        const ciagow = runsInRoom(project, u.id).filter((r) => r.tier !== "gorny").length;
        const inne = roomsOf(project).filter((r) => r.id !== u.id);
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 p-4"
            onClick={() => setUsuwanyPokoj(null)}>
            <div className="w-full max-w-md rounded-lg bg-white p-4 shadow-xl" data-okno="usun-pokoj"
              onClick={(e) => e.stopPropagation()}>
              <h3 className="mb-2 text-sm font-semibold text-stone-800">Usunąć „{nazwa}”?</h3>
              <p className="mb-3 text-xs text-stone-500">
                W nim {szafek} {plural(szafek, "szafka", "szafki", "szafek")}
                {ciagow ? ` i ${ciagow} ${plural(ciagow, "ściana", "ściany", "ścian")}` : ""}. Co z nimi zrobić?
                Wszystko da się przywrócić przyciskiem Cofnij.
              </p>
              <div className="mb-3 flex flex-wrap items-center gap-2 rounded border border-stone-200 p-2">
                <span className="text-xs text-stone-600">Przenieś do</span>
                <select value={u.cel} onChange={(e) => setUsuwanyPokoj({ ...u, cel: e.target.value })}
                  aria-label="Pomieszczenie docelowe"
                  className="rounded border border-stone-300 bg-white px-2 py-1 text-sm text-stone-900 focus:border-teal-600 focus:outline-none">
                  {inne.map((r) => <option key={r.id} value={r.id}>{r.name}</option>)}
                </select>
                <button onClick={() => { deleteRoom(u.id, u.cel); setUsuwanyPokoj(null); }}
                  className="ml-auto rounded bg-teal-700 px-3 py-1.5 text-sm font-medium text-white hover:bg-teal-800">
                  Przenieś i usuń pomieszczenie
                </button>
              </div>
              <div className="flex justify-end gap-2">
                <button onClick={() => setUsuwanyPokoj(null)}
                  className="rounded px-3 py-1.5 text-sm text-stone-600 hover:bg-stone-100">Anuluj</button>
                <button onClick={() => { deleteRoom(u.id, null); setUsuwanyPokoj(null); }}
                  className="rounded border border-red-300 px-3 py-1.5 text-sm font-medium text-red-700 hover:bg-red-50">
                  Usuń razem z szafkami
                </button>
              </div>
            </div>
          </div>
        );
      })()}

      {kreator && (() => {
        const k = kreator;
        const zm = (patch) => setKreator((c) => ({ ...c, ...patch }));
        const nazwaOf = (dolneCiagi.find((r) => r.id === k.of) || {}).name || "";
        const pole = "w-full rounded border border-stone-300 bg-white px-2 py-1.5 text-sm text-stone-900 focus:border-teal-600 focus:outline-none";
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 p-4"
            onClick={() => setKreator(null)}>
            <div className="w-full max-w-lg space-y-3 rounded-lg bg-white p-4 shadow-xl" data-el="kreator-rogu"
              onClick={(e) => e.stopPropagation()}>
              <h3 className="text-sm font-semibold text-stone-800">Nowy ciąg</h3>
              <Seg value={k.rog ? "rog" : "osobno"} onChange={(v) => zm({ rog: v === "rog" })}
                options={[{ v: "rog", l: "Pod kątem prostym (narożnik)" }, { v: "osobno", l: "Osobny ciąg" }]} />
              {k.rog && (
                <div className="space-y-2">
                  <label className="block">
                    <span className="mb-1 block text-[11px] text-stone-400">Do którego ciągu</span>
                    <select value={k.of} onChange={(e) => zm({ of: e.target.value })} className={pole}>
                      {dolneCiagi.map((r) => <option key={r.id} value={r.id}>{r.name}</option>)}
                    </select>
                  </label>
                  <Seg value={k.at} onChange={(v) => zm({ at: v })}
                    options={[{ v: "end", l: `Za „${nazwaOf}”` }, { v: "start", l: `Przed „${nazwaOf}”` }]} />
                  <Seg value={k.owner} onChange={(v) => zm({ owner: v })}
                    options={[{ v: "self", l: "Nowy ciąg w róg" }, { v: "of", l: `„${nazwaOf}” w róg` }]} />
                  <label className="block">
                    <span className="mb-1 block text-[11px] text-stone-400">Szafka w rogu</span>
                    <select value={k.szafka} onChange={(e) => zm({ szafka: e.target.value,
                      W: e.target.value === "L" ? CORNER_L_W : (k.W === CORNER_L_W ? 1000 : k.W) })} className={pole}>
                      <option value="slepa">ślepa z fixem — fix na zasłoniętą część, jedne drzwi</option>
                      <option value="L">w L z ramieniem na drugą ścianę</option>
                      <option value="brak">bez szafki (dołożę sam)</option>
                    </select>
                  </label>
                  {k.szafka !== "brak" && (
                    <div className="flex gap-2">
                      <label className="block flex-1">
                        <span className="mb-1 block text-[11px] text-stone-400">Szerokość szafki</span>
                        <Num value={k.W} min={MIN_COL} onChange={(v) => zm({ W: Math.round(Number(v) || 0) })} />
                      </label>
                      {k.szafka === "L" && (
                        <label className="block flex-1">
                          <span className="mb-1 block text-[11px] text-stone-400">Ramię</span>
                          <Num value={k.arm} min={0} onChange={(v) => zm({ arm: Math.round(Number(v) || 0) })} />
                        </label>
                      )}
                    </div>
                  )}
                  {k.szafka !== "L" && (
                    <label className="block">
                      <span className="mb-1 block text-[11px] text-stone-400">Wstawka w rogu</span>
                      <select value={k.wstawka || ""} onChange={(e) => zm({ wstawka: e.target.value || null })} className={pole}>
                        <option value="">brak</option>
                        <option value="plaska">płaska — grubość płyty, na wkręty</option>
                        <option value="szeroka">szeroka — 60 mm licem, na trójkąty</option>
                      </select>
                    </label>
                  )}
                  <label className="block">
                    <span className="mb-1 block text-[11px] text-stone-400">Blat przez róg</span>
                    <select value={k.top || ""} onChange={(e) => zm({ top: e.target.value || null })} className={pole}>
                      <option value="">jak szafki (przechodzi ciąg, który wjeżdża w róg)</option>
                      <option value="of">{`przechodzi „${nazwaOf}”`}</option>
                      <option value="self">przechodzi nowy ciąg</option>
                    </select>
                  </label>
                </div>
              )}
              <div className="flex justify-end gap-2 pt-1">
                <button onClick={() => setKreator(null)}
                  className="rounded border border-stone-300 px-3 py-1.5 text-xs text-stone-600 hover:bg-stone-50">Anuluj</button>
                <button onClick={utworzZKreatora}
                  className="rounded bg-teal-700 px-3 py-1.5 text-xs font-medium text-white hover:bg-teal-800">Utwórz ciąg</button>
              </div>
            </div>
          </div>
        );
      })()}
      {transfer && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 p-4"
          onClick={() => setTransfer(null)}>
          <div className="w-full max-w-2xl rounded-lg bg-white p-4 shadow-xl"
            onClick={(e) => e.stopPropagation()}>
            <h3 className="mb-2 text-sm font-semibold text-stone-800">
              {transfer.mode === "export" ? "Kopia projektu" : "Wklej projekt"}
            </h3>
            <p className="mb-2 text-xs text-stone-500">
              {transfer.mode === "export"
                ? "Zaznacz i skopiuj poniższy tekst, wklej go do pliku tekstowego albo notatki. Tak zachowasz projekt niezależnie od przeglądarki."
                : "Wklej tutaj wcześniej skopiowany tekst projektu."}
            </p>
            <textarea
              readOnly={transfer.mode === "export"}
              value={transfer.text}
              onChange={(e) => setTransfer({ ...transfer, text: e.target.value })}
              onFocus={(e) => transfer.mode === "export" && e.target.select()}
              className="h-64 w-full rounded border border-stone-300 p-2 font-mono text-[11px] focus:border-teal-600 focus:outline-none" />
            <div className="mt-3 flex justify-end gap-2">
              <button onClick={() => setTransfer(null)}
                className="rounded px-3 py-1.5 text-sm text-stone-600 hover:bg-stone-100">Zamknij</button>
              {transfer.mode === "export" ? (
                <button
                  onClick={async () => {
                    try { await navigator.clipboard.writeText(transfer.text); setSaved("skopiowano do schowka"); }
                    catch { setSaved("zaznacz tekst i skopiuj ręcznie"); }
                  }}
                  className="rounded bg-teal-700 px-3 py-1.5 text-sm font-medium text-white hover:bg-teal-800">
                  Kopiuj do schowka
                </button>
              ) : (
                <button onClick={() => applyImportText(transfer.text)}
                  className="rounded bg-teal-700 px-3 py-1.5 text-sm font-medium text-white hover:bg-teal-800">
                  Wczytaj projekt
                </button>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
</script>
    <script>
      (function bootStandalonePreview() {
        const root = document.getElementById("root");

        function escapeHtml(value) {
          return String(value).replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
        }

        function showError(error) {
          root.innerHTML = `
            <main style="padding:24px;font-family:system-ui,sans-serif;max-width:900px;margin:auto">
              <h1 style="font-size:24px;font-weight:700;color:#991b1b">Nie udało się uruchomić podglądu</h1>
              <p>Ten plik działa po pobraniu na komputer i otwarciu w przeglądarce. Wymaga dostępu do CDN dla React, Babel i Tailwind.</p>
              <pre style="margin-top:16px;background:#fee2e2;color:#7f1d1d;padding:12px;border-radius:8px;white-space:pre-wrap">${escapeHtml(error && (error.stack || error.message || error))}</pre>
            </main>`;
        }

        try {
          const source = document.getElementById("app-source").textContent;
          const previewSource = source
            .replace(/import React, \{([^}]+)\} from ["']react["'];/, "const {$1} = React;")
            .replace(/export default function App\s*\(/, "function App(")
            + `\n\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));`;

          const compiled = Babel.transform(previewSource, {
            presets: [["react", { runtime: "classic" }]],
            filename: "szafki.jsx",
          }).code;

          new Function("React", "ReactDOM", compiled)(React, ReactDOM);
        } catch (error) {
          showError(error);
        }
      })();
    </script>
  </body>
</html>
