    out.kolor = out.kolor || kolorOf(rt2);
    const gs = wallGapOf(arm.other.run, null);
    const plecy = fo.depth - arm.depth;                   // plecy ramienia od sciany
    const v0 = Math.max(0, gs.bottom - gs.top) - plecy;
    worktopSpans(rt2).forEach((sp) => {
      const a0 = Math.max(arm.u0, fo.lead + sp.x0), a1 = Math.min(arm.u0 + arm.len, fo.lead + sp.x1);
      if (a1 <= a0) return;
      // „od rogu": przy ramieniu wychodzacym od konca ciagu rog jest na poczatku pasa
      const [u0, u1] = arm.outerAtEnd ? [a0 - arm.u0, a1 - arm.u0]
        : [arm.u0 + arm.len - a1, arm.u0 + arm.len - a0];
      out.ramie.push({ u0, u1, v0, v1: v0 + rt2.depth });
    });
  }
  return out.kolor ? out : null;
};

function TopView({ cab, geo, mat: matIn, showDims, showShelves, showHardware, arm, blat, wstawki }) {
  const mat = texMat(matIn, cab.texture, cab.textureDir);
  const shc = shelfColorOf(cab, mat);
  const { D } = cab;
  const W = geo.W;
  const pad = 160;
  // patrzymy z gory: X = szerokosc, Y (w dol na ekranie) = glebokosc, przod u dolu
  const frontExtra = cab.frontMode === "overlay" ? geo.tf : 0;
  const tOvL = geo.isBlat ? geo.blat.overL : 0;
  const tOvR = geo.isBlat ? geo.blat.overR : 0;
  const tOvF = geo.isBlat ? geo.blat.overFront : 0;
  const tOvB = geo.isBlat ? geo.blat.overBack : 0;
  /* Szafka narozna nie konczy sie na korpusie — ramie idzie w bok wzdluz drugiej
     sciany i rysunek musi je objac, inaczej widac tylko kawalek mebla. */
  const armLen = arm ? arm.len + geo.tf : 0;
  // po stronie ramienia ida jeszcze dwa wymiary: samo ramie i calosc z nim
  const armDimL = arm && arm.side === "left" && showDims ? 240 : 0;
  const armDimR = arm && arm.side !== "left" && showDims ? 240 : 0;
  const vb = `${-pad - tOvL - armDimL} ${-pad - tOvB} ${W + tOvL + tOvR + 2 * pad + 120 + armDimL + armDimR} ${D + tOvB + tOvF + 2 * pad + 100 + frontExtra + armLen}`;
  const bf = mat.board.color;
  const t = geo.t;
  const cd = geo.carcassDepth;

  return (
    <svg viewBox={vb} className="w-full h-auto" style={{ maxHeight: DRAW_MAX_H }}>
      <GrainDefs mat={matIn} on={cab.texture} dir={cab.textureDir} />
      {/* obrys korpusu z gory */}
      <rect x="0" y="0" width={W} height={cd} fill="#fafaf9" stroke={LINE} strokeWidth="1.5" />
      {/* wstawka w rogu: przy boku, konczy sie w licu drzwi */}
      {wstawkiSzafki(wstawki, geo).map((w, i) => (
        <rect key={"ws" + i} data-el="wstawka" x={w.x0} y={cd + frontExtra - w.gl} width={w.x1 - w.x0} height={w.gl}
          fill={mat.front.color} stroke={INK} strokeWidth="1.5" />
      ))}
      {/* Ramie szafki naroznej: biegnie wzdluz drugiej sciany, wiec w ukladzie
          tej szafki idzie w bok od jej lica. `v` to glebokosc ramienia od tamtej
          sciany, `u` — dlugosc liczona od lica korpusu. */}
      {arm && (() => {
        const left = arm.side === "left";
        const ax = (v, szer) => (left ? v : W - v - szer);
        const ay = (u) => cd + u;
        const vLico = arm.depth;
        return (
          <g>
            <rect x={ax(0, arm.depth)} y={ay(0)} width={arm.depth} height={arm.len}
              fill="#fafaf9" stroke={LINE} strokeWidth="1.5" />
            {/* bok zamykajacy ramie na wolnym koncu */}
            <rect x={ax(arm.depth - armKorpus(arm), armKorpus(arm))} y={ay(arm.len - t)} width={armKorpus(arm)} height={t}
              fill={bf} stroke={INK} strokeWidth="2" />
            {/* plecy i wzmocnienia — te same, co w rzucie calej zabudowy */}
            {(() => {
              const ap = armPlan(arm, true);
              const pas = (r, fill, op) => (
                <rect x={ax(r.v0, r.v1 - r.v0)} y={ay(r.u0)}
                  width={r.v1 - r.v0} height={r.u1 - r.u0}
                  fill={fill} stroke={INK} strokeWidth="1.5" opacity={op} />
              );
              return (
                <>
                  {ap.back && pas(ap.back, ap.back.plyta ? bf : mat.back.color, 1)}
                  {ap.rails.map((r, k) => (
                    <g key={"awz" + k}>{pas(r, bf, 0.55)}</g>
                  ))}
                </>
              );
            })()}
            {/* front ramienia zaczyna sie za katownikiem i luzem, a na wolnym
                koncu zachodzi na bok ramienia — bez luzu stal z nim rowno */}
            {(() => {
              const fp = armFrontPlan(arm);
              return (
                <rect x={ax(cab.frontMode === "inset" ? vLico - geo.tf : vLico, geo.tf)}
                  y={ay(fp.odRogu)} width={geo.tf} height={fp.w}
                  fill={mat.front.color} stroke={INK} strokeWidth="2" />
              );
            })()}
            {bracketPlan(arm, true).map((r, k) => (
              <rect key={"kat" + k} x={ax(r.v, r.h)} y={ay(r.u)} width={r.h} height={r.w}
                fill={r.front ? mat.front.color : bf} stroke={INK} strokeWidth="2" />
            ))}
            {/* Uchwyt i zawias frontu ramienia — uchwyt po stronie rogu przed
                licem, zawias przy wolnym koncu na wewnetrznym licu boku. */}
            {showHardware && arm.doors !== "fix" && (() => {
              const fp = armFrontPlan(arm);
              const uch = handleOutOf(cab);
              const lico = cab.frontMode === "inset" ? vLico : vLico + geo.tf;
              return (
                <g>
                  {uch > 0 && <rect x={ax(lico, uch)} y={ay(fp.odRogu + UCHWYT_OD_KRAWEDZI - 6)} width={uch} height={12}
                    fill="#3f3f46" stroke={INK} strokeWidth="1" />}
                  <rect x={ax(vLico - HINGE_D, HINGE_D)} y={ay(arm.len - t - 12)} width={HINGE_D} height={12}
                    rx="3" fill="#71717a" fillOpacity="0.8" stroke={INK} strokeWidth="1.2" />
                </g>
              );
            })()}
            {/* Nozki ramienia pod dnem (przerywane) — te same miejsca co
                w zamowieniu; `u` od rogu, `v` od sciany ramienia. */}
            {showHardware && cab.legs && cab.legs.on && (() => {
              const lp = armLegPlan(arm);
              return lp.us.flatMap((u) => lp.vs.map((v) => (
                <rect key={`anog${u}-${v}`} x={ax(v, lp.w)} y={ay(u)} width={lp.w} height={lp.w}
                  rx={legRound(cab) ? lp.w / 2 : 0} fill="none" stroke={INK}
                  strokeWidth="1.5" strokeDasharray="6 4" opacity="0.7" />
              )));
            })()}
          </g>
        );
      })()}
      {/* boki — skrocone przy narozniku z wycieciem/elementem */}
      {geo.postSide !== "left" && (
        <rect x="0" y={geo.cornerCut?.sideLeftDepth || 0} width={t}
          height={cd - (geo.cornerCut?.sideLeftDepth || 0)} fill={bf} stroke={INK} strokeWidth="2" />
      )}
      {geo.postSide !== "right" && (
        <rect x={W - t} y={geo.cornerCut?.sideRightDepth || 0} width={t}
          height={cd - (geo.cornerCut?.sideRightDepth || 0)} fill={bf} stroke={INK} strokeWidth="2" />
      )}
      {/* wzmocnienie tylne szafki w L (A albo B) — zastepuje bok od strony ramienia */}
      {(geo.postRects || []).map((q) => (
        <rect key={"post-" + q.nazwa} x={q.x0} y={q.v0} width={q.x1 - q.x0} height={q.v1 - q.v0}
          fill={shc} stroke={INK} strokeWidth="2" />
      ))}
      {/* wieniec widoczny z gory jako plyta na calej glebokosci */}
      {geo.hasTop && (
        <rect x={geo.topX0} y={geo.isBlat ? -tOvB : 0}
          width={geo.topX1 - geo.topX0}
          height={geo.isBlat ? geo.blatDepth : cd}
          fill={bf} stroke={INK}
          strokeWidth={geo.isBlat ? 2 : 1}
          opacity={geo.isBlat ? 0.45 : 0.25} />
      )}
      {/* elementy wzmacniajace z gory (y=0 tyl; glebokosc od tylu = cd - z0 - zLen) */}
      {geo.levels.flatMap((lv) => lv.cols.flatMap((c) => (c.rails || []).map((r, ri) => (
        <rect key={`trail${lv.i}-${c.j}-${ri}`}
          x={r.x0} y={cd - (r.z0 + r.zLen)} width={r.x1 - r.x0} height={r.zLen}
          fill={bf} stroke={INK} strokeWidth="1.5" opacity="0.55" />
      ))))}

      {/* polki widziane z gory — obrys glebokosci polki w kolumnach, ktore je maja */}
      {showShelves &&
        (geo.levels[0]?.cols || []).map((c) => {
          if (c.kind === "drawers" || c.kind === "blenda") return null;
          const n = (c.shelves || []).length;
          if (!n) return null;
          return (
            <g key={"sh" + c.j}>
              {polkaCzesci(c, cd - geo.shelfBack - (c.shD ?? geo.shelfDepth), cd - geo.shelfBack, cd).map(([x0, z0, x1, z1], k) => (
                <rect key={k} x={x0} y={cd - z1} width={x1 - x0} height={z1 - z0}
                  fill={shc} fillOpacity="0.35"
                  stroke={INK} strokeWidth="1.5" strokeDasharray="9 6" />
              ))}
              <text x={(c.x0 + c.x1) / 2} y={geo.shelfBack + geo.shelfDepth - 14}
                textAnchor="middle" fontSize="17" fill={INK} opacity="0.75"
                fontFamily="ui-monospace, monospace">
                {n} {n === 1 ? "półka" : "półki"} {fmt(c.shW ?? c.w)}×{fmt(c.shD ?? geo.shelfDepth)}
              </text>
            </g>
          );
        })}

      {/* przegrody pionowe */}
      {geo.dividers.map((d, i) => (
        <rect key={"dv" + i} x={d.x} y={geo.backIntrusion} width={t}
          height={geo.dividerDepth} fill={bf} stroke={INK} strokeWidth="2" />
      ))}

      {/* fronty widziane z gory jako cienki pas przy przedniej krawedzi */}
      {(() => {
        // bierzemy dolny poziom jako reprezentatywny (z gory widac tylko przednia plaszczyzne)
        const cols = geo.levels[0]?.cols || [];
        const ffc = cab.realColors && cab.frontSameAsBoard !== false ? mat.board.color : mat.front.color;
        /* Szafka narozna ma front tylko tam, gdzie nie wchodzi ramie — dalej lico
           jest otwarte i prowadzi w ramie. Pas ciagniety przez cala szerokosc
           rysowal tam sciane, ktorej nie ma. Przy samym rogu konczy sie jeszcze
           wczesniej: tam stoi maskownica katownika i drzwi na nia nie wchodza —
           z gory wygladalo to, jakby front nachodzil na wspornik. */
        const maskK = arm && arm.bracket ? arm.bracket.odKorpusu - arm.bracket.luz : 0;
        const licoOd = arm ? (arm.side === "right" ? 0 : W - arm.free + maskK) : 0;
        const licoDo = arm ? (arm.side === "right" ? arm.free - maskK : W) : W;
        return cols.map((c) => {
          if (!c.count) return null;
          const isDrawer = c.kind === "drawers";
          // kolumna szuflad ma wlasny montaz frontu — wpuszczony siedzi w
          // swietle korpusu, rowno z bokiem i przegroda, a nie na nich
          const cMode = isDrawer ? c.drawerMode || cab.frontMode : cab.frontMode;
          const z0 = cMode === "overlay" ? cd : cd - geo.tf;
          const dr0 = isDrawer && c.drawers?.length ? c.drawers[0] : null;
          const x0 = dr0 ? dr0.x : c.frontX0 ?? c.x0;
          const x1 = dr0 ? dr0.x + dr0.w : c.frontX1 ?? c.x1;
          // skrzynka: bierzemy najglebsze NL sposrod szuflad w kolumnie (rzeczywisty zasieg)
          const nl = isDrawer && c.drawers?.length
            ? Math.max(...c.drawers.map((d) => d.nl || 0))
            : c.nl || 0;
          /* Skrzynka stoi w swietle kolumny, nie na szerokosc frontu (ten zachodzi
             na boki) — tak jak w bryle 3D: od boku o 4 mm, cofnieta o setback
             prowadnicy. Wczesniej obrys wchodzil w boki korpusu (audyt 2D). */
          const sb = dr0?.rail?.setback || 0;
          const boxFront = cd - sb;
          const boxBack = Math.max(geo.backIntrusion, cd - sb - nl);
          const skX0 = c.x0 + 4;
          const skX1 = c.x0 + (dr0?.skrzynka?.LW ?? (c.x1 - c.x0)) - 4;
          return (
            <g key={"fr" + c.j}>
              {Math.min(x1, licoDo) > Math.max(x0, licoOd) && (
                <rect x={Math.max(x0, licoOd)} y={z0}
                  width={Math.min(x1, licoDo) - Math.max(x0, licoOd)} height={geo.tf}
                  fill={ffc} stroke={INK} strokeWidth="2" />
              )}
              {isDrawer && nl > 0 && (
                <>
                  <rect data-el="skrzynka-obrys" x={skX0} y={boxBack} width={skX1 - skX0}
                    height={boxFront - boxBack}
                    fill="none" stroke={LINE} strokeWidth="1" strokeDasharray="5 4" opacity="0.6" />
                  <text x={(x0 + x1) / 2} y={(boxBack + boxFront) / 2 + 6} textAnchor="middle"
                    fontSize="16" fill={LINE} fontFamily="ui-monospace, monospace">
                    NL {fmt(nl)}
                  </text>
                  {/* wolna przestrzen za szuflada, od jej konca do tylu */}
                  {boxBack - geo.backIntrusion > 1 && showDims && (
                    <DimV y1={geo.backIntrusion} y2={boxBack} x={(x0 + x1) / 2}
                      label={`${fmt(boxBack - geo.backIntrusion)}`}
                      c={WARNC} />
                  )}
                </>
              )}
            </g>
          );
        });
      })()}

      {showHardware && <TopHardware cab={cab} geo={geo} cd={cd} />}
      {/* prowadnice szuflad z gory — pas 21 mm przy kazdym boku, na glebokosc NL */}
      {showHardware && (geo.levels[0]?.cols || [])
        .filter((c) => c.kind === "drawers" && (c.drawers || []).length)
        .flatMap((c) => {
          const nl = Math.max(...c.drawers.map((d) => d.rail.d || 0));
          if (!nl) return [];
          const sb = c.drawers[0]?.rail.setback || 0;
          return [c.x0, c.x1 - RUNNER_W].map((rx, s) => (
            <rect key={`trn${c.j}-${s}`} x={rx} y={cd - sb - nl} width={RUNNER_W} height={nl}
              fill="#8b8b93" stroke={INK} strokeWidth="1.5" opacity="0.85" />
          ));
        })}

      {/* elementy stale (fix) widziane z gory — leza w plaszczyznie frontu */}
      {(() => {
        const z0 = cab.frontMode === "overlay" ? cd : cd - geo.tf;
        const ffc = cab.realColors && cab.frontSameAsBoard !== false ? mat.board.color : mat.front.color;
        const panels = [];
        geo.levels.forEach((lv) =>
          lv.cols.forEach((c) => {
            if (c.fix) panels.push({ k: `f${lv.i}-${c.j}`, x: c.fix.x, w: c.fix.w });
            if (c.topFix) panels.push({ k: `tf${lv.i}-${c.j}`, x: c.topFix.x, w: c.topFix.w });
          })
        );
        // z gory kilka poziomow nakłada się na siebie — rysujemy kazdy pas raz
        const seen = new Set();
        return panels
          .filter((p) => {
            const key = `${Math.round(p.x)}|${Math.round(p.w)}`;
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
          })
          .map((p) => (
            <g key={p.k}>
              <rect x={p.x} y={z0} width={p.w} height={geo.tf}
                fill={ffc} stroke={INK} strokeWidth="2" />
              <line x1={p.x} y1={z0} x2={p.x + p.w} y2={z0 + geo.tf}
                stroke={INK} strokeWidth="1.2" opacity="0.5" />
              <line x1={p.x} y1={z0 + geo.tf} x2={p.x + p.w} y2={z0}
                stroke={INK} strokeWidth="1.2" opacity="0.5" />
            </g>
          ));
      })()}

      {/* wsporniki pionowe przy elementach stalych — z gory widac ich glebokosc */}
      {geo.levels.flatMap((lv) =>
        lv.cols
          .filter((c) => c.support && c.fix)
          .map((c) => (
            <rect key={`tsup${lv.i}-${c.j}`}
              x={c.fix.side === "left" ? c.fix.x + c.fix.w - t : c.fix.x}
              y={cd - c.support.d} width={t} height={c.support.d}
              fill="none" stroke={INK} strokeWidth="1.5" strokeDasharray="8 6" />
          ))
      )}

      {/* plecy */}
      {cab.back !== "none" && (() => {
        const bcol = geo.backIsBoard
          ? (cab.backPos === "outside" && cab.backBoardMat !== "shelf" ? mat.board.color : (shc))
          : mat.back.color;
        // z gory: y=0 to tyl. Plecy wewnatrz siedza tuz przy tyle, na zewnatrz za korpusem
        const outside = geo.backIsBoard && geo.backPos === "outside";
        // przybijany HDF i plyta na zewnatrz siedza za korpusem (`plecyZa`)
        const py = geo.grooved ? geo.grOff - geo.tb : geo.plecyZa ? -geo.tb : outside ? -geo.tb : 0;
        const inside = geo.grooved || (geo.backIsBoard && geo.backPos === "inside");
        // HDF we frezie wchodzi w boki na szerokosc frezu minus luz — jak w bryle i formatce
        const grab = geo.grooved ? geo.grDep - geo.grPlay : 0;
        const base0 = inside ? geo.interior.x0 - grab : 1;
        const base1 = inside ? geo.interior.x1 + grab : W - 1;
        const px = Math.max(base0, geo.cornerCut?.backLeftX ?? base0);
        const px1 = Math.min(base1, geo.cornerCut?.backRightX ?? base1);
        const pw = Math.max(0, px1 - px);
        return (
          <rect x={px} y={py} width={pw} height={geo.tb}
            fill={bcol} stroke={INK} strokeWidth="2" />
        );
      })()}

      {/* wyciecie w narozniku */}
      {geo.geoCuts.map((gc, ci) => {
        const smat = shc;
        // obszar wneki we wspolrzednych widoku z gory (y = glebokosc od tyłu)
        const rx = gc.bx0;
        const ry = gc.bz0;
        const rw = gc.bx1 - gc.bx0;
        const rh = gc.bz1 - gc.bz0;
        return (
          <g key={"cut" + ci}>
            <rect x={rx} y={ry} width={rw} height={rh}
              fill={ERRC} opacity="0.15" stroke={ERRC} strokeWidth="1.5" strokeDasharray="6 4" />
            <CutMaskTop gc={gc} t={t} color={smat} />
            {showDims && (
              <>
                {/* szerokosc na zewnatrz otworu: przy tylnej scianie gdy otwor z tyłu, inaczej przy licu */}
                <DimH x1={rx} x2={rx + rw}
                  y={gc.onBack ? ry - 22 : ry + rh + 22}
                  label={`${fmt(gc.cw)}`} above={gc.onBack} c={ERRC} />
                {/* glebokosc na zewnatrz otworu: po stronie boku szafki */}
                <DimV y1={ry} y2={ry + rh}
                  x={gc.onLeft ? rx - 22 : rx + rw + 22}
                  label={`${fmt(gc.cdp)}`} left={gc.onLeft} c={ERRC} />
                {/* wolna glebokosc od czola zabudowy do lica */}
                {(() => {
                  const mt = gc.mask ? t : 0;
                  const zEnd = gc.bz1 + mt;
                  const free = Math.round(cd - zEnd);
                  if (free < 20) return null;
                  return (
                    <DimV y1={zEnd} y2={cd} x={(gc.bx0 + gc.bx1) / 2}
                      label={`${fmt(free)}`} left={!gc.onLeft} c={LINE} />
                  );
                })()}

              </>
            )}
          </g>
        );
      })}

      {(geo.geoObs || []).map((o, obIx) => (() => {
        return (
          <g key={"ob" + obIx}>
            <rect x={o.ox0} y={o.oz0} width={o.ow} height={o.od}
              fill="#7c3aed" opacity="0.28" stroke="#6d28d9" strokeWidth="1.5" strokeDasharray="5 4" />
            <ObsMaskTop o={o} t={t} W={W} color={shc} />
            <text x={o.ox0 + o.ow / 2} y={o.oz0 + o.od / 2 + 6} textAnchor="middle"
              fontSize="18" fill="#6d28d9" fontFamily="ui-monospace, monospace">
              {fmt(o.ow)}×{fmt(o.od)}
            </text>
            {showDims && (() => {
              // bryla w narozniku wchodzi w plyte boku — wtedy mierzymy od krawedzi szafki
              const cols = geo.levels[0]?.cols || [];
              const host = cols.find((c) => o.ox0 >= c.x0 - 1 && o.ox1 <= c.x1 + 1);
              // bryla przy boku wchodzi w plyte, wiec nie miesci sie w zadnej
              // kolumnie — do wymiaru wolnej glebokosci wystarczy ta, ktora
              // zachodzi, inaczej zabudowa zostawala bez zwymiarowania
              const hostAny = host || cols.find((c) => Math.min(c.x1, o.ox1) - Math.max(c.x0, o.ox0) > 0);
              const colX0 = host ? host.x0 : 0;
              const colX1 = host ? host.x1 : W;
              const dL = Math.round(o.ox0 - colX0);
              const dR = Math.round(colX1 - o.ox1);
              return (
                <>
                  {/* glebokosc od tylu do bryly */}
                  {o.oz0 > 0 && !o.mask && (
                    <DimV y1={0} y2={o.oz0} x={o.ox0 - 18}
                      label={`${fmt(o.oz0)}`} c="#6d28d9" />
                  )}
                  {/* glebokosc od przodu (lica) do bryly — tylko gdy nie ma zabudowy,
                      bo przy zabudowie mierzymy przestrzen od jej czola */}
                  {cd - o.oz1 > 0 && !o.mask && (
                    <DimV y1={o.oz1} y2={cd} x={o.ox1 + 18}
                      label={`${fmt(cd - o.oz1)}`} left={false} c="#6d28d9" />
                  )}
                  {/* odleglosci w obrebie kolumny, tuz pod bryla */}
                  {dL > 1 && !o.mask && (
                    <DimH x1={colX0} x2={o.ox0} y={o.oz1 + 46}
                      label={`${fmt(dL)}`} above={false} c="#6d28d9" />
                  )}
                  {dR > 1 && !o.mask && (
                    <DimH x1={o.ox1} x2={colX1} y={o.oz1 + 46}
                      label={`${fmt(dR)}`} above={false} c="#6d28d9" />
                  )}
                  {/* wolna przestrzen po zabudowie — tylko w kolumnach z polkami */}
                  {hostAny && hostAny.kind !== "drawers" && o.mask && (() => {
                    const gb = o;
                    const wallL = gb.touchLeft ? hostAny.x0 : o.ox0 - geo.t;
                    const wallR = gb.touchRight ? hostAny.x1 : o.ox1 + geo.t;
                    const myEnd = o.oz1 + (o.mask ? geo.t : 0);
                    const frontFree = Math.round(cd - myEnd);
                    return (
                      <>
                        {frontFree > 1 && (
                          <DimV y1={myEnd} y2={cd} x={(o.ox0 + o.ox1) / 2}
                            label={`${fmt(frontFree)}`}
                            left={(o.ox0 + o.ox1) / 2 > W / 2} c={LINE} />
                        )}
                      </>
                    );
                  })()}
                </>
              );
            })()}
          </g>
        );
      })())}

      {/* swiatla miedzy przeszkodami — liczone raz, na kazdym pasmie glebokosci */}
      {showDims && (() => {
        const cols = geo.levels[0]?.cols || [];
        const blockers = [];
        geo.geoCuts.forEach((gc) => {
          const mt = gc.mask ? t : 0;
          blockers.push({
            l: gc.onLeft ? gc.bx0 : gc.bx0 - mt,
            r: gc.onLeft ? gc.bx1 + mt : gc.bx1,
            end: gc.bz1 + mt,
          });
        });
        (geo.geoObs || []).forEach((q) => {
          const mt = q.mask ? t : 0;
          blockers.push({
            l: q.ox0 - (q.touchLeft ? 0 : mt),
            r: q.ox1 + (q.touchRight ? 0 : mt),
            end: q.oz1 + mt,
          });
        });
        if (!blockers.length) return null;
        const edges = [0, ...new Set(blockers.map((b) => Math.round(b.end)))].sort((a, b) => a - b);
        const bands = edges.map((z, i) => [z, i + 1 < edges.length ? edges[i + 1] : cd]);
        const drawn = new Set();
        const out = [];
        bands.forEach(([za, zb]) => {
          if (zb - za < 12) return;
          const act = blockers.filter((b) => b.end > za + 1);
          cols.forEach((col) => {
            if (col.kind === "drawers") return;
            const inCol = act
              .filter((b) => b.r > col.x0 + 1 && b.l < col.x1 - 1)
              .sort((a, b) => a.l - b.l);
            if (!inCol.length) return;
            let cur = col.x0;
            const segs = [];
            inCol.forEach((b) => {
              if (b.l - cur > 1) segs.push([cur, b.l]);
              cur = Math.max(cur, b.r);
            });
            if (col.x1 - cur > 1) segs.push([cur, col.x1]);
            segs.forEach(([sa, sb]) => {
              const val = Math.round(sb - sa);
              if (val < 20) return;
              const key = `${col.j}|${Math.round(sa)}|${Math.round(sb)}`;
              if (drawn.has(key)) return;
              drawn.add(key);
              out.push(
                <DimH key={"lw" + key} x1={sa} x2={sb} y={za + 16}
                  label={`${fmt(val)}`} above={false} c={LINE} />
              );
            });
          });
        });
        return out;
      })()}

      {showDims && (
        <>
          <DimH x1={0} x2={W} y={-50} label={`${fmt(W)}`} />
          <DimV y1={0} y2={cd} x={-50} label={`${fmt(cd)}`} />
          {/* szerokosci swiatla kolumn dolnego poziomu */}
          {(geo.levels[0]?.cols || []).length > 1 &&
            geo.levels[0].cols.map((c) => (
              <DimH key={"cw" + c.j} x1={c.x0} x2={c.x1} y={cd + 90}
                label={`${fmt(c.w)}`} above={false}
                c={c.w < MIN_COL ? WARNC : DIMC} />
            ))}
          {/* glebokosc uzytkowa: swiatlo miedzy pleckami a licem */}
          <DimV y1={geo.backIntrusion} y2={cd} x={W + 55}
            label={`${fmt(cd - geo.backIntrusion)}`} left={false} c={DIMC} />
          {/* glebokosc polki, jesli krotsza niz swiatlo */}
          {geo.shelfDepth < cd - geo.backIntrusion && (
            <DimV y1={geo.shelfBack} y2={geo.shelfBack + geo.shelfDepth} x={W + 115}
              label={`półka ${fmt(geo.shelfDepth)}`} left={false} c={LINE} />
          )}
        </>
      )}
      {/* Blat ciagu nad szafka (i nad ramieniem) — przezroczysty, na wierzchu,
          tak jak w rzucie zabudowy. */}
      {blat && (
        <g data-el="blat-szafki">
          {blat.korpus.map((r, i) => (
            <rect key={"bk" + i} x={r.x} y={r.y} width={r.w} height={r.h}
              fill={blat.kolor} opacity="0.35" stroke={INK} strokeWidth="2" />
          ))}
          {arm && blat.ramie.map((r, i) => (
            <rect key={"br" + i} x={arm.side === "left" ? r.v0 : W - r.v1} y={cd + r.u0}
              width={r.v1 - r.v0} height={r.u1 - r.u0}
              fill={blat.kolor} opacity="0.35" stroke={INK} strokeWidth="2" />
          ))}
        </g>
      )}
      {showDims && arm && (
        <text x={arm.side === "left" ? arm.depth / 2 : W - arm.depth / 2} y={cd + arm.len / 2}
          textAnchor="middle" fontSize="22" fill={ACC} fontFamily="ui-monospace, monospace">
          ramię {fmt(arm.len)}
        </text>
      )}
      {/* Wymiary wzdluz sciany ramienia: samo ramie (od lica korpusu) i cala
          szafka w L od tylu korpusu do konca ramienia — to jest dlugosc, ktora
          szafka zajmuje przy drugiej scianie. */}
      {showDims && arm && (() => {
        const left = arm.side === "left";
        const x1 = left ? -50 : W + 55;
        const x2 = left ? -250 : W + 245;
        return (
          <g data-el="wymiary-ramienia">
            <DimV y1={cd} y2={cd + arm.len} x={x1} left={left} label={`ramię ${fmt(arm.len)}`} />
            <DimV y1={0} y2={cd + arm.len} x={x2} left={left} label={`${fmt(cd + arm.len)} z ramieniem`} />
          </g>
        );
      })()}

      {/* podpis pod calym rysunkiem — przy szafce w L pod ramieniem */}
      <text x={W / 2} y={cd + 150 + (arm ? arm.len : 0)} textAnchor="middle" fontSize="22" fill={LINE}
        fontFamily="ui-monospace, monospace">widok z góry — tył u góry, przód u dołu</text>
    </svg>
  );
}

function SideView({ cab, geo, mat: matIn, showDims, which, showHardware, wallGap, wstawki }) {
  const mat = texMat(matIn, cab.texture, cab.textureDir);
  const shc = shelfColorOf(cab, mat);
  const sideRight = which === "right";
  const { H, D } = cab;
  const pad = 160;
  const rightExtra = cab.frontMode === "overlay" ? geo.tf : 0;
  const below = Math.max(
    geo.legBelow,
    cab.plinth.on && !geo.plinthInBody ? geo.plinthH : 0
  );
  const sOvF = geo.isBlat ? geo.blat.overFront : 0;
  const sOvB = geo.isBlat ? geo.blat.overBack : 0;
  const fy = (y) => H - y;
  const bf = mat.board.color;
  const cd = geo.carcassDepth;
  const xC = D - cd; // tyl po lewej
  /* Sciana za szafka w ciagu — takze przy odstepie 0, zeby bylo widac, do czego
     szafka dostaje. Przy odstepie pokazuje, skad wziela sie pusta przestrzen za
     plecami: pionowa przy rownym odstepie, pochyla, gdy przy podlodze jest inny
     niz pod blatem. Szafka wolnostojaca sciany nie ma — nie wiadomo, gdzie jest.
     Tyl korpusu to plecy nakladane z zewnatrz albo sam bok. */
  const xTyl = xC - (geo.plecyZa || 0);
  const sciana = wallGap ? (() => {
    const yPodloga = H + below, yBlat = 0;
    const xD = xTyl - wallGap.bottom, xG = xTyl - wallGap.top;
    // przedluzamy linie sciany o 60 mm ponad blat, z tym samym pochyleniem
    const nad = 60;
    const xN = xG + (xG - xD) * nad / yPodloga;
    return { xD, xG, xN, yPodloga, yBlat, yN: -nad };
  })() : null;
  // wymiar wysokosci idzie wtedy za sciane, zeby na nia nie wchodzil
  const xWysokosc = sciana ? Math.min(sciana.xD, sciana.xN) - SCIANA_GR - 60 : -50;
  const lewo = Math.min(-pad - sOvB, xWysokosc - 110);
  const vb = `${lewo} ${-pad - 70} ${D + sOvF + pad + rightExtra - lewo} ${H + 2 * pad + 70 + below}`;
  const hasFront = geo.levels.some((lv) => lv.cols.some((c) => c.count > 0));
  // przod korpusu jest przy x=D; front nakladany wystaje o tf, wpuszczany jest w licu
  const frontFace = cab.frontMode === "overlay" ? D + geo.tf : D;

  // polki przelotowe sa konstrukcyjne (plyta korpusu), polki w kolumnach moga
  // byc z cienszej plyty — rysujemy je wiec osobno, kazda swoja gruboscia
  const allShelves = [
    ...geo.sepShelves.map((s) => ({ y: s.y, th: geo.t, d: geo.shelfDepth })),
    ...geo.levels.flatMap((lv) => lv.cols.flatMap((c) => c.shelves.map((s) => ({ y: s.y, th: geo.ts, d: c.shD ?? geo.shelfDepth })))),
  ];

  return (
    <svg viewBox={vb} className="w-full h-auto" style={{ maxHeight: DRAW_MAX_H }}>
      <GrainDefs mat={matIn} on={cab.texture} dir={cab.textureDir} />
      {sciana && <ScianaDefs />}
      <rect x="0" y="0" width={D} height={H} fill="#fafaf9" stroke={LINE} strokeWidth="1.5" strokeDasharray="8 8" />
      {sciana && (
        <g data-el="sciana">
          <polygon points={`${sciana.xN},${sciana.yN} ${sciana.xD},${sciana.yPodloga} `
            + `${sciana.xD - SCIANA_GR},${sciana.yPodloga} ${sciana.xN - SCIANA_GR},${sciana.yN}`}
            fill="url(#sciana-kreski)" />
          <line x1={sciana.xN} y1={sciana.yN} x2={sciana.xD} y2={sciana.yPodloga}
            stroke={INK} strokeWidth="3" />
          <line x1={sciana.xD - 60} y1={sciana.yPodloga} x2={xTyl + 60} y2={sciana.yPodloga}
            stroke={INK} strokeWidth="1.5" opacity="0.6" />
          <text x={sciana.xN - SCIANA_GR / 2} y={sciana.yN - 12} fontSize="20" fill={INK} opacity="0.8"
            textAnchor="middle" fontFamily="ui-monospace, monospace">ściana</text>
          {(wallGap.bottom > 0 || wallGap.top > 0) && [{ y: sciana.yPodloga - 14, x: sciana.xD, g: wallGap.bottom },
            { y: 26, x: sciana.xG, g: wallGap.top }].map((o, i) => (
            <text key={i} x={o.x - 8} y={o.y} fontSize="20" fill={INK} textAnchor="end"
              fontFamily="ui-monospace, monospace">{`↔ ${fmt(o.g)}`}</text>
          ))}
        </g>
      )}
      {(() => {
        const cut = (sideRight ? geo.cornerCut?.sideRightDepth : geo.cornerCut?.sideLeftDepth) || 0;
        return (
          <rect x={xC + cut} y="0" width={cd - cut} height={H}
            fill={bf} stroke={INK} strokeWidth="2" opacity="0.35" />
        );
      })()}
      <rect x={geo.isBlat ? xC - sOvB : xC} y="0"
        width={geo.isBlat ? geo.blatDepth : cd} height={geo.t}
        fill={bf} stroke={INK} strokeWidth="2" />
      <rect x={xC} y={fy(geo.bottomY + geo.t)} width={cd} height={geo.t} fill={bf} stroke={INK} strokeWidth="2" />

      {cab.plinth.on && geo.plinthInBody && (
        <rect x={D - geo.t - (cab.plinth.setback || 0)} y={fy(geo.plinthH)}
          width={geo.t} height={geo.plinthH} fill={bf} stroke={INK} strokeWidth="2" />
      )}
      {/* Cokol pod korpusem to plyta przy licu (cofnieta o `setback`), nie
          klocek na cala glebokosc — z boku widac jej krawedz, jak w bryle 3D. */}
      {cab.plinth.on && !geo.plinthInBody && (
        <rect x={D - geo.t - (cab.plinth.setback || 0)} y={H} width={geo.t} height={geo.plinthH}
          fill={bf} stroke={INK} strokeWidth="2" opacity="0.75" />
      )}
      {cab.legs?.on && (
        <>
          <rect x={xC + 40} y={H - geo.legTop} width={40} height={geo.legH}
            rx={legRound(cab) ? 20 : 0} fill={legColorOf(cab)} stroke={INK} strokeWidth="2"
            opacity={geo.legTop > 0 ? 0.5 : 1} />
          <rect x={xC + cd - 80} y={H - geo.legTop} width={40} height={geo.legH}
            rx={legRound(cab) ? 20 : 0} fill={legColorOf(cab)} stroke={INK} strokeWidth="2"
            opacity={geo.legTop > 0 ? 0.5 : 1} />
        </>
      )}

      {allShelves.map((s, i) => (
        <rect key={i} x={xC + geo.shelfBack} y={fy(s.y + s.th)}
          width={s.d} height={s.th} fill={bf} stroke={INK} strokeWidth="2" />
      ))}

      {/* wsporniki pionowe przy elementach stalych */}
      {geo.levels.flatMap((lv) =>
        lv.cols
          .filter((c) => c.support)
          .map((c) => (
            <rect key={`sup${lv.i}-${c.j}`} x={D - c.support.d} y={fy(lv.y1)}
              width={c.support.d} height={lv.h} fill="none" stroke={INK}
              strokeWidth="1.5" strokeDasharray="8 6" />
          ))
      )}

      {cab.back !== "none" && (() => {
        const bcol = geo.backIsBoard
          ? (cab.backPos === "outside" && cab.backBoardMat !== "shelf" ? mat.board.color : (shc))
          : mat.back.color;
        /* tyl po lewej (xC). Plyta wewnatrz przy xC; HDF przybijany i plyta na
           zewnatrz za korpusem (`plecyZa`) — HDF przybijany stal tu wczesniej
           w korpusie, choc w bryle i rzucie z gory jest za nim (audyt 2D). */
        const px = geo.grooved
          ? xC + geo.grOff - geo.tb
          : geo.plecyZa
          ? xC - geo.plecyZa
          : xC;
        // HDF we frezie ma wysokosc swiatla plus to, co wchodzi we frez w wiencu i dnie
        const grab = geo.grooved ? geo.grDep - geo.grPlay : 0;
        const py = geo.backIsBoard && geo.backPos === "inside" ? fy(geo.interior.y1)
          : geo.grooved ? fy(geo.interior.y1 + grab) : 0;
        const ph = geo.backIsBoard && geo.backPos === "inside" ? geo.innerH
          : geo.grooved ? geo.innerH + 2 * grab : H;
        return (
          <rect x={px} y={py} width={geo.tb} height={ph}
            fill={bcol} stroke={INK} strokeWidth="2" />
        );
      })()}

      {geo.levels
        .filter((lv) => lv.cols.some((c) => c.count > 0))
        .map((lv) => (
          <rect key={lv.i} x={cab.frontMode === "overlay" ? D : D - geo.tf}
            y={fy(lv.frontHi)} width={geo.tf} height={Math.max(0, lv.frontHi - lv.frontLo)}
            fill={cab.realColors && cab.frontSameAsBoard !== false ? mat.board.color : mat.front.color} stroke={INK} strokeWidth="2" />
        ))}

      {/* Uchwyty wystaja przed fronty, wiec z boku widac je wszystkie — ten sam
          obrys co w bryle (`uchwytObrys`), wysuniecie z `uchwytOut`. */}
      {geo.doors.filter((d) => d.handle && d.w > 0 && d.h > 0).map((d) => {
        const ob = uchwytObrys(d);
        const out = uchwytOut(d, cab);
        if (!(out > 0)) return null;
        return (
          <rect key={`uch${d.key}`} data-el="uchwyt-bok-widok" x={frontFace} y={fy(ob.y1)}
            width={out} height={ob.y1 - ob.y0} rx="3" fill="#52525b" opacity="0.9" />
        );
      })}

      {/* prowadnice szuflad z boku — tylko kolumna przylegajaca do ogladanego
          boku; dalsze zaslania przegroda */}
      {/* Skrzynka szuflady przy tym boku — kontur (bok metalowy albo wyzszy tyl)
          i dno. Te same wymiary co formatki dna i tylu szuflady. */}
      {geo.levels.flatMap((lv) => lv.cols.flatMap((c, j) =>
        (c.kind === "drawers" && (sideRight ? j === lv.cols.length - 1 : j === 0) ? c.drawers || [] : [])
          .filter((dr) => dr.skrzynka)
          .map((dr) => {
            const sk = dr.skrzynka;
            const x0 = D - (dr.rail.setback || 0) - sk.nl;
            const dnoY = dr.rail.y0 + 12;
            const tylOd = sk.tylOd || 0;
            const hS = Math.max(sk.bok, tylOd + sk.tyl[1]);
            return (
              <g key={`skr${lv.i}-${j}-${dr.i}`} data-el="skrzynka">
                <rect x={x0} y={fy(dr.rail.y0 + hS)} width={sk.nl} height={hS}
                  fill="none" stroke={INK} strokeWidth="1.5" strokeDasharray="10 6" opacity="0.6" />
                <rect x={x0 + 2 + geo.t} y={fy(dnoY + geo.t)} width={sk.dno[1]} height={geo.t}
                  fill={bf} stroke={INK} strokeWidth="1" opacity="0.7" />
                {/* tyl szuflady na koncu bokow od strony plecow korpusu (x0), od
                    `tylOd` nad dolem boku — dno dochodzi do niego (instrukcja V-BOX) */}
                <rect x={x0 + 2} y={fy(dr.rail.y0 + tylOd + sk.tyl[1])} width={geo.t} height={sk.tyl[1]}
                  fill={bf} stroke={INK} strokeWidth="1" opacity="0.7" />
              </g>
            );
          })))}
      {showHardware && (() => {
        const seen = new Set();
        const out = [];
        geo.levels.forEach((lv) =>
          lv.cols.forEach((c, j) =>
            (c.kind === "drawers" && (sideRight ? j === lv.cols.length - 1 : j === 0)
              ? c.drawers || []
              : []
            ).forEach((dr) => {
              const k = `${Math.round(dr.rail.y0)}|${dr.rail.h}|${dr.rail.d}`;
              if (seen.has(k) || !dr.rail.d) return;
              seen.add(k);
              const rx0 = D - (dr.rail.setback || 0) - dr.rail.d;
              out.push(
                <g key={`srn${k}`}>
                  <rect x={rx0} y={fy(dr.rail.y0 + dr.rail.h)}
                    width={dr.rail.d} height={dr.rail.h}
                    fill="#8b8b93" fillOpacity="0.45" stroke={INK} strokeWidth="1.5" />
                  <text x={rx0 + 12} y={fy(dr.rail.y0 + dr.rail.h / 2) + 6}
                    fontSize="18" fill={INK} opacity="0.75" fontFamily="ui-monospace, monospace">
                    prowadnica NL {fmt(dr.rail.d)} / bok {fmt(dr.rail.h)}
                  </text>
                </g>
              );
            })
          )
        );
        return out;
      })()}

      {/* zawiasy z boku — tylko te przy ogladanym boku; zawiasy z dalszych
          kolumn albo z drugiej strony zaslania przegroda */}
      {showHardware && (() => {
        const seen = new Set();
        const out = [];
        geo.doors
          .filter((d) =>
            sideRight
              ? d.colLast && d.hingeSide === "right"
              : d.colJ === 0 && d.hingeSide === "left"
          )
          .forEach((d) =>
          (d.hingePts || []).forEach((hy) => {
            const k = Math.round(hy);
            if (seen.has(k)) return;
            seen.add(k);
            out.push(
              <g key={`shg${k}`}>
                <rect x={D - HINGE_D} y={fy(hy + HINGE_H / 2)} width={HINGE_D} height={HINGE_H}
                  rx="3" fill="#71717a" fillOpacity="0.8" stroke={INK} strokeWidth="1.5" />
                <line x1={D - HINGE_D} y1={fy(hy)} x2={D} y2={fy(hy)}
                  stroke="#fafaf9" strokeWidth="1.5" opacity="0.8" />
              </g>
            );
          })
        );
        return out;
      })()}

      {/* elementy stale (fix) — z boku widac ich zasieg na wysokosci */}
      {(() => {
        const fxx = cab.frontMode === "overlay" ? D : D - geo.tf;
        const ffc = cab.realColors && cab.frontSameAsBoard !== false ? mat.board.color : mat.front.color;
        const panels = [];
        geo.levels.forEach((lv) =>
          lv.cols.forEach((c) => {
            if (c.fix) panels.push({ k: `sf${lv.i}-${c.j}`, y: c.fix.y, h: c.fix.h });
            if (c.topFix) panels.push({ k: `stf${lv.i}-${c.j}`, y: c.topFix.y, h: c.topFix.h });
          })
        );
        const seen = new Set();
        return panels
          .filter((p) => {
            const key = `${Math.round(p.y)}|${Math.round(p.h)}`;
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
          })
          .map((p) => (
            <g key={p.k}>
              <rect x={fxx} y={fy(p.y + p.h)} width={geo.tf} height={p.h}
                fill={ffc} stroke={INK} strokeWidth="2" />
              <line x1={fxx} y1={fy(p.y + p.h)} x2={fxx + geo.tf} y2={fy(p.y)}
                stroke={INK} strokeWidth="1.2" opacity="0.5" />
              <line x1={fxx} y1={fy(p.y)} x2={fxx + geo.tf} y2={fy(p.y + p.h)}
                stroke={INK} strokeWidth="1.2" opacity="0.5" />
              <text x={fxx + geo.tf + 14} y={fy(p.y + p.h / 2) + 7} fontSize="20"
                fill={INK} opacity="0.7" fontFamily="ui-monospace, monospace">
                fix {fmt(p.h)}
              </text>
            </g>
          ));
      })()}

      {showDims && (
        <>
          <DimH x1={0} x2={D} y={-50} label={`${fmt(D)}`} />
          {hasFront && (
            <DimH x1={0} x2={frontFace} y={-110} label={`z drzwiami ${fmt(frontFace)}`} c={LINE} />
          )}
          <DimH x1={xC} x2={xC + geo.shelfDepth} y={H + 70} label={`półka ${fmt(geo.shelfDepth)}`} above={false} />
          <DimV y1={0} y2={H} x={xWysokosc} label={`${fmt(H)}`} />
        </>
      )}
      {geo.geoCuts.filter((gc) => gc.onBack && (gc.onLeft !== sideRight)).map((gc, ci) => (
        <g key={"cut" + ci}>
          {/* obszar wyciecia od tylu (tyl po lewej, x=xC) */}
          <rect x={xC} y={fy(gc.cy1)} width={gc.cdp} height={gc.cutH}
            fill={ERRC} opacity="0.14" stroke={ERRC} strokeWidth="1.5" strokeDasharray="6 4" />
          {/* maskownica pozioma zamyka wneke */}
          {gc.mask && (
            <rect x={xC + gc.cdp - geo.t} y={fy(gc.cy1)} width={geo.t} height={gc.cutH}
              fill={shc} stroke={INK} strokeWidth="2" opacity="0.9" />
          )}
        </g>
      ))}
      {/* elementy kolizyjne — widoczne w przekroju boku */}
      {(geo.geoObs || []).map((o, oi) => {
        const near = sideRight ? o.touchRight : o.touchLeft; // przy pokazywanym boku
        return (
          <g key={"sob" + oi} opacity={near ? 1 : 0.45}>
            <rect x={xC + o.oz0} y={fy(o.oy1)} width={o.od} height={o.oy1 - o.oy0}
              fill="#7c3aed" opacity="0.3" stroke="#6d28d9" strokeWidth="1.5" strokeDasharray="5 4" />
            {o.mask && !o.touchFront && (
              <rect x={xC + o.oz1} y={fy(o.maskTop ?? o.oy1)} width={geo.t} height={(o.maskTop ?? o.oy1) - o.oy0}
                fill={shc} stroke={INK} strokeWidth="2" />
            )}
            {o.mask && !o.touchBack && (
              <rect x={xC + o.oz0 - geo.t} y={fy(o.maskTop ?? o.oy1)} width={geo.t} height={(o.maskTop ?? o.oy1) - o.oy0}
                fill={shc} stroke={INK} strokeWidth="2" />
            )}
          </g>
        );
      })}

      {/* elementy wzmacniajace z boku (x = xC + glebokosc od tylu; tyl po lewej) */}
      {geo.levels.flatMap((lv) => lv.cols.flatMap((c) => (c.rails || []).map((r, ri) => (
        <rect key={`srail${lv.i}-${c.j}-${ri}`}
          x={xC + cd - (r.z0 + r.zLen)} y={fy(r.y1)} width={r.zLen} height={r.y1 - r.y0}
          fill={r.orient === "vertical" ? (shc) : bf}
          stroke={INK} strokeWidth="1.5" opacity="0.6" />
      ))))}
      <text x={D / 2} y={H + 125} textAnchor="middle" fontSize="22" fill={LINE}
        fontFamily="ui-monospace, monospace">{sideRight ? "prawy bok" : "lewy bok"} — tył po lewej, przód po prawej</text>
      {/* wstawka w rogu stoi na zewnatrz tego boku, w licu drzwi — zaslania
          jego przednie `gl` mm na cala wysokosc korpusu */}
      {wstawkiSzafki(wstawki, geo).filter((w) => w.lewa !== sideRight).map((w, k) => (
        <rect key={"ws" + k} data-el="wstawka" x={frontFace - w.gl} y={fy(w.H)} width={w.gl} height={w.H}
          fill={mat.front.color} stroke={INK} strokeWidth="2" opacity="0.9" />
      ))}
    </svg>
  );
}

/* ---------- widok 3D ---------- */

const VERTS = (x0, y0, z0, x1, y1, z1) => [
  { x: x0, y: y0, z: z0 }, { x: x1, y: y0, z: z0 },
  { x: x1, y: y1, z: z0 }, { x: x0, y: y1, z: z0 },
  { x: x0, y: y0, z: z1 }, { x: x1, y: y0, z: z1 },
  { x: x1, y: y1, z: z1 }, { x: x0, y: y1, z: z1 },
];
const QUADS = [
  [0, 1, 2, 3], [5, 4, 7, 6], [4, 0, 3, 7],
  [1, 5, 6, 2], [3, 2, 6, 7], [4, 5, 1, 0],
];

/* Plecy w bryle 3D — jedna zasada dla szafki i dla zabudowy, ta sama co
   w widoku z tylu i w formatkach. Uklad szafki: z = 0 to przod korpusu,
   `cd` jego tyl. HDF przybijane: na tyle korpusu, 1 mm luzu z kazdej strony;
   HDF we frezie: w bokach, `grOff` od tylu; plyta na zewnatrz: caly tyl, za
   korpusem; plyta wewnatrz: miedzy bokami, wiencem i dnem. Wczesniej zabudowa
   wstawiala kazde plecy na cala szerokosc w ostatnie mm korpusu — wchodzily
   w boki, dno i polki, a plecy z plyty wewnatrz mialy zly wymiar. */
/* Skrzynka szuflady (Sevroll V-BOX) w bryle 3D po otwarciu: boki metalowe na
   prowadnicach, dno i tyl z plyty — te same wymiary co formatki szuflady.
   Uklad szafki: z = 0 to przod korpusu (rosnie w glab), `zFront` to tylna
   plaszczyzna frontu szuflady po wysunieciu. Zwraca liste bryl
   [x0, y0, z0, x1, y1, z1, rodzaj]. Wczesniej po otwarciu widac bylo sam
   front — dna i tylu szuflady nie bylo na zadnym rysunku (audyt 2026-09-28). */
const skrzynkaBryly = (d, t, zFront) => {
  const sk = d.dr && d.dr.skrzynka;
  if (!sk) return [];
  const x0 = d.colX0, x1 = d.colX0 + sk.LW;
  const y0 = d.dr.rail.y0;
  const z0 = zFront + (d.dr.rail.setback || 0), z1 = z0 + sk.nl;
  const bokW = 13;          // bok metalowy V-BOX, stoi na prowadnicy przy boku korpusu
  const dnoY = y0 + 12;     // dno wpuszczone w bok nad szyna
  const xm = (x0 + x1) / 2;
  const [dA, dB] = sk.dno, [tA, tH] = sk.tyl;
  return [
    [x0 + 4, y0, z0, x0 + 4 + bokW, y0 + sk.bok, z1 - 2, "metal"],
    [x1 - 4 - bokW, y0, z0, x1 - 4, y0 + sk.bok, z1 - 2, "metal"],
    /* Wg instrukcji V-BOX: tyl na koncu bokow, od `tylOd` nad dolem boku
       (standardowy konczy sie rowno z gora boku), dno dochodzi do tylu. Wczesniej
       tyl stal na dnie i przy gornej szufladzie wchodzil w wieniec. */
    [xm - dA / 2, dnoY, z1 - 2 - t - dB, xm + dA / 2, dnoY + t, z1 - 2 - t, "dno"],
    [xm - tA / 2, y0 + (sk.tylOd || 0), z1 - 2 - t, xm + tA / 2, y0 + (sk.tylOd || 0) + tH, z1 - 2, "tyl"],
  ];
};

const plecyBryla = (cab, geo) => {
  if (cab.back === "none") return null;
  const cd = geo.carcassDepth, W = geo.W, H = cab.H;
  let x0, x1, y0, y1, z0;
  if (cab.back === "board") {
    const wew = geo.backPos !== "outside";
    x0 = wew ? geo.interior.x0 : 0; x1 = wew ? geo.interior.x1 : W;
    y0 = wew ? geo.interior.y0 : 0; y1 = wew ? geo.interior.y1 : H;
    z0 = wew ? cd - geo.tb : cd;
  } else if (geo.grooved) {
    const grab = geo.grDep - geo.grPlay;
    x0 = geo.interior.x0 - grab; x1 = geo.interior.x1 + grab;
    y0 = geo.interior.y0 - grab; y1 = geo.interior.y1 + grab;
    z0 = cd - geo.grOff;
  } else {
    x0 = 1; x1 = W - 1; y0 = 1; y1 = H - 1; z0 = cd;
  }
  x0 = Math.max(x0, geo.cornerCut?.backLeftX ?? x0);
  x1 = Math.min(x1, geo.cornerCut?.backRightX ?? x1);
  return { x0, y0, z0, x1, y1, z1: z0 + geo.tb };
};

const rotAboutY = (p, ang, ox, oz) => {
  const c = Math.cos(ang), s2 = Math.sin(ang);
  const dx = p.x - ox, dz = p.z - oz;
  return { x: ox + dx * c - dz * s2, y: p.y, z: oz + dx * s2 + dz * c };
};
/* Obrot wokol osi poziomej (krawedz zawiasow klapy). Dodatni kat podnosi
   dolna krawedz do przodu i w gore (klapa do gory, os na gorze), ujemny
   opuszcza gorna do przodu i w dol (klapa opadana, os na dole). */
const rotAboutX = (p, ang, oy, oz) => {
  const c = Math.cos(ang), s2 = Math.sin(ang);
  const dy = p.y - oy, dz = p.z - oz;
  return { x: p.x, y: oy + dy * c - dz * s2, z: oz + dy * s2 + dz * c };
};
// klapa otwarta w bryle: do gory do poziomu, opadana troche ponizej
const klapaObrot = (d, angle, oz) => {
  const ang = (Math.min(90, angle) * Math.PI) / 180;
  return d.klapa === "gora"
    ? (p) => rotAboutX(p, ang, d.y + d.h, oz)
    : (p) => rotAboutX(p, -ang, d.y, oz);
};
// uchwyt klapy lezy poziomo przy wolnej krawedzi — jak w szufladzie, tylko
// przy klapie do gory na dole frontu
const klapaUchwytY = (d) => d.klapa === "gora"
  ? d.y + Math.min(50, d.h / 2) : d.y + d.h - Math.min(50, d.h / 2);

/* Kolejnosc rysowania bryl w rzucie 3D — wspolna dla bryly calej zabudowy
   i pojedynczej szafki. Malowanie scian po ich sredniej glebokosci mylilo sie
   przy duzych plytach: srodek blatu albo dna ramienia lezy daleko od widza,
   wiec drobny element przy jego kraju (wzmocnienie pod blatem, maskownica
   przy rogu) wychodzil na wierzch, choc jest pod nim albo za nim. Stad paski
   na blacie i ramie, ktore wygladalo, jakby nie mialo maskownicy.

   Tu ukladamy cale bryly, a nie pojedyncze sciany. Dwa prostopadlosciany,
   ktore sie nie przenikaja, zawsze rozdziela plaszczyzna prostopadla do
   ktorejs osi — i po tej osi widac wprost, ktory lezy dalej od widza. Bryly,
   ktorych rzuty na siebie nie nachodza, moga isc w dowolnej kolejnosci.
   Otwarte drzwi sa obrocone, wiec porownujemy je po ich obrysie osiowym —
   jesli nawet obrysy sie przenikaja, zostaje dawne porownanie srodkow.

   Sciany odwrocone od widza pomijamy: w bryle wypuklej nigdy ich nie widac,
   a rysowane potrafily przebic sie na wierzch sasiadki. Wyjatek to bryly
   polprzezroczyste (wyciecia, elementy kolizyjne) — tam tylna sciana jest
   czescia obrazu. */
const ulozSciany = (solids, proj) => {
  const EPS = 1; // mm — stykajace sie plyty licza sie jako rozdzielone
  const osie3 = ["x", "y", "z"];
  const zero = proj({ x: 0, y: 0, z: 0 }).D;
  // o ile rosnie glebokosc przy kroku o 1 mm wzdluz kazdej osi
  const grad = {
    x: proj({ x: 1, y: 0, z: 0 }).D - zero,
    y: proj({ x: 0, y: 1, z: 0 }).D - zero,
    z: proj({ x: 0, y: 0, z: 1 }).D - zero,
  };
  const osie = osie3.filter((k) => Math.abs(grad[k]) > 1e-9)
    .sort((a, b) => Math.abs(grad[b]) - Math.abs(grad[a]));
  /* Obrys rzutu bryly — wypukly wielokat. Porownujemy tylko bryly, ktorych
     rzuty naprawde na siebie nachodza: przy samym prostokatnym obrysie pary,
     ktore sie wcale nie zaslaniaja, dokladaly przypadkowe powiazania, te
     zamykaly sie w cykl, a przy jego lamaniu drzwi potrafily pojsc za wlasny
     uchwyt. */
  const otoczka = (pts) => {
    const p = [...pts].sort((a, b) => a.X - b.X || a.Y - b.Y);
    const kr = (o, a, b) => (a.X - o.X) * (b.Y - o.Y) - (a.Y - o.Y) * (b.X - o.X);
    const dol = [], gora = [];
    p.forEach((q) => {
      while (dol.length >= 2 && kr(dol[dol.length - 2], dol[dol.length - 1], q) <= 0) dol.pop();
      dol.push(q);
    });
    [...p].reverse().forEach((q) => {
      while (gora.length >= 2 && kr(gora[gora.length - 2], gora[gora.length - 1], q) <= 0) gora.pop();
      gora.push(q);
    });
    return dol.slice(0, -1).concat(gora.slice(0, -1));
  };
  // rozdzielenie dwoch wypuklych wielokatow wzdluz ktorejs krawedzi (twierdzenie o osi rozdzielajacej)
  const NAKLAD = 0.5;
  /* Petla bez tworzenia tablic — przy obracaniu w „3D" liczy sie to przy
     kazdym ruchu myszy dla kazdej pary nachodzacych bryl. */
  const rozdzielonePrzez = (W, P, Q) => {
    for (let i = 0; i < W.length; i++) {
      const a = W[i], b = W[(i + 1) % W.length];
      const nx = b.Y - a.Y, ny = a.X - b.X;
      const dl = Math.hypot(nx, ny);
      if (dl < 1e-9) continue;
      let p0 = Infinity, p1 = -Infinity, q0 = Infinity, q1 = -Infinity;
      for (let k = 0; k < P.length; k++) {
        const r = P[k].X * nx + P[k].Y * ny;
        if (r < p0) p0 = r;
        if (r > p1) p1 = r;
      }
      for (let k = 0; k < Q.length; k++) {
        const r = Q[k].X * nx + Q[k].Y * ny;
        if (r < q0) q0 = r;
        if (r > q1) q1 = r;
      }
      const tol = NAKLAD * dl;
      if (p1 <= q0 + tol || q1 <= p0 + tol) return true;
    }
    return false;
  };
  const rozdzielone = (P, Q) => rozdzielonePrzez(P, P, Q) || rozdzielonePrzez(Q, P, Q);
  const bryly = solids.map((sol) => {
    const pv = sol.v.map(proj);
    const lo = {}, hi = {};
    osie3.forEach((k) => {
      lo[k] = Math.min(...sol.v.map((p) => p[k]));
      hi[k] = Math.max(...sol.v.map((p) => p[k]));
    });
    const X = pv.map((p) => p.X), Y = pv.map((p) => p.Y);
    const dS = pv.reduce((s, p) => s + p.D, 0) / pv.length;
    return { sol, pv, lo, hi, dS, d: dS - (sol.bias || 0), obrys: otoczka(pv),
      x0: Math.min(...X), x1: Math.max(...X), y0: Math.min(...Y), y1: Math.max(...Y) };
  });
  const n = bryly.length;
  const po = Array.from({ length: n }, () => []);   // bryly, ktore ida po tej
  const czeka = new Array(n).fill(0);               // ile bryl musi isc przed ta
  for (let i = 0; i < n; i++) {
    const A = bryly[i];
    for (let j = i + 1; j < n; j++) {
      const B = bryly[j];
      if (A.x1 <= B.x0 + NAKLAD || B.x1 <= A.x0 + NAKLAD
        || A.y1 <= B.y0 + NAKLAD || B.y1 <= A.y0 + NAKLAD) continue;
      if (rozdzielone(A.obrys, B.obrys)) continue;
      /* Kazda os, na ktorej bryly sa rozdzielone, musi wskazac te sama: skoro
         rzuty na siebie nachodza, promien widza przechodzi przez obie i kazda
         plaszczyzna rozdzialu przecina go miedzy nimi. */
      let dalsza = -1, sprzeczne = false;
      for (const k of osie) {
        const aNizej = A.hi[k] <= B.lo[k] + EPS;
        const bNizej = B.hi[k] <= A.lo[k] + EPS;
        if (aNizej === bNizej) continue;
        // przy dodatnim gradiencie wyzsza wartosc na tej osi lezy dalej
        const nizszaDalej = grad[k] < 0;
        const ta = aNizej === nizszaDalej ? i : j;
        if (dalsza >= 0 && ta !== dalsza) sprzeczne = true;
        if (dalsza < 0) dalsza = ta;
      }
      if (sprzeczne) continue;
      /* Bryly, ktore naprawde sie przenikaja — np. plecy w ostatnich 3 mm
         glebokosci korpusu i dno siegajace do samego tylu, albo plecy wpuszczone
         we frez boku. Rozstrzyga os, na ktorej zachodza na siebie najmniej:
         to ona mowi, po ktorej stronie jest ktora plyta. Porownanie srodkow
         calych plyt dawalo z niektorych stron sprzeczne pary i cykl. */
      if (dalsza < 0) {
        let najm = Infinity;
        for (const k of osie) {
          const zakl = Math.min(A.hi[k], B.hi[k]) - Math.max(A.lo[k], B.lo[k]);
          const sA = A.lo[k] + A.hi[k], sB = B.lo[k] + B.hi[k];
          if (zakl >= najm || Math.abs(sA - sB) < 1e-6) continue;
          najm = zakl;
          const nizszaDalej = grad[k] < 0;
          dalsza = (sA < sB) === nizszaDalej ? i : j;
        }
      }
      if (dalsza < 0) dalsza = A.d >= B.d ? i : j;
      const blizsza = dalsza === i ? j : i;
      po[dalsza].push(blizsza);
      czeka[blizsza]++;
    }
  }
  /* Z gotowych do rysowania bierzemy zawsze najdalsza — kolejnosc jest wtedy
     stala. Cykl (bryly, ktore naprawde sie przenikaja) lamiemy tak samo. */
  const kolej = [];
  const gotowe = new Array(n).fill(false);
  let cykle = 0;
  for (let krok = 0; krok < n; krok++) {
    let wyb = -1;
    for (let i = 0; i < n; i++)
      if (!gotowe[i] && czeka[i] <= 0 && (wyb < 0 || bryly[i].d > bryly[wyb].d)) wyb = i;
    if (wyb < 0) {
      cykle++;
      for (let i = 0; i < n; i++)
        if (!gotowe[i] && (wyb < 0 || bryly[i].d > bryly[wyb].d)) wyb = i;
    }
    gotowe[wyb] = true;
    kolej.push(wyb);
    po[wyb].forEach((k) => { czeka[k]--; });
  }
  /* Cien zalezy od kierunku sciany, a nie od jej wielkosci na ekranie. Przy
     cieniu „od pola" waska plyta w licu (maskownica katownika) wychodzila
     ciemna jak szpara, choc stoi w tej samej plaszczyznie co drzwi obok —
     i narożnik wygladal, jakby czegos w nim brakowalo. Swiatlo idzie od widza,
     troche z gory i z boku, wiec przy obracaniu bryla nie gasnie. */
  const dl = Math.hypot(grad.x, grad.y, grad.z) || 1;
  const kam = { x: -grad.x / dl, y: -grad.y / dl, z: -grad.z / dl };
  const sw = { x: kam.x + 0.3 * kam.z, y: kam.y + 0.9, z: kam.z - 0.3 * kam.x };
  const sl = Math.hypot(sw.x, sw.y, sw.z) || 1;
  const srodek = (pts) => osie3.reduce((o, k) => ({ ...o,
    [k]: pts.reduce((s, p) => s + p[k], 0) / pts.length }), {});
  const faces = [];
  kolej.forEach((i) => {
    const { sol, pv, dS } = bryly[i];
    const sB = srodek(sol.v);
    QUADS.forEach((q) => {
      const pts = q.map((k) => pv[k]);
      const dF = pts.reduce((s, p) => s + p.D, 0) / 4;
      if ((sol.alpha ?? 1) >= 0.5 && dF >= dS - 1e-6) return;
      // normalna zewnetrzna: od srodka bryly do srodka sciany
      const sF = srodek(q.map((k) => sol.v[k]));
      const nx = sF.x - sB.x, ny = sF.y - sB.y, nz = sF.z - sB.z;
      const nl = Math.hypot(nx, ny, nz) || 1;
      const jasno = Math.max(0, (nx * sw.x + ny * sw.y + nz * sw.z) / (nl * sl));
      faces.push({ pts, color: sol.color, alpha: sol.alpha ?? 1, bold: !!sol.bold,
        shade: Math.min(1, 0.75 + 0.3 * jasno), tag: sol.tag || null, bryla: i });
    });
  });
  // ile razy kolejnosc trzeba bylo wymusic — rysunek pokazuje to testom
  faces.cykle = cykle;
  return faces;
};

function Scene3D({ cab, geo, mat, open, yaw, pitch, angle, wstawki }) {
  const t = geo.t;
  const cd = geo.carcassDepth;
  const { H } = cab;
  const W = geo.W;
  const bf = mat.board.color;
  const shc = shelfColorOf(cab, mat);
  const ff = cab.realColors && cab.frontSameAsBoard !== false ? mat.board.color : mat.front.color;

  /* --- lista bryl --- */
  const solids = [];
  const box = (x0, y0, z0, x1, y1, z1, color, transform, alpha, bold) => {
    let v = VERTS(x0, y0, z0, x1, y1, z1);
    if (transform) v = v.map(transform);
    audytBryly(x0, y0, z0, x1, y1, z1, color, null, v, alpha);
    solids.push({ v, color, alpha: alpha ?? 1, bold: !!bold });
  };

  // boki skrocone przy narozniku (w 3D z=cd to tyl, wiec ucinamy od strony cd)
  const cutSL = geo.cornerCut?.sideLeftDepth || 0;
  const cutSR = geo.cornerCut?.sideRightDepth || 0;
  /* Od strony ramienia boku nie ma — stoi tam katownik przy plecach. */
  if (geo.postSide !== "left")
    box(0, geo.leftY0, 0, t, geo.leftY0 + geo.leftLen, cd - cutSL, bf);
  if (geo.postSide !== "right")
    box(W - t, geo.rightY0, 0, W, geo.rightY0 + geo.rightLen, cd - cutSR, bf);
  if (geo.postSide) {
    const pShc = shelfColorOf(cab, mat);
    // plyty wzmocnienia tylnego (A albo B) z `postRects`: v od tylu, w 3D z = cd - v
    geo.postRects.forEach((q) => box(q.x0, geo.interior.y0, cd - q.v1, q.x1, geo.interior.y1, cd - q.v0, pShc));
  }
  if (geo.hasBot) box(geo.botX0, geo.bottomY, 0, geo.botX1, geo.bottomY + t, cd, bf);
  if (geo.hasTop)
    box(
      geo.topX0, H - t, geo.isBlat ? -geo.blat.overBack : 0,
      geo.topX1, H, geo.isBlat ? cd + geo.blat.overFront : cd, bf
    );

  {
    const pb = plecyBryla(cab, geo);
    if (pb) box(pb.x0, pb.y0, pb.z0, pb.x1, pb.y1, pb.z1, cab.back === "board" ? bf : mat.back.color);
  }

  /* Glebokosci polek i przegrod `geo` liczy od plecow, a tu os z idzie od
     lica (z = 0 to przod korpusu) — stad odbicie przez `cd`, jak w bryle
     zabudowy. Wczesniej polka zaczynala sie od lica i przy frontach
     wpuszczanych wchodzila w drzwi, a przy HDF we frezie w plecy. */
  const zPolki = [cd - geo.shelfBack - geo.shelfDepth, cd - geo.shelfBack];
  geo.sepShelves.forEach((sh) =>
    box(geo.interior.x0, sh.y, zPolki[0], geo.interior.x1, sh.y + t, zPolki[1], bf)
  );
  geo.dividers.forEach((d) =>
    box(d.x, d.y0, cd - geo.backIntrusion - geo.dividerDepth, d.x + t, d.y1, cd - geo.backIntrusion, bf)
  );
  geo.levels.forEach((lv) =>
    lv.cols.forEach((c) => {
      c.shelves.forEach((sh) =>
        polkaCzesci(c, zPolki[0] + (c.shFront || 0), zPolki[1], cd).forEach(([x0, z0, x1, z1]) =>
          box(x0, sh.y, z0, x1, sh.y + geo.ts, z1, bf))
      );
      if (c.support && c.fix) {
        const sx = c.fix.side === "left" ? c.fix.x + c.fix.w - t : c.fix.x;
        box(sx, lv.y0, 0, sx + t, lv.y1, c.support.d, bf);
      }
    })
  );

  if (cab.plinth.on) {
    const sb = cab.plinth.setback || 0;
    // z=0 to przod korpusu; cokol siedzi z przodu, cofniety o setback w glab
    if (geo.plinthInBody)
      box(geo.interior.x0, 0, sb, geo.interior.x1, geo.plinthH, sb + t, bf);
    else box(0, -geo.plinthH, sb, W, 0, sb + t, bf);
  }
  geo.levels.forEach((lv) => lv.cols.forEach((c) => (c.rails || []).forEach((r) => {
    if (r.x1 > r.x0 && r.y1 > r.y0 && r.zLen > 0)
      box(r.x0, r.y0, r.z0, r.x1, r.y1, r.z0 + r.zLen, bf);
  })));
  if (cab.legs && cab.legs.on) {
    // nozka konczy sie pod dnem: przy cokole w obrysie to wysokosc cokolu,
    // inaczej spod korpusu
    const top = geo.legTop;
    const lh = geo.legH;
    const ins = geo.legs.ins;
    const lw = geo.legs.w;
    /* Dwa rzedy nozek: przy licu i przy plecach. Nieparzysta liczba znaczy
       jeszcze jedna podpore na srodku dna — tak samo jak w elewacji. */
    const miejsca = geo.legs.xs.flatMap((lx) => [[lx, ins], [lx, cd - ins - lw]]);
    if (geo.legs.srodek) miejsca.push([(W - lw) / 2, (cd - lw) / 2]);
    miejsca.forEach(([lx, lz]) => box(lx, top - lh, lz, lx + lw, top, lz + lw, legColorOf(cab)));
  }

  (geo.geoObs || []).forEach((o) => {
    // w 3D z=cd to tyl, a geometria bryly ma tyl przy oz=0 — odwracamy
    box(o.ox0, o.oy0, cd - o.oz1, o.ox1, o.oy1, cd - o.oz0, "#7c3aed", null, 0.45);
  });
  geo.geoCuts.filter((gc) => gc.mask).forEach((gc) => {
    const smat = shc;
    // w 3D z=cd to TYL, geometria wneki ma tyl przy z=0 -> odwracamy: z3d = cd - z
    const zf = (z) => cd - z;
    const rx = gc.bx0, rw = gc.bx1 - gc.bx0;
    const ry = gc.bz0, rh = gc.bz1 - gc.bz0;
    const vVisible = gc.maskVisible === "vertical";
    const sideFace = gc.onLeft ? rx + t : rx + rw - t; // lico boku od wnetrza
    const vx0 = gc.onLeft ? rx + rw : rx - t;
    const vz0 = vVisible ? (gc.onBack ? ry : ry - t) : ry;
    const vz1 = vz0 + (vVisible ? rh + t : rh);
    box(vx0, gc.cy0, zf(vz1), vx0 + t, gc.cy1, zf(vz0), smat);
    // czolo — dochodzi do lica boku
    const hz0 = gc.onBack ? ry + rh : ry - t;
    const a0 = gc.onLeft ? sideFace : (vVisible ? rx : rx - t);
    const a1 = gc.onLeft ? (vVisible ? rx + rw : rx + rw + t) : sideFace;
    box(Math.min(a0, a1), gc.cy0, zf(hz0 + t), Math.max(a0, a1), gc.cy1, zf(hz0), smat);
  });
  (geo.geoObs || []).filter((o) => o.mask && o.maskChosen).forEach((o) => {
    const smat = shc;
    const zf = (z) => cd - z;
    const needL = !o.touchLeft, needR = !o.touchRight;
    const needBack = !o.touchBack, needFront = !o.touchFront;
    const eB = needBack ? t : 0, eF = needFront ? t : 0;
    const mTop = o.maskTop ?? o.oy1;
    if (needL) box(o.ox0 - t, o.oy0, zf(o.oz1 + eF), o.ox0, mTop, zf(o.oz0 - eB), smat);
    if (needR) box(o.ox1, o.oy0, zf(o.oz1 + eF), o.ox1 + t, mTop, zf(o.oz0 - eB), smat);
    if (needBack) box(o.ox0, o.oy0, zf(o.oz0), o.ox1, mTop, zf(o.oz0 - t), smat);
    if (needFront) box(o.ox0, o.oy0, zf(o.oz1 + t), o.ox1, mTop, zf(o.oz1), smat);
  });

  const tf = geo.tf;
  const handleBar = (d, z0trans, transform) => {
    if (!d.handle) return;
    const depth = uchwytOut(d, cab); // ile uchwyt wystaje przed front
    if (!depth) return;
    const u = uchwytObrys(d);
    box(u.x0, u.y0, z0trans - depth, u.x1, u.y1, z0trans, "#3f3f46", transform, 1, false);
  };

  geo.doors.forEach((d) => {
    const z0 = cab.frontMode === "overlay" ? -tf : 0;
    const z1 = z0 + tf;
    if (d.type === "drawer") {
      const pull = open ? Math.min(220, (d.nl || 400) * 0.6) : 0;
      box(d.x, d.y, z0 - pull, d.x + d.w, d.y + d.h, z1 - pull, ff, null, 1, true);
      handleBar(d, z0 - pull, null);
      // skrzynka jest w szafce i przy zamknietej — rysunki z gory i z boku ja pokazuja
      skrzynkaBryly(d, t, z1 - pull).forEach(([a0, b0, c0, a1, b1, c1, r]) =>
        box(a0, b0, c0, a1, b1, c1, r === "metal" ? "#8b8b93" : bf, null, 1, false));
      return;
    }
    const col = d.mirror ? mat.mirror.color : ff;
    if (d.type === "fix" || d.type === "blenda" || !open) {
      box(d.x, d.y, z0, d.x + d.w, d.y + d.h, z1, col, null, 1, true);
      if (d.type !== "fix" && d.type !== "blenda") handleBar(d, z0, null);
      return;
    }
    if (d.type === "klapa") {
      const rot = klapaObrot(d, angle, z0);
      box(d.x, d.y, z0, d.x + d.w, d.y + d.h, z1, col, rot, 0.85, true);
      handleBar(d, z0, rot);
      return;
    }
    // os obrotu na wlasnej zewnetrznej krawedzi plyty, zeby nie wychodzila poza obrys
    const ang = (angle * Math.PI) / 180;
    const left = d.hingeSide === "left";
    const ox = left ? d.x : d.x + d.w;
    const sign = left ? -1 : 1;
    const rot = (p) => rotAboutY(p, sign * ang, ox, z0);
    box(d.x, d.y, z0, d.x + d.w, d.y + d.h, z1, col, rot, 0.85, true);
    handleBar(d, z0, rot);
  });

  // wstawka w rogu przy boku szafki: od lica drzwi `gl` w glab
  wstawkiSzafki(wstawki, geo).forEach((w) => {
    const zL = cab.frontMode === "overlay" ? -tf : 0;
    box(w.x0, 0, zL, w.x1, w.H, zL + w.gl, ff, null, 1, true);
  });

  /* --- rzut --- */
  const cyw = Math.cos(yaw), syw = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const cx = W / 2, cyc = H / 2, cz = cd / 2;
  const proj = (p) => {
    const x = p.x - cx, y = p.y - cyc, z = p.z - cz;
    const x1 = x * cyw + z * syw;
    const z1 = -x * syw + z * cyw;
    const y2 = y * cp - z1 * sp;
    const z2 = y * sp + z1 * cp;
    return { X: x1, Y: -y2, D: z2 };
  };

  // ta sama kolejnosc bryl co w bryle calej zabudowy — `ulozSciany`
  const faces = ulozSciany(solids, proj);

  const xs = faces.flatMap((f) => f.pts.map((p) => p.X));
  const ys = faces.flatMap((f) => f.pts.map((p) => p.Y));
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 60;
  const vb = `${minX - pad} ${minY - pad} ${maxX - minX + 2 * pad} ${maxY - minY + 2 * pad}`;

  const tint = (hex, f) => {
    const n = parseInt(hex.replace("#", ""), 16);
    const r = Math.min(255, Math.round(((n >> 16) & 255) * f));
    const g2 = Math.min(255, Math.round(((n >> 8) & 255) * f));
    const b2 = Math.min(255, Math.round((n & 255) * f));
    return `rgb(${r},${g2},${b2})`;
  };

  return (
    <svg viewBox={vb} className="w-full h-auto select-none" style={{ maxHeight: DRAW_MAX_H }}
      data-cykle={faces.cykle}>
      {faces.map((f, i) => (
        <polygon key={i} points={f.pts.map((p) => `${p.X},${p.Y}`).join(" ")}
          fill={tint(f.color, f.shade)} stroke={INK} strokeWidth={f.bold ? 3 : 1.2}
          strokeLinejoin="round" opacity={f.alpha} />
      ))}
    </svg>
  );
}

const SplitPicker = ({ label, what, s, onToggle, onAuto, onWlasne }) => {
  const [nowe, setNowe] = useState("");
  if (!s || (!s.joints.length && !onWlasne)) return null;
  const wl = s.wlasne || [];
  const dodaj = () => {
    const v = Math.round(Number(nowe));
    if (!(v > 0 && v < s.total) || !onWlasne) return;
    onWlasne([...new Set([...wl, v])].sort((a, b) => a - b));
    setNowe("");
  };
  return (
    <Group label={label}
      hint={`Zaznacz styki korpusów, na których ${what} ma być cięty — wtedy szew wypada w linii szczeliny między frontami. Własne cięcie wpisz w mm od lewego końca. Bez zaznaczeń podział dobiera się sam, gdy ${what} nie mieści się w formatce.`}>
      <div className="flex flex-wrap items-center gap-x-3 gap-y-1.5">
        {s.joints.map((j) => {
          const on = s.cuts.includes(j);
          return (
            <label key={j} className="flex cursor-pointer items-center gap-1 text-xs"
              title={on ? "Zdejmij podział z tego styku" : `Potnij ${what} na tym styku`}>
              <input type="checkbox" checked={on} onChange={() => onToggle(j)} className="h-3.5 w-3.5 accent-teal-700" />
              <span className="font-mono">{fmt(j)} mm</span>
            </label>
          );
        })}
        {wl.map((c) => (
          <span key={"w" + c} className="flex items-center gap-1 rounded-full border border-teal-600 bg-teal-50 px-2 py-0.5 font-mono text-xs">
            {fmt(c)} mm
            <button onClick={() => onWlasne(wl.filter((x) => x !== c))} title="Usuń to cięcie"
              className="text-stone-500 hover:text-stone-800">×</button>
          </span>
        ))}
        {!s.auto && (
          <button onClick={onAuto}
            className="rounded-full border border-dashed border-stone-400 px-2.5 py-1 text-xs text-stone-500 hover:text-stone-700">
            auto
          </button>
        )}
      </div>
      {onWlasne && (
        <div className="mt-1.5 flex items-center gap-2 text-xs">
          <span className="text-stone-500">własne cięcie</span>
          <input type="number" min={1} step={1} value={nowe} placeholder="mm od lewej"
            onChange={(e) => setNowe(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") dodaj(); }}
            className="w-28 rounded border border-stone-300 bg-white px-1.5 py-1 font-mono text-xs focus:border-teal-600 focus:outline-none" />
          <button onClick={dodaj} className="rounded border border-stone-300 px-2 py-1 hover:bg-stone-100">dodaj</button>
          <span className="text-stone-400">długość {fmt(s.total)} mm</span>
        </div>
      )}
    </Group>
  );
};

/* laczy identyczne formatki w jedna pozycje listy */
/* Kolejnosc materialow w zestawieniu: blat na gorze, bo idzie osobnym zamowieniem
   i najczesciej sie o niego pyta, HDF na dole, bo to drobiazg. Reszta zostaje
   w kolejnosci, w jakiej powstaje geometria. */
const MAT_ORDER = { worktop: 0, front: 1, board: 2, shelf: 2, mirror: 3, back: 4 };
const groupPanels = (panels) => {
  const map = new Map();
  panels.forEach((p) => {
    const e = p.edges;
    const key = [p.matKey, p.a, p.b, e.a1, e.a2, e.b1, e.b2, p.name].join("|");
    if (map.has(key)) map.get(key).qty += p.qty;
    else map.set(key, { ...p });
  });
  return [...map.values()]
    .map((p, i) => ({ p, i }))
    .sort((x, y) => (MAT_ORDER[x.p.matKey] ?? 2) - (MAT_ORDER[y.p.matKey] ?? 2) || x.i - y.i)
    .map(({ p }) => p);
};

/* Lista formatek jednej szafki — ta sama w aplikacji i na wydruku. Cokol i blat
   wspolne dla ciagu ida jego pozycja (w formatkach calego projektu), wiec tu ich
   nie ma. Ramie szafki naroznej nalezy do niej: jego plyty sa tu razem
   z korpusem — wczesniej trafialy tylko do listy calego projektu. */
const formatkiSzafki = (geo, { bezCokolu = false, bezBlatu = false, arm = null, wstawki = [] } = {}) => {
  const gone = [...(bezCokolu ? ["Cokół"] : []), ...(bezBlatu ? ["Blat"] : [])];
  const wlasne = gone.length ? geo.panels.filter((p) => !gone.includes(p.name)) : geo.panels;
  // wstawka w rogu przykreca sie do tej szafki, wiec idzie na jej liste
  return groupPanels([...wlasne, ...(arm ? cornerArmParts(arm).panels : []),
    ...wstawki.flatMap((w) => wstawkaParts(w).panels)]);
};

/* Okucia jednej szafki — ta sama lista w aplikacji i na wydruku, na tej samej
   zasadzie co `formatkiSzafki`: listwa montazowa wspolna dla ciagu idzie jego
   pozycja, a okucia ramienia szafki w L i wstawki w rogu naleza do szafki,
   do ktorej sie przykrecaja (wczesniej byly tylko w liscie projektu, choc ich
   formatki byly juz na liscie szafki). Te same nazwy sumujemy w jednej pozycji. */
const okuciaSzafki = (geo, { bezListwy = false, arm = null, wstawki = [] } = {}) => {
  const out = (bezListwy ? geo.hardware.filter((h) => h.name !== RAIL_NAME) : geo.hardware).map((h) => ({ ...h }));
  const dodaj = (h) => {
    const jest = out.find((x) => x.name === h.name && (x.unit || "") === (h.unit || ""));
    if (!jest) { out.push({ ...h }); return; }
    jest.qty = Math.round((jest.qty + h.qty) * 100) / 100;
    if (h.spec && h.spec !== jest.spec) jest.spec = jest.spec ? `${jest.spec}; ${h.spec}` : h.spec;
  };
  if (arm) cornerArmParts(arm).hardware.forEach(dodaj);
  wstawki.forEach((w) => wstawkaParts(w).hardware.forEach(dodaj));
  return out;
};

/* Czy projekt ma cos poza lista jednej szafki: druga szafke, wspolny cokol albo
   blat ciagu, ramie szafki naroznej. Wtedy potrzebne sa „Formatki calego
   projektu” i rozkroj calosci — przy jednej szafce w ciagu blat i cokol ciagu
   nie trafialy inaczej nigdzie. */
/* Wycinek projektu z jednym pomieszczeniem — do list, wyceny i rozkroju
   „tylko to pomieszczenie” oraz do rozdzialow wydruku. Rogi i pietra nie
   wychodza poza pomieszczenie, wiec uklad wycinka jest taki sam jak w calosci. */
const projektPomieszczenia = (project, roomId) => {
  const items = project.items.filter((it) => roomOfItem(project, it) === roomId);
  return { ...project, rooms: roomsOf(project).filter((r) => r.id === roomId),
    runs: runsInRoom(project, roomId), items, active: 0 };
};

const calyProjekt = (project) =>
  project.items.length > 1 || projectParts(project).length > project.items.length;

const edgeText = (p) => {
  const out = [];
  if (p.edges.a1) out.push("przód " + fmt(p.a));
  if (p.edges.a2) out.push("tył " + fmt(p.a));
  if (p.edges.b1) out.push("bok " + fmt(p.b));
  if (p.edges.b2) out.push("bok " + fmt(p.b));
  return out.length ? out.join(", ") : "—";
};

// `id` — kotwica, do ktorej da sie przewinac (np. „Pokaz rysunek" z gornego paska)
// kazda karta da sie zwinac (uzytkownik 2026-09-29); domyslnie rozwinieta
const Card = ({ title, children, right, collapsible = true, defaultOpen = true, id }) => {
  const [open, setOpen] = useState(defaultOpen);
  /* „Zwiń wszystkie / Rozwiń wszystkie” w gornym pasku (komentarz uzytkownika
     2026-09-29) — jedno zdarzenie do wszystkich kart, ktore da sie zwinac. */
  useEffect(() => {
    if (!collapsible) return undefined;
    const h = (e) => setOpen(!!(e.detail && e.detail.open));
    window.addEventListener("mp-karty", h);
    return () => window.removeEventListener("mp-karty", h);
  }, [collapsible]);
  const shown = collapsible ? open : true;
  return (
    <section id={id} className="rounded-lg border border-stone-200 bg-white"
      // gorny pasek jest przyklejony — bez odstepu zaslanialby naglowek karty
      style={id ? { scrollMarginTop: 120 } : undefined}>
      <header
        className={`flex items-center justify-between gap-2 px-4 py-2.5 ${
          shown ? "border-b border-stone-200" : ""
        }`}>
        {collapsible ? (
          <button type="button" onClick={() => setOpen(!open)}
            title={open ? "Zwiń sekcję" : "Rozwiń sekcję"}
            className="flex min-w-0 flex-1 items-center gap-2 text-left">
            <span className={`text-[10px] leading-none text-stone-400 transition-transform ${open ? "" : "-rotate-90"}`}>
              ▼
            </span>
            <h2 className="truncate text-sm font-semibold tracking-tight text-stone-800">{title}</h2>
          </button>
        ) : (
          <h2 className="min-w-0 truncate text-sm font-semibold tracking-tight text-stone-800">{title}</h2>
        )}
        {right}
      </header>
      {shown && <div className="p-4 space-y-4">{children}</div>}
    </section>
  );
};

const NoteLine = ({ text, color, icon, przed, editLevels, editItemLevels, editItemCab, cab, setGap, runFix, setMatDepth, setLegs }) => {
  const [txt, ...actions] = text.split("|");
  const btns = actions.map((action) => {
    if (action.startsWith("worktop:")) {
      const d = Number(action.split(":")[1]);
      return { label: `Zmień na blat ${fmt(d)} mm`, run: () => setMatDepth && setMatDepth(d) };
    }
    if (action === "plinthauto" || action === "topauto")
      return { label: "Dobierz podział automatycznie", run: () => runFix && runFix(action) };
    if (action.startsWith("topcut:")) {
      return { label: action === "topcut:1"
        ? "Zamów blat docięty na wymiar"
        : "Zamów cały arkusz",
        run: () => runFix && runFix(action) };
    }
    if (action.startsWith("rundepth:")) {
      // „rundepth:570" — ten ciag, „rundepth:570@c2" — sasiedni, po nazwie w akcji
      const [d, gdzie] = action.slice("rundepth:".length).split("@");
      return { label: gdzie
        ? `Zmniejsz głębokość sąsiedniego ciągu do ${fmt(Number(d))} mm`
        : `Zmniejsz głębokość szafek do ${fmt(Number(d))} mm`,
        run: () => runFix && runFix(action) };
    }
    // rozjazd z ciagiem da sie naprawic z dwoch stron — szafka albo caly ciag
    if (action.startsWith("runcab:") || action.startsWith("runrun:")) {
      const [kind, field, val] = action.split(":");
      const toRun = kind === "runrun";
      const label = field === "plinth"
        ? (toRun ? "Ustaw cokół ciągu jak tutaj" : "Wyrównaj cokół do ciągu")
        : field === "hangerMode"
        ? (toRun ? "Tak ma wisieć cały ciąg" : "Wieszaj tę szafkę jak ciąg")
        : (toRun ? `Ustaw cały ciąg na ${val} mm` : `Wyrównaj tę szafkę do ciągu (${val} mm)`);
      return { label, run: () => runFix && runFix(action) };
    }
    if (action.startsWith("wstawka:")) {
      // „wstawka:<ciag z narożnikiem>:<plaska|szeroka>:<ile mm widac od przodu>"
      const [, , typ, ile] = action.split(":");
      return {
        label: typ === "szeroka" ? `Wstawka ${fmt(Number(ile))} mm (na trójkątach)` : `Dodaj wstawkę ${fmt(Number(ile))} mm`,
        run: () => runFix && runFix(action),
      };
    }
    if (action.startsWith("fixgap:")) {
      const [, li, j, val, dir] = action.split(":");
      const verb = dir === "down" ? "Zmniejsz" : "Zwiększ";
      return { label: `${verb} luz do ${val} mm`, run: () => editLevels((L) => (L[+li].cols[+j].gapBetween = +val)) };
    }
    if (action.startsWith("fixback:")) {
      const [, li, j, k, val] = action.split(":");
      return {
        label: `Ustaw tył na ${val} mm`,
        run: () => editLevels((L) => (L[+li].cols[+j].drawers[+k].backHeight = +val)),
      };
    }
    if (action.startsWith("legs:")) {
      const ile = Math.max(2, Math.round(Number(action.split(":")[1]) || 0));
      return {
        label: `${ile} nóżek — ${ile % 2 ? "jedna na środku" : "para na środku"}`,
        run: () => setLegs && setLegs(ile),
      };
    }
    if (action.startsWith("hingeflip:")) {
      const [, li, j, side] = action.split(":");
      return {
        label: `Przełóż zawiasy na ${side === "left" ? "lewą" : "prawą"}`,
        run: () => editLevels((L) => (L[+li].cols[+j].hinge = side)),
      };
    }
    if (action.startsWith("onedoor:")) {
      // „onedoor:<poziom>:<kolumna>:<szerokosc>:<strona zawiasow>" — dwoje waskich drzwi w jedne
      const [, li, j, w, side] = action.split(":");
      return {
        label: `Jedne drzwi ${fmt(Number(w))} mm — zawiasy z ${side === "left" ? "lewej" : "prawej"}`,
        run: () => editLevels((L) => {
          const c = L[+li].cols[+j];
          c.doors = 1;
          c.hinge = side;
          c.doorWidths = [];
        }),
      };
    }
    if (action.startsWith("noTop:")) {
      const idx = Number(action.split(":")[1]);
      return {
        label: "Dołóż parę wzmocnień",
        run: () => editItemCab && editItemCab(idx, (c, m) =>
          Object.assign(c, bezWienca(c, (m.front || {}).thickness))),
      };
    }
    if (action.startsWith("armlen:")) {
      // „armlen:<dlugosc>:<nr szafki>:<szerokosc drzwi>" — skraca ramie szafki w L
      const [, len, idx, drzwi] = action.split(":");
      return {
        label: `Skróć ramię do ${fmt(Number(len))} mm — drzwi ${fmt(Number(drzwi))} mm`,
        run: () => editItemCab && editItemCab(Number(idx), (c) => Object.assign(c, {
          corner: { ...(c.corner || {}), arm: Number(len) } })),
      };
    }
    if (action.startsWith("hingeflipcab:")) {
      // „hingeflipcab:<nr szafki>:<poziom>:<kolumna>:<strona>:<ile zostaje>" — z uwagi o kolizji
      const [, idx, li, j, side, zostaje] = action.split(":");
      const reszta = Number(zostaje) > 0 ? ` — zostaje ${fmt(Number(zostaje))} mm` : " — bez kolizji";
      return {
        label: `Przełóż zawiasy na ${side === "left" ? "lewą" : "prawą"}${reszta}`,
        run: () => editItemLevels(Number(idx), (L) => { L[+li].cols[+j].hinge = side; }),
      };
    }
    if (action.startsWith("wspornikoff:")) {
      // „wspornikoff:<poziom>:<kolumna>:<nowa strona zawiasu albo ->" — bez wspornika polka wraca na cala szerokosc
      const [, li, j, strona] = action.split(":");
      return {
        label: strona !== "-" ? "Przełóż zawiasy na drugą stronę i usuń wspornik" : "Usuń wspornik",
