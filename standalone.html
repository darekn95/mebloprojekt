        run: () => editLevels((L) => {
          const col = L[+li].cols[+j];
          col.fix = { ...(col.fix || {}), support: false };
          if (strona !== "-") col.hinge = strona;
        }),
      };
    }
    if (action.startsWith("slepyfix:")) {
      // „slepyfix:<nr szafki>:<strona fixu>:<szerokosc>" — sam fix, reszta zostaje
      const [, idx, strona, w] = action.split(":");
      return {
        label: `Popraw fix na ${fmt(Number(w))} mm`,
        run: () => editItemLevels(Number(idx), (L) => L.forEach((lv) => {
          const j = strona === "left" ? 0 : lv.cols.length - 1;
          const col = lv.cols[j];
          if (col && col.fix && col.fix.side === strona) lv.cols[j] = { ...col, fix: { ...col.fix, w: Number(w) } };
        })),
      };
    }
    if (action.startsWith("slepyrog:")) {
      // „slepyrog:<nr szafki>:<strona fixu>:<szerokosc fixu>:<ciag z narożnikiem albo ->:<grubosc wstawki>"
      const [, idx, strona, w, ciag, gr] = action.split(":");
      const grW = Number(gr) || 18;
      return {
        label: `Ustaw szafkę w rogu: fix ${fmt(Number(w))} mm + drzwi${ciag !== "-" ? ` + wstawka ${fmt(grW)} mm` : ""}`,
        run: () => {
          editItemLevels(Number(idx), (L) => L.forEach((lv) => {
            const j = strona === "left" ? 0 : lv.cols.length - 1;
            lv.cols[j] = { ...lv.cols[j], kind: "doors", doors: 1, doorWidths: [],
              fix: { ...((lv.cols[j] || {}).fix || {}), side: strona, w: Number(w), mode: "overlay", support: false },
              // zawias od zewnatrz, czyli po stronie przeciwnej do fixu — uchwyt wypada przy fixie
              hinge: strona === "left" ? "right" : "left" };
          }));
          if (ciag !== "-" && runFix) runFix(`wstawka:${ciag}:plaska:${grW}`);
        },
      };
    }
    if (action.startsWith("cornerdoor:")) {
      const [, w, idx] = action.split(":");
      return {
        label: `Ustaw jedne drzwi ${w} mm`,
        /* Szafka narozna to jedna komora — front jest po prostu wezszy od
           korpusu. Uwaga bywa widoczna z sasiadki, wiec poprawka idzie po
           numerze szafki, a nie po tej akurat ogladanej. */
        run: () => editItemLevels(Number(idx), (L) => L.forEach((lv) => {
          const c = { ...lv.cols[0], w: null, kind: "doors", doors: 1,
            doorWidths: [Number(w)], noDiv: false };
          lv.cols = [c];
        })),
      };
    }
    if (action.startsWith("fixcolauto:")) {
      const li = Number(action.split(":")[1]);
      return {
        label: "Rozłóż kolumny automatycznie",
        run: () => editLevels((L) => L[li].cols.forEach((c) => { c.w = null; })),
      };
    }
    if (action.startsWith("fixdiv:")) {
      const val = Number(action.split(":")[1]);
      const now = cab.gaps?.divOverlay ?? 7;
      return {
        label: `${val > now ? "Zwiększ" : "Zmniejsz"} nałożenie do ${val} mm`,
        run: () => setGap("divOverlay", val),
      };
    }
    if (action.startsWith("fixh:")) {
      const [, li, j, k, val] = action.split(":");
      return { label: `Zmień bok szuflady na ${val} mm`, run: () => editLevels((L) => (L[+li].cols[+j].drawers[+k].h = +val)) };
    }
    if (action.startsWith("fixnl:")) {
      const [, li, j, k, val] = action.split(":");
      return { label: `Zmień głębokość prowadnic do NL ${val}`, run: () => editLevels((L) => (L[+li].cols[+j].drawers[+k].nl = +val)) };
    }
    if (action.startsWith("fixsup:")) {
      const [, li, j] = action.split(":");
      return {
        label: "Dobuduj wspornik pionowy",
        run: () => editLevels((L) => {
          const f = L[+li].cols[+j].fix || (L[+li].cols[+j].fix = { side: "none", w: 60 });
          f.support = true;
          if (!(f.supportDepth > 0)) f.supportDepth = 100;
        }),
      };
    }
    if (action.startsWith("fixnodoor:")) {
      const [, li, j] = action.split(":");
      return {
        label: "Usuń kolidujące skrzydło",
        run: () => editLevels((L) => {
          const col = L[+li].cols[+j];
          const n = Math.max(0, Math.round(col.doors ?? 0));
          if (n <= 0) return;
          // koliduje skrzydlo od strony elementu stalego — usuwamy tylko je
          const k = (col.fix || {}).side === "right" ? n - 1 : 0;
          col.doors = n - 1;
          ["doorWidths", "mirrors", "handles", "hinges"].forEach((key) => {
            if (Array.isArray(col[key]) && col[key].length > k) col[key].splice(k, 1);
          });
          // po usunieciu jednego z dwoch skrzydel zawias wraca na auto
          if (col.doors === 1) col.hinge = "auto";
        }),
      };
    }
    return null;
  }).filter(Boolean);
  return (
    <li className="flex items-start gap-2 text-sm" style={{ color }}>
      {przed}
      <span className="font-mono">{icon}</span>
      <span>
        {txt}
        {btns.map((btn, i) => (
          <button key={i} onClick={btn.run}
            className="ml-2 rounded bg-teal-600 px-2 py-0.5 text-xs font-medium text-white hover:bg-teal-700">
            {btn.label}
          </button>
        ))}
      </span>
    </li>
  );
};

const MiniBtn = ({ onClick, children, tone = "plain", title }) => (
  <button onClick={onClick} title={title}
    className={"rounded border px-1.5 py-0.5 text-[11px] transition-colors " +
      (tone === "on"
        ? "border-teal-700 bg-teal-700 text-white"
        : "border-stone-200 bg-white text-stone-500 hover:border-stone-400 hover:text-stone-800")}>
    {children}
  </button>
);

/* Powiekszanie rysunku. 100% to rozmiar dopasowany do karty (jak dotad); wyzej
   SVG rosnie od tego dopasowanego rozmiaru, a ramka dostaje przewijanie
   i przesuwanie przeciaganiem. Tam, gdzie przeciaganie obraca bryle (3D),
   przesuwa sie z wcisnietym Shiftem.
   Kazdy rysunek (zakres | widok | szafka — `resetKey`) pamieta swoje
   powiekszenie, miejsce przewiniecia i szerokosc przy 100%: po przelaczeniu
   widoku i powrocie rysunek jest taki, jak go zostawiono. Pamiec trwa do
   przeladowania strony; nowy rysunek startuje od „Dopasuj”. */
const ZOOM_KROKI = [1, 1.25, 1.5, 2, 2.5, 3, 4];
const ZOOM_PAMIEC = new Map();   // resetKey -> { z, x, y, fit }
const zoomPamiec = (k) => {
  if (!ZOOM_PAMIEC.has(k)) ZOOM_PAMIEC.set(k, { z: 1, x: 0, y: 0, fit: 0 });
  return ZOOM_PAMIEC.get(k);
};
function ZoomBox({ children, obraca = false, pelny = false, onPelny, resetKey }) {
  const kluczRef = useRef(resetKey);
  kluczRef.current = resetKey;
  const [stan, setStan] = useState(() => ({ k: resetKey, z: zoomPamiec(resetKey).z }));
  // po zmianie rysunku od razu (w tym samym rysowaniu) jego zapamietane powiekszenie
  const zoom = stan.k === resetKey ? stan.z : zoomPamiec(resetKey).z;
  const setZoom = (f) => setStan((s) => {
    const k = kluczRef.current;
    const z0 = s.k === k ? s.z : zoomPamiec(k).z;
    const z = typeof f === "function" ? f(z0) : f;
    zoomPamiec(k).z = z;
    return { k, z };
  });
  const ramka = useRef(null);
  const dopasowana = useRef(zoomPamiec(resetKey).fit);
  const przes = useRef(null);
  const zoomRef = useRef(1);
  zoomRef.current = zoom;
  const poScroll = useRef(null);
  /* Powrot do rysunku: przewiniecie ustawiamy dopiero, gdy ramka juz ma
     powiekszony rysunek (efekt nizej, po kazdym rysowaniu). */
  useEffect(() => {
    const p = zoomPamiec(resetKey);
    if (p.fit) dopasowana.current = p.fit;
    poScroll.current = p.z > 1 ? { x: p.x, y: p.y, z: p.z } : null;
  }, [resetKey]);
  /* Ctrl + kolko nad rysunkiem przybliza rysunek w miejscu kursora zamiast
     calej strony (tak jak mapy); szczypanie na touchpadzie przychodzi jako to
     samo. React podpina kolko jako pasywne, wiec bez wlasnego nasluchu nie da
     sie zablokowac powiekszania strony. */
  useEffect(() => {
    const el = ramka.current;
    if (!el) return undefined;
    const naKolko = (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      const z0 = zoomRef.current;
      const z1 = Math.max(1, Math.min(ZOOM_KROKI[ZOOM_KROKI.length - 1], z0 * Math.exp(-e.deltaY * 0.0015)));
      if (Math.abs(z1 - z0) < 1e-3) return;
      const r = el.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      // punkt pod kursorem zostaje na miejscu
      poScroll.current = { x: (el.scrollLeft + mx) * (z1 / z0) - mx, y: (el.scrollTop + my) * (z1 / z0) - my, z: z1 };
      setZoom(z1);
    };
    el.addEventListener("wheel", naKolko, { passive: false });
    return () => el.removeEventListener("wheel", naKolko);
  }, []);
  useEffect(() => {
    const p = poScroll.current;
    if (!p || !ramka.current || Math.abs(p.z - zoom) > 1e-6) return;
    ramka.current.scrollLeft = p.x;
    ramka.current.scrollTop = p.y;
    poScroll.current = null;
    const m = zoomPamiec(resetKey);
    m.x = ramka.current.scrollLeft;
    m.y = ramka.current.scrollTop;
  });
  /* Szerokosc rysunku przy 100%: SVG ma szerokosc karty, ale wysokosc
     ograniczona, wiec sama tresc bywa wezsza — liczymy ja z proporcji viewBox,
     inaczej pierwszy krok powiekszenia skakalby kilka razy. */
  useEffect(() => {
    if (zoom !== 1 || !ramka.current) return;
    const svg = ramka.current.querySelector("svg");
    if (!svg) return;
    const r = svg.getBoundingClientRect();
    const vb = svg.viewBox && svg.viewBox.baseVal;
    dopasowana.current = vb && vb.width && vb.height
      ? Math.min(r.width, r.height * (vb.width / vb.height)) : r.width;
    zoomPamiec(resetKey).fit = dopasowana.current;
  });
  const krok = (d) => setZoom((z) => {
    const i = ZOOM_KROKI.findIndex((k) => k >= z - 1e-6);
    const j = Math.max(0, Math.min(ZOOM_KROKI.length - 1, (i < 0 ? ZOOM_KROKI.length - 1 : i) + d));
    return ZOOM_KROKI[j];
  });
  const wiekszy = zoom > 1;
  return (
    <div className={pelny ? "pelny-rys" : ""}>
      <style>{`.zoom-on svg{width:var(--zw)!important;max-width:none!important;max-height:none!important;height:auto!important}
.pelny-rys .zoom-fit svg{max-height:calc(100vh - 230px)!important}`}</style>
      <div className="mb-1 flex items-center justify-end gap-1">
        <span className="mr-1 text-[11px] text-stone-400">
          {wiekszy ? (obraca ? "Shift + przeciągnij, żeby przesunąć" : "przeciągnij, żeby przesunąć")
            : "Ctrl + kółko nad rysunkiem: przybliż"}
        </span>
        <MiniBtn onClick={() => krok(-1)} title="Pomniejsz">−</MiniBtn>
        <span className="w-10 text-center font-mono text-[11px] text-stone-500" data-el="zoom">{Math.round(zoom * 100)}%</span>
        <MiniBtn onClick={() => krok(1)} title="Powiększ">+</MiniBtn>
        <MiniBtn onClick={() => setZoom(1)} title="Cały rysunek w karcie">Dopasuj</MiniBtn>
        {onPelny && (
          <MiniBtn onClick={onPelny} tone={pelny ? "on" : "plain"}
            title={pelny ? "Wróć do zwykłego widoku (Esc)" : "Rysunek na całe okno"}>
            {pelny ? "Zamknij pełny ekran" : "Pełny ekran"}
          </MiniBtn>
        )}
      </div>
      <div ref={ramka}
        className={"rounded border border-stone-100 bg-stone-50 p-3 "
          + (wiekszy ? "zoom-on overflow-auto" : "zoom-fit")}
        /* `contain: inline-size` trzyma szerokosc ramki na szerokosci karty — bez
           tego kolumna strony rozszerzala sie pod powiekszony rysunek i nie bylo
           czego przewijac. */
        style={wiekszy ? { "--zw": `${Math.round((zoomPamiec(resetKey).fit || dopasowana.current) * zoom)}px`,
          contain: "inline-size", width: "100%",
          maxHeight: pelny ? "calc(100vh - 170px)" : "75vh",
          cursor: obraca ? undefined : "grab" } : undefined}
        onPointerDownCapture={(e) => {
          if (!wiekszy || (obraca && !e.shiftKey) || e.button !== 0) return;
          przes.current = { x: e.clientX, y: e.clientY,
            sl: ramka.current.scrollLeft, st: ramka.current.scrollTop, ruszyl: false };
          if (obraca) e.stopPropagation();   // Shift przesuwa zamiast obracac
        }}
        onPointerMove={(e) => {
          const p0 = przes.current;
          if (!p0) return;
          const dx = e.clientX - p0.x, dy = e.clientY - p0.y;
          if (!p0.ruszyl && Math.abs(dx) + Math.abs(dy) < 4) return;
          p0.ruszyl = true;
          ramka.current.scrollLeft = p0.sl - dx;
          ramka.current.scrollTop = p0.st - dy;
        }}
        onScroll={(e) => {
          if (!wiekszy || poScroll.current) return;
          const m = zoomPamiec(resetKey);
          m.x = e.currentTarget.scrollLeft;
          m.y = e.currentTarget.scrollTop;
        }}
        onPointerUp={() => { przes.current = null; }}
        onPointerLeave={() => { przes.current = null; }}>
        {children}
      </div>
    </div>
  );
}

/* ---------- trwaly zapis projektu ----------
   W artefakcie Claude dostepne jest window.storage; w zwyklej przegladarce
   (standalone.html, GitHub Pages, dwuklik, Vite) go nie ma, wiec uzywamy
   localStorage. Interfejs ujednolicony: get -> {value}|null, set(key, value). */
const projectStore = (() => {
  const ws = typeof window !== "undefined" ? window.storage : null;
  if (ws && typeof ws.get === "function" && typeof ws.set === "function") return ws;
  return {
    async get(key) {
      try {
        const value = localStorage.getItem(key);
        return value == null ? null : { value };
      } catch (e) {
        return null;
      }
    },
    async set(key, value) {
      localStorage.setItem(key, value);
    },
  };
})();

/* ---------- rozkrój formatek na arkuszach ----------
   Ciecie gilotynowe: kazde ciecie przechodzi przez caly pozostaly kawalek.
   Wolne pola powstaja wylacznie z takich ciec i nigdy sie nie nakladaja,
   wiec kazdy uklad da sie wyciac prostymi cieciami piły panelowej. */

const SHEET_W = 2800; // arkusz, ktory kupujemy
const SHEET_H = 2100;
/* Zanim pojda formatki, arkusz jest okrawany na wymiar bazowy — i to on jest
   realnym maksimum jednej formatki, nie surowy arkusz. */
const USABLE_W = 2761.2;
const USABLE_H = 2061.2;
const KERF = 3; // rzaz piły

/* ---------- cokol ciagu ----------
   W ciagu cokol jest jedna plaszczyzna przez wszystkie szafki, a nie suma
   odcinkow pod kazda z nich — inaczej mielibysmy szwy tam, gdzie stykaja sie
   korpusy. Plaszczyzna dluzsza od maksymalnej formatki musi jednak pojsc
   z kilku kawalkow: dzielimy je rowno i oklejamy takze na laczeniu, zeby styk
   plaszczyzn bocznych nie zostal surowy. */
/* Styki korpusow to jedyne miejsca, w ktorych laczenie plaszczyzny nie rzuca sie
   w oczy — tam wypada pionowa szczelina miedzy frontami, wiec szew chowa sie
   w tej samej linii. Dlatego ciac wolno tylko tutaj. Automat tnie dopiero
   wtedy, gdy plaszczyzna nie miesci sie w formatce, i bierze najdalszy styk,
   ktory jeszcze wchodzi — czyli tak rzadko, jak sie da. */
/* `wlasne` — ciecia wpisane recznie w dowolnym miejscu (mm od lewego konca),
   niekoniecznie na styku korpusow (komentarz uzytkownika 2026-09-29). Gdy sa,
   podzial przestaje byc automatyczny: styki tylko te zaznaczone plus wlasne. */
const splitAtJoints = (total, joints, want, max = USABLE_W, wlasne = []) => {
  let cuts = [];
  let auto = true;
  let noFit = false;
  const wl = (wlasne || []).filter((c) => c > 0 && c < total);
  if (Array.isArray(want) || wl.length) {
    // recznie wybrane styki; te, ktore zniknely po zmianie szerokosci, odpadaja same
    auto = false;
    cuts = [...new Set([...(Array.isArray(want) ? want.filter((c) => joints.includes(c)) : []), ...wl])]
      .sort((a, b) => a - b);
  } else {
    let start = 0;
    while (total - start > max) {
      const cand = joints.filter((j) => j > start && j - start <= max).pop();
      if (cand == null) { noFit = true; break; }
      cuts.push(cand);
      start = cand;
    }
  }
  const lens = [];
  let prev = 0;
  cuts.forEach((c) => { lens.push(c - prev); prev = c; });
  lens.push(total - prev);
  return { cuts, joints, lens, auto, noFit, max, n: lens.length, wlasne: wl,
    tooLong: Math.max(0, ...lens.filter((l) => l > max)) };
};

/* Rozmieszczenie ciagow liczy sie z calego projektu, a potrzebuje go i rysunek,
   i blat, i uwagi. Projekt jest niezmienny — po kazdej zmianie powstaje nowy
   obiekt — wiec wystarczy zapamietac wynik przy nim samym. */
const layoutCache = new WeakMap();
/* Kazde pomieszczenie ma wlasny uklad: ciagi roznych pomieszczen nie stoja
   w jednym rzucie, wiec nie moga ze soba kolidowac ani skladac sie w rog.
   `info` laczy wszystkie (ciag ma jedno pomieszczenie, wiec klucze sie nie
   gryza), a `pokoje` trzyma uklad kazdego osobno — do kolizji otwierania. */
const projectLayout = (project) => {
  if (layoutCache.has(project)) return layoutCache.get(project);
  const info = new Map();
  const pokoje = new Map();
  const ids = [...new Set([...roomsOf(project).map((r) => r.id),
    ...(project.runs || []).map((r) => roomOfRun(project, r))])];
  ids.forEach((id) => {
    const runs = drawableRuns(project, id);
    if (!runs.length) return;
    const L = runLayout(assemblyParts(project, runs));
    pokoje.set(id, L);
    L.info.forEach((n, k) => info.set(k, n));
  });
  const L = { info, pokoje, corners: [...info.values()].some((n) => n.corner) };
  layoutCache.set(project, L);
  return L;
};

// styki korpusow wzdluz ciagu, liczone od lewej krawedzi pierwszej szafki
const runJoints = (project, run) => {
  const list = runItems(project, run.id);
  const joints = [];
  let x = 0;
  list.forEach(({ it }, k) => {
    x += computeGeo(it.cab, it.mat).W;
    if (k < list.length - 1) { joints.push(x); x += run.gap || 0; }
  });
  return { joints, total: x, list };
};

const runPlinth = (project, run) => {
  const { joints, total, list } = runJoints(project, run);
  if (!list.length) return null;
  const p = run.plinth || list[0].it.cab.plinth;
  if (!p || !p.on) return null;
  const h = Math.max(0, Math.round(p.height || 0));
  if (!(h > 0)) return null;
  /* W rogu cokoly obu scian spotykaja sie pod katem prostym i jeden musi zajsc
     za drugi — inaczej stalyby obok siebie i jeden wystawalby w powietrze.
     Cokol tej sciany konczy sie wiec na TYLE cokolu prostopadlego, a nie na
     koncu szafki naroznej: reszta jej lica jest juz zaslonieta ramieniem. */
  let dl = total;
  const n = projectLayout(project).info.get(run.id);
  const arm = n && n.pair && n.pair.wchodzi.id === run.id ? n.arm || null : null;
  const mojeRamie = arm || [...projectLayout(project).info.values()]
    .map((k) => k.arm).find((a) => a && a.run.id === run.id);
  if (mojeRamie && mojeRamie.free > 0) {
    const c = mojeRamie.cab;
    const t = c.geo.t;
    /* Koniec cokolu: lico ramienia plus grubosc jego cokolu i jeszcze grubosc
       plyty, na ktora ma zachodzic. Cokoly obu scian nie stykaja sie w rogu
       czolami — jeden idzie na zakladke po drugim. */
    const koniec = Math.round(c.x + mojeRamie.free + 2 * t);
    if (koniec > 0 && koniec < total) dl = koniec;
  }
  return { total: dl, h,
    ...splitAtJoints(dl, joints.filter((j) => j < dl), run.plinthCuts, USABLE_W, run.plinthCutsWlasne),
    mat: list[0].it.mat, grainMatters: list[0].it.cab.grainMatters, name: run.name };
};

/* Blat idzie nad calym ciagiem jedna plaszczyzna. Bierzemy go od lewego wysuniecia
   pierwszej szafki z blatem do prawego wysuniecia ostatniej — wysuniecia
   wewnetrzne znikaja, bo to jedna plyta, a nie kilka stykajacych sie. */
/* Ile blat wystaje przed lico frontow. Glebokosc blatu jest wymiarem
   rzeczywistym — od sciany do jego konca — wiec ten wysieg wchodzi w nia. */
const WORKTOP_OVERHANG = 10;
/* Blat kupuje sie w gotowym pasie 600 albo 1200 mm i nie docina z glebokosci,
   dopoki wystaje przed drzwi najwyzej tyle — do sciany i tak dopasowuje sie go
   na miejscu. Wiecej znaczy zwykle, ze zle jest odsuniecie od sciany albo
   glebokosc szafek, i dopiero wtedy pytamy, czy blat ciac. */
const WORKTOP_MAX_OVERHANG = 30;
/* Drzwi na zawiasach puszkowych nie leza na krawedzi korpusu — przy zawiasach
   zostaje ok. 2 mm szczeliny. To wytyczna montazowa: nie ma jej na rysunkach
   ani w wymiarach, liczy sie tylko do tego, ile blat wystaje przed fronty. */
const HINGE_PLAY = 2;

/* Odcinki blatu do rysunku. Skrajne dociagamy do konca calej plyty, bo nad
   rogiem blat idzie dalej niz szafki, ktore pod nim stoja. */
const worktopSpans = (rt) => {
  if (!rt || !(rt.spans || []).length) return [];
  const s = rt.spans.map((x) => ({ ...x })).sort((a, b) => a.x0 - b.x0);
  s[0].x0 = Math.min(s[0].x0, rt.x0);
  s[s.length - 1].x1 = Math.max(s[s.length - 1].x1, rt.x0 + rt.total);
  // ...i przycinamy do niej: przy rogu blat konczy sie na krawedzi sasiada
  s.forEach((x) => { x.x0 = Math.max(x.x0, rt.x0); x.x1 = Math.min(x.x1, rt.x0 + rt.total); });
  const zostaje = s.filter((x) => x.x1 > x.x0);
  if (!zostaje.length) return [];
  /* Blat nad sasiadujacymi szafkami to jedna plyta, a nie kawalek na szafke —
     rysowany osobno pokazywal szwy tam, gdzie ich nie ma. Rozdziela go dopiero
     przerwa miedzy szafkami. */
  const out = [zostaje[0]];
  zostaje.slice(1).forEach((x) => {
    const p = out[out.length - 1];
    if (x.x0 <= p.x1) { p.x1 = Math.max(p.x1, x.x1); p.depth = Math.max(p.depth, x.depth); }
    else out.push(x);
  });
  return out;
};

/* Szafki ciagu pogrupowane po wysokosci lica. Blat idzie nad ta grupa, ktora
   zajmuje najwiecej miejsca — reszta to slupki albo szafka z rozjechana
   wysokoscia, i jedno od drugiego rozni sie tylko skala roznicy. */
const worktopLevel = (project, run) => {
  const { list } = runJoints(project, run);
  if (!list.length) return null;
  const gap = Math.max(0, Math.round(run.gap || 0));
  let x = 0;
  const cabs = list.map(({ it, i }, k) => {
    const geo = computeGeo(it.cab, it.mat);
    const o = { it, idx: i, geo, x0: x, x1: x + geo.W, y: cabTopY(it.cab, geo) };
    x += geo.W;
    if (k < list.length - 1) x += gap;
    return o;
  });
  const szer = new Map();
  cabs.forEach((c) => szer.set(c.y, (szer.get(c.y) || 0) + (c.x1 - c.x0)));
  const y = [...szer.entries()].sort((a, b) => b[1] - a[1] || a[0] - b[0])[0][0];
  return { cabs, y, pod: cabs.filter((c) => c.y === y), poza: cabs.filter((c) => c.y !== y) };
};

/* Blat ciagu liczy sie z calego projektu, a pyta o niego kilkanascie miejsc
   przy kazdym przerysowaniu (rysunki, uwagi, zestawienie) — kazde przeliczalo
   geometrie wszystkich szafek ciagu. Projekt jest niezmienny (kazda zmiana to
   nowy obiekt), wiec wynik zapamietujemy przy nim i przy obiekcie ciagu; kopia
   ciagu po prostu nie trafi w pamiec i policzy sie od nowa. */
const runTopCache = new WeakMap();
const runTop = (project, run, bezRogu = false) => {
  if (!project || !run || typeof run !== "object") return runTopLiczy(project, run, bezRogu);
  let m = runTopCache.get(project);
  if (!m) { m = new WeakMap(); runTopCache.set(project, m); }
  let e = m.get(run);
  if (!e) { e = {}; m.set(run, e); }
  const k = bezRogu ? "b" : "n";
  if (!(k in e)) e[k] = runTopLiczy(project, run, bezRogu);
  return e[k];
};
const runTopLiczy = (project, run, bezRogu = false) => {
  const { joints, list } = runJoints(project, run);
  /* Pas moze byc pusty, a i tak potrzebowac blatu: lezy w nim ramie szafki
     naroznej z sasiedniej sciany. */
  /* Ramie lezy w tym pasie, ale nalezy do szafki z sasiedniej sciany — i to jej
     ciag decyduje, czy ma nad soba blat. Pytanie o `run.worktop` zostawialo rog
     bez blatu, gdy pas za rogiem byl pusty i nikt mu blatu nie wlaczyl. */
  const ramiona = ((projectLayout(project).info.get(run.id) || {}).arms || [])
    .filter((a) => (a.run && a.run.run && a.run.run.worktop) || run.worktop);
  if (!list.length && !ramiona.length) return null;
  const gap = Math.max(0, Math.round(run.gap || 0));
  let x = 0;
  const spans = [];
  /* Blat roboczy ciagu obejmuje wszystkie szafki jednej wysokosci, niezaleznie
     od tego, co ma ustawione pojedyncza szafka. Slupek jest wyzszy, wiec blat
     konczy sie przy jego boku i do niego dolega. */
  const lvl = run.worktop ? worktopLevel(project, run) : null;
  /* Blat liczy sie od sciany na wysokosci blatu: odstep od niej, korpus,
     szczelina przy zawiasach, front i wysieg przed fronty. */
  if (lvl && lvl.pod.length) {
    lvl.pod.forEach((c) => {
      // od sciany do lica korpusu razem z plecami przybijanymi (szafka stoi o nie dalej)
      const gl = Math.round((c.geo.glebOdSciany ?? c.geo.carcassDepth) - (Number(c.it.offset) || 0));
      const odSciany = wallGapOf(run, c.it).top;
      spans.push({ x0: c.x0, x1: c.x1,
        depth: odSciany + gl + HINGE_PLAY + c.geo.tf + WORKTOP_OVERHANG,
        odSciany, worktop: true, rear: c.it.cab.back !== "none" });
    });
  }
  /* Ramie szafki naroznej lezy w pasie sasiedniej sciany i tez chce blat nad
     soba — bez tego blat konczyl sie na korpusie, a rog zostawal goly. */
  if (ramiona.length) {
    const n = projectLayout(project).info.get(run.id) || { lead: 0 };
    const odSciany = wallGapOf(run, null).top;
    ramiona.forEach((a) => {
      spans.push({ x0: a.u0 - (n.lead || 0), x1: a.u0 - (n.lead || 0) + a.len,
        depth: odSciany + a.depth + HINGE_PLAY + a.cab.geo.tf + WORKTOP_OVERHANG,
        odSciany,
        // grubosc frontu ramienia — pas z samym ramieniem nie ma jej skad wziac
        tf: a.cab.geo.tf,
        worktop: true, rear: a.cab.cab.back !== "none" });
    });
  }
  if (!(lvl && lvl.pod.length)) {
  list.forEach(({ it }, k) => {
    const geo = computeGeo(it.cab, it.mat);
    if (geo.isBlat)
      spans.push({ x0: x + geo.topX0, x1: x + geo.topX1, depth: geo.blatDepth,
        worktop: geo.isWorktop,
        rear: it.cab.back !== "none" || geo.blat.overBack > 0 });
    x += geo.W;
    if (k < list.length - 1) x += gap;
  });
  }
  if (!spans.length) return null;
  /* Przy narożniku o koncu blatu decyduje rog, a nie wysuniecie blatu szafki:
     albo blat idzie nad rogiem, albo konczy sie przy boku sasiada. */
  const ext = (project.runs || []).some((r) => r.corner)
    ? (projectLayout(project).info.get(run.id) || {}).topSpan : null;
  /* Blat dojezdzajacy do rogu styka sie z krawedzia przechodzacego, a ta lezy
     dalej od sciany niz lico szafek — o tyle go skracamy. Bez tego oba blaty
     zachodzily na siebie i ten krotszy wychodzil w zamowieniu za dlugi. */
  const doKrawedzi = (id, gl) => {
    if (!id || bezRogu) return 0;
    const r = (project.runs || []).find((x) => x.id === id);
    const rp = r ? runTop(project, r, true) : null;
    if (!rp) return 0;
    /* Blat liczy sie od sciany pod blatem, a uklad ciagu — od sciany przy
       podlodze. Przy krzywej scianie roznica miedzy nimi przesuwa krawedz. */
    const g = wallGapOf(r, null);
    return Math.max(0, Math.round(rp.depth + g.bottom - g.top - gl));
  };
  const x0 = ext && ext.cor0 ? Math.round(ext.x0) + doKrawedzi(ext.przez0, ext.glPrzez0)
    : Math.min(...spans.map((s) => s.x0));
  const x1 = ext && ext.cor1 ? Math.round(ext.x1) - doKrawedzi(ext.przez1, ext.glPrzez1)
    : Math.max(...spans.map((s) => s.x1));
  const total = Math.round(x1 - x0);
  /* Blat roboczy tnie sie z gotowego odcinka, wiec jego granica jest dlugosc
     handlowa, a nie formatka plyty. */
  const worktop = spans.some((s) => s.worktop);
  const mat0 = list.length ? list[0].it.mat : ramiona[0].cab.rawMat;
  return {
    total, x0, worktop,
    /* Odcinki, ktore blat naprawde zakrywa — rysunek bierze je wprost, zeby
       plaszczyzna konczyla sie tam, gdzie konczy sie mebel pod nia. */
    spans: spans.map((s) => ({
      x0: Math.round(s.x0), x1: Math.round(s.x1), depth: Math.round(s.depth) })),
    th: Math.round(worktop
      ? (mat0.worktop || {}).thickness || 38
      : (mat0.board || {}).thickness || 18),
    /* Wysokosc lica, na ktorym blat lezy — elewacja rysuje go wlasnie stad.
       Pas z samym ramieniem bierze ja z szafki, do ktorej ramie nalezy. */
    y: lvl && lvl.pod.length ? lvl.y
      : ramiona.length ? cabTopY(ramiona[0].cab.cab, ramiona[0].cab.geo) : 0,
    // konce ciete na 45 stopni — na formatce trzeba je zaznaczyc
    skos0: !!(ext && ext.skos0), skos1: !!(ext && ext.skos1),
    /* Koniec blatu wolny = widoczny, do oklejenia (uzytkownik 2026-09-29: blat
       oklejany od zewnetrznej strony). Nie jest wolny w rogu (styk z drugim
       blatem albo sciana, do ktorej dochodzi przechodzacy) ani przy wyzszej
       szafce (slupek), do ktorej blat dolega. */
    wolny0: !(ext && ext.cor0) && !(lvl && lvl.poza.some((c) => Math.abs(c.x1 - x0) <= 2)),
    wolny1: !(ext && ext.cor1) && !(lvl && lvl.poza.some((c) => Math.abs(c.x0 - x1) <= 2)),
    matKey: worktop ? "worktop" : "board",
    ...(() => {
      /* Szerokosc zamawiana. `surowa` to blat ze standardowym wysiegiem 10 mm,
         `doLica` — od sciany do lica drzwi. Arkusz musi wyjsc przed drzwi choc
         o milimetr; caly pas zamawiamy, dopoki wystaje najwyzej 30 mm. Dalej
         domyslnie docinamy na wymiar, a uzytkownik moze to odwrocic
         (`run.topCut`: true = docięty, false = caly arkusz). */
      const surowa = Math.round(Math.max(...spans.map((s) => s.depth)));
      const doLica = surowa - WORKTOP_OVERHANG;
      const arkusz = worktop ? WORKTOP_DEPTHS.find((d) => d - doLica >= 1) || null : null;
      const wysiegArkusza = arkusz ? arkusz - doLica : null;
      const pelny = !!arkusz && (run.topCut === false
        || (run.topCut !== true && wysiegArkusza <= WORKTOP_MAX_OVERHANG));
      const depth = pelny ? arkusz : arkusz ? Math.min(surowa, arkusz) : surowa;
      return { surowa, arkusz, docinka: arkusz ? arkusz - depth : 0, pelnyArkusz: pelny,
        depth, doLica, wysiegArkusza, wysieg: depth - doLica,
        odSciany: Math.max(0, ...spans.map((s) => s.odSciany || 0)) };
    })(),
    rear: spans.some((s) => s.rear),
    // styki przeliczamy na uklad samej plyty, zeby ciecia liczyly sie od jej konca
    ...splitAtJoints(total, joints.filter((j) => j > x0 && j < x1).map((j) => Math.round(j - x0)),
      run.topCuts, worktop ? WORKTOP_LEN : USABLE_W, run.topCutsWlasne),
    /* Pas z samym ramieniem nie ma wlasnych szafek — material bierze wtedy
       od tej, do ktorej ramie nalezy. */
    mat: mat0,
    grainMatters: list.length ? list[0].it.cab.grainMatters : ramiona[0].cab.cab.grainMatters,
    name: run.name,
  };
};

// rowne kawalki lacza sie w jedna pozycje zamowienia
const runPlinthPanels = (rp) => {
  if (!rp) return [];
  const map = new Map();
  rp.lens.forEach((len) => map.set(len, (map.get(len) || 0) + 1));
  return [...map.entries()].map(([len, qty]) => ({
    name: "Cokół ciągu", qty, a: len, b: rp.h, matKey: "board",
    edges: { a1: false, a2: true, b1: true, b2: true },
    note: rp.n > 1 ? "krawędź dolna oraz oba końce, w tym łączenie" : "krawędź dolna oraz oba końce",
  }));
};

/* Kolumna korpusu, ktora styka sie z ramieniem. Ramie wychodzi bokiem, wiec
   polka ramienia konczy sie wlasnie na polkach tej kolumny — z niej bierzemy
   i liczbe polek, i wysokosci do sprawdzenia. */
const armColumn = (side, lv) => {
  const cs = (lv && lv.cols) || [];
  return (side === "right" ? cs[cs.length - 1] : cs[0]) || null;
};
const armShelfYs = (side, levels) => {
  const ys = [];
  (levels || []).forEach((lv) =>
    ((armColumn(side, lv) || {}).shelves || []).forEach((s) => ys.push(Math.round(s.y))));
  return ys;
};

/* Formatka i okucia wstawki w rogu. Z plyty frontowej (jest widoczna), na
   wysokosc korpusu. Plaska: grubosc plyty od przodu, 60 mm w glab, przykrecona
   od srodka szafki przez bok wkretami co ok. 200 mm. Szeroka: 60 mm licem do
   przodu, na trojkatach po obu stronach (2 na strone przy 720). Plaska ma
   oklejona krawedz przednia i dolna, szeroka tylko dolna (ustalone
   z uzytkownikiem 2026-09-27/28). */
const wstawkaParts = (ws) => {
  const H = Math.round(ws.H);
  const plaska = ws.typ === "plaska";
  /* Szeroka stoi licem do przodu, a jej boki stykaja sie z bokami szafek —
     widac tylko dolna krawedz (ustalone 2026-09-28). */
  const panels = [{ name: "Wstawka w rogu", qty: 1, a: H, b: plaska ? ws.gl : ws.u, matKey: "front",
    edges: plaska ? { a1: true, a2: false, b1: true, b2: false } : { a1: false, a2: false, b1: true, b2: false },
    note: plaska
      ? "płasko przy boku szafki, licuje się z drzwiami — krawędź przednia i dolna"
      : "licem do przodu, na trójkątach — oklejona tylko dolna krawędź (boki stykają się z szafkami)" }];
  const hardware = plaska
    ? [{ name: "Wkręt 4 × 30", use: "wstawka w rogu — od środka szafki przez bok, co ok. 200 mm",
        spec: `wstawka w rogu: ${Math.max(2, Math.ceil(H / 200))} szt. co ok. 200 mm`,
        qty: Math.max(2, Math.ceil(H / 200)), unit: "szt." }]
    : [{ name: "Trójkąt meblarski", use: "wstawka w rogu — po obu jej stronach, co ok. 400 mm",
        spec: `wstawka w rogu: 2 × ${Math.max(2, Math.ceil(H / 400))} szt. (po obu stronach)`,
        qty: 2 * Math.max(2, Math.ceil(H / 400)), unit: "szt." }];
  return { panels, hardware };
};
const wstawkiOf = (layout) => [...layout.info.values()].flatMap((n) => n.wstawki || []);
/* Wstawka w ukladzie samej szafki (widoki „Szafka”): przy lewym boku, gdy
   szafka zaczyna ciag od rogu, inaczej przy prawym. Wysokosc korpusu, w licu
   drzwi, `gl` w glab od lica. Bez tego wstawka byla tylko w formatkach szafki
   i w widoku ciagu — na rysunku samej szafki jej brakowalo (zgloszenie
   uzytkownika 2026-09-28). */
const wstawkiSzafki = (ws, geo) => (ws || []).map((w) => ({
  x0: w.naStarcie ? -w.u : geo.W, x1: w.naStarcie ? 0 : geo.W + w.u,
  u: w.u, gl: w.gl, H: w.H, typ: w.typ, lewa: !!w.naStarcie }));

/* Formatki ramienia szafki naroznej. Plyty poziome i plecy sa osobnymi
   kawalkami dostawionymi na kolki do korpusu — tak jak w kupnych szafkach
   naroznych — bo w calosci nie da sie ich ani okleic, ani wnieść. */
// glebokosc korpusu ramienia: od plecow (przy scianie) do lica
const armKorpus = (a) => Math.max(0, Math.round(a.depth - armPlan(a).tb));
const cornerArmParts = (a) => {
  const geo = a.cab.geo;
  const cab = a.cab.cab;
  const t = geo.t;
  const H = cab.H;
  // ramie liczymy od lica korpusu: to, co wystaje poza jego glebokosc
  const len = Math.max(0, a.len);
  const inner = Math.max(0, H - 2 * t);
  const panels = [];
  if (len <= 0) return { panels, hardware: [] };
  /* Ramie idzie za szafka, do ktorej nalezy: pod blatem nie ma wienca, wiec i
     ramie go nie ma — zamiast niego dostaje te sama pare wzmocnien. */
  const armTop = geo.hasTop;
  /* Ramie jest zbudowane jak korpus (tak tez je rysujemy): bok na wolnym koncu
     na cala wysokosc i glebokosc, a dno — i wieniec, gdy jest — miedzy
     korpusem a tym bokiem, na pelna glebokosc. Wczesniej formatki mialy
     glebokosc o grubosc plyty mniejsza i bok miedzy dnem a gora, a rysunek
     pokazywal co innego (ustalone z uzytkownikiem 2026-09-27). */
  /* Plecy ramienia stoja przy scianie (v od 0 do grubosci plecow), a korpus
     ramienia przed nimi — tak jak w kazdej szafce z plecami przybijanymi. Glebokosc
     `a.depth` to glebokosc sasiedniego ciagu od sciany razem z jego plecami
     (od 2026-09-28), wiec bok i dno ramienia sa o plecy krotsze. */
  const korpusR = armKorpus(a);
  panels.push({ name: armTop ? "Wieniec i dno ramienia" : "Dno ramienia", qty: armTop ? 2 : 1,
    a: Math.max(0, len - t), b: korpusR, matKey: "board",
    edges: { a1: true, a2: false, b1: true, b2: false }, note: "czoło i koniec przy wsporniku" });
  /* Wzmocnienia ramienia nie sa juz jedna pozycja na dwie sztuki: czolowe
     konczy sie na katowniku przy drzwiach, a tylne idzie dalej — az do
     katownika w tylnym narozniku, bo tam ma sie czego trzymac. */
  const plan = armPlan(a);
  plan.rails.forEach((r) => panels.push({
    name: r.przyTyle ? "Wzmocnienie ramienia — tylne" : "Wzmocnienie ramienia — czołowe",
    qty: 1, a: Math.max(0, Math.round(r.u1 - r.u0)), b: r.wys, matKey: "board",
    edges: { a1: true, a2: false, b1: true, b2: false },
    note: r.przyTyle
      ? "stojące przy plecach, od kątownika w narożniku po bok ramienia"
      : (r.stojace ? "stojące" : "na płask") + " pod blatem, od kątownika przy drzwiach po bok ramienia",
  }));
  panels.push({ name: "Bok ramienia", qty: 1, a: H, b: korpusR, matKey: "board",
    edges: { a1: true, a2: false, b1: false, b2: false }, note: "czoło" });
  /* Plecy ramienia siegaja poza samo ramie: wzdluz drugiej sciany biegna dalej,
     az do katownika w tylnym narozniku — inaczej zostawal tam goly kawalek. */
  if (plan.back)
    // HDF jak w korpusie: na cala wysokosc z luzem 1 mm z kazdej strony
    panels.push({ name: plan.back.plyta ? "Plecy ramienia z płyty" : "Plecy ramienia", qty: 1,
      a: Math.round(plan.back.u1 - plan.back.u0), b: plan.back.plyta ? inner : H - 2,
      matKey: plan.back.plyta ? "board" : "back",
      edges: { a1: false, a2: false, b1: false, b2: false },
      note: [plan.tyl > 0 ? "sięgają do kątownika w tylnym narożniku" : "",
        plan.back.plyta ? "pełna płyta zamiast HDF — usztywnia róg" : ""]
        .filter(Boolean).join(", ") });
  // front ramienia bierze wysokosc z frontow samej szafki, zeby stanely w linii
  const d0 = (geo.doors || []).find((d) => d.h > 0 && d.type !== "blenda");
  /* Wariant „fix": ramie zaslepia plyta przykrecona na staly, a otwierac sie
     bedzie tylko front korpusu — tak sie robi, gdy w rogu i tak nic nie stoi. */
  const fix = a.doors === "fix";
  /* Przy katowniku front ramienia konczy sie na maskownicy i luzie, a nie na
     koncu ramienia — `armFrontPlan` ma to juz policzone, tak samo jak rysunki. */
  panels.push({ name: fix ? "Fix ramienia" : "Front ramienia", qty: 1,
    a: armFrontPlan(a).w,
    b: d0 ? Math.round(d0.h) : H, matKey: "front",
    edges: { a1: true, a2: true, b1: true, b2: true }, note: "cztery krawędzie" });
  /* Katownik trzyma kat prosty i daje obu skrzydlom o co sie oprzec przy
     zamknieciu. Cztery plyty na cala wysokosc: dwie w srodku i dwie na czole,
     wszystkie skrecone ze soba. Przy drzwiach lamanych albo skreconych na staly
     kat nie jest potrzebny.

     Formatki po 60 mm, bo mniejszej nie da sie uciac ani okleic — dlatego jedna
     plyta nachodzi na czolo drugiej. Nachodzaca ma obie dlugie krawedzie na
     wierzchu, doczolowa chowa jedna w styku i tej sie nie oklei. */
  if (a.bracket) {
    const w = a.bracket.w;
    const hM = d0 ? Math.round(d0.h) : H;
    panels.push({ name: "Kątownik narożnika — nachodzący", qty: 1, a: w, b: inner, matKey: "board",
      edges: { a1: false, a2: false, b1: true, b2: true }, note: "obie krawędzie pionowe" });
    panels.push({ name: "Kątownik narożnika — doczołowy", qty: 1, a: w, b: inner, matKey: "board",
      edges: { a1: false, a2: false, b1: true, b2: false },
      note: "krawędź pionowa od strony wnętrza — druga wchodzi w styk" });
    panels.push({ name: "Maskownica kątownika — nachodząca", qty: 1, a: w, b: hM, matKey: "front",
      edges: { a1: true, a2: true, b1: true, b2: false }, note: "krawędź pionowa oraz góra i dół" });
    panels.push({ name: "Maskownica kątownika — doczołowa", qty: 1, a: w, b: hM, matKey: "front",
      edges: { a1: true, a2: true, b1: true, b2: false }, note: "krawędź pionowa oraz góra i dół" });
  }
  /* Polki w ramieniu ida osobno, tak jak plyty poziome — w calosci w L nikt ich
     nie okleji ani nie wniesie. Liczba idzie za kolumna przy ramieniu, bo to na
     jej polkach polka ramienia sie konczy — polka bez pary wisialaby w powietrzu.
     Poziomy sumujemy, bo kazdy z nich ma wlasny podzial na wysokosc. */
  const polek = armShelfYs(a.side, geo.levels).length;
  if (polek > 0)
    // za katownikiem naroznika w licu ramienia (gdy jest) — jak polka korpusu
    panels.push({ name: "Półka ramienia", qty: polek, a: len - t, b: a.depth - (geo.tb || t) - (a.bracket ? t : 0), matKey: "board",
      edges: { a1: true, a2: false, b1: false, b2: false }, note: "krawędź przednia" });
  // cokol idzie dalej pod ramieniem — to osobny kawalek wzdluz drugiej sciany
  if (a.cab.plinthH > 0)
    panels.push({ name: "Cokół ramienia", qty: 1, a: len, b: a.cab.plinthH, matKey: "board",
      edges: { a1: false, a2: true, b1: true, b2: true }, note: "krawędź dolna oraz oba końce" });
  /* Fix nie ma zawiasow — trzyma sie na zlaczkach od srodka, zeby z zewnatrz
     nie bylo nic widac. */
  /* Fix przykreca sie od srodka na trojkaty meblarskie — tak samo jak cokol
     bez nozek. Trojkatow nie wpisujemy na sztywno: para na kazdym koncu i
     kolejna co ok. 400 mm wysokosci, zeby wysoki fix nie trzymal sie na
     czterech. Zawiasow tyle, ile wychodzi z wysokosci i szerokosci skrzydla —
     tak samo jak przy drzwiach szafki. */
  const trojkatow = 2 * Math.max(2, Math.ceil(inner / 400));
  const zawiasow = autoHinges(d0 ? Math.round(d0.h) : H, armFrontPlan(a).w);
  /* Skrzydla lamane: drugie skrzydlo wisi na pierwszym, a nie na korpusie,
     wiec zwyklych zawiasow do niego nie ma — sa tylko lamane. */
  const hardware = fix
    ? [{ name: "Trójkąt meblarski", use: "fix ramienia szafki narożnej, od środka, 2 rzędy co ok. 400 mm",
        spec: `fix ramienia szafki narożnej, przykręcany od środka: 2 rzędy po ${trojkatow / 2} na ${fmt(inner)} mm`,
        qty: trojkatow, unit: "szt." }]
    : a.doors === "lamane"
      ? []
      : [{ name: "Zawias", use: "front ramienia szafki narożnej",
          spec: "front ramienia szafki narożnej",
          qty: zawiasow, unit: "szt." }];
  /* Ramie liczy okucia tak samo jak szafka: konfirmaty na stykach plyt
     poziomych z bokiem, kolki pod polke, wkrety do wzmocnien i katownika,
     nozki pod wolnym koncem. Bez tego zamowienie mowilo tylko o zawiasach. */
  const konfQty = (armTop ? 2 : 1) * konfirmatyNaStyk(korpusR);
  if (konfQty)
    hardware.push({ name: "Konfirmat 7 × 50",
      use: "złącza ramienia szafki narożnej, co ok. 200 mm styku",
      spec: `ramię szafki narożnej: ${armTop ? "wieniec i dno" : "dno"} do boku ramienia`,
      qty: konfQty, unit: "szt." });
  /* Zawieszki w czesci ramienia wisza na drugiej scianie — pod nimi odcinek
     listwy (domyslnie) albo hak: `corner.armHanger` (uzytkownik 2026-09-29).
     Przy B w czesci ramienia listwa biegnie od plyty wzmocnienia do boku ramienia. */
  const zw = geo.zawieszki || {};
  if (zw.naRamieniu && cab.hangerMode !== "haczyki") {
    if ((cab.corner || {}).armHanger === "hak")
      hardware.push({ name: "Hak / wkręt z kołkiem do ściany", use: "zawieszki ramienia szafki narożnej bez listwy",
        spec: "pod zawieszką w części ramienia — po jednym na zawieszkę", qty: zw.naRamieniu, unit: "szt." });
    else {
      const wzm = (geo.postRects || []).find((q) => q.nazwa === "plecy");
      const dl = Math.max(0, Math.round(zw.gdzie === "ramie" && wzm ? len + geo.carcassDepth - wzm.v0 - 40 : len - 40));
      hardware.push({ name: "Listwa montażowa do zawieszek", use: "pod zawieszki szafek wiszących",
        spec: `ramię szafki narożnej: odcinek ${fmt(dl)} mm przy drugiej ścianie`,
        qty: Math.round(dl / 100) / 10, unit: "mb" });
    }
  }
  if (polek > 0 && mocowaniePolek(cab) === "pins")
    hardware.push({ name: "Kołek podporowy ⌀5",
      use: "półki ramienia narożnika, po cztery na półkę",
      spec: "półki ramienia, po cztery na półkę", qty: polek * 4, unit: "szt." });
  if (polek > 0 && mocowaniePolek(cab) === "trojkaty")
    hardware.push({ name: "Trójkąt meblarski",
      use: "półki ramienia narożnika na trójkątach, po cztery na półkę",
      spec: `półki ramienia na trójkątach: 4 szt. na półkę × ${polek}`, qty: polek * 4, unit: "szt." });
  {
    const naPlyte = Math.max(2, Math.ceil(inner / 200));
    const opis = [];
    let wk = 0;
    if (plan.rails.length) { wk += plan.rails.length * 4; opis.push(`wzmocnienia ${plan.rails.length}×4`); }
    if (a.bracket) { wk += 4 * naPlyte; opis.push(`kątownik narożnika 4×${naPlyte}`); }
    if (wk) hardware.push({ name: "Wkręt 4 × 30",
      use: "wzmocnienia i kątownik ramienia narożnika — 4 na wzmocnienie, kątownik co ok. 200 mm",
      spec: `ramię szafki narożnej: ${opis.join(", ")} szt.`, qty: wk, unit: "szt." });
  }
  if (cab.legs && cab.legs.on) {
    // te same miejsca, ktore rysuje elewacja i bryla — `armLegPlan`
    const lp = armLegPlan(a);
    hardware.push({ name: "Nóżka regulowana",
      use: "pod ramieniem szafki narożnej",
      spec: `pod ramieniem szafki narożnej, wysokość ${fmt(cab.legs.height || 100)} mm: `
        + `${lp.us.length} pary — przy rogu, ${lp.us.length > 2 ? "na środku i " : ""}pod wolnym końcem`,
      qty: lp.ile, unit: "szt." });
  }
  /* Zawiasow lamanych tyle samo, co zwyklych na tej wysokosci — spinaja
     skrzydla na calej dlugosci styku, wiec przy wysokim froncie dwa to za malo. */
  if (a.doors === "lamane")
    hardware.push({ name: "Zawias łamany 90°",
      use: "drugie skrzydło szafki narożnej, spięte z pierwszym",
      spec: "spina drugie skrzydło z pierwszym — pierwsze wisi na boku na zawiasie 165°",
      qty: zawiasow, unit: "szt." });
  return { panels, hardware };
};

/* Plan wiercen tego, co nie jest w geometrii samej szafki (uzytkownik
   2026-09-29): ramie szafki w L — konfirmaty dna/wienca ramienia w boku
   ramienia, kolki polek ramienia, zawiasy frontu ramienia, trojkaty fixu
   ramienia — i trojkaty wstawki szerokiej w rogu. Te same liczby co okucia
   (`cornerArmParts`, `wstawkaParts`). Wiersze jak w `geo.drillPlan`. */
const wierceniaDodatkowe = (a, wstawki = []) => {
  const out = [];
  const plyta = (panel) => { let p = out.find((q) => q.panel === panel); if (!p) out.push(p = { panel, rows: [] }); return p; };
  const wiersz = (panel, kind, ys, note) => plyta(panel).rows.push({ kind, ys: ys.map((v) => Math.round(v)), note });
  const rowno = (lo, hi, n) => (n <= 1 ? [(lo + hi) / 2] : [...Array(n)].map((_, i) => lo + ((hi - lo) * i) / (n - 1)));
  if (a && a.len > 0) {
    const geo = a.cab.geo, cab = a.cab.cab, t = geo.t, H = cab.H;
    const korpusR = armKorpus(a);
    const lista = (xs) => xs.map((v) => fmt(v)).join(", ");
    const kon = `⌀7 w boku ramienia, ${lista(konfirmatyPoz(korpusR))} mm od przedniej krawędzi; w czole płyty ⌀5 × 50`;
    wiersz("Bok ramienia", "konfirmat — dno ramienia", [geo.bottomY + t / 2], kon);
    if (geo.hasTop) wiersz("Bok ramienia", "konfirmat — wieniec ramienia", [H - t / 2], kon);
    const ys = armShelfYs(a.side, geo.levels);
    if (ys.length && mocowaniePolek(cab) !== "confirmat") {
      const przod = a.bracket ? t : 0, gl = a.depth - (geo.tb || t) - (a.bracket ? t : 0);
      const pin = cab.shelfPin || {};
      const pf = num(pin.dFront) ?? 37, pb = num(pin.dBack) ?? 37;
      if (mocowaniePolek(cab) === "trojkaty")
        wiersz("Bok ramienia", "trójkąt meblowy", ys,
          `2 rzędy — pod półką ramienia, przy jej przedniej i tylnej krawędzi: ${fmt(przod + KONF_OD_KRAWEDZI)} i ${fmt(przod + gl - KONF_OD_KRAWEDZI)} mm od przedniej krawędzi płyty; wysokość = spód półki; tu 2 z 4`);
      else
        wiersz("Bok ramienia", "kołek półki", ys,
          `⌀5, ${fmt(przod + pf)} i ${fmt(przod + gl - pb)} mm od przedniej krawędzi płyty; wysokość = spód półki; tu 2 z 4 kołków półki`);
    }
    const d0 = (geo.doors || []).find((d) => d.h > 0 && d.type !== "blenda");
    if (a.doors === "fix") {
      const inner = Math.max(0, H - 2 * t);
      const n = Math.max(2, Math.ceil(inner / 400));
      wiersz("Fix ramienia", "trójkąt meblowy", rowno(KONF_OD_KRAWEDZI, inner - KONF_OD_KRAWEDZI, n),
        "od środka, 2 rzędy — położenie od dołu fixu");
    } else if (a.doors !== "lamane") {
      const n = autoHinges(d0 ? Math.round(d0.h) : H, armFrontPlan(a).w);
      const dRef = (geo.doors || []).find((d) => d.h > 0 && d.type === "door" && (d.hingePts || []).length === n);
      const hys = dRef ? dRef.hingePts : d0 ? hingePositions(d0.y, d0.h, n, []).pts : rowno(100, H - 100, n);
      wiersz("Bok ramienia", "zawias", hys, "oś zawiasu frontu ramienia — puszka ⌀35 we froncie, prowadnik na wewnętrznym licu boku");
    }
    // zawieszka w czesci ramienia (wzmocnienie A albo B „w części ramienia”) — patrz `zawieszki` w computeGeo
    if ((geo.zawieszki || {}).naRamieniu)
      wiersz("Bok ramienia", "zawieszka", [geo.hasTop ? H - t : H], zawieszkaNote(ZAWIESZKA_OD_PLECOW + (geo.backIntrusion || 0), 1));
  }
  (wstawki || []).filter((w) => w.typ !== "plaska").forEach((w) => {
    const H = Math.round(w.H), n = Math.max(2, Math.ceil(H / 400));
    wiersz("Wstawka w rogu", "trójkąt meblowy", rowno(KONF_OD_KRAWEDZI, H - KONF_OD_KRAWEDZI, n),
      "2 rzędy — po obu jej stronach, do boków sąsiednich szafek; położenie od dołu wstawki");
  });
  return out;
};

const runTopPanels = (rt) => {
  if (!rt) return [];
  /* Lyzwa zmienia sposob ciecia, wiec musi byc widoczna w samej nazwie —
     kolumna z oklejaniem mowi tylko o krawedziach. */
  const skos = (rt.skos0 ? 1 : 0) + (rt.skos1 ? 1 : 0);
  const name = skos ? `Blat ciągu (łyżwa 45° — ${skos === 2 ? "oba końce" : "jeden koniec"})` : "Blat ciągu";
  if (rt.matKey !== "worktop") {
    // blat z plyty 18 mm: czolo i oba konce jak dotad
    const map = new Map();
    rt.lens.forEach((len) => map.set(len, (map.get(len) || 0) + 1));
    return [...map.entries()].map(([len, qty]) => ({
      name, qty, a: len, b: rt.depth, matKey: rt.matKey,
      edges: { a1: true, a2: rt.rear, b1: true, b2: true },
      note: rt.n > 1 ? "czoło i oba końce, w tym łączenie" : "czoło i oba końce",
    }));
  }
  /* Blat roboczy: przod ma fabryczny profil, tyl stoi przy scianie — oklejamy
     tylko wolne konce (uzytkownik 2026-09-29, faktura: obrzeze ABS 43/2 na
     dwa konce). Laczenia kawalkow i konce w rogu / przy slupku zostaja bez. */
  const map = new Map();
  const ost = rt.lens.length - 1;
  rt.lens.forEach((len, k) => {
    const b1 = k === 0 && rt.wolny0 !== false, b2 = k === ost && rt.wolny1 !== false;
    const key = `${len}|${b1}|${b2}`;
    if (!map.has(key)) map.set(key, { len, b1, b2, qty: 0 });
    map.get(key).qty += 1;
  });
  return [...map.values()].map((g) => ({
    name, qty: g.qty, a: g.len, b: rt.depth, matKey: rt.matKey,
    edges: { a1: false, a2: false, b1: g.b1, b2: g.b2 },
    note: g.b1 && g.b2 ? "oba końce (przód z profilem)" : g.b1 || g.b2 ? "jeden koniec (przód z profilem)" : "bez oklejania — końce przy rogu, słupku albo łączeniu",
  }));
};

/* Listwa do zawieszek biegnie przez caly ciag jednym odcinkiem, a nie kawalkiem
   pod kazda szafka — inaczej szafki wisialyby kazda na swoim kawalku i nic by
   ich nie trzymalo w jednej linii. */
const RAIL_NAME = "Listwa montażowa do zawieszek";
const runRail = (project, run) => {
  const { total, list } = runJoints(project, run);
  if (list.length < 2) return null;
  if ((run.hangerMode || "listwa") !== "listwa") return null;
  // liczy sie tylko dla ciagu wiszacego — stojacy nie ma czego wieszac
  if (!list.every(({ it }) => !(it.cab.legs && it.cab.legs.on) && !(it.cab.plinth && it.cab.plinth.on)))
    return null;
  const len = Math.max(0, total - 40);
  return { len, name: run.name };
};

/* Zestawienia calego projektu: szafka nalezaca do ciagu oddaje swoje formatki
   bez cokolu i bez blatu, bo te ida osobnymi pozycjami — na caly ciag. */
const projectParts = (project) => {
  const shared = new Map();
  (project.runs || []).forEach((r) => {
    const rp = runPlinth(project, r);
    const rt = runTop(project, r);
    const rr = runRail(project, r);
    if (rp || rt || rr) shared.set(r.id, { run: r, rp, rt, rr });
  });
  const drop = (id) => {
    const s = shared.get(id);
    if (!s) return null;
    const names = [];
    if (s.rp) names.push("Cokół");
    if (s.rt) names.push("Blat");
    return names;
  };
  // szafka narozna liczy sie z kontekstem rogu — inaczej jej wzmocnienia sa za dlugie
  const layout = projectLayout(project);
  const cabs = project.items.map((it, ci) => {
    const g = computeGeo(it.cab, it.mat, armCtxOf(layout, ci));
    const gone = drop(it.runId || null);
    const s = shared.get(it.runId || null);
    return {
      mat: it.mat,
      grainMatters: it.cab.grainMatters,
      name: (it.cab.name || "").trim() || `Szafka ${ci + 1}`,
      panels: gone ? g.panels.filter((p) => !gone.includes(p.name)) : g.panels,
      hardware: s && s.rr ? g.hardware.filter((h) => h.name !== RAIL_NAME) : g.hardware,
    };
  });
  const runs = [];
  /* W kilku pomieszczeniach „Ściana 1” jest w kazdym — pozycja ciagu niesie
     wiec nazwe pomieszczenia, zeby w zbiorczym zamowieniu dalo sie je odroznic. */
  const wielePokoi = roomsOf(project).length > 1;
  shared.forEach(({ run: r0, rp, rt, rr }) => {
    const run = wielePokoi ? { ...r0, name: `${roomName(project, roomOfRun(project, r0))}, ${r0.name}` } : r0;
    /* Sam ciag (listwa, cokol, blat) moze zostac bez szafek — wtedy nie ma od
       kogo pozyczyc materialu i siegniecie po items[0] wywracalo aplikacje. */
    const base = { mat: (rp || rt || {}).mat
      || (project.items[0] || {}).mat || defaultMaterials,
      grainMatters: (rp || rt || {}).grainMatters };
    if (rp) runs.push({ ...base, mat: rp.mat, name: `Cokół — ${run.name}`,
      panels: runPlinthPanels(rp), hardware: [] });
    if (rt) runs.push({ ...base, mat: rt.mat, name: `Blat — ${run.name}`,
      panels: runTopPanels(rt), hardware: [] });
    if (rr) runs.push({ ...base, name: `Listwa — ${run.name}`, panels: [],
      hardware: [{ name: RAIL_NAME, use: "pod zawieszki szafek wiszących",
        spec: `jeden odcinek ${fmt(rr.len)} mm na ciąg`,
        qty: Math.round(rr.len / 100) / 10, unit: "mb" }] });
  });
  /* Ramie szafki naroznej to osobna pozycja: formatki ida na te sama plyte, co
     szafka, ale latwiej je rozpoznac przy montazu, gdy stoja osobno. */
  const arms = [];
  if ((project.runs || []).some((r) => r.corner)) {
    projectLayout(project).info.forEach((n) => {
      if (!n.arm) return;
      const { panels, hardware } = cornerArmParts(n.arm);
      if (!panels.length) return;
      /* Front ramienia stoi w licu tej sciany, w ktorej pasie lezy — wiec bierze
         plyte frontowa stamtad. Gdy tamten ciag jest jeszcze pusty, zostaje
         material szafki naroznej. */
      const sasiad = n.arm.other && n.arm.other.g ? n.arm.other.g.cabs[0] : null;
      const armMat = sasiad ? sasiad.rawMat : n.arm.cab.rawMat;
      arms.push({ mat: armMat, grainMatters: n.arm.cab.cab.grainMatters,
        name: `Narożnik — ${(n.arm.cab.cab.name || "").trim() || "szafka w rogu"}`,
        panels, hardware });
    });
  }
  const wstawki = wstawkiOf(layout).map((w) => {
    const { panels, hardware } = wstawkaParts(w);
    return { mat: w.cab.rawMat || w.cab.mat, grainMatters: w.cab.cab.grainMatters,
      name: `Wstawka w rogu — ${(w.cab.cab.name || "").trim() || `Szafka ${w.cab.index + 1}`}`,
      panels, hardware };
  });
  return [...cabs, ...runs, ...arms, ...wstawki];
};

/* Uwagi ciagu w jednym miejscu, bo czyta je i karta aktywnej szafki, i licznik
   uwag przy pozostalych szafkach na pasku — teksty nie moga sie rozjechac.
   runCabMsgs dotyczy jednej szafki, runWideMsgs calego ciagu. */
const runCabMsgs = (run, c) => {
  const out = [];
  if (!run) return out;
  if (run.H != null && Math.round(c.H) !== run.H)
    out.push({ level: "warn", text:
      `Wysokość ${fmt(c.H)} mm nie zgadza się z ciągiem „${run.name}" (${fmt(run.H)} mm) — fronty nie staną w jednej linii.`
      + `|runcab:H:${run.H}|runrun:H:${Math.round(c.H)}` });
  /* Plytsza szafka w ciagu to normalny zabieg, gdy z tylu cos przeszkadza: lico
     zostaje w linii, cofa sie sam tyl. Dlatego mowimy o tym wprost, zamiast
     kazac to "naprawiac". */
  /* Glebsza szafka (np. slupek 600 w ciagu 560 — uzytkownik 2026-09-28: zostaje
     600, ale ma byc ostrzezenie) wyznacza lico calego ciagu: pozostale szafki
     odsuwaja sie od sciany o roznice albo ona sama wystaje, gdy ja cofnac. */
  if (run.D != null && Math.round(c.D) > run.D)
    out.push({ level: "warn", text:
      `Głębokość ${fmt(c.D)} mm jest większa niż w ciągu (${fmt(run.D)} mm) o ${fmt(Math.round(c.D) - run.D)} mm. `
      + `Szafki stoją równo w licu, więc pozostałe odsuną się o tyle od ściany (za nimi zostanie pusta przestrzeń), `
      + `a blat i cokół pójdą za tym licem. Jeśli ta ma wystawać przed pozostałe, ustaw jej wysunięcie z lica.`
      + `|runcab:D:${run.D}|runrun:D:${Math.round(c.D)}` });
  else if (run.D != null && Math.round(c.D) !== run.D)
    out.push({ level: "warn", text:
      `Głębokość ${fmt(c.D)} mm różni się od ciągu (${fmt(run.D)} mm). Jeśli to celowe — lico zostaje w linii, cofa się tylko tył — zostaw tak; blat licz na najgłębszą szafkę.`
      + `|runcab:D:${run.D}|runrun:D:${Math.round(c.D)}` });
  /* Ciag wiesza sie na listwie, pojedyncza szafka na haczykach — dlatego nowy
     ciag startuje z listwa, a szafka, ktora zostala na haczykach, dostaje uwage
     zamiast cichej zmiany ustawienia. Szafki stojacej to nie dotyczy: nic nie
     wiesza, wiec sposob wieszania jest jej obojetny. */
  const wisi = !(c.legs && c.legs.on) && !(c.plinth && c.plinth.on);
  if (wisi && (run.hangerMode || "listwa") !== (c.hangerMode || "listwa"))
    out.push({ level: "warn", text:
      `Ta szafka wiesza się ${c.hangerMode === "haczyki" ? "na haczykach" : "na listwie"}, `
      + `a ciąg ${run.hangerMode === "haczyki" ? "na haczykach" : "na listwie"} — w ciągu listwa trzyma wszystkie szafki w jednej linii.`
      + `|runcab:hangerMode:x|runrun:hangerMode:x` });
  if (run.plinth && !samePlinth(c.plinth, run.plinth))
    out.push({ level: "warn", text:
      `Cokół tej szafki (${plinthText(c.plinth)}) nie zgadza się z ciągiem (${plinthText(run.plinth)}) — cokół idzie przez cały ciąg jedną płaszczyzną.`
      + `|runcab:plinth:x|runrun:plinth:x` });
  return out;
};

// "1600, 1600 i 800" zamiast "1600 i 1600 i 800"
const listPl = (xs) => (xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + " i " + xs[xs.length - 1]);

/* Cokol i blat dziela sie dokladnie tak samo, wiec i uwagi o nich pisze jedno
   miejsce — inaczej teksty rozjechalyby sie przy pierwszej poprawce. */
const splitMsgs = (what, whatGen, s, fixAction) => {
  const out = [];
  if (!s) return out;
  // blat roboczy ma swoj arkusz 4100, plyta meblowa swoj po okrawaniu
  const jednostka = s.max === WORKTOP_LEN ? "arkuszu blatu" : "formatce";
  const jednostkaM = s.max === WORKTOP_LEN ? "arkusz blatu" : "formatka";
  if (s.noFit)
    out.push({ level: "error", text:
      `${what} ma ${fmt(s.total)} mm, a między stykami korpusów nie ma odcinka krótszego niż ${jednostkaM} `
      + `(${fmt(s.max)} mm) — trzeba zwęzić którąś szafkę albo pociąć go poza stykiem.` });
  else if (s.tooLong > 0)
    out.push({ level: "error", text:
      `Odcinek ${whatGen} ${fmt(s.tooLong)} mm nie mieści się w ${jednostka} (${fmt(s.max)} mm) `
      + `— dołóż podział na styku korpusów.|${fixAction}` });
  else if (s.n > 1)
    out.push({ level: "warn", text:
      (s.auto
        ? `${what} ma ${fmt(s.total)} mm i nie zmieści się w jednym ${s.max === WORKTOP_LEN ? "arkuszu blatu" : "arkuszu"} (maksimum ${fmt(s.max)} mm) — pójdzie z ${s.n} części`
        : `${what} idzie z ${s.n} części`)
      + ` po ${listPl(s.lens.map(fmt))} mm, ciętych na styku korpusów `
      + `(${listPl(s.cuts.map(fmt))} mm od lewej) i oklejonych także na łączeniu.` });
  return out;
};

/* Ponizej tej roznicy wysokosci szafka po prostu odstaje od reszty ciagu i
   pewnie jest to pomylka; powyzej to juz slupek, ktory ma byc wyzszy. */
const SLUPEK_MIN = 200;

/* Uwagi o blacie roboczym ciagu: co jest pod nim, co obok, i co jeszcze ma
   wieniec, choc pod blatem powinno miec pare wzmocnien. */
/* Odstep od sciany jest swiadoma decyzja (krzywa sciana, rura), ale latwo o nim
   zapomniec przy montazu — i to on przesuwa glebokosc blatu. Dlatego mowimy
   o nim zawsze, osobno dla ciagu i dla szafek, ktore stoja inaczej niz on. */
const wallGapMsgs = (project, run) => {
  const out = [];
  if (!run) return out;
  const opis = (g) => (g.bottom === g.top
    ? `${fmt(g.bottom)} mm od ściany`
    : `${fmt(g.bottom)} mm od ściany przy podłodze i ${fmt(g.top)} mm na wysokości blatu`);
  const gc = wallGapOf(run, null);
  if (gc.bottom || gc.top)
    out.push({ level: "info", text:
      `Ciąg stoi ${opis(gc)} — za plecami zostaje wolna przestrzeń. `
      + `Blat liczymy od ściany na wysokości blatu.` });
  runItems(project, run.id).forEach(({ it }) => {
    if (!it.wallGap) return;
    const g = wallGapOf(run, it);
    if (g.bottom === gc.bottom && g.top === gc.top) return;
    const nazwa = (it.cab.name || "").trim() || "szafka";
    out.push({ level: "info", text:
      `Szafka „${nazwa}" stoi ${opis(g)}, inaczej niż reszta ciągu.` });
  });
  return out;
};

const worktopMsgs = (project, run) => {
  const out = [];
  if (!run) return out;
  /* Pas za rogiem sam blatu nie ma wlaczonego, a mimo to lezy na nim blat nad
     ramieniem naroznika — jego szerokosc trzeba sprawdzic tak samo. */
  const rt = runTop(project, run);
  if (!run.worktop && !(rt && rt.worktop)) return out;
  /* Pas moze nie miec wlasnych szafek, a i tak miec blat — nad ramieniem
     naroznika z sasiedniej sciany. Wtedy `lvl` jest pusty, ale sprawdzic
     szerokosc blatu i tak trzeba. */
  const lvl = worktopLevel(project, run);
  (lvl ? lvl.poza : []).forEach((c) => {
    const nazwa = (c.it.cab.name || "").trim() || "szafka";
    const roznica = Math.abs(c.y - lvl.y);
    if (roznica >= SLUPEK_MIN)
      out.push({ level: "info", text:
        `Szafka „${nazwa}" jest o ${fmt(roznica)} mm ${c.y > lvl.y ? "wyższa" : "niższa"} od reszty ciągu `
        + `— blat kończy się przy jej boku i do niej dolega.` });
    else
      out.push({ level: "warn", text:
        `Szafka „${nazwa}" odstaje od ciągu o ${fmt(roznica)} mm — blat jej nie obejmie. `
        + `Wyrównaj wysokość albo zrób z niej słupek (różnica od ${fmt(SLUPEK_MIN)} mm).` });
  });
  /* Blat glebszy niz 600 wymusza arkusz 1200, a z niego zostaje pas odpadu.
     Zwykle taniej jest zejsc z glebokoscia szafek o te kilkadziesiat milimetrow,
     niz kupowac dwa razy szerszy blat — ale to decyzja, nie blad. */
  if (rt && rt.worktop && rt.depth > WORKTOP_DEPTHS[0] && rt.depth <= WORKTOP_DEPTHS[1]) {
    const nadmiar = rt.depth - WORKTOP_DEPTHS[0];
    /* Grubosc frontu bierzemy z szafki, a w pasie z samym ramieniem — z tej,
       do ktorej ramie nalezy. Na sztywno wpisane 18 klamalo przy innej plycie. */
    const tf = lvl && lvl.pod.length
      ? lvl.pod[0].geo.tf
      : ((rt.spans || []).find((s2) => s2.tf) || {}).tf
        ?? (project.items[0]
          ? computeGeo(project.items[0].cab, project.items[0].mat).tf
          : defaultMaterials.front.thickness);
    // pas z samym ramieniem glebokosc bierze z ustawienia ciagu
    const glebokosc = lvl && lvl.pod.length
      ? Math.max(...lvl.pod.map((c) => Math.round(c.geo.carcassDepth - (Number(c.it.offset) || 0))))
      : Math.max(0, Math.round(Number(run.D) || 0));
    // glebokosc szafek, przy ktorej arkusz 600 wystaje przed drzwi standardowe 10 mm
    const plecySz = lvl && lvl.pod.length ? Math.max(...lvl.pod.map((c) => c.geo.plecyZa || 0)) : 0;
    const sugerowana = WORKTOP_DEPTHS[0] - WORKTOP_OVERHANG - HINGE_PLAY - tf - (rt.odSciany || 0) - plecySz;
    out.push({ level: "warn", text:
      `Blat wychodzi ${fmt(rt.depth)} mm — o ${fmt(nadmiar)} mm za dużo na arkusz `
      + `${fmt(WORKTOP_DEPTHS[0])} mm, a z arkusza ${fmt(WORKTOP_DEPTHS[1])} mm zostaje pas odpadu. `
      + `Szafki są za głębokie: przy ${fmt(sugerowana)} mm arkusz ${fmt(WORKTOP_DEPTHS[0])} mm `
      + `wystaje przed drzwi ${fmt(WORKTOP_OVERHANG)} mm`
      + (rt.odSciany ? ` (razem z odstępem ${fmt(rt.odSciany)} mm od ściany)` : "")
      + `. Można też świadomie wziąć szerszy arkusz.`
      + (glebokosc > sugerowana ? `|rundepth:${sugerowana}` : "")
      + `|worktop:${WORKTOP_DEPTHS[1]}` });
  }
  /* Ile arkusz 600 wystaje przed drzwi. Standard to 10 mm — blat oslania gorna
     krawedz frontow, zeby przy krojeniu nie kapalo na nie. Mniej: uwaga.
     Ponad 30 mm: ostrzezenie, bo zwykle zle jest odsuniecie od sciany albo
     glebokosc szafek — a jesli oba sa dobre, blat trzeba dociac. */
  const naArkusz600 = rt && rt.worktop && rt.arkusz === WORKTOP_DEPTHS[0];
  let opisanyWysieg = false;
  if (naArkusz600) {
    const w = rt.wysiegArkusza;
    const gl = lvl && lvl.pod.length
      ? Math.max(...lvl.pod.map((c) => Math.round(c.geo.carcassDepth - (Number(c.it.offset) || 0))))
      : Math.max(0, Math.round(Number(run.D) || 0));
    // plecy przybijane stoja za korpusem i odsuwaja go od sciany (2026-09-28)
    const plecy = lvl && lvl.pod.length ? Math.max(...lvl.pod.map((c) => c.geo.plecyZa || 0)) : 0;
    const front = rt.doLica - (rt.odSciany || 0) - gl - plecy - HINGE_PLAY;
    const sklad = (rt.odSciany ? `${fmt(rt.odSciany)} mm od ściany + ` : "")
      + (plecy ? `plecy ${fmt(plecy)} + ` : "")
      + `korpus ${fmt(gl)} + ${fmt(HINGE_PLAY)} mm luzu przy zawiasach + front ${fmt(front)} `
      + `= ${fmt(rt.doLica)} mm do lica drzwi`;
    // glebokosc szafek, przy ktorej arkusz wystaje przed drzwi dokladnie 10 mm
    const cel = gl + w - WORKTOP_OVERHANG;
    const naCel = lvl && lvl.pod.length && cel > 0 && cel !== gl ? `|rundepth:${cel}` : "";
    if (w < WORKTOP_OVERHANG) {
      opisanyWysieg = true;
      out.push({ level: "info", text:
        `Blat ${fmt(rt.arkusz)} mm wystaje przed drzwi tylko ${fmt(w)} mm (${sklad}). `
        + `Zwykle wychodzi ok. ${fmt(WORKTOP_OVERHANG)} mm i osłania górną krawędź frontów. `
        + `Zmniejsz głębokość szafek albo odsunięcie od ściany.` + naCel });
    } else if (w > WORKTOP_MAX_OVERHANG) {
      opisanyWysieg = true;
      out.push({ level: "warn", text:
        `Cały arkusz ${fmt(rt.arkusz)} mm wystawałby przed drzwi ${fmt(w)} mm (${sklad}) — `
        + `ponad ${fmt(WORKTOP_MAX_OVERHANG)} mm. Sprawdź odsunięcie od ściany i głębokość szafek; `
        + `jeśli oba są dobre, blat trzeba dociąć. `
        + (rt.pelnyArkusz
          ? `Teraz zamawiamy cały arkusz.|topcut:1`
          : `Teraz zamawiamy go dociętego do ${fmt(rt.depth)} mm — ${fmt(rt.wysieg)} mm przed drzwi.|topcut:0`)
        + naCel });
    }
  }
  // docięty na życzenie albo z arkusza 1200 — mówimy, że tnie go zakład
  if (rt && rt.worktop && !rt.pelnyArkusz && rt.docinka > 0 && !opisanyWysieg) {
    out.push({ level: "info", text:
      `Blat zamawiamy docięty do ${fmt(rt.depth)} mm z pasa ${fmt(rt.arkusz)} mm — `
      + `zdejmuje go zakład, na miejscu zostaje tylko dopasowanie do ściany.`
      + (naArkusz600 ? `|topcut:0` : "") });
  }
  /* Dwa odcinki blatu spotykaja sie w rogu. Rozne szerokosci widac tam od razu:
     jeden konczy sie przed licem drugiego albo za nim, a styk trzeba doginac.
     Zwykle chodzi o rozne glebokosci szafek na obu scianach. */
  (project.runs || []).forEach((inny) => {
    if (inny.id === run.id) return;
    const para = (inny.corner && inny.corner.of === run.id)
      || (run.corner && run.corner.of === inny.id);
    if (!para) return;
    const rtI = runTop(project, inny);
    if (!rt || !rtI || !rt.worktop || !rtI.worktop || rt.depth === rtI.depth) return;
    /* Wyrownujemy w dol: glebszy pas schodzi do szerokosci plytszego. Poprawka
       moze dotyczyc tego ciagu albo sasiada, wiec nazwa ciagu idzie w akcji. */
    const glOf = (r, l) => (l && l.pod.length
      ? Math.max(...l.pod.map((c) => Math.round(c.geo.carcassDepth - (Number(c.it.offset) || 0))))
      : Math.max(0, Math.round(Number(r.D) || 0)));
    const glebszy = rt.depth > rtI.depth ? run : inny;
    const rtG = rt.depth > rtI.depth ? rt : rtI;
    const cel = glOf(glebszy, glebszy.id === run.id ? lvl : worktopLevel(project, glebszy))
      - (rtG.depth - Math.min(rt.depth, rtI.depth));
    const fix = cel > 0
      ? `|rundepth:${cel}${glebszy.id === run.id ? "" : "@" + glebszy.id}` : "";
    out.push({ level: "warn", text:
      `Blat tej ściany ma ${fmt(rt.depth)} mm, a sąsiedniej „${inny.name}" ${fmt(rtI.depth)} mm `
      + `— w narożniku spotkają się dwie różne szerokości i styk wypadnie ze skokiem. `
      + `Zwykle bierze się to z różnych głębokości szafek na obu ścianach: `
      + `ciąg „${glebszy.name}" jest głębszy.` + fix });
    /* Sasiad z blatem ponad arkusz 600 nie ma gdzie o tym powiedziec, gdy stoi
       w nim samo ramie — wtedy mowimy to tutaj, przy szafce naroznej. */
    if (rtI.depth > WORKTOP_DEPTHS[0] && !runItems(project, inny.id).length) {
      // przy tej glebokosci arkusz 600 wystaje przed drzwi standardowe 10 mm
      const celI = glOf(inny, null) - (rtI.surowa - WORKTOP_DEPTHS[0]);
      out.push({ level: "warn", text:
        `Blat nad ramieniem, po stronie ciągu „${inny.name}", wychodzi ${fmt(rtI.depth)} mm `
        + `— nie wytnie się z arkusza ${fmt(WORKTOP_DEPTHS[0])} mm. Ramię jest tak głębokie, `
        + `jak ten ciąg: przy ${fmt(celI)} mm blat zmieści się z zapasem.`
        + (celI > 0 ? `|rundepth:${celI}@${inny.id}` : "") });
    }
  });
  (lvl ? lvl.pod : []).forEach((c) => {
    const nazwa = (c.it.cab.name || "").trim() || "szafka";
    if (c.geo.hasTop) {
      out.push({ level: "warn", text:
        `Szafka „${nazwa}" stoi pod blatem roboczym, a ma wieniec — pod blatem robi się parę wzmocnień: `
        + `z przodu płyta na płask, z tyłu stojąca.`
        + `|noTop:${c.idx}` });
      return;
    }
    /* Bez wienca i bez wzmocnien korpus nie ma sie czym usztywnic — tak wygladaja
       szafki z projektow sprzed blatu ciagu, wiec trzeba je zaczepic. */
    const maWzmocnienia = (c.geo.levels || []).some((lv) =>
      (lv.cols || []).some((k) => (k.rails || []).length));
    if (!maWzmocnienia)
      out.push({ level: "warn", text:
        `Szafka „${nazwa}" nie ma ani wieńca, ani wzmocnień — pod blatem korpus musi się czymś `
        + `usztywnić: z przodu płyta na płask, z tyłu stojąca.`
        + `|noTop:${c.idx}` });
  });
  return out;
};

/* Uwagi o pietrach: gorny ciag nie moze wystawac poza dolny, a pod sufitem
   warto wiedziec, ile jeszcze zostaje. */
const tierMsgs = (project, run) => {
  const out = [];
  if (!run) return out;
  const runs = project.runs || [];
  const dolny = run.tier === "gorny" ? runs.find((r) => r.id === run.wall) : run;
  const gorny = run.tier === "gorny" ? run : runs.find((r) => r.tier === "gorny" && r.wall === run.id);
  if (!dolny || !gorny) return out;
  /* Oba pietra liczymy w tym samym ukladzie sciany: od lewej krawedzi.
     Narożnik zabiera poczatek albo koniec ciagu (szafka sasiada, ramie szafki
     w L, luz) — pod gornym ciagiem to tez meble, wiec dolny liczy sie razem
     z nim, a gorny zaczyna sie za swoim. Bez tego gorna szafka w L nad ramieniem
     dolnej „wystawala nad pustym miejscem” (2026-09-29). */
  const lay = projectLayout(project).info;
  const zakres = (r, zRogiem) => {
    const { total } = runJoints(project, r);
    const odLewej = r.offsetFrom !== "right";
    const off = Math.max(0, Math.round(r.offset || 0));
    const n = lay.get(r.id);
    const rogL = n && odLewej ? Math.max(0, Math.round(n.lead - off)) : 0;
    const rogP = n && odLewej ? Math.max(0, Math.round(n.tail)) : 0;
    const sciana = runWallW(project, r);
    const start = odLewej ? off
      : sciana != null ? Math.max(0, sciana - off - total) : 0;
    return zRogiem ? { start, koniec: start + rogL + total + rogP, total }
      : { start: start + rogL, koniec: start + rogL + total, total };
  };
  const d = zakres(dolny, true);
  const g = zakres(gorny, false);
  if (g.total > 0 && d.total > 0) {
    const zLewej = d.start - g.start;
    const zPrawej = g.koniec - d.koniec;
    if (zLewej > 0 || zPrawej > 0)
      out.push({ level: "warn", text:
        `Ciąg górny wystaje poza dolny`
        + (zLewej > 0 ? ` o ${fmt(zLewej)} mm z lewej` : "")
        + (zLewej > 0 && zPrawej > 0 ? " i" : "")
        + (zPrawej > 0 ? ` o ${fmt(zPrawej)} mm z prawej` : "")
        + ". Górna szafka wisi wtedy nad pustym miejscem — przesuń ciąg albo wyrównaj długości." });
  }
  if (gorny.ceiling != null) {
    const { list } = runJoints(project, gorny);
    if (list.length) {
      const mount = tierMountY(project, gorny);
      const gora = mount + Math.max(...list.map(({ it }) => Math.round(it.cab.H)));
      const luz = Math.round(gorny.ceiling - gora);
      if (luz < 0)
        out.push({ level: "error", text:
          `Szafki górne sięgają ${fmt(gora)} mm, a sufit jest na ${fmt(gorny.ceiling)} mm — `
          + `nie mieszczą się o ${fmt(-luz)} mm.` });
      else
        out.push({ level: "info", text:
          `Nad szafkami górnymi zostaje ${fmt(luz)} mm do sufitu`
          + (luz > 0 ? ` — o tyle da się je jeszcze podwyższyć albo dołożyć blendę.` : ".") });
    }
  }
  return out;
};

const runWideMsgs = (run, total, rp, rt, len) => {
  const out = [];
  if (!run) return out;
  // przy narożniku liczy sie miejsce od rogu, a nie sama suma korpusow
  const zajete = Math.max(total, Math.round(len || 0));
  if (run.wallW != null && zajete > run.wallW)
    out.push({ level: "error", text:
      `Ciąg „${run.name}" zajmuje ${fmt(zajete)} mm`
      + (zajete > total ? ` (${fmt(total)} mm szafek i ${fmt(zajete - total)} mm na narożnik)` : "")
      + `, a ściana ma ${fmt(run.wallW)} mm — brakuje ${fmt(zajete - run.wallW)} mm.` });
  out.push(...splitMsgs("Cokół ciągu", "cokołu ciągu", rp, "plinthauto"));
  out.push(...splitMsgs("Blat ciągu", "blatu ciągu", rt, "topauto"));
  return out;
};

/* Uwagi o narozniku. W rogu zawsze cos przepada — chodzi o to, zeby bylo
   wiadomo ile, po ktorej stronie i czego jeszcze nie da sie z tego wyliczyc.
   Rog dotyczy obu ciagow po rowno, wiec uwage widac z kazdego z nich. */
const cornerPairMsgs = (n, blat) => {
  const out = [];
  const p = n.parent;
  if (!n.corner || !p) return out;
  const wchodzi = n.corner.owner === "self" ? n.run.name : p.run.name;
  const ustepuje = n.corner.owner === "self" ? p : n;
  const strata = Math.round(ustepuje.lead + ustepuje.tail);
  const gdzie = n.corner.at === "end" ? "za jego końcem" : "przed jego początkiem";
  out.push({ level: "info", text:
    `Narożnik: ciąg „${n.run.name}" stoi pod kątem prostym do „${p.run.name}" (${gdzie}). `
    + `W róg wjeżdża „${wchodzi}"`
    + (strata > 0
      ? `, więc ciąg „${ustepuje.run.name}" zaczyna się ${fmt(strata)} mm od rogu.`
      : ".") });
  if (n.pair && n.pair.dosuniety > 0)
    out.push({ level: "info", text:
      `Górny ciąg „${n.pair.wchodzi.run.name}" jest dosunięty do rogu o ${fmt(n.pair.dosuniety)} mm, `
      + `bo w rogu wisi szafka w L — jej ramię zaczyna się w samym rogu. Tyle zostaje wolnego na początku ściany.` });
  /* Szafka wjezdzajaca w rog chowa czesc frontu za drugim ciagiem — to wlasnie
     slepy narożnik. Mowimy wprost, ile frontu zostaje do reki. */
  const z = n.blind;
  if (z) {
    const kto = `Szafka „${(z.cab.cab.name || "").trim() || "bez nazwy"}" z ciągu „${z.run.run.name}"`;
    const za = `ciąg „${z.other.run.name}"`;
    const zaCiagiem = `ciągiem „${z.other.run.name}"`;
    if (z.free <= 0)
      out.push({ level: "error", text:
        `${kto} chowa się w całości za ${zaCiagiem} — nie ma jak jej otworzyć. `
        + `Poszerz ją do co najmniej ${fmt(z.zaslania + MIN_COL)} mm albo zrób z niej szafkę narożną.` });
    else if (z.free < MIN_COL)
      out.push({ level: "warn", text:
        `Ślepy narożnik: ${kto} ma ${fmt(z.covered)} mm frontu zasłonięte przez ${za} `
        + `(do lica jego frontów i ${fmt(SLEPY_ZAPAS)} mm zapasu na uchwyt), `
        + `zostaje ${fmt(z.free)} mm — na drzwi to za mało. Poszerz szafkę albo zrób z niej szafkę narożną.` });
    else if (!slepyUstawiony(z)) {
      /* Najpierw rog, potem reszta: jeden blok z tym, co trzeba zrobic, i jednym
         przyciskiem — fix na zaslonieta czesc, jedne drzwi z zawiasem od
         zewnatrz (uchwyt przy fixie) i wstawka przy szafce drugiego ciagu.
         Kolizje otwierania w tym rogu widac obok, od razu. */
      const ws = n.corner && n.corner.wstawka;
      const tfW = tfPrzyRogu(n);
      const wsTxt = ws ? "" : `, wstawka ${fmt(tfW)} mm przy szafce ciągu „` + z.other.run.name + "”";
      out.push({ level: "warn", text:
        `Ślepy narożnik — szafka w rogu do ustawienia: ${kto} ma ${fmt(z.covered)} mm frontu zasłonięte przez ${za} `
        + `(do lica jego frontów i ${fmt(SLEPY_ZAPAS)} mm zapasu na uchwyt), do ręki zostaje ${fmt(z.free)} mm. `
        + `Proponuję: fix ${fmt(z.covered)} mm przy rogu, jedne drzwi na resztę z zawiasem od zewnętrznej `
        + `strony (uchwyt przy fixie)${wsTxt}.`
        + `|slepyrog:${z.cab.index}:${z.strona}:${z.covered}:${ws ? "-" : n.id}:${tfW}` });
    } else if (slepyFixy(z).length) {
      /* Fix jest, ale innej szerokosci niz zaslonieta czesc — wezszy znaczy,
         ze drzwi wchodza za sasiedni ciag (uchwyt przy jego drzwiach), szerszy
         zabiera frontu do reki. Jedna podpowiedz z przyciskiem. */
      const inne = slepyFixy(z);
      const wezszy = inne.some((w) => w < z.covered);
      out.push({ level: wezszy ? "warn" : "info", text:
        `Ślepy narożnik: ${kto} ma fix ${inne.map((w) => fmt(w)).join(" / ")} mm, a zasłonięte jest ${fmt(z.covered)} mm `
        + `(do lica frontów ciągu „${z.other.run.name}" i ${fmt(SLEPY_ZAPAS)} mm zapasu na uchwyt)`
        + (wezszy ? " — drzwi wchodzą za sąsiedni ciąg." : " — zostaje mniej frontu do ręki.")
        + `|slepyfix:${z.cab.index}:${z.strona}:${Math.round(z.covered)}` });
    } else
      out.push({ level: "info", text:
        `Ślepy narożnik: ${kto} ma fix ${fmt(z.covered)} mm na zasłoniętą część `
        + `(do lica frontów ciągu „${z.other.run.name}" i ${fmt(SLEPY_ZAPAS)} mm zapasu), drzwi na pozostałe ${fmt(z.free)} mm.` });
  }
  /* Szafka narozna w L: zamiast chowac front za sasiadem, korpus wychodzi
     ramieniem na druga sciane i oba fronty spotykaja sie w rogu. */
  const a = n.arm;
  if (a) {
    const kto = `Szafka „${(a.cab.cab.name || "").trim() || "bez nazwy"}"`;
    const opisDrzwi = {
      wsporniki: "dwa osobne fronty, każdy domykany do swojego ramienia kątownika w wewnętrznym rogu",
      lamane: "dwa skrzydła spięte zawiasami łamanymi — wspornik nie jest potrzebny",
      skrecone: "dwa fronty skręcone na stałe pod kątem 90°, na zawiasach z jednej strony",
      fix: "ramię zaślepione fixem przykręconym na stałe, otwierają się tylko drzwi w korpusie",
    }[a.doors] || "dwa fronty spotykające się pod kątem prostym";
    out.push({ level: "info", text:
      `${kto} jest szafką narożną w L: korpus ${fmt(a.cab.geo.W)} mm przy ścianie „${a.run.run.name}" `
      + `plus ramię ${fmt(a.len)} × ${fmt(armKorpus(a))} mm przy ścianie „${a.other.run.name}". `
      + `Drzwi: ${opisDrzwi}. Płyty poziome ramienia dostawia się na kołki, oklejone na łączeniu.` });
    const zasieg = cornerSpan(n);
    if (zasieg)
      out.push({ level: "info", text:
        `Od rogu szafka zajmuje wzdłuż ściany „${a.other.run.name}" ${fmt(zasieg.wzdluzRamienia)} mm `
        + `(${zasieg.odScianyA ? `${fmt(zasieg.odScianyA)} odstępu od ściany + ` : ""}`
        + (zasieg.zaKorpusem ? (zasieg.zaKorpusem === zasieg.plecy ? `${fmt(zasieg.zaKorpusem)} plecy + `
          : `${fmt(zasieg.zaKorpusem)} za korpusem (plecy i wyrównanie do lica ciągu) + `) : "")
        + `${fmt(zasieg.glKorpusu)} głębokości korpusu + ${fmt(a.len)} ramienia), `
        + `a wzdłuż ściany „${a.run.run.name}" ${fmt(zasieg.wzdluzKorpusu)} mm`
        + (zasieg.odScianyB ? ` (${fmt(zasieg.odScianyB)} odstępu + ${fmt(a.cab.geo.W)} korpusu)` : "")
        + `. Front korpusu nie ma całej jego szerokości: róg zabiera głębokość ramienia `
        + `z frontem, więc na drzwi od tej strony zostaje ${fmt(Math.max(0, a.front))} mm.` });
    /* Szerokosc skrzydla to formatka drzwi ramienia: ramie minus katownik w rogu
       (plyta, front, na ktory nachodzi, i luz) i minus luz na wolnym koncu.
       Skrocenie ramienia o X skraca skrzydlo dokladnie o X. */
    const skrzydlo = armFrontPlan(a).w;
    if (a.doors !== "fix" && skrzydlo > SZEROKI_FRONT) {
      const zabiera = a.len - skrzydlo;
      const naDrzwi = a.len - (skrzydlo - SZEROKI_FRONT);
      const krotkie = 600;
      out.push({ level: "warn", text:
        `${kto}: drzwi ramienia mają ${fmt(skrzydlo)} mm (ramię ${fmt(a.len)} minus ${fmt(zabiera)} mm, `
